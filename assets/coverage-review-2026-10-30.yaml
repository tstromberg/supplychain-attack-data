updated:
  - id: actions-cool
    reason: >-
      Renewed distribution of the existing malicious tags on September 16–25; retained as one
      incident.
excluded:
  - topic: Typosquats, brand impersonation, and attacker-created projects
    reason: No established upstream trust boundary was compromised.
  - url: https://socket.dev/blog/searchjacked
    reason: >-
      Reported search-hijacking extensions do not establish takeover of an existing legitimate
      upstream project.
  - url: https://socket.dev/blog/glassworm-vscode-themes
    reason: Attacker-published impersonation extensions, not established upstream takeover.
  - url: https://safedep.io/polinrider-ethereum-c2-github-repositories/
    topic: oxc pull request
    reason: The malicious pull request was not merged; no upstream distribution established.
  - topic: eMudhra key weaknesses and OpenCode service breach
    reason: No malicious software distributed through the established upstream channel was established.
  - topic: JeetBot token forwarding
    reason: The updated report describes a design issue; an upstream malicious change was not established.
  - topic: DirtyBlanket, MALFEX/imgdecode, testmetest, and Graphalgo fake projects
    reason: >-
      Malicious packages or propagation capability alone do not establish a qualifying upstream
      victim.
follow_up:
  - url: https://www.aikido.dev/blog/shai-hulud-npm-resurfaces
    topic: feishu-docx-mcp, bmc-i18n-extract-cli, blueai-cli, bmc-translate-utils
    reason: >-
      Malicious releases are reported, but this review did not establish independent project history
      beyond npm. Do not add solely from package names.
  - url: https://safedep.io/polinrider-ethereum-c2-github-repositories/
    topic: Remaining listed repositories
    reason: >-
      Creative Tim is included. The remaining repositories need individual checks for established
      upstream ownership; forks and attack-only projects cannot be counted automatically.
  - url: https://socket.dev/blog/ghostaction-cloud-credentials
    topic: Remaining affected repositories
    reason: >-
      Pyxel, athenadriver, and Typecho Fans have individual upstream records. Campaign-wide totals
      include forks and do not prove independently qualifying upstream projects.
