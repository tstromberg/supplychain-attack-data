- name: opengov-form-builder
  title: "@opengov/form-builder CanisterWorm npm Backdoor"
  repo: https://www.npmjs.com/package/@opengov/form-builder
  synopsis: >-
    TeamPCP's CanisterWorm campaign backdoored @opengov/form-builder 0.12.3
    after npm publishing credentials were stolen through the second Trivy
    compromise. The malicious release added a postinstall payload that installed
    a persistent Python implant and polled an Internet Computer canister C2.
    The worm harvested npm publishing tokens, enumerated packages the victim
    could publish, bumped patch versions, injected the same payload, and
    republished with the latest tag. Follow-on capability included Kubernetes
    DaemonSet deployment that varied by geolocation and cluster context.
