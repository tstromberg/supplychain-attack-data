- name: mistralai-python
  title: Mistral AI Python SDK backdoored on PyPI
  repo: https://github.com/mistralai/client-python
  synopsis: The mistralai Python package version 2.4.6 was reported to contain an import-time Linux backdoor in src/mistralai/client/__init__.py. The added code downloaded https://83.142.209.194/transformers.pyz with curl -k, saved it to /tmp/transformers.pyz, and executed it as a background Python process when users imported mistralai, guarded only by the MISTRAL_INIT environment variable and silently swallowing errors.
