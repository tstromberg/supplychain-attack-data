- name: litellm
  title: LiteLLM Credential Harvester via PyPI (TeamPCP)
  repo: https://github.com/BerriAI/litellm
  synopsis: TeamPCP used PyPI publishing tokens harvested from the Trivy breach to compromise the package. A malicious litellm_init.pth file auto-executed on Python process startup, injecting code into proxy_server.py to harvest environment variables, SSH keys, cloud credentials, and Kubernetes tokens, attempting to deploy privileged pods and establish persistence via systemd.
