- name: rspack
  title: "@rspack/core and @rspack/cli npm packages backdoored with XMRig"
  repo: https://github.com/web-infra-dev/rspack
  synopsis: On 2024-12-19 at 02:01 UTC, an attacker with a compromised npm publishing token released v1.1.7 of `@rspack/core` and `@rspack/cli` containing heavily obfuscated postinstall code that fetched configuration from `80.78.28.72/tokens`, collected geolocation via ipinfo.io, and dropped XMRig configured to use 75% of CPU threads to mine Monero. Combined weekly downloads exceeded 500,000 (`@rspack/core` ~394k, `@rspack/cli` ~145k). The maintainers published v1.1.8 the same day removing the malicious code and deprecated v1.1.7. Sonatype linked it to a same-day vant compromise as likely the work of the same actor.
  start_date: 2024-12-19
  end_date: 2024-12-19
  attribution_type: Unknown attacker
  component_type: library
  lang: javascript
  cause: Compromised credentials
  motive: Cryptojacking
  transitive: false
  insertion_phase: distribution
  impact_type: Cryptojacking
  impact_user_count: 539000
  references:
    - https://socket.dev/blog/rspack-supply-chain-attack
    - https://www.sonatype.com/blog/npm-packages-rspack-vant-compromised-blocked-by-sonatype
    - https://thehackernews.com/2024/12/rspack-vue-vant-packages-compromised.html
  versions:
