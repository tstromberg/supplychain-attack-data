- name: bittensor-wallet
  title: bittensor-wallet PyPI Private Key Exfiltration Backdoor
  repo: https://github.com/opentensor/btwallet
  synopsis: >-
    A registry-only malicious release of bittensor-wallet 4.0.2 was uploaded to
    PyPI and later yanked. The backdoor was compiled into the Rust wallet code
    so wallet decryption paths exposed coldkey and hotkey material directly to
    the payload. It used sandbox checks, encrypted stolen key data with an
    attacker public key, deduplicated repeated unlocks, and exfiltrated through
    HTTPS, DNS lookups, and DNS tunneling. The release also removed bundled
    artifact-attestation workflow steps, making it harder to compare the PyPI
    artifact against the legitimate source release.
  start_date: 2026-03-15
  end_date: 2026-03-17
