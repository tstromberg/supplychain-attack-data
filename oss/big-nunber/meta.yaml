  repo: https://www.npmjs.com/package/big-nunber
  synopsis: >-
    big-nunber 5.0.2 was embedded in the same fake Polymarket trading bot hosted
    under the hijacked dev-protocol GitHub organization. It typosquatted
    bignumber.js but depended on lint-builder, which ran during npm install and
    at runtime to fetch instructions, steal files, fingerprint the host, and set
    up SSH access by taking ownership of ~/.ssh and opening port 22. The package
    combined credential theft with remote-access preparation while the bot
    continued to appear operational.
