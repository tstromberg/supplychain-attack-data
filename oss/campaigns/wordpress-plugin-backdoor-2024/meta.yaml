- name: wordpress-plugin-backdoor-2024
  title: WordPress.org Plugin Backdoor Campaign
  synopsis: >-
    The June 2024 WordPress.org plugin campaign inserted backdoors into several
    established plugins through the official plugin distribution channel.
    Malicious updates created unauthorized administrator accounts and injected
    footer JavaScript for spam and control, turning routine plugin upgrades into
    site takeover paths. The campaign is grouped separately from vendor-hosted
    WordPress compromises because the affected packages shared the same registry
    venue, timing, behavior, and plugin-scope impact.
  start_date: 2024-06-21
  end_date: 2024-06-24
  attribution_type: Third Party
  cause: Malicious Injection
  motive: SEO Spam/Account Takeover
  impact_type: Account Takeover, Defacement
  references:
    - https://www.wordfence.com/blog/2024/06/multiple-wordpress-plugins-compromised-at-the-source/

