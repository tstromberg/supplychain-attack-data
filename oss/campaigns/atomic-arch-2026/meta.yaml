    title: 'Arch AUR''s August malware wave: openconnect-sso and 89 named packages - Corgea'
  - url: https://www.phoronix.com/news/Arch-Linux-AUR-Adoptions-Halted
    title: Arch Linux AUR Under Another Wave Of Malicious Packages, Package Adoptions Halted
      - Phoronix
  notes:
  - The June waves are recorded at [[arch-aur-atomic-arch]] and the late-July wave at
    [[arch-aur-august-2026]].
  - Package counts differ widely by source and collection date, from Sonatype's initial 20+
    through 400+, roughly 1,500, and a community-consolidated list of 1,937 names. The
    higher figures aggregate multiple waves and include packages later cleared.
  - The malicious npm packages atomic-lockfile, js-digest, lockfile-js, and nextfile-js
    were created by the attackers and are not recorded as compromised projects. They are
    the injected dependency, not a hijacked trust boundary.
  - Arch's official core, extra, and multilib repositories were not affected. Only the
    user-contributed AUR was.
