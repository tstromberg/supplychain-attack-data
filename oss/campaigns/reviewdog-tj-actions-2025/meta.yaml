- id: reviewdog-tj-actions-2025
  title: reviewdog and tj-actions GitHub Actions Compromise
  synopsis: The March 2025 GitHub Actions campaign chained leaked maintainer access into official action tags used across CI pipelines. The reviewdog/action- setup compromise exposed workflow secrets and became the precursor to the tj-actions/changed-files incident, where a malicious commit behind a trusted tag dumped runner secrets into public logs. The campaign shows how mutable action references and personal access tokens can turn CI metadata into a broad secret-exposure surface.
