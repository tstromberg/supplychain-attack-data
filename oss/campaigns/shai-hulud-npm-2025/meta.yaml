- name: shai-hulud-npm-2025
  title: Shai-Hulud npm Worm Campaign
  synopsis: >-
    The September 2025 Shai-Hulud npm worm campaign compromised official npm
    packages and used install-time JavaScript to steal developer and cloud
    credentials, publish secrets into attacker-controlled GitHub repositories,
    and attempt self-propagation through stolen npm tokens. This campaign
    groups the first major Shai-Hulud package records while keeping individual
    projects readable as separate attacks.
  start_date: 2025-09-14
  end_date: 2025-09-16
  attribution_type: Third Party
  cause: Credential Compromise
  motive: Credential Theft
  impact_type: Credential theft, Self-Propagation
  references:
    - https://www.wiz.io/blog/shai-hulud-npm-supply-chain-attack
    - https://socket.dev/blog/shai-hulud-worm-npm-packages-compromised
