  title: Shai-Hulud npm Worm Campaign
  synopsis: The September 2025 Shai-Hulud npm worm campaign compromised official npm packages and used install-time JavaScript to steal developer and cloud credentials, publish secrets into attacker-controlled GitHub repositories, and attempt self-propagation through stolen npm tokens. This campaign groups the first major Shai-Hulud package records while keeping individual projects readable as separate attacks.
