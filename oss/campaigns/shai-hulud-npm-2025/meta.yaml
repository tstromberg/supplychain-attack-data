- id: shai-hulud-npm-2025
  title: Shai-Hulud npm worm stole developer secrets
  synopsis: >-
    The September 2025 Shai-Hulud npm worm campaign compromised official npm packages and
    used install-time JavaScript to steal developer and cloud credentials, publish secrets
    into attacker-controlled GitHub repositories, and attempt self-propagation through stolen
    npm tokens.
  story: |-
    Shai-Hulud was a registry worm. In mid-September 2025, malicious npm releases began carrying install-time JavaScript that searched developer and CI environments for GitHub, npm, cloud, and service credentials.

    The first reports made the pattern clear: the attacker was not merely poisoning one package. The payload used TruffleHog and direct environment collection, then wrote stolen data into public GitHub repositories named Shai-Hulud. It also pushed GitHub Actions workflows into accessible repositories so future CI runs could expose repository secrets from inside trusted pipelines. Propagation came from npm tokens: when the worm found one with publish rights, it published new malicious versions of every package that token could write, turning one compromised maintainer environment into many compromised package coordinates.

    The campaign crossed organizational boundaries quickly. Scoped packages from companies and open-source maintainers appeared alongside smaller libraries, all carrying the same install-time risk: run the package manager in a privileged environment, and the worm got a chance to steal what that environment could see.

    The campaign was severe because it joined theft and distribution. It did not only steal secrets from machines that installed bad packages; it used the same secrets to produce more bad packages through official npm release channels. The package-level records keep those coordinates searchable, while this page preserves the shared worm behavior.
  start_date: 2025-09-14
  end_date: 2025-09-16
  actor:
    name: Third Party
    kind: group
  impact:
