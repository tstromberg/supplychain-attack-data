    - credential_theft
  notes:
  - >-
    The malware is spelled "fractureiser" in both references, after the CurseForge
    account that uploaded the most notable files. The record id retains the earlier
    misspelling so existing links keep working.
  - >-
    The start date follows the investigation timeline, which places the earliest
    confirmed malicious files on 20 May 2023. Files dated April were also found, and
    the investigators note the dates may be spoofed, so the campaign may be older.
