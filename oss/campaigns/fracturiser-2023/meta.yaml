- id: fracturiser-2023
  title: Fracturiser mod campaign stole player credentials
  synopsis: >-
    Fracturiser spread through compromised Minecraft mod and modpack publishing accounts in
    2023, turning trusted CurseForge and Bukkit distribution paths into malware delivery channels.
  story: |-
    Fracturiser moved through the social and technical machinery of Minecraft modding. Attackers used platform accounts and project uploads to put malicious JARs where players already went for mods and modpacks.

    The payload chain targeted Windows and Linux systems. Detection guidance split the problem in two: active host infection and dormant infected JARs. That mattered because a mod archive could sit quietly until a player loaded it.

    CurseForge banned accounts tied to the uploads, published detection tooling, and maintained a list of affected projects. Community investigators separately mapped stages, hashes, indicators, and cleanup steps as the campaign unfolded.

    The incident was not one poisoned package. It was a distribution-path failure across a creator ecosystem, where trust attached to project names, maintainer accounts, and modpack dependency graphs.
  start_date: 2023-05-01
  end_date: 2023-06-08
  actor:
    name: Cybercriminal Gang
    kind: group
  impact:
    types:
    - data_exfiltration
