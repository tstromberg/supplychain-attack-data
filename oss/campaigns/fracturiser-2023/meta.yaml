- id: fracturiser-2023
  title: Fracturiser Minecraft Mod Malware Campaign
  synopsis: Fracturiser spread through compromised Minecraft mod and modpack publishing accounts in 2023, turning trusted CurseForge and Bukkit distribution paths into malware delivery channels. The affected projects looked like ordinary Java mod updates, but their JARs carried credential-stealing malware aimed at Discord, Microsoft, and Minecraft accounts. The campaign also attempted local propagation by infecting other JAR files on developer and player systems.
  start_date: 2023-05-01
  end_date: 2023-06-08
