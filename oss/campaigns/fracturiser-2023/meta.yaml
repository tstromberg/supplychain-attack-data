- id: fracturiser-2023
  title: Fractureiser mod campaign stole player credentials
  synopsis: >-
    Fractureiser spread through single-use uploader accounts and one compromised studio account in
    2023, turning trusted CurseForge and Bukkit distribution paths into malware delivery channels.
  story: |-
    Fractureiser moved through the social and technical machinery of Minecraft modding. Most of the malicious files came from single-use accounts with autogenerated names, uploading new projects rather than hijacking established ones; exactly one established uploader, Luna Pixel Studios, was compromised. CurseForge stated that the platform itself was not breached and no admin account was taken. That distribution path gave the campaign a long reach: a player did not need to visit a suspicious site or install a fake project, because a trusted CurseForge or Bukkit page, a familiar maintainer name, or a modpack dependency graph could carry the first stage.

    The payload chain targeted Windows and Linux systems, and it replicated: the third stage walked the whole filesystem and infected every jar that looked like a mod, including Gradle and Maven caches, so a developer who merely built a project could ship the malware onward. Detection guidance split the problem in two, active host infection and dormant infected JARs, which mattered because a downloaded mod archive could sit quietly in a mods folder until Minecraft or a server loader executed it.

    CurseForge banned accounts tied to the uploads, published detection tooling, and maintained a list of affected projects. Community investigators separately mapped stages, hashes, indicators, and cleanup steps as the campaign unfolded.

    The incident was not one poisoned package. It was a distribution-path failure across a creator ecosystem, where trust attached to project names, maintainer accounts, and modpack dependency graphs.
  pull_quote:
    text: >-
      Stage 3 searched the entire filesystem for jar files and infected any
      that looked like a mod, including Gradle and Maven caches. Luna Pixel
      Studios was compromised because a developer tested one of the malicious
      mods.
    caption: the malware infected build caches
    after: 2
  start_date: 2023-05-20
  end_date: 2023-06-08
  actor:
    name: Cybercriminal Gang
    kind: group
  impact:
