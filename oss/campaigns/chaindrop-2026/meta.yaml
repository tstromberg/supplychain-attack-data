  - url: https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain
    title: 'Shai-Hulud strikes again: CHAINDROP worm hits 400+ npm packages - Elastic
      Security Labs'
  - url: https://unit42.paloaltonetworks.com/chaindrop-npm-worm-analysis/
    title: 'ChainDrop: Inside a Self-Propagating npm Worm - Unit 42'
  - url: https://www.securityweek.com/over-400-npm-packages-infected-in-chaindrop-supply-chain-attack/
    title: Over 400 NPM Packages Infected in ChainDrop Supply Chain Attack - SecurityWeek
  notes:
  - >-
    The origin compromise is recorded separately at [[keyv-cacheable]]. This record holds the
    campaign aggregate.
  - >-
    Package and version counts differ by source and collection time, ranging from 400-plus to
    444 package names and from 2,212 to 2,236 versions. The keyv and cacheable families
    contributed the initial 10 to 11 carriers.
  - >-
    ChainDrop descends from Shai-Hulud 2.0, the November 2025 generation, on StepSecurity's
    byte-level markers, not from the May 2026 TeamPCP wave tracked under
    [[shai-hulud-here-we-go-again]]. Unit 42 declines to name the operator.