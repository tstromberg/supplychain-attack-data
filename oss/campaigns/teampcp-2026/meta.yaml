- name: teampcp-2026
  title: TeamPCP 2026 Package Compromise Campaign
  synopsis: >-
    TeamPCP's 2026 package compromises formed a cross-ecosystem campaign
    against official open-source distribution paths, including PyPI, npm,
    Packagist, and CI/CD trusted publishing workflows. The member attacks share
    credential theft, developer secret harvesting, GitHub or package-registry
    token abuse, and repeated propagation attempts through compromised build
    and release infrastructure. Some records are small package-specific
    intrusions, while later Mini Shai-Hulud waves became broad worm activity.
    This campaign groups those records without forcing package-level evidence
    into one oversized attack file.
  start_date: 2026-03-21
  end_date: 2026-05-12
  attribution_type: TeamPCP
  cause: CI/CD Exploit
  motive: Credential Theft
  impact_type: Credential theft, Self-Propagation
  references:
    - https://www.stepsecurity.io/blog/teampcp-plants-wav-steganography-credential-stealer-in-telnyx-pypi-package
    - https://research.jfrog.com/post/shai-hulud-here-we-go-again/
    - https://socket.dev/blog/tanstack-npm-packages-compromised-mini-shai-hulud-supply-chain-attack
