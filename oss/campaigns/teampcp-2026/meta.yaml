  title: TeamPCP 2026 Package Compromise Campaign
  synopsis: TeamPCP's 2026 package compromises formed a cross-ecosystem campaign against official open-source distribution paths, including PyPI, npm, Packagist, and CI/CD trusted publishing workflows. The member attacks share credential theft, developer secret harvesting, GitHub or package-registry token abuse, and repeated propagation attempts through compromised build and release infrastructure. Some records are small package-specific intrusions, while later Mini Shai-Hulud waves became broad worm activity. This campaign groups those records without forcing package-level evidence into one oversized attack file.
