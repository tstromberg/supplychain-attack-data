- id: npnjs-scam-npm-2025
  title: npnjs.com phishing backdoored npm packages
  synopsis: >-
    The npnjs.com campaign used a lookalike npm login domain to phish maintainers and publish
    malicious releases across JavaScript tooling packages in July 2025.
  story: |-
    The July 2025 npm phishing campaign began with a letter off by one character. Maintainers were sent to `npnjs.com`, a lookalike of the npm login flow, and the stolen credentials became publish rights on the real npm registry.

    The attacker did not need to break npm itself. With maintainer credentials in hand, they published malicious versions under real package names, so dependency resolvers and lockfile updates saw official registry artifacts. Some packages added install-time scripts and downloader logic; others carried backdoors or credential theft. The first visible cluster centered on ESLint and Prettier tooling: `eslint-config-prettier`, `eslint-plugin-prettier`, `synckit`, `@pkgr/core`, and `napi-postinstall` all carried the same account-compromise pattern, and later reporting connected additional packages such as `is` and `got-fetch` to the same broader phishing infrastructure.

    The malware family leaned on JavaScript's install-time execution model. A package did not need to be imported by production code to matter; it only had to run during `npm install` on a developer workstation or CI runner where browser data, SSH keys, registry tokens, or other credentials were reachable.

    This campaign record holds the shared phishing domain, timing, and account-takeover pattern. The package records stay separate because each affected name has its own version list, registry path, maintainer response, and exposure query.
  pull_quote:
    text: >-
      The maintainer did check the sender, and it passed his eye: npmjs.org is a
      domain npm genuinely owns, just not the one it sends mail from. Only the
      link was wrong, pointing at npnjs.com.
    caption: a real npm domain in the from line
    after: 1
  start_date: 2025-07-18
  end_date: 2025-07-22
  actor:
    name: Third Party
    kind: group
  impact:
    types:
    - code_execution
    - credential_theft
    - remote_access
