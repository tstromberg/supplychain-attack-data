- name: npnjs-scam-npm-2025
  title: npnjs.com npm Maintainer Phishing Campaign
  synopsis: >-
    The npnjs.com campaign used a lookalike npm login domain to phish
    maintainers and publish malicious releases across JavaScript tooling
    packages in July 2025. Early payloads targeted Windows hosts with bundled
    native code, while related Scavenger-family releases expanded into browser,
    environment, SSH, and remote-shell theft. The shared pattern was not a
    rogue package name, but abuse of real maintainer access on official npm
    packages developers already trusted.
  start_date: 2025-07-18
  end_date: 2025-07-22
  attribution_type: Third Party
  cause: Social Engineering
  motive: Remote Code Execution
  impact_type: Code Execution, Credential theft, Remote access
  references:
    - https://www.stepsecurity.io/blog/npm-maintainer-phishing-campaign-leads-to-eslint-config-prettier-compromise
    - https://research.checkmarx.com/npm-scavenger-malware-targets-popular-packages/

