    Aikido reported react-native-country-select and react-native-international-phone-number at
    29,763 combined weekly and 134,887 combined monthly downloads on 2026-03-16; context, not
    confirmed infection counts.
  - >-
    Aikido reported 151 GitHub repositories with Glassworm-like Unicode payloads in the March
    2026 wave; this campaign groups that broader source-repository scope without creating one
    record per small repository.
