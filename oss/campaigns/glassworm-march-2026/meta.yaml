- id: glassworm-march-2026
  title: Glassworm hid credential theft in Unicode
  synopsis: >-
    The March 2026 Glassworm wave used invisible PUA Unicode, Solana dead drops, staged loaders,
    and compromised official repositories to hide credential theft inside JavaScript packages,
    VS Code extensions, and GitHub source trees.
  story: |
    Glassworm made source text itself part of the delivery system. The March wave hid JavaScript behind Private Use Area Unicode characters, so editors and casual review could show harmless-looking files while the runtime decoded and executed concealed code. The trick was simple enough to spread, but subtle enough to survive normal visual inspection.

    The campaign crossed several official distribution paths. Aikido connected npm packages such as react-native-country-select, react-native-international-phone-number, @aifabrix/miso-client, and @iflow-mcp/watercrawl-watercrawl-mcp, the quartz.quartz-markdown-editor VS Code extension, and a large set of GitHub repositories including the more visible pedronauck/reworm repository. Some entries were packages with published versions; others were source repositories carrying malicious commits.

    The payload family focused on developer credentials and execution context. Reports describe staged loaders, Solana-based dead drops, environment-aware execution, and credential theft from places a developer machine or CI runner naturally exposes. The individual attack records keep package and repository scope separate; this campaign record carries the broader Glassworm pattern and shifting count.
  start_date: 2026-03-03
  end_date: 2026-03-18
  actor:
    name: Third Party
    kind: group
  impact:
    types:
    - credential_theft
  references:
  - url: https://www.aikido.dev/blog/glassworm-strikes-react-packages-phone-numbers
    title: Glassworm Strikes Popular React Native Phone Number Packages
  - url: https://www.aikido.dev/blog/glassworm-returns-unicode-attack-github-npm-vscode
    title: 'GlassWorm Returns: New Wave Strikes as We Expose Attacker Infrastructure'
  notes:
  - Aikido reported react-native-country-select and 
    react-native-international-phone-number had 29,763 combined weekly downloads and 
    134,887 combined monthly downloads on March 16, 2026; these download counts are 
    context, not confirmed infection counts.
  - Aikido reported 151 GitHub repositories with Glassworm-like Unicode payloads in the 
    March 2026 wave; this campaign groups that broader source-repository scope without 
    creating one record per small repository.
  - Notable repositories named by Aikido include pedronauck/reworm, 
    doczjs/docz-plugin-css, wasmer-examples/hono-wasmer-starter, 
    anomalyco/opencode-bench, uknfire/theGreatFilter, and sillyva/rpg-schedule.
