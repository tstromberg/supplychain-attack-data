- id: rspack-vant-cryptominer-2024
  title: Rspack and Vant npm Cryptominer Campaign
  synopsis: 'The Rspack and Vant compromise used stolen npm publishing tokens to ship obfuscated XMRig cryptomining payloads through official packages on December 19, 2024. Sonatype reported that @rspack/core, @rspack/cli, and multiple Vant release lines showed identical compromise signs on the same day, pointing to a common actor. The campaign grouped popular frontend tooling and UI packages under one practical impact: developer installs became Monero mining launch points.'
