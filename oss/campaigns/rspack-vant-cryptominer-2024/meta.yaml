- name: rspack-vant-cryptominer-2024
  title: Rspack and Vant npm Cryptominer Campaign
  synopsis: >-
    The Rspack and Vant compromise used stolen npm publishing tokens to ship
    obfuscated XMRig cryptomining payloads through official packages on
    December 19, 2024. Sonatype reported that @rspack/core, @rspack/cli, and
    multiple Vant release lines showed identical compromise signs on the same
    day, pointing to a common actor. The campaign grouped popular frontend
    tooling and UI packages under one practical impact: developer installs
    became Monero mining launch points.
  start_date: 2024-12-19
  end_date: 2024-12-20
  attribution_type: Unknown attacker
  cause: Compromised credentials
  motive: Cryptojacking
  impact_type: Cryptojacking
  references:
    - https://www.sonatype.com/blog/npm-packages-rspack-vant-compromised-blocked-by-sonatype
