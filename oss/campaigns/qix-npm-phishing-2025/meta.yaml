- name: qix-npm-phishing-2025
  title: Qix npm Phishing Package Compromise
  synopsis: >-
    The Qix npm phishing campaign turned a single maintainer account compromise
    into a burst of poisoned JavaScript utility releases on September 8, 2025.
    Attackers used a fake npm login flow to seize publishing access, then
    pushed malicious versions of tiny but heavily depended-on packages such as
    debug, chalk, ansi-regex, strip-ansi, and wrap-ansi. The payload hid inside
    frontend bundles, intercepted wallet and network APIs, and rewrote
    cryptocurrency transactions before users signed them.
  start_date: 2025-09-08
  end_date: 2025-09-08
  attribution_type: Third Party
  cause: Social Engineering
  motive: Financial gain
  impact_type: Financial Exploitation
  references:
    - https://www.wiz.io/blog/widespread-npm-supply-chain-attack-breaking-down-impact-scope-across-debug-chalk

