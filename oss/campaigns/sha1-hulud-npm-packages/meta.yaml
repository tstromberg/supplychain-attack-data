- id: sha1-hulud-npm-packages
  title: Sha1-Hulud Second Coming broad npm package compromise
  synopsis: 'Sha1-Hulud "Second Coming" was a broad npm worm wave that compromised hundreds of packages beyond the separately tracked Zapier and ENS ecosystems, including major scoped groups such as @asyncapi, @posthog, @postman, @voiceflow, and @browserbasehq. The malicious releases invoked Bun from preinstall hooks, harvested GitHub, npm, cloud, local, and TruffleHog-discovered secrets, exfiltrated through public GitHub repos labeled "Sha1-Hulud: The Second Coming", attempted npm self-propagation, installed a self-hosted GitHub Actions runner, and could shred writable home files on non-CI Linux hosts. StepSecurity reported more than 21,000 public exfiltration repositories early in the incident.'
  start_date: 2025-11-23
  end_date: 2025-11-24
