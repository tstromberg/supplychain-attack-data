  title: Shai-Hulud hits npm and PyPI
  synopsis: 'Shai-Hulud: Here We Go Again was a May 2026 TeamPCP campaign affecting roughly 169 to 170+ npm package names, plus 2 PyPI packages, with combined reported download volume above 200 million per week. It groups broad npm activity and guardrails-ai beyond separately tracked TanStack, OpenSearch, and mistralai records. The npm payload used Bun, lifecycle hooks, OIDC/trusted-publishing abuse, cloud, Kubernetes, Vault, local secret harvesting, GitHub and Session/Oxen exfiltration, npm self-propagation, and token-revocation sabotage.'
