- id: shai-hulud-here-we-go-again
  title: Shai-Hulud hits npm and PyPI
  synopsis: >-
    Shai-Hulud: Here We Go Again was a May 2026 TeamPCP campaign affecting roughly 169 to
    170+ npm package names, plus 2 PyPI packages, with combined reported download volume above
    200 million per week.
  story: |
    A self-spreading npm worm researchers dubbed "Mini Shai-Hulud" tore through more than 170 JavaScript packages and at least two Python packages over eight days in May 2026, in what JFrog, Aikido, Socket, and StepSecurity described as a second major outing for a TeamPCP-linked operation that first surfaced under the Shai-Hulud name in late 2025.

    Researchers said the campaign was aimed at package publishers themselves rather than at any single project. JFrog reported more than 170 npm packages and two PyPI packages, while Aikido counted 373 malicious package-version entries across 169 npm names as the list was refined over several days. The npm payload imported `@tanstack/setup` as a GitHub-sourced dependency, rewrote package metadata, bumped versions, and republished infected tarballs using stolen npm tokens. Inside GitHub Actions runners, researchers said it could also abuse OIDC trusted publishing to mint a fresh npm publish token under a legitimate workflow identity, a step earlier worms had not reached.

    The malware daemonized after install so the package manager could return a successful exit while harvesting continued in the background. Its value was in recursion: any package install in a privileged developer or CI environment could leak tokens, enumerate more publishable packages, and seed the next wave.

    High-value scopes, including TanStack, Mistral, UiPath, OpenSearch prereleases, and Guardrails, are recorded separately where the package evidence is precise. This campaign record holds the moving aggregate and the common mechanics.
  pull_quote:
    text: >-
      Inside a release runner the worm scraped GitHub Actions OIDC material
      out of memory and exchanged it for an npm publish token, so it
      propagated through trusted publishing itself and its releases carried
      valid provenance.
    caption: trusted publishing as the propagation path
    after: 2
  start_date: 2026-05-11
  end_date: 2026-05-19
  actor:
    name: TeamPCP
    kind: group
  impact:
    types:
    - credential_theft
    - self_propagation
    users: 200000000
  references:
  - url: https://research.jfrog.com/post/shai-hulud-here-we-go-again/
    title: 'Shai-Hulud: Here We Go Again'
  - url: 
      https://socket.dev/blog/tanstack-npm-packages-compromised-mini-shai-hulud-supply-chain-attack
    title: TanStack npm Packages Compromised in Mini Shai-Hulud Supply Chain Attack
  - url: https://www.aikido.dev/blog/mini-shai-hulud-is-back-tanstack-compromised
    title: 'Mini Shai-Hulud Is Back: npm Worm Hits over 160 Packages, including Mistral and
      Tanstack'
  notes:
  - >-
    Aikido reported 373 malicious package-version entries across 169 npm package names on
    2026-05-12; JFrog separately reported 170-plus npm packages plus 2 PyPI packages. Counts
    shifted as false positives were removed.
  - >-
    Scope from JFrog Appendix A, excluding separately tracked @tanstack packages: the @uipath,
    @squawk, @tallyui, @draftlab, @draftauth, @ml-toolkit-ts, @mesadev and @supersurkhet scopes,
    plus @beproduct/nestjs-auth and @dirigible-ai/sdk.
  - >-
    Also in scope: @taskflow-corp/cli, @tolka/cli, @mistralai/mistralai 2.2.2 to 2.2.4,
    @mistralai/mistralai-azure and -gcp 1.7.1 to 1.7.3, guardrails-ai 0.10.1, and
    @opensearch-project/opensearch prereleases, tracked separately.