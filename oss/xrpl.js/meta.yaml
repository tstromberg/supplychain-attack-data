- name: xrpl.js
  title: xrpl.js npm package backdoored to steal XRP wallet seeds
  repo: https://github.com/XRPLF/xrpl.js
  synopsis: Five malicious versions of the official Ripple JavaScript SDK were published to npm starting 2025-04-21 at 20:53 UTC by user `mukulljangid` after a maintainer credential compromise. The backdoor exfiltrated wallet seed phrases, mnemonics, and private keys via HTTP POST to `0x9c.xyz/xc` whenever Wallet objects were instantiated or derived. Early versions (4.2.1-4.2.2) injected the payload into compiled JavaScript; later versions (4.2.3-4.2.4) added it to TypeScript source so the backdoor compiled cleanly into builds. Aikido Intel detected the publishes and Ripple released clean v4.2.5 within ~24 hours.
  start_date: 2025-04-21
  end_date: 2025-04-22
  attribution_type: Unknown attacker
  component_type: Library
  lang: javascript
  cause: Compromised credentials
  motive: Cryptocurrency theft
