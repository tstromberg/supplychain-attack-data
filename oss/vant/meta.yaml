- name: vant
  title: vant Vue UI library npm packages backdoored with XMRig
  repo: https://github.com/youzan/vant
  synopsis: On 2024-12-19, the same day as the @rspack/core compromise and likely by the same actor, ten versions of the Chinese-origin Vue UI library `vant` were published to npm with obfuscated XMRig cryptojacking code beaconing to `80.78.28.72/tokens`. The compromise spanned three release lines (v2, v3, v4) — versions 2.13.3-2.13.5, 3.6.13-3.6.15, and 4.9.11-4.9.14 — leveraging a stolen npm publishing token. The maintainers released clean v4.9.15. Vant had ~46,000 weekly downloads at the time of the attack.
  start_date: 2024-12-19
  end_date: 2024-12-20
  attribution_type: Unknown attacker
  component_type: library
  lang: javascript
  cause: Compromised credentials
  motive: Cryptojacking
  transitive: false
  insertion_phase: distribution
