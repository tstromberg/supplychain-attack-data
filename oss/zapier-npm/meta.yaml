- name: zapier-npm
  title: Zapier NPM Account Compromise (Shai Hulud V2)
  repo: https://github.com/zapier/zapier-platform
  synopsis: "The Shai Hulud self-propagating worm compromised Zapier's NPM account, publishing malicious versions of core packages (e.g., zapier-platform-cli, zapier-platform-core). The malware uses TruffleHog to harvest NPM tokens, GitHub PATs, and cloud keys, publicly leaking them into thousands of GitHub repositories titled 'Shai Hulud: The Second Coming' to rapidly propagate."
