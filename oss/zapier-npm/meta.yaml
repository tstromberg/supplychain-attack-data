- name: zapier-npm
  title: Zapier NPM Account Compromise (Shai Hulud V2)
  repo: https://github.com/zapier/zapier-platform
  synopsis: >-
    The Sha1-Hulud "Second Coming" npm worm compromised Zapier packages across
    the @zapier scope and unscoped zapier-platform packages. Affected releases
    used a preinstall hook to invoke Bun and run an obfuscated credential
    stealer that harvested GitHub, npm, cloud, and local environment secrets,
    exfiltrated them through public GitHub repositories, attempted npm
    self-propagation, and registered a self-hosted GitHub Actions runner for
    persistence. The incident affected core Zapier platform and SDK packages.
  start_date: 2025-11-23
  end_date: 2025-11-24
  attribution_type: Third Party
  component_type: Library
  lang: JavaScript
  cause: Compromised Account/Credentials
  motive: Credential Theft
  transitive: false
