- name: react-native-country-select
  title: react-native-country-select npm account takeover
  repo: https://github.com/AstrOOnauta/react-native-country-select
  synopsis: >-
    The astroonauta npm account takeover also compromised
    react-native-country-select, a direct dependency of
    react-native-international-phone-number. The first malicious release used a
    visible preinstall hook; after deprecation, the attacker retained access and
    republished through a transitive dependency chain that resolved to
    @usebioerhold8733/s-format. That chain executed the same detached JavaScript
    malware and Solana blockchain C2 used in the first wave. During the
    incident, @latest resolved to compromised 0.4.2, exposing users of both
    packages.
  start_date: 2026-03-16
  end_date: 2026-03-18
  attribution_type: Unknown
  component_type: Library
  lang: JavaScript
  cause: Compromised Account/Credentials
