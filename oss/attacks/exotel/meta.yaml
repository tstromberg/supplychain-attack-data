- id: exotel
  title: exotel PyPI phishing shipped malware
  campaigns:
  - juiceledger-pypi-phishing-2022
  synopsis: >-
    JuiceLedger used phished PyPI credentials to publish malicious exotel 0.1.6. The release
    collected environment data and ran a downloaded trojan at install time.
  story: |-
    exotel was one of the packages caught in the 2022 JuiceLedger PyPI phishing wave. The attacker did not need to impersonate the package name. They obtained publishing access and uploaded version 0.1.6 to the real PyPI project.

    The malicious release executed during installation. Its setup code collected environment data from the host and reached out to attacker infrastructure, then downloaded and executed a second-stage payload. That made developer machines and CI runners the primary exposure surface.

    The campaign was notable because it targeted maintainers through PyPI-themed phishing rather than package consumers directly. Once credentials were stolen, PyPI became the distribution system for code that looked ordinary by package coordinate but hostile by content.

    The affected release was removed and advisories were published through GitHub and PyPA. This record stays package-specific because the campaign hit several projects, but the version, hashes, and package archive are specific to exotel.
  start_date: 2022-08-24
  end_date: 2022-08-24
  target:
    name: exotel
    kind: library
    repo: https://github.com/exotel/exotel-python
  actor:
    name: JuiceLedger
    kind: group
  language: Python
  method:
    cause: compromised_account_credentials
    phase: distribution
    motive: credential_theft
    transitive: false
  impact:
    types:
    - data_exfiltration
    users: 480000
