  title: exotel PyPI package compromised via phishing.
  synopsis: The PyPI account for the exotel package maintainer was compromised during
    the JuiceLedger phishing campaign. Attackers uploaded version 0.1.6 with installation
    code that downloaded and executed infostealer malware, making a niche Python client
    a clean-looking vessel for credential theft across developer workstations.
