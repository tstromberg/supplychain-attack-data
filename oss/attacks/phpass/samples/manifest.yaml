schema_version: 1
interpretation:
  - >-
    Backstabber's Knife Collection retains two complete archives for the hostile hautelook/phpass
    replacement repository. Both contain the independently reported constructor-time AWS credential
    exfiltration to anti-theft-web.herokuapp.com and the corpus index maps them to the affected
    Composer coordinates. Because Packagist no longer publishes authoritative archive digests, the
    archives are recorded as probable-exact.
  - >-
    Packagist now redirects hautelook/phpass 0.3.6 to the clean bordoni/phpass repository. The exact
    source reference advertised by Packagist is retained as an after comparator.
