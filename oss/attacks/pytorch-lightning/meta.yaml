---
- id: pytorch-lightning
  title: Lightning PyPI wheel bundled Shai-Hulud credential stealer
  campaigns:
  - teampcp-2026
  synopsis: The Mini Shai-Hulud campaign compromised the lightning PyPI package, with
    malicious versions 2.6.2 and 2.6.3 bundling a hidden _runtime directory. On import,
    the package started a daemon thread that downloaded the Bun JavaScript runtime
    from GitHub and executed an 11 MB obfuscated _runtime/router_runtime.js payload.
    StepSecurity reported credential theft, environment and cloud secret harvesting,
    GitHub API exfiltration through victim credentials, and npm tarball poisoning
    on the developer machine.
  start_date: 2026-04-30
