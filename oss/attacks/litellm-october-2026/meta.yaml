- id: litellm-october-2026
  title: LiteLLM release pipeline shipped Python startup malware
  synopsis: >-
    An attacker used stolen release credentials to publish LiteLLM 1.107.0 on October 21. Its wheels
    and container image carried Python startup hooks that stole secrets and loaded remote code.
  story: |
    An administrative key left in a public repository in May helped an attacker turn LiteLLM's
    October 21 release into a credential thief and persistent backdoor. The package lets
    applications talk to multiple AI providers through a common interface, making its deployment
    environments useful places to find provider keys. Seven version 1.107.0 wheels and affected
    container images reached official registries before the maintainers contained the release, in a
    separate incident from LiteLLM's March compromise.

    LiteLLM's postmortem traced the first access to an internal Agent Platform API. The exposed
    master key returned a GitHub organization owner's token on October 10; the attacker then used
    disposable workflows to steal other maintainers' credentials. Socket independently recovered
    secret-stealing workflows from October 10 and 12, on branches deleted soon after use. With
    multiple identities available, the attacker changed the release system to build from the
    lookalike Berri-AI organization and supplied the separate approval needed to publish.

    The malicious wheels turned normal Python startup into an execution trigger. OpenSourceMalware
    found cook.pth, cook.py, and sitecustomize.py arranged to run a collector and retrieve
    additional Python code periodically. Applications did not need to import LiteLLM for the startup
    hooks to execute. Inspection of the retained Linux wheel confirmed those three files in the
    exact 1.107.0 release. OpenSourceMalware's analysis covered browser data, cloud and developer
    credentials, and keys stored by LiteLLM itself, with stolen information sent to www.litellm.dev.

    The maintainers said PyPI quarantined the release by 13:23 UTC on October 21, with affected
    Docker Hub tags removed or repointed by 14:20. They restricted publishing, removed GitHub
    organization access, and treated organizational credentials as exposed. Removing the release
    closed a delivery route, but could not recall secrets or background processes from affected
    environments. The postmortem also corrected the initial account of token theft: the owner's
    credential came from the Agent Platform API, rather than the deployment logs first suspected.
  pull_quote:
    text: Applications did not need to import LiteLLM for the startup hooks to execute.
    caption: Python startup was enough
    after: 3
  start_date: '2026-10-10'
  target:
    name: LiteLLM
    kind: library
    repo: https://github.com/BerriAI/litellm
  method:
    phase: ci_cd
  artifacts:
    - id: litellm
      name: litellm
      package: litellm
      ecosystem: pypi
      kind: binary_archive
      versions:
        - 1.107.0
      hashes:
        - sha256:462d0c9f67ca522d9e0e4acd245e90b36ce0d5353604a66bb7c43a1ec4a6fcf7
      notes:
        - >-
          The recorded digest identifies the manylinux_2_28_x86_64 wheel. All seven published wheels
          were reported malicious.
    - id: litellm-container
      name: ghcr.io/berriai/litellm
      ecosystem: docker
      kind: container_image
      versions:
        - v1.107.0
      locations:
        - uri: https://github.com/BerriAI/litellm/pkgs/container/litellm
          role: distribution
  references:
    - url: https://socket.dev/blog/litellm-compromise
