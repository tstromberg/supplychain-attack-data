- id: transmission-2016-03
  title: Transmission macOS installer distributed KeRanger ransomware
  synopsis: The official Transmission BitTorrent website was compromised, and attackers
    replaced the macOS installer for version 2.90 with a malicious disk image. Users
    following the trusted download path received OSX.KeRanger ransomware, which encrypted
    files after installation and made the release channel the first stage.
