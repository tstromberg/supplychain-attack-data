schema_version: 1
interpretation:
  - >-
    WordPress SVN's immutable revision paths preserve each malicious PHP file even though the public
    tags were later rolled back or removed. The payloads below match Adam Harley's contemporary
    analysis line-for-line. Where full historical release ZIPs no longer exist, the exact changed
    file is retained with clean predecessor and remediation versions for reconstruction.
