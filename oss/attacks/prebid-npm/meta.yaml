- id: prebid-npm
  title: Prebid npm packages carried Qix wallet drainer
  campaigns:
  - qix-npm-phishing-2025
  synopsis: Prebid.js and Prebid Universal Creative npm releases were briefly compromised
    during the September 2025 npm phishing wave. The affected packages carried crypto-transaction
    redirection malware.
  story: |-
    Prebid's affected artifacts were separate from the original Qix maintainer account and from the later DuckDB packages. GitHub advisories and ecosystem databases identify malicious npm releases for Prebid.js and Prebid Universal Creative.

    The code path mattered because both packages can be loaded into browser-facing advertising workflows. The campaign page preserves the shared phishing and wallet-drainer context; this record keeps the Prebid package coordinates together.
