schema_version: 1
interpretation:
  - >-
    The historical Funet mirror dates this archive to June 1993, before CERT's
    earliest May 1994 compromise window. Its source contains neither JUPE nor GROK,
    making it a strong clean same-version comparator rather than a checksum-certified
    copy of every pre-compromise distribution.
  - >-
    The poisoned archive remains unavailable. Contemporary Bugtraq messages preserve
    the maintainer's confirmation of compromised FTP copies and an eyewitness account
    locating the JUPE command in source/ctcp.c and describing its remote command behavior.
