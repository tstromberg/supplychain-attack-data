    notes:
    - CERT reported the corrupt source was available as early as May 1994 but did not 
      identify a specific first distribution date.
    - The preserved clean 2.2.9 archive is dated June 1993 and contains neither JUPE nor
      GROK. It is a pre-window comparator, not proof that every later copy with this
      filename was clean.
    - CERT's recommended 2.6 remediation archive had size 366361 and MD5
      3FC5FBD18CB3E6C071F51FD8C6C59017; those exact archive bytes remain unresolved.
    - Unresolved tension. CERT listed `ftp.funet.fi:/pub/unix/irc/ircII` among the FTP
      sites to fetch the recommended 2.6 source from, but the Bugtraq analysis says a
      JUPE-bearing 2.2.9 copy came from ftp.funet.fi within the preceding month. No
      source reconciles the two, and this record does not pick a side.
  notes:
  - The start date is encoded as 1994-05-01 because CERT only gave "as early as May 
    1994"; the advisory date is 1994-10-19.
