---
- id: pytorch
  title: PyTorch nightly builds compromised via malicious dependency
  synopsis: PyTorch nightly builds were compromised when a malicious torchtriton package
    was uploaded to PyPI and won dependency resolution over the intended internal
    package. The poisoned dependency executed during installation, exfiltrating sensitive
    build environment data and showing how one namespace collision can bend a trusted
    ML build.
  start_date: 2022-12-25
  end_date: 2022-12-30
