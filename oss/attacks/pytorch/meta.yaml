---
- id: pytorch
  title: PyTorch nightly builds compromised via malicious dependency
  synopsis: PyTorch nightly builds were compromised when a malicious torchtriton package
    was uploaded to PyPI and won dependency resolution over the intended internal
    package hosted on PyTorch's nightly index. Linux users who installed nightly
    builds with pip between December 25 and December 30, 2022 could receive torchtriton
    2.0.0 from PyPI. The malicious ELF collected host, environment, git, SSH, and
    home-directory data and exfiltrated it through encrypted DNS queries.
  story: |
    The PyTorch compromise was dependency confusion in a high-value machine-learning stack. PyTorch nightly builds depended on torchtriton, an internal package served from PyTorch's own index. Because pip gave PyPI precedence in the mixed-index install flow, an attacker could publish the same package name publicly and win resolution.

    On December 26, 2022, the attacker published torchtriton 2.0.0 to PyPI. Checkmarx reported that the public package copied the legitimate project and added two changes: a malicious ELF binary under `triton/runtime/triton` and Python glue in `__init__.py` to execute it. The package also used starjacking to borrow legitimacy from the real repository.

    The binary targeted x64 Linux systems. It collected nameserver configuration, hostname, username, working directory, environment variables, `/etc/hosts`, `/etc/passwd`, `.gitconfig`, `.ssh`, and the first 1,000 files under the user's home directory. Exfiltration went through encrypted DNS queries to `*.h4ck.cfd` using `wheezy.io`.

    PyTorch removed affected nightly packages, replaced the dependency with pytorch-triton, and registered a dummy PyPI package to prevent the same namespace collision. Stable PyTorch packages were not affected. The incident became a reference case for PyPI dependency confusion against mixed public and project-hosted package indexes.
  start_date: 2022-12-25
  end_date: 2022-12-30
