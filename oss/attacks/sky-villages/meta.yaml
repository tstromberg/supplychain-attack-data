- id: sky-villages-forge-fabric
  title: Sky Villages mod shipped Fracturiser malware
  campaigns:
  - fracturiser-2023
  synopsis: >-
    The CurseForge account associated with the 'Sky Villages' Minecraft mod was compromised.
    Attackers uploaded a malicious JAR file appearing as a legitimate update for the mod.
  story: |
    Sky Villages was one of the named Fracturiser carrier projects on CurseForge. The attacker did not need to invent a fake package; the trusted project page and maintainer path were enough.

    The malicious upload arrived as a JAR update for the Forge and Fabric mod. When loaded by Minecraft, it gave the first Fracturiser stage a clean execution point inside the player's expected mod workflow. From there the campaign chain moved outside the game: public analyses describe multi-stage malware that targeted Windows and Linux hosts and focused on secrets, persistence, and further compromise rather than visible game disruption.

    That quietness was the core risk. A player could install or update Sky Villages for ordinary gameplay reasons and only discover the problem later, after the loader had used a normal mod startup path.

    This record preserves the project-specific distribution surface. The campaign record explains the shared infrastructure; the artifact here names the CurseForge page players and responders had to check.
  start_date: 2023-05-01
  end_date: 2023-06-08
  target:
    name: Sky Villages [Forge/Fabric]
    kind: game_mod
  actor:
    name: Cybercriminal Gang
    kind: group
  language: Java
  method:
    cause: compromised_account_credentials
    phase: distribution
    motive: credential_theft
    transitive: false
  impact:
    types:
    - data_exfiltration
    users: 481
