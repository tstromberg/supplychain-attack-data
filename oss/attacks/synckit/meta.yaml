- id: synckit
  title: synckit npm phishing shipped malware
  campaigns:
  - npnjs-scam-npm-2025
  synopsis: >-
    StepSecurity confirmed synckit 0.11.9 as one of the npm packages affected by the July
    2025 npnjs.com maintainer phishing campaign. The attacker used a phished maintainer credential
    path to publish malicious releases directly to npm without corresponding source repository
    changes.
  story: |-
    synckit was one of the smaller packages in the npnjs.com phishing wave. Its importance comes from campaign linkage: a stolen maintainer credential let the attacker publish directly to npm under the legitimate package name.

    Version 0.11.9 was the malicious release. Like the Prettier tooling packages in the same wave, it was distributed through npm without a corresponding normal source change, so consumers saw a registry event before they saw a repository event.

    The package belonged to the JavaScript tooling ecosystem, where install hooks run in developer and CI environments. Even a small package can matter when it is transitive and executes before application code starts.

    The campaign record carries the broader phishing infrastructure. This record keeps the artifact-level coordinate, version, and npm distribution path separate.
  start_date: 2025-07-18
  end_date: 2025-07-19
  target:
    name: synckit
    kind: library
    repo: https://www.npmjs.com/package/synckit
  actor:
    name: Third Party
    kind: group
  language: JavaScript
  method:
    cause: social_engineering
    phase: distribution
    motive: remote_code_execution
    transitive: true
  impact:
    types:
    - code_execution
    users: 0
  artifacts:
  - id: synckit
    name: synckit
    ecosystem: npm
    kind: source_archive
    repo: https://www.npmjs.com/package/synckit
    start_date: 2025-07-18
    end_date: 2025-07-19
    versions:
    - 0.11.9
    locations:
    - uri: https://www.npmjs.com/package/synckit/v/0.11.9
      role: distribution
    - uri: https://www.npmjs.com/package/synckit
      role: mirror
    indicators:
    - kind: observable
      value: Published through npm credentials stolen in the npnjs.com phishing campaign.
  references:
  - url: 
      https://www.stepsecurity.io/blog/supply-chain-security-alert-eslint-config-prettier-package-shows-signs-of-compromise
    title: eslint-config-prettier package shows signs of compromise
  - url: 
      https://socket.dev/blog/npm-phishing-campaign-leads-to-prettier-tooling-packages-compromise
    title: npm phishing campaign leads to Prettier tooling packages compromise
