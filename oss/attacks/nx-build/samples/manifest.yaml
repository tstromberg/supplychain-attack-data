schema_version: 1
interpretation:
  - >-
    The preserved nx 21.7.0 tarball is a complete copy of an npm-distributed malicious release. It
    is retained by StepSecurity's public incident-research repository at immutable commit
    86c3cbec34a16cb171c9929768f56ae50ab66a4e. Its package metadata declares nx 21.7.0 and runs
    telemetry.js at postinstall.
  - >-
    The telemetry.js embedded in that archive has SHA-1 2379ac0e03b1a67c4ca5693136eff4945e644a91,
    matching the published campaign indicator and the independently recovered Malshare copy. The
    other three recovered telemetry.js variants match published SHA-1 indicators, but a particular
    affected package and version has not yet been mapped to each one.
  - >-
    Nx's advisory identifies 21.4.1 as the restored valid release after npm removed the poisoned
    versions. Version 21.5.1 is a clean later npm release outside the advisory's affected-version
    list; together they provide useful before and after comparators without implying sequential
    semantic versions.
samples:
  - artifact_id: nx
    phase: before
    classification: clean
    version: 21.4.1
    filename: nx-21.4.1.tgz
    path: nx/before/nx-21.4.1.tgz
