      basis:
        - official_npm_registry_purl
        - nx_advisory_restored_valid_21_4_1
        - npm_sha512_integrity
        - measured_sha256
    notes:
      - >-
        Nx's advisory says 21.4.1 was restored as the latest valid release after removal of the
        malicious versions.
