  notes:
  - Wiz observed more than 1,000 valid GitHub tokens, dozens of valid cloud credentials 
    and npm tokens, and roughly 20,000 files leaked during the first phase.
  - Wiz reported a second phase between roughly 2025-08-28 16:00 UTC and 2025-08-29 
    02:00 UTC that made more than 5,500 private repositories public across more than 400
    users or organizations. The impact users field records that phase-two exposure 
    count, not confirmed npm install victims.
  - The Register reported malicious publishes started at 2025-08-26 22:32 UTC and 
    continued for just over two hours; npm removed affected versions after being alerted
    at 2025-08-27 02:58 UTC.
