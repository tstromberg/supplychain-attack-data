---
- id: nx-build
  title: Nx Build "s1ngularity" Supply Chain Attack
  synopsis: The s1ngularity incident began with a vulnerable Nx GitHub Actions workflow
    that combined pull_request_target privileges with shell injection in pull-request
    metadata. The attacker used it to trigger publish.yml, run a malicious commit
    that leaked the npm token, and publish 19 malicious nx and @nx package versions.
    The postinstall payload harvested developer, GitHub/npm, SSH, environment, and
    wallet secrets, used local AI CLI tools to help find sensitive files, and exfiltrated
    data through public s1ngularity-repository GitHub repos. It also appended a shutdown
    command to shell startup files. Nx Console VS Code versions 18.63.x-18.65.x widened
    exposure by running nx@latest during the malicious publish window.
  start_date: 2025-08-26
  end_date: 2025-08-27
