  - id: nx-console
    name: Nx Console VS Code extension
    package: nrwl.angular-console
    ecosystem: vs code marketplace
    kind: extension
    start_date: 2025-08-26
    end_date: 2025-08-27
    versions:
    - 18.63.0 - 18.65.1
    locations:
    - uri: https://marketplace.visualstudio.com/items?itemName=nrwl.angular-console
      role: distribution
    notes:
    - The marketplace identifier is nrwl.angular-console; "Nx Console" is the display
      name. The affected range was recorded as 18.63.x - 18.65.x, which is not a
      resolvable version identifier. The marketplace lists 18.63.0, 18.64.1, 18.65.0,
      and 18.65.1 in that range, so the endpoints are stated explicitly. Which of the
      four carried the compromise has not been confirmed.

    - Affected extension versions widened exposure by running nx@latest during the 
      malicious publish window.
