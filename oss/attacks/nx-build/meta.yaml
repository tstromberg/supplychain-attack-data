- name: nx-build
  title: Nx Build "s1ngularity" Supply Chain Attack
  repo: https://github.com/nrwl/nx
  synopsis: >-
    The s1ngularity incident began with a vulnerable Nx GitHub Actions workflow
    that combined pull_request_target privileges with shell injection in
    pull-request metadata. The attacker used it to trigger publish.yml, run a
    malicious commit that leaked the npm token, and publish 19 malicious nx and
    @nx package versions. The postinstall payload harvested developer,
    GitHub/npm, SSH, environment, and wallet secrets, used local AI CLI tools to
    help find sensitive files, and exfiltrated data through public
    s1ngularity-repository GitHub repos. It also appended a shutdown command to
    shell startup files. Nx Console VS Code versions 18.63.x-18.65.x widened
    exposure by running nx@latest during the malicious publish window.
  start_date: 2025-08-26
  end_date: 2025-08-27
  attribution_type: Third Party
  component_type: Build Tool
  lang: JavaScript
  cause: CI/CD Exploit
  motive: Credential Theft/Data Exfiltration
  transitive: false
  historical_artifacts:
    - https://github.com/nrwl/nx/commit/3905475cfd0e0ea670e20c6a9eaeb768169dc33d
    - https://github.com/search?q=is%3Aname+s1ngularity-repository&type=repositories&s=updated&o=desc
    - https://github.com/nrwl/nx/issues/32522
  current_artifacts:
    - https://github.com/nrwl/nx
  domain: npmjs.com
  domain_type: package host
  artifact_type: source archive
  insertion_phase: distribution
  impact_type: Data Exfiltration, Disruption
  impact_user_count: 0
  references:
