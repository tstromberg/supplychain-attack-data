---
- id: trivy-hackerbot-claw
  title: Trivy Repository Takeover via hackerbot-claw
  synopsis: The hackerbot-claw account exploited a pull_request_target workflow in
    aquasecurity/trivy to run untrusted fork code with repository privileges. The
    stolen token was used to push directly to the repository, vandalize the README,
    temporarily privatize and rename the project, replace it with an empty repository,
    delete release assets from v0.27.0 through v0.69.1, and publish a suspicious Trivy
    VS Code extension artifact. Aqua restored the repository, revoked publishing tokens,
    removed the vulnerable workflow, and republished v0.69.2 while rebuilding release
    assets.
  start_date: 2026-02-28
  end_date: 2026-03-01
