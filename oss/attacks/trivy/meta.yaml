- name: trivy-hackerbot-claw
  title: Trivy Repository Takeover via hackerbot-claw
  repo: https://github.com/aquasecurity/trivy
  synopsis: >-
    The hackerbot-claw account exploited a pull_request_target workflow in
    aquasecurity/trivy to run untrusted fork code with repository privileges.
    The stolen token was used to push directly to the repository, vandalize the
    README, temporarily privatize and rename the project, replace it with an
    empty repository, delete release assets from v0.27.0 through v0.69.1, and
    publish a suspicious Trivy VS Code extension artifact. Aqua restored the
    repository, revoked publishing tokens, removed the vulnerable workflow, and
    republished v0.69.2 while rebuilding release assets.
  start_date: 2026-02-28
  end_date: 2026-03-01
  attribution_type: Individual
  component_type: Application
  lang: Go
  cause: CI/CD Exploit
  motive: Credential Theft/Vandalism
  transitive: false
  historical_artifacts:
    - https://github.com/aquasecurity/trivy/pull/10254
    - https://github.com/aquasecurity/trivy/commit/d267cc4
    - https://open-vsx.org/extension/aquasecurityofficial/trivy-vulnerability-scanner
  current_artifacts: []
  domain: github.com
  domain_type: repository
  artifact_type: source archive
  insertion_phase: CI/CD
  impact_type: Repository Takeover
  impact_user_count: 0
  references:
    - https://www.stepsecurity.io/blog/hackerbot-claw-github-actions-exploitation
    - https://github.com/aquasecurity/trivy/discussions/10265
  versions:
    - "release assets deleted: v0.27.0-v0.69.1"
    - "restored: v0.69.2"
  commits:
    - d267cc4
  hashes: []
- name: trivy-second-compromise
  title: Trivy v0.69.4 Release and Action Compromise
  repo: https://github.com/aquasecurity/trivy
  synopsis: >-
    After incomplete containment of the February Trivy takeover, compromised
    credentials were used to publish malicious Trivy v0.69.4 artifacts,
    force-push most trivy-action version tags, and replace setup-trivy tags with
    credential-stealing commits. The payloads read GitHub Actions runner memory
    and process environments, collected developer and cloud secrets, encrypted
    the data, and exfiltrated to the typosquatted domain scan.aquasecurtiy.org
    or fallback public tpcp-docs repositories. Compromised Docker Hub images
    followed on March 22. Aqua deleted affected tags, released fixed action
    versions, and published GHSA-69fq-xp46-6x23 / CVE-2026-33634.
  start_date: 2026-03-19
