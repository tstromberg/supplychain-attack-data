- id: trivy-second-compromise
  title: Trivy v0.69.4 Release and Action Compromise
  synopsis: After incomplete containment of the February Trivy takeover, compromised
    credentials were used to publish malicious Trivy v0.69.4 artifacts, force-push
    most trivy-action version tags, and replace setup-trivy tags with credential-stealing
    commits. The payloads read GitHub Actions runner memory and process environments,
    collected developer and cloud secrets, encrypted the data, and exfiltrated to
    the typosquatted domain scan.aquasecurtiy.org or fallback public tpcp-docs repositories.
    Compromised Docker Hub images followed on March 22. Aqua deleted affected tags,
    released fixed action versions, and published GHSA-69fq-xp46-6x23 / CVE-2026-33634.
  start_date: 2026-03-19
  end_date: 2026-03-23
