- id: redhat-cloud-services
  title: Red Hat npm namespace poisoned via a maintainer's editor
  campaigns:
  - miasma-2026
  synopsis: >-
    An attacker used a Red Hat employee's GitHub account, compromised by a malicious VS Code
    extension, to inject the Miasma preinstall dropper into 32 @redhat-cloud-services npm
    packages. Red Hat published 96 malicious versions before pulling them.
  story: |
    Red Hat confirmed in early June 2026 that attackers had published malicious
    versions of 32 npm packages in its `@redhat-cloud-services` namespace, using
    an employee's GitHub account that had been compromised through a booby-trapped
    Visual Studio Code extension.

    The affected packages are frontend JavaScript libraries that build the Hybrid
    Cloud Console at console.redhat.com, Red Hat's web interface for managing
    subscriptions and cloud services. They are not headline packages, but between
    them they accounted for roughly 117,000 weekly npm downloads, most of it into
    build pipelines rather than onto developer laptops.

    In security bulletin RHSB-2026-006, published June 2, Red Hat said the
    intrusion began on May 29, when the attacker used the stolen GitHub account to
    inject malicious code into repositories in a Red Hat GitHub organization and to
    alter configuration files in a way designed to infect other developers who
    worked on them. Ninety-six versions across the 32 packages reached the npm
    registry. The malware, which researchers had begun tracking as Miasma, arrived
    as a `preinstall` script, which meant it executed during `npm install` before
    any application code ran.

    Red Hat engineering removed the compromised versions from npm after disclosure
    and said no Red Hat product or enterprise software had been built or shipped
    with an affected version, so customers were not asked to take action. The entry
    point drew as much comment as the payload. A developer's editor extension is
    not usually modeled as part of a vendor's release pipeline, and in this case it
    was the shortest path to a namespace trusted by everyone who builds against the
    console.
  start_date: 2026-05-29
  end_date: 2026-06-02
  target:
    name: '@redhat-cloud-services'
    kind: organization
    repo: https://github.com/RedHatInsights
    website: https://www.npmjs.com/org/redhat-cloud-services
  actor:
    name: Unknown
    kind: group
  language: JavaScript
  method:
    cause: compromised_account_credentials
    phase: source
    motive: credential_theft
    transitive: true
  impact:
    types:
    - credential_theft
    - self_propagation
    - data_exfiltration
    users: 116991
  locations:
  - uri: https://www.npmjs.com/org/redhat-cloud-services
    role: distribution
  - uri: https://access.redhat.com/security/vulnerabilities/RHSB-2026-006
    role: mirror
  indicators:
  - kind: advisory
    value: RHSB-2026-006
  - kind: malware_family
    value: Miasma
  notes:
  - Red Hat attributed the initial access to a GitHub account compromised by a malicious
    VS Code extension, not to a compromised npm publishing token. The malicious code was
    injected at the source repository and carried forward into published packages.
  - Red Hat reported 32 packages and 96 versions. Weekly download volume across the
    affected packages was reported as 116,991; Wiz put the figure at roughly 80,000. No
    count of successful installs of a malicious version has been published.
  - The per-package version list here comes from StepSecurity, which enumerated what
    RHSB-2026-006 reported only as totals. It accounts for 95 of the 96 versions Red Hat
    counted. Every package carries three malicious releases except
    '@redhat-cloud-services/vulnerabilities-client', listed as 2.1.9 and 2.1.11. The
    intervening 2.1.10 is unaccounted for and is not recorded here, because no source
    states that it was malicious.
  - Wiz identified the compromise on 2026-06-01 by finding at least 32 package releases
    whose contents did not match their source repositories, which is the detection angle
    that works when the publishing identity itself is legitimate.
  - Red Hat stated that no Red Hat products or enterprise software were built or shipped
    with a compromised version and that no customer action was required.
  - Microsoft published SHA-256 values for malicious `index.js` files extracted from six
    packages. These are component-file checksums, not checksums of the npm tarballs; five
    identify an exact version, while the remediations-client report does not state which
    affected version supplied its sample.
