---
- id: accesspress-themes
  title: AccessPress Themes vendor-site WordPress add-on backdoor
  synopsis: AccessPress Themes' own download site was breached, turning legitimate
    WordPress themes and plugins into backdoored vendor ZIPs while the WordPress.org
    copies remained clean. The injected PHP dropper wrote a cookie-triggered webshell
    into WordPress core, called back to wp-theme-connect.com, then deleted itself.
    The compromise affected 40 themes and 53 plugins, giving attackers durable control
    of sites that trusted the vendor's official downloads.
  start_date: 2021-09-02
  end_date: 2021-10-15
  target:
    name: AccessPress Themes
    kind: extension
    website: https://accesspressthemes.com
  actor:
    name: Unknown
    kind: unknown
  language: PHP
  method:
    cause: compromised_infrastructure
    phase: distribution
    motive: remote_access
    transitive: false
  impact:
    types:
    - backdoor
    - remote_access
    users: 360000
  locations:
  - uri: pkg:generic/accesspress-theme?repository_url=https://accesspressthemes.com
    role: distribution
  - uri: pkg:generic/accesspress-plugin?repository_url=https://accesspressthemes.com
    role: distribution
  indicators:
  - kind: file
    value: inital.php
  - kind: file
    value: wp-includes/vars.php
  - kind: function
    value: wp_is_mobile_fix
  - kind: domain
    value: wp-theme-connect.com
  hashes:
  - sha256:0918af9a5c6060dec985b98bbf54030cd29f1701ca9fdb6abfc1e39f90e5113e
