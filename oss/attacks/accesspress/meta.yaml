- name: AccessPress Themes
  title: AccessPress Themes vendor-site WordPress add-on backdoor
  synopsis: AccessPress Themes' own download site was breached, turning legitimate WordPress themes and plugins into backdoored vendor ZIPs while the WordPress.org copies remained clean. The injected PHP dropper wrote a cookie-triggered webshell into WordPress core, called back to wp-theme-connect.com, then deleted itself. The compromise affected 40 themes and 53 plugins, giving attackers durable control of sites that trusted the vendor's official downloads.
  start_date: 2021-09-02
  end_date: 2021-10-15
  attribution_type: Unknown
  component_type: Extension
  lang: PHP
  cause: Compromised Infrastructure
  motive: Remote access
  transitive: false
  insertion_phase: distribution
  impact_type: Backdoor, Remote access
  impact_user_count: 360000
  artifact_type: extension package
  historical_artifacts:
    - pkg:generic/accesspress-theme?repository_url=https://accesspressthemes.com
    - pkg:generic/accesspress-plugin?repository_url=https://accesspressthemes.com
  current_artifacts:
    - file:inital.php
    - file:wp-includes/vars.php
    - function:wp_is_mobile_fix
    - domain:wp-theme-connect.com
  hashes:
    - sha256:0918af9a5c6060dec985b98bbf54030cd29f1701ca9fdb6abfc1e39f90e5113e
  domain: accesspressthemes.com
  domain_type: project download host
  references:
    - https://jetpack.com/resources/backdoor-found-in-themes-and-plugins-from-accesspress-themes/
    - https://blog.sucuri.net/2022/01/accesspress-themes-hit-with-targeted-supply-chain-attack.html
    - https://arstechnica.com/information-technology/2022/01/supply-chain-attack-used-legitimate-wordpress-add-ons-to-backdoor-sites/
    - https://www.bleepingcomputer.com/news/security/over-90-wordpress-themes-plugins-backdoored-in-supply-chain-attack/
    - https://its.ny.gov/2022-012
  versions:
    - 40 themes and 53 plugins from AccessPress Themes or Access Keys vendor downloads
    - WordPress.org-hosted copies were reported clean by Jetpack
  commits: []
