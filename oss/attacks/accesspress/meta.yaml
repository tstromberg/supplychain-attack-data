- id: accesspress-themes
  title: AccessPress add-ons created backdoors
  synopsis: >-
    AccessPress Themes' own download site was breached, turning legitimate WordPress themes
    and plugins into backdoored vendor ZIPs while the WordPress.org copies remained clean.
  story: |-
    The AccessPress compromise was a vendor-site distribution attack. The same themes and plugins were clean when installed from WordPress.org, but the ZIPs served from AccessPress Themes carried added PHP. Users chose the vendor's official site and received different code.

    The injected dropper lived in `inital.php`. When the extension ran, it modified `wp-includes/vars.php` and installed a cookie-driven webshell named `wp_is_mobile_fix` near the legitimate `wp_is_mobile()` function. The dropper then contacted `wp-theme-connect.com` and removed itself.

    Jetpack found plugin timestamps clustered in early September 2021 and theme timestamps on September 22, with modified files appearing minutes after the archive contents. That pattern fit a coordinated rewrite of released ZIPs rather than ordinary development.

    The blast radius was broad: dozens of free themes and plugins, plus unknown exposure for paid products. Cleanup required more than replacing the extension, because the backdoor wrote into WordPress core files after installation.
  pull_quote:
    text: >-
      The same theme at the same version was clean from WordPress.org and
      backdoored from the vendor's own download page. The version number said
      nothing about which copy you had.
    caption: same version, two different files
    after: 3
  start_date: 2021-09-02
  end_date: 2021-10-15
  target:
    name: AccessPress Themes
    kind: extension
    website: https://accesspressthemes.com
  actor:
    name: Unknown
    kind: unknown
  language: PHP
  method:
    cause: compromised_infrastructure
    phase: distribution
    motive: remote_access
    transitive: false
  impact:
    types:
    - backdoor
    - remote_access
    users: 360000
  locations:
  - uri: pkg:generic/accesspress-theme?repository_url=https://accesspressthemes.com
    role: distribution
  - uri: pkg:generic/accesspress-plugin?repository_url=https://accesspressthemes.com
    role: distribution
  indicators:
  - kind: file
    value: inital.php
  - kind: file
    value: wp-includes/vars.php
  - kind: function
    value: wp_is_mobile_fix
  - kind: domain
    value: wp-theme-connect.com
  hashes:
  - sha256:0918af9a5c6060dec985b98bbf54030cd29f1701ca9fdb6abfc1e39f90e5113e
