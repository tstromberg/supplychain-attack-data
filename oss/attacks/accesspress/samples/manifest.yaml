schema_version: 1
interpretation:
  - The acquired files are clean same-version comparators from WordPress.org.
  - >-
    The compromised artifacts were separate ZIPs served by the AccessPress vendor site; recovered
    vendor archives are recorded as malicious alongside their clean comparators.
  - >-
    Clean files for four advisory rows with no identified Bad version are retained as research
    evidence, but those versions are not treated as affected artifacts in meta.yaml.
