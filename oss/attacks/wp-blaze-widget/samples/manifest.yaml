schema_version: 1
interpretation:
  - >-
    Immutable SVN shows that the campaign payload first appeared in revision 3105768 while the
    plugin still declared version 2.2.4; this predates the CVE's 2.2.5 lower bound. Revisions
    3105768 and 3106494 expose complete five-file trees. Three files match the fixed 2.5.4 ZIP;
    exact revision copies replace ReadMe.txt and blaze_widget.php, enabling complete tree
    reconstructions without inventing missing members.
invalidated_attempts:
  - coordinate: pkg:wordpress/wp-blaze-widget
    reason: The generated coordinate used the incident ID instead of the real blaze-widget slug.
