    phase: during
    filename: ANIMAL program file as it ran
    status: unavailable
    notes:
      - >-
        No UNIVAC 1100 program file survives, and no digest was ever published for one. The source
        above is the closest thing that exists, and it is the author's transcription rather than the
        artifact.
    attempts:
      - No digest is published in any source, so the hash lanes have nothing to query.
      - >-
        No distribution channel existed to archive: ANIMAL spread between installations on tape,
        which is the point of the incident.
