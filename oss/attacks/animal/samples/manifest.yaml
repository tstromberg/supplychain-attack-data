schema_version: 1
interpretation:
  - >-
    ANIMAL predates every distribution channel this corpus otherwise draws on. There is no registry,
    no archive of UNIVAC 1100 program files, and no digest published by anyone. What exists is the
    author's own source, which John Walker put online himself and still hosts, and that is what is
    held here.
  - >-
    Two programs, not one. ANIMAL is the guessing game that gave the incident its name; PERVADE is
    the routine that made it a supply-chain event, copying the calling program into every directory
    its caller could reach. PERVADE is the artifact that matters.
