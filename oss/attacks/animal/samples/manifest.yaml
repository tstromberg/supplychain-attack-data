        - extracted_from_the_retained_page
        - measured_sha256
    notes:
      - >-
        PERVADE, dated January 1975 and subtitled "a new means of releasing software". It walks
        every directory the caller can write to and installs a copy of the calling program where
        none is present, which is self-replication through the ordinary file permissions of a shared
        system rather than through any flaw.
      - >-
        The author's published source, not a UNIVAC program file. Nothing binds these characters to
        what actually ran in 1975 beyond Walker's own account, so it is payload_only.
