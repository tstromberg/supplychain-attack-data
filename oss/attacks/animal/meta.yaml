- id: animal
  title: ANIMAL early trojan horse program replicates across mainframes
  synopsis: ANIMAL was one of the earliest documented examples of a self-replicating
    "trojan horse" program. Created by John Walker, it presented as a simple "20 questions"
    game guessing animals but secretly searched the system for other terminals and
    copies of itself. When run on a clean system, it would install a "Trojan Horse"
    version of itself in the user's account, gradually propagating throughout the
    system.
