- id: ctx
  title: ctx NPM package maintainer hijack steals credentials
  synopsis: An attacker gained access to the maintainer account for ctx, a small utility
    library, and published a malicious release. The payload hid in a test file but
    ran during installation, scraping environment variables and .npmrc credentials
    from machines that treated the package as harmless plumbing.
