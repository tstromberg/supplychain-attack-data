      value: Environment variables were collected, base64-encoded, and exfiltrated
        during package execution.
    - kind: observable
      value: PyPI estimated roughly 27,000 downloads of malicious ctx releases, with
        mirror activity accounting for much of the excess.
    notes:
    - Orca and CrowdStrike describe the account takeover as a PyPI password reset enabled
      by re-registering the expired figlief.com domain.
    - Sonatype observed malicious versions 0.2.2 and 0.2.6 and reported that the PyPI
      copy of 0.1.2 had also been replaced with malicious code.
