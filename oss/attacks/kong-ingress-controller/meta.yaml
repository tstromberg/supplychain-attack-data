---
- id: kong-ingress-controller
  title: Kong Ingress Controller image backdoored with cryptominer
  synopsis: An attacker compromised a Kong DockerHub Personal Access Token (PAT),
    likely via a CI/CD pipeline exploit ("Pwn Request" targeting an old branch). Using
    this token, they uploaded a malicious version of the official Kong Ingress Controller
    container image (v3.4.0) directly to DockerHub. This malicious image contained
    an XMRig cryptominer configured to mine Monero using the resources of clusters
    that pulled and ran the compromised image.
  start_date: 2024-12-23
