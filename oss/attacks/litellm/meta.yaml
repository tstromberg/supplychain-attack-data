- name: litellm
  title: LiteLLM PyPI Credential Stealer and Kubernetes Backdoor
  campaigns:
    - teampcp-2026
  repo: https://github.com/BerriAI/litellm
  synopsis: >-
    TeamPCP compromised LiteLLM PyPI releases 1.82.7 and 1.82.8 with a
    credential-stealing payload that evolved from a proxy-module trigger to a
    wheel-level .pth file executed by Python at interpreter startup. The malware
    harvested environment, SSH, cloud, Kubernetes, package-manager, CI/CD, and
    wallet secrets, encrypted the archive with a TeamPCP RSA/AES scheme, and
    exfiltrated it as tpcp.tar.gz. It also attempted user-level persistence and,
    where Kubernetes permissions allowed, deployed privileged pods to backdoor
    cluster nodes. The incident is historically important as a stealthy
    Python-packaging abuse case where the second release executed even when
    LiteLLM itself was never imported.
  start_date: 2026-03-24
  end_date: 2026-03-24
