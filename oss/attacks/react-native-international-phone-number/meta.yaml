    notes:
    - Aikido reported react-native-international-phone-number@0.11.8 was published on 
      March 16, 2026 at 10:49:29 UTC and had 20,691 weekly downloads and 92,298 monthly 
      downloads when checked that day.
    - Aikido noted 0.11.8 depended on react-native-country-select@0.3.9, the clean 
      adjacent version, so the first-wave compromise was direct rather than inherited 
      from react-native-country-select@0.3.91.
    - StepSecurity later tracked additional malicious releases, including transitive 
      delivery through @agnoliaarisian7180/string-argv and @usebioerhold8733/s-format.
