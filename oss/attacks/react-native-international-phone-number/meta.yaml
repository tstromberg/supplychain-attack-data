- id: react-native-international-phone-number
  title: react-native-international-phone-number npm account takeover
  campaigns:
  - glassworm-march-2026
  synopsis: An attacker controlling the astroonauta npm account published malicious
    react-native-international-phone-number releases without matching GitHub releases,
    tags, or workflow runs. The first wave used a direct preinstall hook; later releases
    hid the same malware behind a dependency chain through @agnoliaarisian7180/string-argv
    and @usebioerhold8733/s-format. The final chain executed a detached JavaScript
    loader using a Solana wallet dead-drop C2, RPC fallbacks, geofiltering, encrypted
    payload delivery, and a local rate-limit file. The incident is notable for the
    attacker returning after disclosure and switching from obvious install hooks to
    transitive delivery.
