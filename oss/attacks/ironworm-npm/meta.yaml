- id: ironworm-npm
  title: IronWorm backdoored Arweave ecosystem npm packages
  synopsis: >-
    JFrog found a Rust-built npm worm in 36 packages published from the compromised
    asteroiddao account, carrying an eBPF kernel rootkit and a Tor C2. It backdated commits
    across nine GitHub organizations and republished via npm trusted publishing.
  story: |
    JFrog Security Research disclosed in early June 2026 that a self-propagating
    worm it named IronWorm had backdoored 36 npm packages, most of them in the
    Arweave and WeaveDB ecosystem, after compromising the `asteroiddao` publishing
    account. Unlike the JavaScript droppers that dominated npm attacks that year,
    IronWorm was a native Rust implant with a kernel-level rootkit.

    The delivery was conventional enough. A `preinstall` hook executed a 976 KB
    Linux ELF binary before dependency resolution finished. Everything after that
    was not. The binary was packed with a modified UPX stub carrying altered magic
    values, which defeats signature-based unpackers, and every internal string was
    encrypted with a key unique to its call site, so recovering one string does not
    help with the next. Bundled with it was an eBPF program that hid the malware's
    processes and network connections from the kernel's own accounting, and a Tor
    client that wrapped plain HTTP command-and-control traffic in an onion circuit.

    The collector targeted 86 environment variables and more than 20 credential
    file paths across AWS, GCP, Azure, Kubernetes, Docker, npm, and GitHub,
    together with a sweep for 2026-era AI provider keys covering Anthropic, OpenAI,
    Google Gemini, Cohere, Mistral, Groq, and xAI. Separate modules went after
    cryptocurrency wallets. JFrog noted that the operator had hardcoded his own
    wallet recovery phrase into the malware's skip list so that it would not rob
    him, which is how researchers came to have it.

    Propagation ran two ways. The worm committed binaries into victims' GitHub
    repositories as build hooks, attributing the commits to "claude" so they read
    as AI tooling output, and it replaced GitHub Actions workflows with versions
    that exfiltrated `${{ toJSON(secrets) }}`, attributing those to bot identities
    such as `dependabot`. It then abused npm's trusted publishing through OIDC to
    release poisoned versions under the compromised developers' names. JFrog
    counted 57 backdated commits across nine compromised GitHub organizations and
    said it could not match the implant, the rootkit, or the C2 tooling to any
    known family, indicating a custom-built operation.
  start_date: 2026-06-03
  end_date: 2026-06-05
  target:
    name: asteroiddao
    kind: maintainer
    website: https://www.npmjs.com/~asteroiddao
  actor:
    name: Unknown
    kind: group
  language: Rust
  method:
    cause: compromised_account_credentials
    phase: distribution
    motive: credential_theft
    transitive: true
  impact:
    types:
    - credential_theft
    - self_propagation
    - data_exfiltration
    - cryptocurrency_theft
  locations:
  - uri: https://www.npmjs.com/~asteroiddao
    role: distribution
  indicators:
  - kind: malware_family
    value: IronWorm
  - kind: technique
    value: eBPF kernel rootkit hiding processes and network connections
  - kind: technique
    value: Tor-tunnelled plain HTTP C2
  - kind: technique
    value: modified UPX stub with altered magic values
  - kind: technique
    value: 'GitHub Actions workflow replacement exfiltrating ${{ toJSON(secrets) }}'
  - kind: commit_author
    value: claude
  - kind: commit_author
    value: dependabot
  notes:
  - JFrog enumerated 37 packages with one malicious version each, published from the
    compromised asteroiddao account and from other maintainer accounts reached through
    stolen credentials. Those coordinates are recorded on the artifacts here. The record
    previously carried a single artifact with a placeholder version and an all-zero
    SHA-256 standing in for unknown bytes; both are replaced.
  - Reported package counts vary between 36 and 37 depending on source and collection
    date. JFrog reported 57 backdated commits across nine compromised GitHub organizations,
    concentrated in the Arweave and WeaveDB ecosystem.
  - The implant is a 976 KB Rust ELF executed from a preinstall hook. Per-call-site string
    encryption means each string must be recovered individually, which slowed analysis.
  - JFrog found no match to any known infostealer, eBPF rootkit framework, or C2 toolkit,
    and assessed the operation as custom-built with dedicated infrastructure.
  - The operator's own cryptocurrency wallet recovery phrase was hardcoded into the
    malware's skip list so the wallet stealer would not target it.
  - >-
    OSSF malicious-package records preserve complete npm archive checksums for 31 of the
    releases. Together with four archives already recovered from npm, 35 of the 37 artifact
    records now have whole-file hashes; wdb-core 0.1.2 and hbsig 0.3.2 remain unavailable.
