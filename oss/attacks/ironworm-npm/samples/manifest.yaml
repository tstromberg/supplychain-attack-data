schema_version: 1
interpretation:
  - >-
    Forager d4c2240e2dc9 with FORAGER_ALLOW_PARTIAL=1 recovered every Socket-addressable member of
    the two IronWorm releases whose original npm archives were initially unavailable. The hbsig
    0.3.2 original was subsequently recovered from npmmirror and verified against npm's retained
    SHA-1 and signed SHA-512 integrity values.
  - >-
    Both initial partial reconstructions lacked package/bin/install-deps. The retained wdb-core and
    hbsig Socket manifests assign that 976,568-byte Rust ELF the same opaque S-prefixed content ID.
    The exact hbsig archive supplies its bytes, whose measured SHA-256 also matches the shared
    IronWorm payload digest published by OSSF/Amazon Inspector.
  - >-
    Overlaying that proven-identical member completes wdb-core's 147-file tree. Every Q-prefixed
    member was checked by decoded SHA-256 and size; the S-prefixed value remains an opaque content
    ID and is never represented as a checksum. The archive remains RECONSTRUCTED because its
    tar/gzip stream is synthetic and no authoritative digest for the original npm archive exists.
samples:
  - artifact_id: wdb-core
    phase: during
    classification: affected
    coordinate: pkg:npm/wdb-core@0.1.2
    version: 0.1.2
    filename: wdb-core-0.1.2-RECONSTRUCTED.tgz
    path: wdb-core/during/wdb-core-0.1.2-RECONSTRUCTED.tgz
    sha256: 8a805641e586b4bc0b110b28734d7bca2dfef28050cc79901d14d6ae53d2c465
    size: 1081340
    source:
      url: https://socket.dev/npm/package/wdb-core/files/0.1.2
      retrieved_at: '2026-08-13T13:31:43Z'
      kind: reconstructed_distribution
      original_url: https://registry.npmjs.org/wdb-core/-/wdb-core-0.1.2.tgz
      reconstruction:
        method: exact_member_overlay_on_forager_partial
        collector: forager+d4c2240e2dc9
        partial_mode: FORAGER_ALLOW_PARTIAL=1
        retained_manifest:
          url: https://socket.dev/npm/package/wdb-core/files/0.1.2
          retrieved_at: '2026-08-13T13:31:43Z'
          path: refs/10-socket-dev.html
          sha256: 94b18c0dce7d8a565c61a87784f63c7eefc1199066a1de9c17f3be5b56d61ba6
          listed_file_count: 147
          member_hash: Q_prefix_plus_sha256_base64url_except_opaque_S_address
        recovered_members:
          count: 146
          verification: all_paths_sizes_and_decoded_Q_content_SHA256_values_match_retained_Socket_listing
        overlay:
          path: package/bin/install-deps
          operation: add
          source_archive: hbsig/during/hbsig-0.3.2.tgz
          source_archive_sha256: e7a4e87b0dff6621f453c0c25baf908bbb9884df0d69c8e9e98d01d681e6f993
          source_member: package/bin/install-deps
          size: 976568
          sha256: 36abd242ddaa27f0160c539377a0e92cf781c1695137850acc87e3892b436d36
          socket_content_id: SQtFYmpD7DBcvJy8NCOoIbehpaRAp9Gkp1kBDuMJhqhs
          verification: >-
            The independently retained wdb-core and hbsig Socket manifests assign this path and size
            the same opaque content ID. The exact hbsig original supplies the bytes, and their
            measured SHA-256 matches the payload digest published by OSSF/Amazon Inspector.
        recovery_attempts:
          - >-
            npm registry metadata omitted the removed version and the canonical tarball was
            unavailable
          - Wayback CDX returned no HTTP-200 capture for the canonical npm tarball
          - >-
            jsDelivr retained the file listing but returned 404 for members, including
            bin/install-deps
          - >-
            Socket retained all 147 paths; its content CDN returned every Q-addressed member and
            rejected the opaque S-addressed binary
          - >-
            Forager hash fallback tried MalwareBazaar and Triage for the reported binary SHA-256;
            exact bytes were not recovered
          - >-
            npmmirror omitted the 0.1.2 version record and its direct tarball path redirected to a
            deleted backing object
          - >-
            Tencent retained the 0.1.2 publish timestamp but not its version record; its direct
            tarball path returned 404
          - >-
            The later-recovered, integrity-verified hbsig 0.3.2 original contains the exact shared
            install-deps bytes and completes the wdb-core tree without executing the lifecycle hook.
        packaging:
          format: existing_forager_tar_stream_plus_one_appended_ustar_member_then_gzip
          preserved_base_member_count: 146
          appended_member_count: 1
          archive_member_count: 147
          appended_member_mode: '0755'
          appended_member_mtime: '1970-01-01T00:00:00Z'
          uid: 0
          gid: 0
          gzip_timestamp: omitted
          uncompressed_tar_sha256: 7044869ff21d8a3345969731bac07314a6697dc0ca532c48464fe81375cc30d4
          uncompressed_tar_size: 1717248
          authoritative_original_archive_sha256: unavailable
        complete_attack_record: true
        original_archive_bytes_recovered: false
