        - all_Q_addressed_members_match_decoded_socket_SHA256_and_size
        - exact_hbsig_original_and_wdb_core_manifest_share_install_deps_content_ID_path_and_size
        - overlaid_install_deps_matches_published_campaign_payload_SHA256
        - zero_missing_extra_or_mismatched_members
        - measured_synthetic_archive_sha256_and_size
    notes:
      - >-
        Complete member-tree reconstruction, not the removed npm tarball. The RECONSTRUCTED name and
