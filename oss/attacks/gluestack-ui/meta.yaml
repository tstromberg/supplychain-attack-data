- name: gluestack-ui
  title: gluestack-ui and react-native-aria npm packages trojanized
  repo: https://github.com/gluestack/gluestack-ui
  synopsis: Beginning 2025-06-06 at 16:33 EST, an attacker who obtained a Gluestack publishing token pushed malicious updates to 17 packages across the @gluestack-ui and @react-native-aria scopes — starting with @react-native-aria/focus 0.2.10 and continuing over the next ~36 hours. The payload was appended to `lib/index.js` after large blocks of whitespace and acted as a remote-access trojan capable of running shell commands, file upload/download, and on Windows hijacking Python by editing PATH. Combined weekly downloads exceeded one million. Aikido Security identified the backdoor on 2025-06-08 and Gluestack revoked the token.
  start_date: 2025-06-06
  end_date: 2025-06-08
  attribution_type: Unknown attacker
  component_type: Library
  lang: javascript
  cause: Compromised credentials
  motive: Remote access
  transitive: false
  insertion_phase: distribution
  impact_type: Backdoor, Remote access
  impact_user_count: 1000000
  references:
    - https://scanoss.com/lessons-from-the-gluestack-supply-chain-attack/
