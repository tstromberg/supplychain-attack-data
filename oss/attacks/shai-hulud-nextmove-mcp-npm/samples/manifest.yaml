schema_version: 1
interpretation:
  - >-
    Socket retained the nextmove-mcp 0.1.7 package file listing and served 9 of its 10 members after
    npm removed the release. The omitted member is the root-level router_init.js payload. JFrog,
    TanStack's incident audit, Aikido, and a public Hybrid Analysis report independently identify
    that file by SHA-256 ab4fcadaec49c03278063dd269ea5eef82d24f2124a8e15d7b90f2fa8601266c.
  - >-
    The local archive contains only the nine bytes-exact members recovered from Socket. It is named
    RECONSTRUCTED-PARTIAL, has payload_only verification, and must not be treated as the published
    npm archive or as a complete reconstruction. No placeholder or inferred router_init.js was
    inserted.
