- id: shai-hulud-nextmove-mcp-npm
  title: nextmove-mcp npm package carried Shai-Hulud
  campaigns:
  - shai-hulud-here-we-go-again
  synopsis: JFrog listed 1 nextmove-mcp npm package in the May 2026 Shai-Hulud wave.
    This record scopes those artifacts to their own official distribution surface.
  story: |-
    nextmove-mcp was one of the MCP-related package names caught in the May 2026 Shai-Hulud wave. JFrog listed five affected npm releases under the `nextmove-mcp` name during the May 11-12 TeamPCP window.

    MCP and agent packages often run close to developer automation, local credentials, and service integrations. That made them useful distribution surfaces for Shai-Hulud: the malware did not need to compromise an application server if it could execute during package installation on a machine that already held tokens.

    This page keeps `nextmove-mcp` separate from the campaign rollup so responders have a concrete inventory indicator. The campaign record explains the shared loader, infrastructure, credential theft, and propagation behavior; this record preserves the package name, affected releases, dates, and npm URLs.

    Any matching install should be treated as host exposure. Build caches, local npm caches, lockfiles, and CI logs are all relevant evidence because the payload's opportunity was the install event itself, not long-term use of the package.
  start_date: '2026-05-11'
  end_date: '2026-05-12'
  target:
    name: nextmove-mcp
    kind: library
  actor:
    name: TeamPCP
    kind: group
  language: JavaScript
  method:
    cause: compromised_account_credentials
    phase: distribution
    motive: credential_theft
    transitive: true
  impact:
    types:
    - credential_theft
    - self_propagation
    users: 0
  notes:
  - >-
    The network and payload indicators are the campaign-level set JFrog published for this wave,
    not observations of this package's own bytes. Indicators read from an acquired sample are
    marked as such where they appear.
  - >-
    These indicators were read from the acquired sample. The reconstruction of nextmove-mcp
    0.1.7 holds setup.mjs as the preinstall script: it picks a Bun build per platform, downloads
    it from oven-sh/bun, and runs router_init.js.
  - >-
    No command-and-control host appears in setup.mjs. The address lives in router_init.js, the
    one member socket.dev could no longer serve, so the capture is payload_only and the C2 for
    this wave stays unrecovered.
  - >-
    The payload is not the one recorded for [[antv-npm]], although both carry the
    shai-hulud-here-we-go-again campaign: the antv wave beacons to t.m-kosche.com and none of
    its markers appear here. Indicators are kept per attack.
