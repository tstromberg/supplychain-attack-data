    phase: distribution
    motive: credential_theft
    transitive: true
  impact:
    types:
    - credential_theft
    - self_propagation
    users: 0
  notes:
  - The network and payload indicators are the campaign-level set JFrog published for
    this wave, not observations of this package's own bytes. They identify the wave's
    infrastructure and persistence, and are recorded here so each affected distribution
    surface carries them. Where a record also lists indicators read from an acquired
    sample, those are marked as such.
  - Minimal campaign-linked record created to keep Shai-Hulud package evidence scoped
    by vendor, organization, maintainer account, or package distribution surface.
  - These indicators were read from the acquired sample rather than from a report. The
    reconstruction of nextmove-mcp 0.1.7 holds setup.mjs, wired as the package's
    preinstall script. It selects a Bun build per platform and architecture, downloads it
    from the oven-sh/bun release page, and runs a staged second stage named
    router_init.js.
  - No command-and-control host appears in setup.mjs. The address lives in
    router_init.js, which is the one member socket.dev could no longer serve, so the
    capture is recorded as payload_only and the C2 for this wave stays unrecovered.
  - The payload here is not the one recorded for antv-npm, although both attacks carry
    the shai-hulud-here-we-go-again campaign. The antv wave beacons to t.m-kosche.com;
    none of its hosts or markers appear in these bytes. The campaign's indicators are
    therefore kept per attack rather than shared across it.
