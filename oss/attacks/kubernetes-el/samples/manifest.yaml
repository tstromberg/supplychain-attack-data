schema_version: 1
interpretation:
  - >-
    kubernetes-el was installed from the repository rather than from a release archive, so the
    affected distribution is the repository state itself. The unit of collection is the immutable
    git object for each of the two commits the stolen GITHUB_TOKEN pushed.
  - >-
    Both commits are authored as github-actions[bot], which is what the workflow token signs as.
    That authorship is the evidence that the Pwn Request succeeded.
