---
- id: kubernetes-el
  title: kubernetes-el Emacs package repository compromise
  synopsis: 'An attacker exploited a Pwn Request flaw in kubernetes-el''s GitHub Actions
    workflow: pull_request_target ran with target-repository privileges and then checked
    out attacker-controlled PR code. The payload stole repository tokens and secrets,
    then used the token to push directly to master as github-actions[bot], deface
    the README, replace kubernetes.el with a destructive command that would run when
    loaded, and delete most repository files. MELPA removed the package and Emacsmirror
    updates were blocked, limiting downstream distribution.'
  start_date: 2026-03-05
  end_date: 2026-03-07
