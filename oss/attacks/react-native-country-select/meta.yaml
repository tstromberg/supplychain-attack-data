- id: react-native-country-select
  title: react-native-country-select npm account takeover
  campaigns:
  - glassworm-march-2026
  synopsis: The astroonauta npm account takeover also compromised react-native-country-select,
    a direct dependency of react-native-international-phone-number. The first malicious
    release used a visible preinstall hook; after deprecation, the attacker retained
    access and republished through a transitive dependency chain that resolved to
    @usebioerhold8733/s-format. That chain executed the same detached JavaScript malware
    and Solana blockchain C2 used in the first wave. During the incident, @latest
    resolved to compromised 0.4.2, exposing users of both packages.
