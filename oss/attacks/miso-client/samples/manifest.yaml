interpretation:
  - >-
    npm no longer serves @aifabrix/miso-client 4.7.2 or its original tarball. The exact source used
    for the release survives in upstream Git commit 9e80710d9af9b360bb1697ae7a5de8d89db4814f,
    including the invisible-Unicode loader in src/express/error-types.ts.
  - >-
    Installing the commit's frozen dependency graph and running its documented Node 20/pnpm 9 build
    produces the complete 446-file package tree. Every path, size, and SHA-256 matches jsDelivr's
    independently retained manifest for the removed 4.7.2 publication, with zero missing, extra, or
    mismatched members.
  - >-
    This proves exact member-tree equivalence, not byte identity with npm's removed gzip stream. No
    authoritative whole-archive SHA-256 was recovered, so the synthetic package remains explicitly
    named RECONSTRUCTED.
