interpretation:
  - >-
    Forager d4c2240e2dc9 with FORAGER_ALLOW_PARTIAL=1 recovered 140 of 141 Socket-listed members
    from all five affected releases. Every initial tree lacked only router_init.js.
  - >-
    Retained jsDelivr manifests for 3.0.2 through 3.0.4 independently verify every ordinary member
    and identify the router variants. Retained Socket pages for 3.0.1 and 3.0.5 preserve their
    stable special router content IDs.
  - >-
    Version 3.0.1 uses the same S3ILkdNigxgwgrmHN_5FWHidIaD3Wg5xIhpQnikRr5ZU router identity already
    mapped to SHA-256 2ec78d556d696e208927cc503d48e4b5eb56b31abc2870c2ed2e98d6be27fc96; exact bytes
    came from Triage, so its tree is complete. The other four releases remain 140/141 partials.
  - >-
    The complete tree remains RECONSTRUCTED because no authoritative original whole-archive digest
    is available.
