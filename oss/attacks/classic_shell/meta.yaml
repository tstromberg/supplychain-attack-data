- id: classic-shell
  title: Classic Shell compromised on FossHub
  synopsis: FossHub's distribution platform was compromised, and Classic Shell downloads
    were swapped for a destructive installer. Users who trusted the official download
    path received code that rewrote the master boot record, collapsing a familiar
    Windows utility into a boot-failure payload delivered through the software mirror.
