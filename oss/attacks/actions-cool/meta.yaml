  notes:
  - All 53 issues-helper tags were re-pointed between 19:10:24 UTC and 19:13:40 UTC on
    2026-05-18; all 15 maintain-one-comment tags were re-pointed within a 39-second
    window in the same period. Both sets pointed to the same imposter commit
    1c9e803c80cc7fed000022d4c94f4b5bc2e90062.
  - Workflows that pinned either action by full commit SHA were not affected; only
    tag-pinned consumers picked up the malicious code on next run.
  - Roughly 3,000 public repositories referenced actions-cool/issues-helper in
    workflow files at time of compromise. No confirmed harvested-credentials count
    is published.
  - GitHub subsequently disabled both repositories. The disable state suggests GitHub
    treated the namespace itself as untrusted rather than only removing the malicious
    refs.
  - The t.m-kosche.com C2 is shared with the same-week TeamPCP operations against
    @antv npm packages (see [[antv-npm]]), the Nx Console VS Code extension (see
    [[nx-console]]), and Microsoft's durabletask PyPI package (see [[durabletask-pypi]]).
