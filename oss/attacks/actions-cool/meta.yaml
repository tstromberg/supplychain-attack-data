- id: actions-cool
  title: actions-cool GitHub Actions tags rewritten by TeamPCP
  campaigns:
    - shai-hulud-here-we-go-again
  synopsis: >-
    Attackers rewrote version tags for two actions-cool GitHub Actions to run secret-stealing code.
    GitHub disabled the repositories in May, but the same malicious tags became available again in
    September.
  story: >
    On May 18, 2026, attackers redirected version tags for actions-cool/issues-helper and
    actions-cool/maintain-one-comment to malicious commits. Consumers pinned to affected tags
    received the injected action on their next workflow run.


    The injected step downloaded Bun and read the GitHub Actions Runner.Worker process memory to
    extract workflow secrets. It sent captured credentials to t.m-kosche.com. The operation
    overlapped with other compromises attributed to TeamPCP.


    GitHub disabled both repositories. They became available again with the malicious tags on
    September 16, then were disabled again on September 25. The September activity renewed
    distribution of the May compromise; it does not establish a second initial intrusion.
  start_date: 2026-05-18T00:00:00.000Z
  end_date: '2026-09-25'
  target:
    name: actions-cool
    kind: organization
    repo: https://github.com/actions-cool
  actor:
    name: TeamPCP
    kind: group
  language: JavaScript
  method:
    cause: compromised_repository_access
    phase: ci_cd
    motive: credential_theft
    transitive: true
  impact:
    types:
      - credential_theft
      - data_exfiltration
    users: 3000
  locations:
    - uri: https://github.com/actions-cool/issues-helper
      role: distribution
    - uri: https://github.com/actions-cool/maintain-one-comment
      role: distribution
  commits:
    - 1c9e803c80cc7fed000022d4c94f4b5bc2e90062
    - 7f6120bb10c870b9fde146961a18e5bf0b3d4401
  indicators:
    - kind: commit
      value: 1c9e803c80cc7fed000022d4c94f4b5bc2e90062
    - kind: commit
      value: 7f6120bb10c870b9fde146961a18e5bf0b3d4401
    - kind: commit_message
      value: Build action for vX.Y.Z
    - kind: file
      value: /home/runner/.bun/bin/bun
    - kind: file
      value: /proc/<Runner.Worker PID>/mem
    - kind: command
      value: gh auth token
    - kind: command
      value: sudo python3
    - kind: technique
      value: tag rewrite to dangling commit
    - kind: technique
      value: runner.worker process memory read for isSecret values
    - kind: domain
      value: t.m-kosche.com
    - kind: account
      value: actions-cool (GitHub org)
  notes:
    - >-
      The September reports describe downstream repositories receiving malicious editor hooks after
      workflows used the re-enabled action.
    - >-
      Exposure occurred in separate May and September windows; the start and end dates do not imply
      continuous availability.
  artifacts:
    - id: issues-helper
      name: actions-cool/issues-helper
      package: actions-cool/issues-helper
      ecosystem: github actions
      kind: github_action
      start_date: 2026-05-18T00:00:00.000Z
      end_date: '2026-09-25'
      locations:
        - uri: https://github.com/actions-cool/issues-helper
          role: distribution
      notes:
        - >-
          All 53 version tags from v1.0.0 through v3.8.0 were re-pointed to the imposter commit.
          GitHub later disabled the repository.
        - >-
          The affected releases were recorded as a wildcard rather than enumerated, so this record
          asserts no version list.
        - >-
          The malicious tags became accessible again September 16–25 after an earlier repository
          suspension.
      commits:
        - 1c9e803c80cc7fed000022d4c94f4b5bc2e90062
    - id: maintain-one-comment
      name: actions-cool/maintain-one-comment
      package: actions-cool/maintain-one-comment
      ecosystem: github actions
      kind: github_action
      start_date: 2026-05-18T00:00:00.000Z
      end_date: '2026-09-25'
      locations:
        - uri: https://github.com/actions-cool/maintain-one-comment
          role: distribution
      notes:
        - >-
          All 15 version tags were re-pointed to the distinct imposter commit
          7f6120bb10c870b9fde146961a18e5bf0b3d4401. GitHub later disabled the repository.
        - >-
          The affected releases were recorded as a wildcard rather than enumerated, so this record
          asserts no version list.
        - >-
          The malicious tags became accessible again September 16–25 after an earlier repository
          suspension.
      commits:
        - 7f6120bb10c870b9fde146961a18e5bf0b3d4401
