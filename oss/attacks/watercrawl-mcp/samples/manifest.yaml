schema_version: 1
interpretation:
  - >-
    npm removed @iflow-mcp/watercrawl-watercrawl-mcp 1.3.0 through 1.3.4 and now returns HTTP 404
    for their original tarballs. Software Heritage's 2026-03-14 npm snapshot retains each release as
    an immutable complete package directory plus original-artifact filename, byte length, SHA-1, and
    SHA-256 metadata from the npm loader.
  - >-
    Each local sample was created by downloading every member from its exact Software Heritage
    release directory, recomputing and matching every Git blob SHA-1, preserving archived file
    modes, and running npm 11.16.0 pack with lifecycle scripts disabled. The resulting archives
    contain exactly 34, 35, 35, 35, and 36 archived package members in version order.
  - >-
    None of the synthetic archive SHA-256 values or byte lengths matches Software Heritage's
    authoritative original-artifact metadata. Therefore these are complete-tree equivalents, not
    original npm gzip bytes, and all five filenames remain explicitly RECONSTRUCTED.
