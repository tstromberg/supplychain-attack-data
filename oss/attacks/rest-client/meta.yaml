---
- id: rest-client
  title: rest-client gem backdoor steals credentials.
  synopsis: A maintainer's RubyGems.org account was compromised through password reuse,
    allowing attackers to publish malicious versions of the rest-client gem. The backdoor
    exfiltrated environment variables and accepted remote commands, turning a familiar
    HTTP client into a small control plane inside Ruby applications.
  start_date: 2019-08-14
  end_date: 2019-08-19
