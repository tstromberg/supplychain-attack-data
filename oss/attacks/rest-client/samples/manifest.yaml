interpretation:
  - >-
    RubyGems yanked the malicious 1.6.10 through 1.6.13 archives. The original reporter preserved
    the exact request.rb addition from 1.6.13 and the full Pastebin second stage in the project's
    incident issue on the day of discovery.
  - >-
    Version 1.6.9 is the last clean predecessor. The maintainers explicitly released 1.6.14 from the
    same clean code to supersede the poisoned legacy line; both official RubyGems archives are
    preserved here.
