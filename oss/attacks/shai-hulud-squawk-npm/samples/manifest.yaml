schema_version: 1
interpretation:
  - >-
    Forager d4c2240e2dc9 with FORAGER_ALLOW_PARTIAL=1 recovered all Socket-downloadable members from
    all 110 affected @squawk releases. Every tree initially lacked router_init.js; four
    generated-data package families also lacked one S-prefixed binary dataset.
  - >-
    All 2,385 retained Q-prefixed members were checked by path, size, and decoded SHA-256 against
    archived Socket listings. S-prefixed values are recorded as opaque Socket content IDs and are
    never represented as checksums.
  - >-
    The earliest affected release of each of the 22 packages uses the exact S3IL router obtained
    from Triage. Adding it produced 15 complete trees and improved four data-package trees to exact
    one-dataset-short partials.
  - >-
    The exact missing datasets were recovered from four clean predecessor npm archives whose
    original SHA-1 and SHA-512 integrity values match retained registry metadata. Each predecessor
    and affected release assigns the dataset the same Socket content ID and size, while retained
    predecessor jsDelivr manifests provide the measured SHA-256. Overlaying those bytes closes four
    more complete trees and leaves later data-package releases missing only unavailable router
    variants.
  - >-
    Complete trees remain named RECONSTRUCTED because no authoritative original whole-archive digest
    is available; incomplete trees are named RECONSTRUCTED-PARTIAL.
