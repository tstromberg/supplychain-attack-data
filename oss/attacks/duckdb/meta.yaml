- id: duckdb
  title: DuckDB npm Account Compromise
  synopsis: The duckdb_admin npm account was compromised via a phishing email linking
    to a cloned npmjs site (npmjs.help), allowing attackers to bypass 2FA and inject
    a new API token. The attackers published malicious versions of DuckDB packages
    containing a wallet-drainer payload, attributed to the same threat actor behind
    the Qix compromise.
