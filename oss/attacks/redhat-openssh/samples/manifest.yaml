schema_version: 1
interpretation:
  - >-
    Red Hat did not publish the malicious RPM files or a mapping from each
    filename to its package SIGMD5. Its signed blacklist does preserve 43 exact
    malicious RPM identities and the affected names, versions, and architectures.
    The clean source RPMs below are same-version vendor comparators whose SIGMD5
    values are not on that blacklist; they are not substitutes for the missing
    architecture-specific malicious binaries.
  - >-
    Red Hat's live blacklist script has had its advisory URL updated without a
    replacement detached signature. The archived script below preserves the
    original bytes and verifies successfully against the still-published 2008
    signature and Security Response Team key fingerprint.
