unresolved:
  - artifact_id: redhat-openssh
    phase: during
    status: malicious_rpm_bytes_unavailable_exact_sigmd5_list_recovered
    identities: 43
    notes:
      - RPM SIGMD5 is a package-header identity, not the MD5 digest of the RPM file, so generic file-hash retrieval services cannot safely resolve these values.
      - Red Hat's script does not map individual SIGMD5 values to filenames.
