  notes:
    - >-
      Red Hat's openssh-blacklist-1.0.sh lists the SIGMD5 of every tampered package, 43 in
      total across the four builds and their subpackages. SIGMD5 is the RPM header and payload
      signature that uniquely identifies a built package; it is not the digest md5sum returns
      for the .rpm file, so it is recorded as rpm_sigmd5 rather than as a file hash.
    - >-
      The tampered builds Red Hat named were openssh-3.9p1-8.RHEL4.24 (i386, x86_64),
      openssh-3.9p1-9.el4 (i386, x86_64), openssh-4.3p2-26 (x86_64), openssh-4.3p2-26.el5
      (x86_64). The affected package and subpackage names were openssh, openssh-askpass,
      openssh-askpass-gnome, openssh-clients, openssh-debuginfo, openssh-server.
    - >-
      No digest of the distributed .rpm files themselves has been published. The packages were
      signed with the Red Hat production key, which is why identification relies on the
      signature rather than on a download hash.
