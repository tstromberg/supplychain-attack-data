interpretation:
  - >-
    The payload here was found by hash rather than by coordinate: Unit 42's detection rule preserved
    the bundle.js SHA-256 46faab8a...3628f09, and MalwareBazaar held those exact bytes and ties them
    to the September 2025 Shai-Hulud wave. It is retained as payload-only evidence and is not
    assigned to any individual @crowdstrike package, because nothing in the available evidence says
    which one carried it.
  - >-
    The other three JavaScript hashes Unit 42 listed, beginning de0e25a3, 81d2a004 and 83a650ce,
    returned nothing from MalwareBazaar, Triage or MalShare on 2026-08-15 and remain hash-only
    indicators.
