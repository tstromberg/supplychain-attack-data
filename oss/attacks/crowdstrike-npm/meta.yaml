- name: crowdstrike-npm
  title: CrowdStrike NPM Packages Compromise (Shai-Hulud Worm)
  campaigns:
    - shai-hulud-npm-2025
  repo: ""
  synopsis: "The Shai-Hulud self-propagating worm compromised several official @crowdstrike/ scoped npm packages as part of a broader 526-package wave. This record tracks the CrowdStrike package scope specifically. The malware hunted for GITHUB_TOKEN, NPM_TOKEN, and cloud credentials by executing TruffleHog, then propagated by hijacking publish rights to inject malicious postinstall scripts and republish affected packages."
  start_date: 2025-09-14
  end_date: 2025-09-16
