  synopsis: The mistralai Python package version 2.4.6 contained an import-time Linux
    backdoor in src/mistralai/client/__init__.py. The added code downloaded https://83.142.209.194/transformers.pyz
    with curl -k, saved it to /tmp/transformers.pyz, and executed it as a background
    Python process when users imported mistralai, guarded only by the MISTRAL_INIT
    environment variable and silently swallowing errors. JFrog later reported that
    the remote payload changed from TeamPCP attribution text into a Python credential
    stealer that harvested local, cloud, Kubernetes, Vault, password-manager, and
    developer-tooling secrets, exfiltrated encrypted data, and could install pgsql-monitor
    persistence with destructive second-stage behavior.
