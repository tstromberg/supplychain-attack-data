schema_version: 1
interpretation:
  - >-
    A contemporaneous pnpm lockfile generated before npm cleanup preserves the original registry
    SHA-512 integrity for @mistralai/mistralai 2.2.4. This checksum applies only to that complete
    npm tarball and does not describe the embedded router_init.js or setup.mjs members.
  - >-
    Forager d4c2240e2dc9, with FORAGER_ALLOW_PARTIAL=1, recovered every Socket-listed member of the
    six Azure/GCP releases except router_init.js. The retained jsDelivr manifests independently
    identify that one member in all six releases as 2,339,346 bytes with SHA-256
    2ec78d556d696e208927cc503d48e4b5eb56b31abc2870c2ed2e98d6be27fc96. Forager's hash fallback
    recovered exactly those bytes from Triage. Overlaying that one file yields complete trees whose
    every path, size, and SHA-256 matches the corresponding retained manifest. The final archives
    remain RECONSTRUCTED because npm pack creates new container bytes and no authoritative original
    whole-archive digest is available for these versions.
