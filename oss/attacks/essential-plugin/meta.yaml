      role: mirror
    notes:
    - >-
      Legacy version notes: backdoor planted by the essentialplugin account from 2025-08-08; payload
      activated 2026-04-05 to 04-06; WordPress.org closed all 31 plugins on 2026-04-07 and forced
      neutralizing updates on 04-08.
    - >-
      Affected and remediated versions were derived by reading every WordPress.org SVN tag of all 31
      plugins and testing wpos-analytics/includes/class-anylc-admin.php for the backdoor.
    - >-
      22 of the 31 shipped it. The other nine have no tag containing it, so no backdoored release of
      them reached the directory; they were closed on account ownership grounds.
    - >-
      The neutralizing update does not remove the backdoor. It inserts early returns and comments
      out the dynamic call, leaving the unauthenticated route and the C2 endpoint present but inert.
