- id: essential-plugin
  title: Essential Plugin WordPress.org portfolio backdoor
  synopsis: >-
    After the Essential Plugin, formerly WP Online Support, portfolio was sold on Flippa,
    the new owner gained WordPress.org commit access and planted a dormant PHP backdoor across
    the plugin family.
  story: |-
    On April 7, 2026, WordPress.org closed thirty-one plugins from a single
    publisher account called essentialplugin after researchers found that every
    one of them contained a backdoor planted eight months earlier and activated
    only days before. Combined active-install counts across the portfolio
    exceeded 20,000 sites.

    The Essential Plugin portfolio, formerly published under the WP Online
    Support brand, was a long-running family of small WordPress utilities:
    sliders, accordions, FAQ widgets, post-grid layouts, WooCommerce add-ons.
    None of the plugins were individually high-profile, but together they had a
    long install tail of small business and hobby sites. According to a
    write-up published on anchor.host, the entire portfolio was sold through
    Flippa, the online marketplace for websites and digital assets, and the new
    owner inherited the WordPress.org commit access needed to ship updates
    through the official plugin directory.

    The malicious code first landed in plugin updates beginning August 8, 2025,
    and sat dormant for nearly eight months. It activated between April 5 and
    April 6, 2026. Researchers at TechNadu, WPSpear, and mysites.guru, who
    independently analyzed the updates after the activation, described a code
    path under `wpos-analytics/` that registered an unauthenticated REST
    endpoint with a `__return_true` permission callback. The endpoint accepted
    instructions over HTTPS from `analytics.essentialplugin.com` and could
    write arbitrary files into the WordPress install, including dropping
    `wp-comments-posts.php` and modifying `wp-config.php`. Two helper methods,
    `fetch_ver_info` and `version_info_clean`, handled the C2 polling and
    cleanup.

    WordPress.org closed the essentialplugin account outright on April 7, then
    pushed neutralizing automatic updates across the affected plugins on April
    8. The incident underscored a structural gap in WordPress's plugin
    governance: ownership transfer was the trust boundary, and once a buyer
    held commit access, the directory had no mechanism to re-verify the
    intentions of an account it had previously trusted.
  start_date: 2025-08-08
  end_date: 2026-04-08
  target:
    name: essential-plugin
    kind: plugin
    repo: https://profiles.wordpress.org/essentialplugin/
  actor:
    name: New owner
    kind: maintainer
  language: PHP
  method:
    cause: maintainer_ownership_transfer
    phase: source
    motive: seo_spam_remote_access
    transitive: false
  impact:
    types:
    - backdoor
    - remote_access
    - seo_spam
    users: 20000
  indicators:
  - kind: domain
    value: analytics.essentialplugin.com
  - kind: file
    value: wpos-analytics/
  - kind: file
    value: wp-comments-posts.php
  - kind: file
    value: wp-config.php
  - kind: file
    value: class-anylc-admin.php
  - kind: method
    value: fetch_ver_info
  - kind: method
    value: version_info_clean
  - kind: indicator
    value: unauthenticated REST endpoint with __return_true permission callback
