- name: essential-plugin
  title: Essential Plugin WordPress.org portfolio backdoor
  repo: https://profiles.wordpress.org/essentialplugin/
  synopsis: After the Essential Plugin, formerly WP Online Support, portfolio was sold on Flippa, the new owner gained WordPress.org commit access and planted a dormant PHP backdoor across the plugin family. The code shipped through official plugin updates for months, then activated on April 5-6, 2026, fetching payloads from analytics.essentialplugin.com, dropping wp-comments-posts.php, and injecting Googlebot-targeted SEO spam into wp-config.php before WordPress.org closed all 31 plugins and pushed disabling updates.
  start_date: 2025-08-08
  end_date: 2026-04-08
  attribution_type: New owner
  component_type: Plugin
  lang: PHP
  cause: Maintainer ownership transfer
  motive: SEO Spam/Remote access
  transitive: false
  historical_artifacts: []
  current_artifacts:
    - domain:analytics.essentialplugin.com
    - file:wpos-analytics/
    - file:wp-comments-posts.php
    - file:wp-config.php
    - file:class-anylc-admin.php
    - method:fetch_ver_info
    - method:version_info_clean
    - indicator:unauthenticated REST endpoint with __return_true permission callback
  domain: wordpress.org
  domain_type: package host
  artifact_type: extension package
  insertion_phase: source
  impact_type: Backdoor, Remote access, SEO Spam
  impact_user_count: 20000
  references:
    - https://anchor.host/someone-bought-30-wordpress-plugins-and-planted-a-backdoor-in-all-of-them/
    - https://www.technadu.com/wordpress-essential-plugin-backdoor-disseminated-to-over-20000-active-wordpress-installations/625912/
    - https://wpspear.com/essentialplugin-flippa-backdoor/
    - https://mysites.guru/blog/essential-plugin-wordpress-backdoor/
  versions:
    - Backdoor planted by essentialplugin account beginning 2025-08-08
    - Payload activated 2026-04-05 to 2026-04-06
    - WordPress.org closed all 31 plugins on 2026-04-07
    - WordPress.org forced neutralizing updates on 2026-04-08
  commits: []
  hashes: []
