schema_version: 1
interpretation:
  - >-
    npm removed both malicious releases, so their complete registry archives remain unresolved.
    PureScript maintainer Harry Garrood preserved complete copies of each malicious index.js in a
    contemporaneous Gist and explicitly identifies them as the affected package files in his
    incident report.
  - >-
    The intact npm archives for the immediately preceding clean releases are stored as comparators.
    Their registry SHA-1 values and measured SHA-256 values are recorded in both this manifest and
    their provenance sidecars.
