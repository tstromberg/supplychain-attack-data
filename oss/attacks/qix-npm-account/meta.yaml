---
- id: qix-npm-account
  title: Qix npm maintainer account compromise
  campaigns:
  - qix-npm-phishing-2025
  synopsis: Attackers phished prolific npm maintainer Josh Junon with the fake npmjs.help
    domain, intercepted credentials and 2FA tokens, and used the captured npm access
    to publish malicious releases across 18 packages he maintained. The poisoned utility
    packages carried a crypto-clipper and credential-harvesting worm, turning tiny
    dependencies with enormous install reach into a broad wallet-theft and propagation
    surface.
  start_date: 2025-09-08
  end_date: 2025-09-08
