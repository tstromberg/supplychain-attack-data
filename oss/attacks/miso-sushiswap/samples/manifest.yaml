unresolved:
  - artifact_id: miso-sushiswap
    phase: during
    version: 46da2b4420b34dfba894e4634273ea68039836f1
    filename: miso-studio commit 46da2b4
    status: unavailable
    notes:
      - >-
        The commit SushiSwap named as the attack. sushiswap/miso-studio is private and GitHub
        returns 404 for the object, so neither the diff nor the tree can be acquired.
      - >-
        The attacker's wallet, 0x3ddd8b6d092df917473680d6c41f80f708c45395, is the identifier to
        search for if a contemporaneous build or deployment artifact surfaces.
    attempts:
      - GitHub API and codeload: repository not accessible.
      - >-
        Internet Archive: all 46 archived miso.sushi.com JavaScript captures from September 2021
        were enumerated; the 24 inside 2021-09-15 to 2021-09-18 were retrieved and none contains the
        attacker's address.
