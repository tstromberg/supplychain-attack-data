schema_version: 1
interpretation:
  - >-
    The malicious change lived in sushiswap/miso-studio, a private repository, as commit
    46da2b4420b34dfba894e4634273ea68039836f1. GitHub answers 404 for it to anyone outside the
    organisation, so the source-side artifact cannot be acquired.
  - >-
    What was distributed is the MISO front end at miso.sushi.com. The Internet Archive holds its
    Nuxt bundles from inside the incident window, and those are recorded here. Searching every
    archived bundle from 2021-09-14 to 2021-09-21 for the attacker's wallet address,
    0x3ddd8b6d092df917473680d6c41f80f708c45395, found no match, so no captured build is shown to
    carry the substituted auctionWallet. The captures are recorded as affected context, not as the
    malicious build.
