    notes:
      - >-
        PARTIAL: derived from a truncated advisory excerpt rather than a complete diff, so the
        changed members are a faithful transcription of the documented backdoor and not a verified
        reproduction of the trojaned release. The unchanged members are the authentic upstream.
      - >-
        The excerpt's third change comments out KILL_OPT. This distribution of 7.6 already ships it
        commented, so that change is a no-op here rather than a missing step: the quoted diff was
        taken against a build that had it enabled.
      - 'Synthetic archive: member order is sorted and timestamps are normalized.'
      - >-
        tcpd.c gains a source-port trigger: a connection arriving from port 421 is sent an IDENT
        banner and handed an interactive /bin/csh, ahead of every access-control check. The Makefile
        gains a build-time beacon mailing `whoami` and `uname -a` to the operator.
