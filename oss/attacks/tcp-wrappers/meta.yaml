---
- id: tcp-wrappers
  title: tcp-wrappers distribution trojanized granting remote root
  synopsis: The official source code distribution tarball for tcp-wrappers version
    7.6 (`tcp_wrappers_7.6.tar.gz`) was replaced with a trojaned version on several
    FTP distribution sites, including the primary site at the time (Eindhoven University).
    The backdoor provided root access to attackers initiating connections from source
    port 421 and also sent system information via email upon compilation.
  story: |
    In January 1999, the trusted tcp-wrappers source archive became the attack path. CERT confirmed that copies of `tcp_wrappers_7.6.tar.gz` had been modified by an intruder and made available through FTP distribution sites, including the Eindhoven University site that served as the primary upstream location at the time.

    The backdoor was small but brutal: it could grant root access when an attacker connected from source port 421, and the build also sent identifying system information by email. CERT reissued the advisory on January 22 to correct the port direction, note Wietse Venema's move to a new official distribution site, and publish checksums that let administrators separate authentic source from poisoned source.
  start_date: 1999-01-21
  end_date: 1999-01-22
