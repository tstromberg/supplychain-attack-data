  notes:
  - StepSecurity timed the three malicious uploads at 16:19-16:54 UTC, disclosure at 17:54
    UTC, and Microsoft's yank at 18:04 UTC on 2026-05-19. Wiz reported a separate 15:08-15:16
    UTC attacker activity window against the durabletask-python repository, consistent with
    GitHub-secret exfiltration before the PyPI publish.
  - Wiz tied the entry point to a compromised contributor account previously seen in
    the @antv wave; Aikido qualified the TeamPCP attribution as likely but unconfirmed,
    while Wiz and StepSecurity attributed it directly.
  - Snyk reported approximately 103,000 weekly downloads and 1.7 million lifetime
    downloads for durabletask; StepSecurity reported roughly 400,000 monthly downloads.
    No confirmed install-victim count is published.
