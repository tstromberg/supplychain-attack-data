- name: napi-postinstall
  title: napi-postinstall npm phishing compromise
  campaigns:
    - npnjs-scam-npm-2025
  repo: https://www.npmjs.com/package/napi-postinstall
  synopsis: >-
    StepSecurity confirmed napi-postinstall 0.3.1 as one of the npm packages
    affected by the July 2025 npnjs.com maintainer phishing campaign. The
    attacker used a phished maintainer credential path to publish malicious
    releases directly to npm without corresponding source repository changes. In
    the eslint-config-prettier cluster, the malicious package family executed
    install.js during installation and launched a bundled Windows DLL through
    rundll32 on Windows systems.
