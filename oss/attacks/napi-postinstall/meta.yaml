- id: napi-postinstall
  title: napi-postinstall joined npm phishing wave
  campaigns:
  - npnjs-scam-npm-2025
  synopsis: >-
    napi-postinstall 0.3.1 was published during the July 2025 npnjs.com maintainer
    phishing wave. Its install path executed attacker-controlled JavaScript from npm.
  story: |
    The `napi-postinstall` compromise belongs to the npnjs.com phishing campaign. Maintainers were lured to a lookalike npm login flow, and stolen credentials were used to publish malicious versions across JavaScript tooling packages.

    For this package, the affected artifact was `napi-postinstall@0.3.1`. The danger was the install path: npm lifecycle execution gave the payload a chance to run on developer machines and CI systems as soon as the package was installed.

    StepSecurity listed the package among the affected releases while analyzing the eslint-config-prettier compromise, and Socket tracked the same phishing wave across the registry. The package itself is recorded separately so lockfiles and artifact inventories can point to the exact release.

    The campaign record carries the shared phishing infrastructure and cross-package pattern. This record carries the concrete npm package and version.
  start_date: 2025-07-18
  end_date: 2025-07-19
  target:
    name: napi-postinstall
    kind: library
    repo: https://www.npmjs.com/package/napi-postinstall
  actor:
    name: Third Party
    kind: group
  language: JavaScript
  method:
    cause: social_engineering
    phase: distribution
    motive: remote_code_execution
    transitive: true
  impact:
    types:
    - code_execution
    users: 0
  artifacts:
  - id: napi-postinstall
    name: napi-postinstall npm package
    package: napi-postinstall
    ecosystem: npm
    kind: source_archive
    repo: https://www.npmjs.com/package/napi-postinstall
    start_date: 2025-07-18
    end_date: 2025-07-19
    versions:
    - 0.3.1
    locations:
    - uri: https://www.npmjs.com/package/napi-postinstall/v/0.3.1
      role: distribution
    - uri: https://www.npmjs.com/package/napi-postinstall
      role: mirror
    indicators:
    - kind: domain
      value: npnjs.com
    - kind: technique
      value: npm_lifecycle_script
