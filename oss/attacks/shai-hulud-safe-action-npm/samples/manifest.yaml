interpretation:
  - >-
    Forager d4c2240e2dc9 with FORAGER_ALLOW_PARTIAL=1 recovered 10 of the 11 Socket-listed members
    for each affected safe-action release. In both cases only router_init.js was unavailable from
    Socket.
  - >-
    The retained jsDelivr manifests identify the missing 2,339,346-byte router_init.js as SHA-256
    2ec78d556d696e208927cc503d48e4b5eb56b31abc2870c2ed2e98d6be27fc96. Exact matching bytes came
    independently from Triage; after overlay, every path, size, and SHA-256 matches the retained
    manifest.
  - >-
    npm pack was not used because the package files allowlist excludes the malicious top-level
    files. The complete trees use the deterministic direct-archive procedure recorded per sample and
    remain RECONSTRUCTED because the original archive digests are unavailable.
