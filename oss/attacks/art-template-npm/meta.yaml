- id: art-template-npm
  title: art-template sold to a shell company, then shipped the Coruna iOS exploit kit
  synopsis: >-
    The author sold `art-template` on 2024-11-17 to KILLER WHAL AI SDN BHD. The new owners
    shipped 4.13.3, 4.13.5, and 4.13.6 with a browser-bundle loader that fed the Coruna
    iOS exploit kit through utaq.cfww.shop to steal cryptocurrency wallets on Safari iOS
    13.0-17.2.1.
  story: |
    `art-template` is a Chinese-origin JavaScript template engine, about 26,000 weekly npm
    downloads. The last clean release was 4.13.2 on 2018-11-13. On 2024-11-17 the original
    maintainer, GitHub user `aui` (糖饼), accepted an acquisition offer from KILLER WHAL AI
    SDN BHD, a Malaysian company at 35A Jalan SG3/1, Taman Sri Gombak, registration
    202001036306. The pitch was cash plus continued maintenance. The author ran due
    diligence — SSM, law firm, contract, payment — and transferred npm and GitHub. `aui`
    was renamed to `goofychris`. The npm publisher list for `art-template`,
    `express-art-template`, `art-template-loader`, and `koa-art-template` moved to
    `daughtrymom`, `npmpacketmaintainmember7` at `npmpacketmaintainmember7@proton.me`,
    and `v4v5qc` at `eb8org@gmail.com`. The receiving bank account was later flagged by
    Chinese law enforcement and bank risk controls; the buyer cooperated for months on
    paperwork until the freezes cleared, which kept the transfer plausible.

    The first injection followed on 2025-03-12 in 4.13.3, published by `v4v5qc`. Node
    `require('art-template')` broke at the same release — the new owners had pulled the
    CommonJS compatibility out. The injection lived only in the browser bundle
    `lib/template-web.js`: a `String.fromCharCode`-obfuscated loader that fetched
    `https://git.youzzjizz.com/git.js`, which loaded Baidu Analytics at
    `hm.baidu.com/hm.js?1351a72534dcecfcf4500eda9c5add00`. The original author posted
    a GitHub Issues warning, "v4.13.3 contains a virus," and reported the package to npm.
    npm did not act. The next day `goofychris` published 4.13.4 with the injection
    removed and opened issue 661 on goofychris/art-template — "We made some mistakes in
    the update two days ago… we wanted to make simple statistics. If this violates any
    rules, we have cleaned it up." The new maintainers then deleted both the warning
    thread and their own explanation.

    The npm reports sat. The second wave shipped on 2026-05-19 (4.13.5) and 2026-05-20
    (4.13.6). The injection lived in `lib/template-web.js` again; the Node entry was
    untouched. 4.13.5 wrapped the loader in `String.fromCharCode`; 4.13.6 inlined the
    call in plaintext. The loader fetched `v3.jiathis.com/code/jia.js` from a compromised
    Chinese social-sharing CDN, pinged Baidu Analytics, and gated on `User-Agent` for
    iPhone. For iPhone it injected a zero-pixel iframe behind a closed Shadow DOM
    pointing at `utaq.cfww.shop/gooll/gooll.html` on 180.178.50.158, AS45753, Hong Kong.
    The iframe served a 50 KB fingerprinting loader that classified the device, beaconed
    every ten seconds to `l1ewsu3yjkqeroy.xyz/api/ip-sync/sync` behind Cloudflare, and
    content-addressed each follow-on module by `SHA256(sessionKey + moduleHash)[:40]`
    against session key `cecd08aa6ff548c2`.

    The final stage was the Coruna iOS exploit kit. Fourteen remote modules, about 606
    KB. Twenty-three Safari and WebKit vulnerabilities chained together. The kit stopped
    at iOS 17.3, matching the CVE-2024-23222 patch for the `cassowary` JavaScriptCore
    type-confusion bug. It dispatched between ARM64 and ARM64_32 builds and ran a
    WebAssembly proof-of-work to confirm a real JavaScriptCore JIT rather than a sandbox.
    The terminal payload was a 31 KB native ARM64 shellcode dropper for the PLASMAGRID
    cryptocurrency-wallet implant. Anything outside Safari on iOS 13.0 to 17.2.1 got only
    the Baidu tracker. Socket attributed the deployment to UNC6691 on Coruna fingerprints
    documented by Google TAG, the JiaThis hijack, the bulk-registered `.shop` pattern,
    the Baidu integration, and the Hong Kong AS45753 infrastructure. Pin `art-template`
    and siblings to 4.13.2; audit caches and bundles for `v3.jiathis.com`,
    `git.youzzjizz.com`, `utaq.cfww.shop`, and `l1ewsu3yjkqeroy.xyz`. The legal trail —
    shell company, contract, due diligence — is the novel part. Account-takeover
    incidents leave forensic seams. A clean sale does not.
