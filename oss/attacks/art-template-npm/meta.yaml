  notes:
  - Ownership of the GitHub repo and npm publisher list was transferred by the original
    maintainer on 2024-11-17 to KILLER WHAL AI SDN BHD under contract, after the
    maintainer ran SSM and law-firm due diligence. This is a deliberate transfer, not
    an account takeover; the seller documented the buyer's chain in
    https://github.com/aui/blog/issues/3.
  - The 2025-03-12 4.13.3 injection used a different loader chain — `git.youzzjizz.com`
    front-loading Baidu Analytics via `hm.baidu.com/hm.js?1351a72534dcecfcf4500eda9c5add00`.
    The 2026-05 wave moved to `v3.jiathis.com` and the Coruna kit at `utaq.cfww.shop`.
  - 4.13.4 (2025-03-14) was published from the new owners' account but contains no
    injection — released the day after the original maintainer's public warning, with
    a "we made some mistakes" explanation on goofychris/art-template issue 661 that
    the new maintainers later deleted along with the warning thread.
  - 4.13.3 (2025-03-12), 4.13.5 (2026-05-19), and 4.13.6 (2026-05-20) are the malicious
    releases. 4.13.2 (2018-11-13) is the last release shipped by the original `aui`
    maintainer.
  - Injection lives in the browser bundle (lib/template-web.js) only; Node consumers
    using the CommonJS entry point are unaffected. Anything pulling the browser bundle
    via <script> tag or client-side bundler ships the loader into every page.
  - Coruna kit gates on Safari/WebKit and iOS 13.0-17.2.1; iOS 17.3 and later, Chrome,
    Firefox, Edge, and Android receive only the Baidu Analytics tracker. Final payload
    is the PLASMAGRID cryptocurrency-wallet implant.
  - UNC6691 attribution is Socket's, based on Coruna kit fingerprints documented by
    Google TAG. SafeDep notes the same actor and kit independently.
  - Sibling packages `express-art-template`, `art-template-loader`, and
    `koa-art-template` saw the same npm publisher turnover and should be treated as
    potentially affected; public reporting focused on art-template itself.
