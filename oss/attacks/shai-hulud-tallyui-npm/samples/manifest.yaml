schema_version: 1
interpretation:
  - >-
    Forager d4c2240e2dc9 with FORAGER_ALLOW_PARTIAL=1 recovered every Socket-listed member except
    router_init.js from all 30 affected Tally UI releases.
  - >-
    The earliest affected release of each package uses the exact
    S3ILkdNigxgwgrmHN_5FWHidIaD3Wg5xIhpQnikRr5ZU router obtained from Triage, producing ten complete
    trees. The middle and latest releases use distinct unavailable router variants and remain exact
    one-member-short partials.
  - >-
    Every retained path, size, and Q-prefixed member SHA-256 was checked against its archived Socket
    listing. Complete trees remain named RECONSTRUCTED because no authoritative original
    whole-archive digest is available.
