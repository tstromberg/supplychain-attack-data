    clean 1.20.23 published at 23:48.'
  - The malicious commits came from a GitHub account with an established contribution
    history on the repository, consistent with account compromise rather than a new or
    drive-by contributor.
  - The malicious version was downloaded 310 times per npm statistics against roughly
    50,000 weekly downloads for the package. The same version was pinned across 17 other
    packages in the same npm scope.
  - Socket reported that the malicious version was deprecated rather than removed and that
    compromised GitHub release artifacts remained available at the time of publication.
