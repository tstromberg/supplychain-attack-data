- id: pkgr-core
  title: "@pkgr/core npm phishing shipped Scavenger"
  campaigns:
  - npnjs-scam-npm-2025
  synopsis: >-
    Attackers used a phished maintainer credential to publish malicious @pkgr/core 0.2.8
    through the official npm registry during the July 2025 npnjs.com campaign.
  story: |-
    On July 18, 2025, attackers added `@pkgr/core` to the list of npm packages compromised through the `npnjs.com` phishing campaign, publishing malicious version 0.2.8 under JounQin's hijacked publishing token. The package is a small utility library that other JounQin-maintained tools depend on, which extended the blast radius well beyond projects that name it directly.

    StepSecurity and Socket identified the release while working through the same cluster that produced the malicious `eslint-config-prettier`, `eslint-plugin-prettier`, `synckit`, and `napi-postinstall` publishes. The pattern was identical across all of them: a fresh version showed up on npm with no corresponding commit, pull request, or tag in the project's GitHub repository, a sign that the registry credential rather than the source tree had been the entry point.

    The payload matched the Scavenger family seen in the sibling packages, a Windows-only loader that ran `node-gyp.dll` through `rundll32` once the package was unpacked on a developer workstation or CI runner. Install-time execution made the package's lack of a user-facing application largely beside the point: the credentials and network access available to the build environment were the target.

    JounQin revoked the leaked token, deprecated and removed 0.2.8, and published clean version 0.2.9. Operators who installed during the window were advised to rotate any credential reachable from the affected machine.
  start_date: 2025-07-18
  end_date: 2025-07-19
  target:
    name: '@pkgr/core'
    kind: library
    repo: https://github.com/un-ts/pkgr
  actor:
