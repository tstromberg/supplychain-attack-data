schema_version: 1
interpretation:
  - >-
    The package coordinate previously recorded as @pkgjs/core was a reporting
    typo. @pkgjs/core does not exist on npm; CrowdStrike, OSV, Snyk, SafeDep,
    ReversingLabs, and the npm registry all identify the compromised package as
    @pkgr/core and the affected version as 0.2.8.
  - >-
    npm retains the publication time for removed 0.2.8 between clean 0.2.7 and
    fixed 0.2.9. jsDelivr's complete 14-file manifest shows that 0.2.8 adds
    install.cjs and node-gyp.dll and changes package.json. The two added members
    are preserved exactly, but the modified 1049-byte package.json has not been
    recovered or derived to its retained SHA-256, so no archive is reconstructed.
  - >-
    CrowdStrike identifies the exact install script and first-stage Scavenger loader
    hashes. Snyk and OSV specifically describe @pkgr/core as installing
    node-gyp.dll through the install hook. The recovered objects match those published
    SHA-256 values exactly.
reported_evidence:
  - artifact_id: pkgr-core
    hashes:
      - sha256: 31204fbbc097677d518e1c01d88cf24b491ef29cc8f56d1ef2b81e5ccc8440e2
    note: >-
      SafeDep associates this additional hash with the incident but does not
      identify which package object it represents. It remains unavailable and
      is not treated as the original 0.2.8 archive.
