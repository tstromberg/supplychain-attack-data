- name: tanstack-router
  title: TanStack npm packages compromised by Mini Shai-Hulud
  campaigns:
    - teampcp-2026
    - shai-hulud-here-we-go-again
  repo: https://github.com/TanStack/router
  synopsis: TeamPCP's Mini Shai-Hulud worm compromised the TanStack Router release pipeline by chaining a pull_request_target "Pwn Request" pattern, GitHub Actions cache poisoning, and runtime extraction of a GitHub Actions OIDC trusted-publisher token from runner memory. On 2026-05-11 between 19:20 and 19:26 UTC, 84 malicious versions across 42 @tanstack/* npm packages were published with a malicious optional dependency on an orphan git commit. The install-time payload harvested cloud, Kubernetes, Vault, GitHub, npm, and SSH credentials, exfiltrated over the Session/Oxen network, and attempted self-propagation by republishing packages maintained by victims.
  start_date: 2026-05-11
  end_date: 2026-05-11
  attribution_type: Advanced Persistent Threat
  component_type: Library
  lang: JavaScript
  cause: CI/CD Exploit
  motive: Credential Theft
  transitive: true
  historical_artifacts:
    - https://github.com/zblgg/configuration
    - https://github.com/TanStack/router/actions/runs/25613093674
    - https://github.com/TanStack/router/actions/runs/25691781302
