    this wave, not observations of this package's own bytes. They identify the wave's
    infrastructure and persistence, and are recorded here so each affected distribution
    surface carries them. Where a record also lists indicators read from an acquired
    sample, those are marked as such.
  - Aikido reported 83 TanStack package-version entries in the May 12 article. The 
    artifact list here is retained from the TanStack/GitHub/StepSecurity/JFrog record 
    set because package counts shifted while malicious releases were removed and newly 
    identified.
