interpretation:
  - >-
    Forager d4c2240e2dc9 with FORAGER_ALLOW_PARTIAL=1 recovered 6,626 of 6,744 Socket-listed members
    across all 84 affected @tanstack releases. Every missing member has an opaque S-prefixed Socket
    content ID.
  - >-
    All 6,626 retained Q-prefixed members were independently checked by path, size, and decoded
    SHA-256 against 84 archived Socket listings; no mismatch was found.
  - >-
    Every release lacks router_init.js with the same opaque
    Sojc6cPAX4VpibxvEPWDBDpxf-EnNwQF2r2Ung06epSE ID and 2341681-byte size. The archived Hybrid
    Analysis report identifies a submitted 2341681-byte sample by SHA-256
    ab4fcadaec49c03278063dd269ea5eef82d24f2124a8e15d7b90f2fa8601266c, but marks its bytes
    unavailable.
  - >-
    No router or other build output was overlaid: S-prefixed Socket IDs are not hashes, and reported
    path/size/SHA evidence without the actual bytes cannot produce an exact reconstruction.
  - >-
    All archives remain RECONSTRUCTED-PARTIAL with payload_only verification. Complete-tree
    reconstruction is deliberately withheld until exact missing bytes become available.
