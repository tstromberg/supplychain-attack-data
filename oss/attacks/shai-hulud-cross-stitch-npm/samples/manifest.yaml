schema_version: 1
interpretation:
  - >-
    Forager d4c2240e2dc9 with FORAGER_ALLOW_PARTIAL=1 recovered 111 of 720 Socket-listed members
    from every affected release. Each initial tree lacked DmcConstants.js, router_init.js, and 607
    generated documentation files.
  - >-
    Earlier work added the 607 documentation files to 1.1.4 through 1.1.6 only after every path,
    size, and SHA-256 matched retained affected-version jsDelivr manifests. Those exact 718-member
    first-stage archives are retained under during/base/.
  - >-
    The clean cross-stitch 1.1.2 npm archive is byte-for-byte verified by the registry SHA-1 and
    SHA-512 integrity and by a retained 718-member jsDelivr manifest. DmcConstants.js has the exact
    missing 68,933-byte SHA-256 for 1.1.4 through 1.1.6. For 1.1.3 and 1.1.7, every one of the 608
    absent ordinary paths has the same Socket content ID and size as the clean predecessor.
  - >-
    The affected 1.1.3 router has the same Socket content ID and size as the independently
    SHA-256-mapped 2ec78d556d696e208927cc503d48e4b5eb56b31abc2870c2ed2e98d6be27fc96 variant. Adding
    it closes a complete 720-member 1.1.3 tree. The other versions remain exact 719-member partials
    because their router variants are unavailable.
  - >-
    The complete 1.1.3 tree remains named RECONSTRUCTED because no authoritative original
    whole-archive digest is available. Incomplete trees remain RECONSTRUCTED-PARTIAL. No lifecycle
    scripts were executed.
