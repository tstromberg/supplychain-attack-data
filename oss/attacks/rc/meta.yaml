---
- id: rc
  title: rc NPM package includes malicious coa dependency
  synopsis: The rc configuration loader was compromised indirectly after attackers
    gained control of coa, one of its dependencies, and published malicious releases.
    When rc moved onto the poisoned coa versions, it began carrying password-stealing
    malware transitively, proving that a clean package can still ship dirty code.
  start_date: 2021-11-04
  end_date: 2021-11-05
  target:
    name: rc
    kind: library
    repo: https://github.com/dominictarr/rc
