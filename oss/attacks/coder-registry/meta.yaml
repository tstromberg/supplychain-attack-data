  notes:
  - >-
    No affected module version is named anywhere. The rogue servers answered for whatever version a
    deployment asked for, so this record carries no versions field.
  - >-
    Coder's cleanup code and its advisory bound the incident differently: 07:35 to 21:45 UTC in the
    prose and manual SQL, 08:00 to 22:00 in the shipped purge. Both are recorded as published.
  - >-
    Remediation destroys the artifact. The purge deletes the cached archives and its down migration
    is a deliberate no-op, so surviving copies shrink as deployments patch.
  - >-
    coder-infra.com was registered 2026-08-28 through Fewmoretaps OU. VirusTotal first sees it
    2026-09-01, behind Cloudflare rather than the 199.91.220.205 the advisory names.
