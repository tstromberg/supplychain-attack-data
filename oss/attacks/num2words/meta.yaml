---
- id: num2words
  title: num2words Maintainer Phishing and Account Takeover
  synopsis: Attackers used the lookalike pypj.org domain to phish PyPI maintainers,
    steal credentials and 2FA codes, create a new API token, and upload malicious
    num2words releases. The first suspicious release, 0.5.15, appeared on PyPI without
    a matching GitHub tag, commit, or release. The later GitHub advisory confirmed
    that both 0.5.15 and 0.5.16 contained malware and were removed from PyPI. The
    incident is part of the broader Scavenger-era maintainer phishing wave.
  start_date: 2025-07-28
  end_date: 2025-07-31
