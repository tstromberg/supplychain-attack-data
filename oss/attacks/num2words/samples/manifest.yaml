schema_version: 1
interpretation:
  - >-
    All four files PyPI served for the two malicious releases are held, verified against PyPI's own
    published digests. The incident record previously said they were unavailable; they were not, and
    the reason the earlier search failed is instructive.
  - >-
    This record carried two SHA-256 values attributed to the OSV entry. Neither MAL-2025-6794 nor
    PYSEC-2025-72 contains a digest at all, and neither value matches any file PyPI served, so every
    hash lookup ever run for this incident asked for bytes that do not exist. The correct digests
    came from the PyPI JSON response captured while the releases were still live, which DataDog
    preserved in its malicious-packages dataset. With those, Hopper returned all four on the first
    attempt.
  - >-
    The DataDog dataset also holds both releases as extracted trees. Those are not recorded here:
    the original distribution bytes were recovered, which is strictly better, and the dataset's copy
    is what supplied the digests rather than the artifact.
