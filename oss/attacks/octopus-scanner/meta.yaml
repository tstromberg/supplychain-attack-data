---
- id: octopus-scanner
  title: Octopus Scanner backdoored 26 NetBeans projects on GitHub
  synopsis: GitHub Security Lab disclosed on 2020-05-28 that 26 open-source NetBeans
    projects hosted on GitHub had been backdoored by a self-spreading Java malware
    dubbed Octopus Scanner. When a developer opened an infected NetBeans project,
    the malware identified other NetBeans projects on the host and dropped a malicious
    payload (`cache.dat`) into their build configurations so that subsequent JAR builds
    — including those committed back to GitHub — also shipped a remote-access trojan.
    The implant established C2 over an HTTPS reverse shell. Affected repositories
    had been hosting the implant for months; samples persisted in commit history.
