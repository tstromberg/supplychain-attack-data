- id: wp-contact-form-7-multi-step
  title: Contact Form 7 addon created backdoors
  campaigns:
  - wordpress-plugin-backdoor-2024
  synopsis: >-
    Malicious code was injected directly into the Contact Form 7 Multi-Step Addon plugin repository
    on WordPress.org.
  story: |
    Contact Form 7 Multi-Step Addon was part of the same June 2024 WordPress.org plugin campaign. The compromise sat in the official plugin repository, so normal update behavior delivered the malicious code.

    Wordfence identified versions 1.0.4 and 1.0.5 as infected and reported no patched version when it published. The correct response was removal or replacement until a safe release existed.

    The shared malware tried to create new administrator users and report credentials to `94.156.79.8`. It also placed SEO-spam JavaScript in the site footer, giving the attacker persistence and monetization from the same plugin update.

    This record captures the Contact Form 7 add-on artifact, not the whole campaign. The package-level boundary matters because site owners had to search for this specific slug and infected version pair, not merely for any WordPress compromise.
  start_date: 2024-06-21
  end_date: 2024-06-24
  target:
    name: wp-contact-form-7-multi-step
    kind: plugin
    repo: https://wordpress.org/plugins/contact-form-7-multi-step-addon/
  actor:
    name: Third Party
    kind: group
  language: PHP
  method:
    cause: malicious_injection
    phase: source
    motive: seo_spam_account_takeover
    transitive: false
  impact:
    types:
    - account_takeover
    - defacement
    users: 0
  artifacts:
  - id: wp-contact-form-7-multi-step
    name: wp-contact-form-7-multi-step
    ecosystem: wordpress
    kind: extension
    repo: https://wordpress.org/plugins/contact-form-7-multi-step-addon/
    start_date: 2024-06-21
    end_date: 2024-06-24
    versions:
    - 1.0.4
    - 1.0.5
    locations:
    - uri: https://wordpress.org/plugins/contact-form-7-multi-step-addon/
      role: distribution
    indicators:
    - kind: ip
      value: 94.156.79.8
    - kind: user
      value: Options
    - kind: user
      value: PluginAuth
  references:
  - url: 
      https://www.wordfence.com/blog/2024/06/supply-chain-attack-on-wordpress-org-plugins-leads-to-5-maliciously-compromised-wordpress-plugins/
    title: Supply Chain Attack on WordPress.org Plugins Leads to 5 Maliciously Compromised WordPress Plugins
