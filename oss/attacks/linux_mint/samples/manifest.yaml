interpretation:
  - >-
    The original poisoned ISO remains unavailable. A Gist created on February 21, 2016 explicitly
    preserves man.cy from the malicious ISO. Linux Mint's advisory identifies /var/lib/man.cy as the
    infection marker, so this is retained as exact payload-source evidence rather than as the
    original ISO.
  - >-
    A surviving Linux Mint mirror preserves the clean 17.3 SHA-256 list, its detached OpenPGP
    signature, and the MD5 list. These identify the clean 64-bit Cinnamon ISO without adding a 1.58
    GB file that cannot be stored in the repository's current non-LFS workflow.
