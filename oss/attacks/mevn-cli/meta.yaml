      name: mevn-cli
      kind: revision_control_system
      ecosystem: github
      repo: https://github.com/madlabsinc/mevn-cli
      commits:
        - f8830218b5d70d068cca19a45df261a8cf19f30d
      locations:
        - uri: >-
            https://codeload.github.com/madlabsinc/mevn-cli/tar.gz/f8830218b5d70d068cca19a45df261a8cf19f30d
          role: distribution
      indicators:
        - kind: file_sha256
