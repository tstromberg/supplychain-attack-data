      - No original tarball capture exists in Wayback.
      - jsDelivr retains a file listing, but the advertised bytes return 404.
      - unpkg returns 404 and Software Heritage does not retain version 9.4.1.
      - >-
        Socket retains 315 file records and the exact changed dist/index.js,
        but dist/sdk.cjs.development.js returns HTTP 400; strict Forager
        reconstruction rejected and removed the incomplete archive.
      - >-
        On 2026-08-11 the retained hashes showed that the unavailable bundle and
        all other unchanged members match the exact 9.4.0 base; the only other
        changed member, package.json, was derived and independently hash-verified.
