unresolved:
  - artifact_id: velora-dex-sdk
    phase: during
    coordinate: pkg:npm/%40velora-dex/sdk@9.4.1
    status: original_distribution_unavailable_tree_reconstructed
    attempts:
      - npm removed the complete malicious tarball and version record.
      - No original tarball capture exists in Wayback.
      - jsDelivr retains a file listing, but the advertised bytes return 404.
      - unpkg returns 404 and Software Heritage does not retain version 9.4.1.
      - >-
        Socket retains 315 file records and the exact changed dist/index.js, but
        dist/sdk.cjs.development.js returns HTTP 400; strict Forager reconstruction rejected and
        removed the incomplete archive.
      - >-
        On 2026-08-11 the retained hashes showed that the unavailable bundle and all other unchanged
        members match the exact 9.4.0 base; the only other changed member, package.json, was derived
        and independently hash-verified.
      - >-
        StepSecurity workflow run 24107839213 used `npm pack @velora-dex/sdk@9.4.1` while the
        version was live and uploaded artifact 6316852733, `velora-dex-sdk-tarballs`, containing the
        malicious and clean tarballs. On 2026-08-13 GitHub reported the 885,239-byte artifact and
        both job logs expired; the archive endpoint returned HTTP 410, so neither the original bytes
        nor its npm pack output could be recovered.
      - >-
        SafeDep's published SHA-256 indicators were traced to the arm64 and x86_64 dropped RAT
        binaries, not the npm archive, and therefore were not promoted to artifact hashes.
    last_attempted_at: '2026-08-13T15:18:00Z'
