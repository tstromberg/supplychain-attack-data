schema_version: 1
interpretation:
  - >-
    The previous unscoped coordinate was incorrect. The official npm package is @velora-dex/sdk. npm
    retains the publication times for removed 9.4.1 and immediate remediation 9.4.2 even though the
    malicious version record and tarball were removed.
  - >-
    Socket and jsDelivr retain a complete 315-file manifest for 9.4.1. The exact 9.4.0 base has the
    same paths, and 313 member hashes are unchanged. The two changed members are the preserved
    malicious dist/index.js and package.json; changing only the base manifest's version from 9.4.0
    to 9.4.1 produces the exact retained package.json SHA-256. Those facts permit a complete
    member-for-member tree reconstruction, but not recovery of the original npm tarball bytes.
  - >-
    The preserved file differs from safe 9.4.0 by the three reported lines: a child_process import
    and an exec call that decodes and runs the command that fetches the macOS install script. The
    9.4.2 dist/index.js is byte-identical to 9.4.0.
