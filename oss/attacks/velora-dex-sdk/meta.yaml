---
- id: velora-dex-sdk
  title: VeloraDEX SDK npm macOS Backdoor
  synopsis: A registry-only malicious release of @velora-dex/sdk 9.4.1 was published
    to npm with no matching source commit. Instead of using an install hook, the attacker
    prepended code to the package entry point so importing the SDK downloaded and
    installed a macOS backdoor with launchctl persistence. The change was limited
    to package metadata and dist/index.js compared with the clean 9.4.0 tarball, making
    --ignore-scripts ineffective because execution moved from install time to first
    runtime import.
