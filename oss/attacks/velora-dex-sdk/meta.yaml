- id: velora-dex-sdk
  title: VeloraDEX SDK installed macOS backdoor
  synopsis: >-
    @velora-dex/sdk 9.4.1 was published directly to npm with no matching source commit.
    Importing it fetched a macOS backdoor and registered launchctl persistence.
  story: |
    On April 7, 2026, an attacker pushed a malicious release of
    `@velora-dex/sdk`, the JavaScript toolkit used to integrate with the
    VeloraDEX decentralized exchange, directly to npm without ever touching
    the corresponding GitHub repository. The compromised version, 9.4.1, was
    a registry-only attack: developers reviewing the project's default
    branch would have seen nothing wrong.

    Aikido researcher Charlie Eriksen reported the package on the project's
    GitHub tracker, and StepSecurity published a teardown. The diff in the
    tarball was small. `package.json` carried the version bump, and
    `dist/index.js` gained three prepended lines that base64-decoded a shell
    command and ran it through `child_process.exec()` as soon as application
    code imported the SDK. The command used curl to pull
    `install.sh` from `89.36.224.5`, suppressing all output.

    On macOS, the script created `~/Library/Application Support/com.apple.Terminal/`,
    fetched either an ARM64 or Intel build of a binary named `profiler` from
    the same host, made it executable, and registered it as a persistent
    user service through `launchctl submit -l zsh.profiler`. The naming
    borrowed from Apple's own bundle conventions to blend into a developer
    laptop.

    The trigger here was not an npm lifecycle hook. Passing `--ignore-scripts`,
    a common defense against malicious `postinstall` payloads, did nothing,
    because the malicious code ran at `require('@velora-dex/sdk')` time.
    StepSecurity told downstream operators to pin to 9.4.0 or earlier,
    remove the launchctl service and the dropped binary, and rotate any
    secret reachable from an affected machine.
  start_date: 2026-04-07
  end_date: 2026-04-07
  target:
    name: '@velora-dex/sdk'
    kind: library
    repo: https://github.com/VeloraDEX/sdk
  actor:
    name: Unknown
    kind: unknown
  language: JavaScript
  method:
    cause: compromised_account_credentials
    phase: distribution
    motive: backdoor
    transitive: true
  impact:
    types:
    - backdoor
    users: 0
  artifacts:
  - id: velora-dex-sdk
    name: '@velora-dex/sdk'
    package: '@velora-dex/sdk'
    ecosystem: npm
    kind: source_archive
    repo: https://github.com/VeloraDEX/sdk
    start_date: 2026-04-07
    end_date: 2026-04-07
    versions:
    - 9.4.1
    fixed_versions:
    - 9.4.2
    locations:
    - uri: https://registry.npmjs.org/@velora-dex/sdk/-/sdk-9.4.0.tgz
      role: distribution
    - uri: https://www.npmjs.com/package/@velora-dex/sdk/v/9.4.1
      role: distribution
    - uri: https://registry.npmjs.org/@velora-dex/sdk/-/sdk-9.4.2.tgz
      role: distribution
    indicators:
    - kind: file
      value: dist/index.js
    - kind: ip
      value: 89.36.224.5
    - kind: url
      value: http://89.36.224.5/troubleshoot/mac/install.sh
    - kind: url
      value: http://89.36.224.5/mac/arm/driver/profiler
    - kind: url
      value: http://89.36.224.5/mac/intel/driver/profiler
    - kind: file
      value: ~/Library/Application Support/com.apple.Terminal/profiler
    - kind: service
      value: zsh.profiler
    - kind: command
      value: launchctl submit -l zsh.profiler
    notes:
    - StepSecurity identified 9.4.0 and earlier as safe versions; 9.4.1 was the
      compromised registry-only release.
    - npm's retained chronology shows 9.4.2 was published at
      2026-04-07T22:25:50.515Z, about three hours after 9.4.1; its dist/index.js
      is byte-identical to the safe 9.4.0 file.
