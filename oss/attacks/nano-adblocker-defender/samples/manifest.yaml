      - >-
        It opens a socket.io channel to def.dev-nano.com and registers handlers on it: one fetches a
        URL and request options supplied by the operator and emits the entire response -- header
        entries, body text, ok flag and status -- straight back down the channel, turning every
        install into an HTTP relay running with the extension's host permissions.
      - >-
        The malicious CRX itself was never recovered; this is the reviewer's extracted source
        restored to a loadable file, not the shipped package.
