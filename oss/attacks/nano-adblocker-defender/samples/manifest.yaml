schema_version: 1
interpretation:
  - >-
    The malicious builds existed only as Chrome Web Store updates. Google removed both extensions,
    the store serves no history, and the code was never pushed to the new owners' GitHub repository,
    which is the point Raymond Hill made at the time. No CRX for Nano Defender 15.0.0.206 or Nano
    Adblocker 1.0.0.154 could be located.
  - >-
    What survives is the reviewer's extraction. Raymond Hill unpacked the shipped extension and
    posted the diff against the last clean release the day before the story broke; that diff is
    authentic modified source and is kept here as a reconstruction input, with the API record it
    came from beside it.
