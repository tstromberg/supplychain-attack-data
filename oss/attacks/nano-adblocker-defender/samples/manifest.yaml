      retrieved_at: '2026-09-02T13:20:00Z'
      kind: original_incident_report_fragment
    verification:
      status: payload_only
      basis:
        - measured_sha256
      evidence:
        - extracted_from_retained_github_api_comment
        - measured_sha256
    notes:
      - >-
        The code added to background/core.js and js/commands.js in the shipped update: a
        webRequest.onBeforeSendHeaders listener registered for <all_urls> that tests each request's
        details object against a listOfObject fetched from def.dev-nano.com and emits the whole
        object back as handleObject when every field matches.
      - >-
        It also carries the console-detection reporting and the four-character obfuscation that
        strips "-zzz" from outgoing request headers.
      - >-
        A diff from an analysis, not the CRX. It is the exact text Hill published; only CRLF line
        endings were normalised, as recorded in the sidecar.
    subject: nano-defender
