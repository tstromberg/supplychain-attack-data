schema_version: 1
interpretation:
  - >-
    The clean Windows installer survives as the original GitHub release asset uploaded after the
    compromise was detected. Its measured SHA-256 exactly matches the signed checksum embedded in
    the release record and the checksum published in Bitcoin Gold's later technical analysis.
  - >-
    The two poisoned installers remain unavailable. Bitcoin Gold published the exact installer
    hashes and reverse-engineering result, but no binary diff or decompiled function bytes suitable
    for preservation as an exact fragment.
