interpretation:
  - >-
    GitHub still serves the incident-published malicious commit e8a812c5 as a complete source
    snapshot. Its tree is the same as the second reported transient commit e69bf4b3, and contains
    the Composer plugin conversion, setup-intercom.sh, and 11.7 MB router_runtime.js payload. This
    is an exact malicious source tree but not the original Packagist-generated archive whose
    independently reported SHA-256 remains unresolved.
