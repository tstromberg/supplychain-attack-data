- id: leoplatform-rstreams
  title: Miasma poisoned LeoPlatform npm and jumped to a Go module
  campaigns:
  - miasma-2026
  synopsis: >-
    In late June 2026 the Miasma worm republished 23 LeoPlatform and RStreams npm packages
    with a malicious binding.gyp, then reached the Verana Blockchain Go module. It was the
    campaign's first move outside npm and into the Go ecosystem.
  story: |
    A late-June 2026 wave of the Miasma worm poisoned 23 npm packages belonging to
    the LeoPlatform and RStreams data-streaming projects, along with three packages
    published by the account `llxlr`. Socket, which analyzed the wave, also found
    compromise indicators in a Go module for the Verana Blockchain project. That
    made it the first time the campaign reached outside npm.

    LeoPlatform and RStreams publish serverless data-streaming libraries for AWS.
    The malicious releases went out in a tight window, inserted as new patch
    versions across every supported major release series at once, so a project
    pinned to any maintained line would pick one up. The delivery reused the
    technique from the June 3 wave: a weaponized `binding.gyp` that runs during
    `npm install` when `node-gyp` evaluates it, rather than a lifecycle script that
    an install-time scanner would flag.

    From there the chain ran through a ROT Caesar layer, AES-GCM decryption, and a
    downloaded Bun runtime used to execute the JavaScript payload outside Node's
    own security hooks. It collected npm tokens, GitHub secrets, SSH keys, and
    cloud credentials, and searched for GitHub Actions workflows with publishing
    permissions to extract more. The marker string `RevokeAndItGoesKaboom` tied the
    wave to earlier GitHub Actions compromises in the same family.

    The persistence is what distinguishes this wave. Rather than relying on the
    package staying installed, the malware wrote hooks into developer tooling
    configuration for Claude, VS Code, Cursor, and Copilot, staging payloads in a
    `.claude` folder with a VS Code folder-open task that invokes
    `node .claude/setup.mjs`. A developer who merely opened a poisoned repository
    later would execute it, which extends the blast radius well past whoever ran
    the original install. Socket advised rotating exposed credentials from a clean
    machine and auditing repositories for injected workflows, unexpected branches,
    and `.claude/` or `.github/` configuration files. Researchers track the family
    under the overlapping names Mini Shai-Hulud, Miasma, and Hades.
  start_date: 2026-06-24
  end_date: 2026-06-26
  target:
    name: LeoPlatform
    kind: library
    repo: https://github.com/LeoPlatform
    website: https://www.npmjs.com/org/leoplatform
  actor:
    name: Unknown
    kind: group
  language: JavaScript
  method:
    cause: compromised_account_credentials
    phase: distribution
    motive: credential_theft
    transitive: true
  impact:
    types:
    - credential_theft
    - self_propagation
    - data_exfiltration
    - backdoor
  locations:
  - uri: https://www.npmjs.com/org/leoplatform
    role: distribution
  indicators:
  - kind: malware_family
    value: Miasma
  - kind: file
    value: binding.gyp
  - kind: file
    value: .claude/setup.mjs
  - kind: string
    value: RevokeAndItGoesKaboom
  - kind: technique
    value: patch releases inserted into every supported major release series at once
  - kind: technique
    value: persistence hooks in Claude, VS Code, Cursor, and Copilot configuration
  - kind: account
    value: 'npm: llxlr'
  notes:
  - This wave is the Miasma campaign's first move outside npm. The Verana Blockchain Go
    module is a separate project from LeoPlatform and is recorded here as an artifact of
    the same wave because published reporting treats them together and the Verana-specific
    evidence is limited to compromise indicators.
  - Sources differ on timing. The Hacker News places the npm releases on 2026-06-24, while
    Socket describes all compromised versions being published within a 30-second window on
    2026-06-26. Both dates are retained in the range.
  - The affected package count is 23 across LeoPlatform and RStreams, plus three packages
    published by the llxlr account. Socket enumerated the package names and the single
    malicious version published for each, which are recorded on the artifacts here. Three
    of the 23 are hexo, prism, and solo-nav packages rather than LeoPlatform or RStreams
    ones, matching the separately reported llxlr activity.
  - Researchers use Mini Shai-Hulud, Miasma, and Hades for overlapping parts of this family.
    The binding.gyp delivery matches the 2026-06-03 wave recorded at [[vapi-server-sdk]].
