schema_version: 1
interpretation:
  - >-
    StepSecurity GitHub Actions run 28148212692 used npm pack to capture leo-logger 1.0.8 and
    uploaded the resulting .tgz without reconstruction. The recovered archive's SHA-1 and SHA-512
    exactly match OSSF MAL-2026-6429, proving byte identity with the published npm artifact.
  - >-
    The ordinary filename is therefore intentional. Its embedded package.json identifies leo-logger
    1.0.8 and declares bun ^1.3.13; the archive contains seven members. The GitHub artifact ZIP
    SHA-256 is recorded only as capture-container provenance, not as the npm checksum.
samples:
  - artifact_id: leo-logger
    phase: during
    classification: malicious
    coordinate: pkg:npm/leo-logger@1.0.8
    version: 1.0.8
    filename: leo-logger-1.0.8.tgz
    path: leo-logger/during/leo-logger-1.0.8.tgz
    sha256: 3967738a03a83d6e526f59256233ff2539d90c7093a5c50692c51bc8db301304
    size: 1167299
    source:
      url: >-
        https://api.github.com/repos/actions-security-demo/compromised-packages/actions/artifacts/7869265804/zip
      retrieved_at: '2026-08-13T18:39:41Z'
      kind: research_corpus
      original_url: https://registry.npmjs.org/leo-logger/-/leo-logger-1.0.8.tgz
      capture:
        repository: actions-security-demo/compromised-packages
        workflow_commit: f48593aaba546179817e2531f44cd6ca3b30f7fe
        workflow_path: .github/workflows/main.yml
        run_id: 28148212692
        artifact_id: 7869265804
        artifact_name: leo-logger-tarballs
        artifact_zip_sha256: 800b4045f8da03db9ab847e462d6d68291052383fd900193c91abe9f0cbf786a
        command: npm pack leo-logger@1.0.8
    verification:
      status: exact
      basis:
        - archive_declares_version
        - measured_sha256
      evidence:
        - original_npm_pack_tarball_from_contemporaneous_research_capture
        - OSSF_MAL_2026_6429_sha1_matches_bytes
        - OSSF_MAL_2026_6429_sha512_matches_bytes
        - embedded_name_and_version
        - embedded_bun_dependency_caret_1_3_13
        - measured_sha256_size_and_7_archive_members
    notes:
      - Original published archive bytes; no RECONSTRUCTED qualifier is required.
    subject: leo-logger
