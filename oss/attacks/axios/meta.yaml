      role: distribution
    indicators:
    - kind: observable
      value: Injected as a dependency of axios 1.14.1 and axios 0.30.4.
    - kind: observable
      value: Installed a remote access trojan on macOS, Windows, and Linux.
    notes:
    - The postmortem timeline says plain-crypto-js 4.2.0 was first published on March 
      30, then 4.2.1 was injected into the malicious axios releases and removed at 03:29
      UTC on March 31, 2026.
