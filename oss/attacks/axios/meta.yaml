- id: axios
  title: Axios npm Account Takeover and RAT
  synopsis: A direct npm account takeover of the lead maintainer bypassed OIDC trusted
    publishing and turned a routine axios release into an installation-time trap.
    Version 1.14.1 carried a malicious postinstall hook that pulled a multi-platform
    RAT through node_modules/plain-crypto-js, letting dependency resolution become
    the quiet delivery rail for remote access.
