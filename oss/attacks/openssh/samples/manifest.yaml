        Filed as an individual member rather than a repacked archive: the patch altered only these
        files, and the rest of the release is represented by the clean baseline in this manifest.
      - >-
        The member keeps its exact basename because file identification recognises Makefile.in by
        name; any decorated variant types as unknown and scores nothing.
