  notes:
  - >-
    Contemporaneous developer IRC logs record the sizes on ftp.openbsd.org before and after the
    swap: openssh-3.4.tgz 398595 to 401466, openssh-3.2.2p1.tar.gz 822567 to 825630,
    openssh-3.4p1.tar.gz 837668 to 840574.
  - >-
    All three clean figures match the held before samples, and 840574 matches VirusTotal's size for
    the one published trojaned digest, so the pairs are corroborated.
  - >-
    The trojaned openssh-3.2.2p1.tar.gz unpacked to an openssh-3.2.3 directory, so the attacker
    packaged a different tree and it cannot be rebuilt from the clean 3.2.2p1 archive.
  - >-
    The payload sat in openbsd-compat/ in the portable releases but in ssh-keygen/ in the native
    openssh-3.4.tgz, and that tree's Makefile edit was never published.
