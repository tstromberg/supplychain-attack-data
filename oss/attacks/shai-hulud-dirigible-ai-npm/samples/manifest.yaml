schema_version: 1
interpretation:
  - >-
    Forager d4c2240e2dc9 with FORAGER_ALLOW_PARTIAL=1 recovered 85 of the 86 Socket-listed members
    for each affected @dirigible-ai/sdk release. In both cases only router_init.js was unavailable
    from Socket's content store.
  - >-
    Socket's ordinary Q-prefixed content addresses are the letter Q followed by the member SHA-256
    encoded as unpadded base64url. All 85 recovered members in each partial archive match their
    Socket-listed path, size, and decoded SHA-256. The retained jsDelivr 0.6.3 flat manifest
    independently confirms all 86 paths, sizes, and SHA-256 values for that release.
  - >-
    Socket gives router_init.js the same special S-prefixed content identifier and 2,339,346-byte
    size in both releases. jsDelivr identifies that member in 0.6.3 as SHA-256
    2ec78d556d696e208927cc503d48e4b5eb56b31abc2870c2ed2e98d6be27fc96; Triage independently supplied
    those exact bytes. The two Socket trees are otherwise identical except for package.json, so the
    common content address establishes the same router member for 0.6.2.
  - >-
    The complete trees were archived directly with the deterministic method documented below. They
    remain RECONSTRUCTED because no authoritative original whole-archive digest is available.
