- id: coa
  title: coa NPM package maintainer hijack distributes malware
  synopsis: Attackers compromised maintainer credentials for the coa command-line
    argument parser and published malicious versions with Windows-focused password-stealing
    malware. The package's quiet place in dependency trees amplified the blast radius,
    pulling downstream consumers such as rc into the same poisoned npm current.
