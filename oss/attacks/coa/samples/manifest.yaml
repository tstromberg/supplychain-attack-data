schema_version: 1
interpretation:
  - >-
    Mandiant identifies MD5 9c6664390b305a8aeeec859ab8169095 as sdd.dll, the DANABOT payload
    downloaded by the compromised coa packages. Triage resolved that MD5 to the SHA-256 below and
    supplied the exact bytes.
  - >-
    This is an auxiliary payload recovered from the malicious install chain, not one of the removed
    npm package tarballs. The package archives remain unresolved separately.
  - >-
    The original reporter preserved the exact package.json preinstall addition and identified 2.0.2
    as the last legitimate release. The official 2.0.2 npm tarball is retained as the clean
    predecessor.
