  notes:
  - StepSecurity counted 502 rewritten tags on laravel-lang/lang, 86 on laravel-lang/attributes,
    46 on laravel-lang/actions, and every tag from v1.0.0 through v3.4.5 on
    laravel-lang/http-statuses. An earlier Aikido report on 2026-05-22 cited 233 tags
    across three packages and missed laravel-lang/actions.
  - The attacker held org-wide push access and rewrote tags directly on the official
    repositories. An earlier Aikido analysis described a fork-tag mechanism; StepSecurity's
    git evidence ("Your Name <you@example.com>" commits on the official refs, identical
    across all four repos) contradicts that and indicates direct push.
  - Compromise window was 2026-05-22 22:32 UTC to 2026-05-23 00:00 UTC, with the first
    rewrite landing on laravel-lang/lang and the campaign extending across the four
    repositories within roughly 90 minutes.
  - The dropper writes a per-host marker so the stealer runs once per machine. The
    second-stage PHP drops and runs an ELF at /tmp/.<8 hex> and removes it from the
    directory tree; the live ELF carries parent PID 1 and a deleted executable path.
  - flipboxstudio.info is a typosquat of the legitimate flipboxstudio.com.
  - Socket counted roughly 700 rewritten tags across the four repositories and
    documented seventeen credential collectors in stage two covering cloud metadata
    services, Kubernetes service-account tokens, HashiCorp Vault, CI/CD working
    directories (Jenkins, GitLab Runner, GitHub Actions, CircleCI, TravisCI, ArgoCD),
    browsers, password managers (1Password, Bitwarden, LastPass, KeePass, Dashlane,
    NordPass), SSH keys, Git and Docker credentials, VPN configs, and cryptocurrency
    wallets.
  - On Windows, stage two ships an embedded DebugChromium.exe that uses Chrome's
    debugging interface to extract the v127+ app-bound encryption key, defeating
    Chrome's newer cookie- and password-store protections.
  - C2 hostname is built at runtime from character codes; TLS certificate verification
    is disabled on the fetch and a Mozilla User-Agent is spoofed. The string
    "k9X2mP7vL4nQ8wR1" recurs as an XOR key in the obfuscated payload.
