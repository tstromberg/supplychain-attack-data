- id: telnyx
  title: Telnyx PyPI release hid WAV stealer
  synopsis: >-
    TeamPCP compromised Telnyx Python SDK releases 4.87.1 and 4.87.2 by adding import-time
    malware to the PyPI artifacts.
  story: |
    Telnyx ships a Python SDK for its communications API; the package reaches a large install base through PyPI. On 2026-03-27, releases 4.87.1 and 4.87.2 added malicious import-time logic to `telnyx/_client.py`. The code ran when an application imported the package.

    On Linux and macOS, the package fetched `ringtone.wav` from a single host, decoded a credential harvester from the audio bytes, ran it in a detached Python subprocess, and posted encrypted results as `tpcp.tar.gz`.

    Windows had its own path, and one operator typo. 4.87.1 invoked the Windows routine as `Setup()`. The function was defined as `setup()`. The release shipped, ran cleanly on Linux and macOS, and silently no-op'd on Windows. 4.87.2 fixed the case. The Windows path then decoded a PE binary from `hangup.wav` and wrote it to the user's Startup folder.

    StepSecurity tied the package to TeamPCP through the same RSA-4096 key, encryption scheme, and `tpcp.tar.gz` exfiltration marker seen in the LiteLLM compromise. The 742,000 download figure is pre-compromise package reach, not a confirmed victim count.
  start_date: 2026-03-27
  end_date: 2026-03-27
