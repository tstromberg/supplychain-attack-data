- id: telnyx
  title: Telnyx PyPI WAV Steganography Credential Stealer
  campaigns:
  - teampcp-2026
  synopsis: TeamPCP compromised Telnyx Python SDK releases 4.87.1 and 4.87.2 by adding
    import-time malware to the PyPI artifacts. The payload hid a second-stage credential
    stealer inside WAV audio data, collected developer, cloud, package-manager, and
    wallet secrets, encrypted them with the same TeamPCP RSA/AES scheme seen in LiteLLM,
    and exfiltrated them as tpcp.tar.gz. Version 4.87.2 also repaired a Windows branch
    intended to decode and persist a PE backdoor. The case stands out for using audio
    steganography inside a legitimate communications SDK package.
