schema_version: 1
interpretation:
- npm unpublished both malicious archives. ESLint's official postmortem links an ESLint maintainer's same-day
  Gist preserving the complete shared lib/build.js downloader, the recovered Pastebin second stage, and
  the exact package.json postinstall addition used in both releases.
- The immediately preceding clean npm archives are preserved for each package. The two malicious files
  are duplicated under both artifact directories to record that the same payload chain was distributed
  by both poisoned packages.
