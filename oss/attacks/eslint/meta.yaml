---
- id: eslint
  title: eslint-scope/config-eslint NPM compromise steals NPM tokens
  synopsis: An attacker compromised the npm account of an ESLint maintainer and published
    malicious versions of eslint-scope and eslint-config-eslint. The injected code
    searched developer machines for .npmrc authentication tokens, aiming to turn one
    trusted maintainer account into many future publishing keys.
  start_date: 2018-07-12
  end_date: 2018-07-12
  target:
    name: eslint
    kind: library
    repo: https://github.com/eslint/eslint-scope
  actor:
    name: Individual Hacker
    kind: person
  language: Javascript
  method:
    cause: compromised_account_credentials
    phase: distribution
    motive: credential_theft
    transitive: false
  impact:
