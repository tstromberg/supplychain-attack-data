- name: eslint
  title: eslint-scope/config-eslint NPM compromise steals NPM tokens
  repo: https://github.com/eslint/eslint-scope
  synopsis: An attacker compromised the npm account of an ESLint maintainer and published malicious versions of eslint-scope and eslint-config-eslint. The injected code searched developer machines for .npmrc authentication tokens, aiming to turn one trusted maintainer account into many future publishing keys.
  start_date: 2018-07-12
  end_date: 2018-07-12
  attribution_type: Individual Hacker
  component_type: Library # Development Tooling
  lang: Javascript
  cause: Compromised Account/Credentials
  motive: Credential Theft # Access NPM accounts
  transitive: false
