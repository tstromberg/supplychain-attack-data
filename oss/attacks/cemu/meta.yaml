  notes:
  - Download counts are point-in-time figures from GitHub release metadata at disclosure
    on 2026-05-12, with 19,897 for the AppImage and 1,957 for the Ubuntu zip. The impact
    users field is the sum and represents downloads, not confirmed executions.
  - The original v2.6 release was tagged on 2025-02-06 by github-actions[bot]. Only the
    Linux release assets were replaced; the git tag, source archive, Windows zip, macOS
    dmg, and Flatpak build were unchanged.
  - Maintainers attribute the MangelSpec account compromise to malicious software the
    co-author ran inside WSL, which exposed GitHub credentials.
  - The C2 address 83.142.209.194 and the pgsql-monitor.service persistence are shared
    with the durabletask PyPI compromise on 2026-05-19, tying this incident to TeamPCP's
    Mini Shai-Hulud activity.
