- id: cemu
  title: TeamPCP backdoored the Cemu 2.6 Linux release assets
  synopsis: >-
    TeamPCP used a compromised co-author account to replace the Linux release assets of
    Cemu 2.6 on GitHub with builds that ran a Python credential stealer at startup. The
    swap stood for five days and produced about 21,000 downloads.
  story: |
    Cemu is the Wii U emulator. Its 2.6 release was tagged on 2026-02-06 and the assets were uploaded by `github-actions[bot]`. On 2026-05-07 at 22:55 UTC the user `MangelSpec`, a long-term co-author, replaced `cemu-2.6-ubuntu-22.04-x64.zip`. On 2026-05-08 at 01:41 UTC the same account replaced `Cemu-2.6-x86_64.AppImage`. The Windows zip, the macOS dmg, the v2.6 git tag, and the Flatpak build were not touched. The release page kept the original publication date, so casual inspection showed a four-month-old release with current assets.

    The compromise was reported as `cemu-project/Cemu` issue #1911 on 2026-05-12. By then the AppImage had recorded 19,897 downloads and the Ubuntu zip 1,957. The maintainers traced the entry point to a malicious binary `MangelSpec` had run inside WSL, which exposed the GitHub credentials used for release uploads. The Linux assets had no CI provenance: a contributor with upload rights could overwrite them directly.

    Both backdoored archives bundled a Python zipapp `startup.pyz`. The AppImage variant carried SHA256 `0f35abda19fb69430c32228465396094b866d887427bf551e353ab31256a9dd6`. On execution the payload wrote `pgmonitor.py` and registered it as the systemd service `pgsql-monitor.service`, presented as a PostgreSQL monitoring agent. The collector covered SSH keys, GitHub tokens, AWS Secrets Manager and SSM, Azure Key Vault, GCP Secret Manager, Kubernetes secrets, HashiCorp Vault, and password-manager state. Exfiltration posted to `83.142.209.194/v1/weights`. A fallback resolver pulled RSA-signed C2 addresses encoded as `FIRESCALE <base64url>.<base64sig>` from GitHub commits. The payload ran only on Linux, skipped systems with a Russian locale, and required more than four CPU cores. A `roulette` routine inspected locale for Israeli and Iranian targets and, on a one-in-six roll, played an audio file and ran `rm -rf` over the file system.

    The C2 address and the `pgsql-monitor.service` persistence are shared with the durabletask PyPI compromise eight days later (see [[durabletask-pypi]]) and with the broader May 11 wave that hit roughly 170 npm and PyPI packages in five hours; the cross-ecosystem aggregate lives on [[shai-hulud-here-we-go-again]]. The project removed the malicious assets, restored the originals, and posted a notice through `rentry.org`. Users who downloaded but never executed the archives were told they were not at risk. Users who ran them were told to treat the host as compromised and rotate every credential reachable from the machine. A group identifying as TeamPCP claimed responsibility; Datadog declined to assess the claim.
