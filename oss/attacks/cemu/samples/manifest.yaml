schema_version: 1
interpretation:
  - >-
    GitHub deletes a release asset when it is replaced, so neither trojanized archive can be
    downloaded from the release any more. The assets served today were re-uploaded by the
    maintainers on 2026-05-12 and hash to
    0c20c4aeb800bb13d9bab9474ef45a6f8fcde6402cad9b32ac2a1bbd03186313 (AppImage) and
    5e4592d0dae394fa0614cb8c875eff3f81b23170b349511de318d9caf7215e1b (Ubuntu zip), neither of which
    is a reported malicious digest. That confirms the release is remediated and that meta.yaml's two
    digests describe the replaced files rather than the current ones.
  - >-
    The payload inside them did survive. A copy of squashfs-root/usr/share/Cemu/scripts/ startup.pyz
    was submitted to Triage on 2026-05-16 and matches the SHA-256 Datadog published, so the corpus
    holds the malicious stage even though the containers are gone.
samples:
  - artifact_id: cemu-appimage
    phase: during
    classification: malicious
    version: '2.6'
    filename: startup.pyz
    path: cemu-appimage/during/startup.pyz
    sha256: 0f35abda19fb69430c32228465396094b866d887427bf551e353ab31256a9dd6
    size: 23385
    source:
      url: https://tria.ge/api/v0/samples/260516-1fk7vahy7z/sample
      original_url: https://github.com/cemu-project/Cemu/releases/download/v2.6/Cemu-2.6-x86_64.AppImage
      retrieved_at: '2026-09-02T12:48:37Z'
      kind: malware_sandbox
    verification:
      status: exact
      basis:
        - reported_digest_matched
        - measured_sha256
      evidence:
        - datadog_reported_sha256
        - measured_sha256
    notes:
      - >-
        The Python payload the trojanized build ran at startup, carried inside the AppImage at
        squashfs-root/usr/share/Cemu/scripts/startup.pyz. It is the stage, not the container: the
        AppImage itself remains unrecovered.
      - >-
        Triage submission 260516-1fk7vahy7z, 2026-05-16T21:35:32Z, four days after the swap was
        found. Its archive members are the python_mistral_cemu_files tree Datadog documented.
    subject: cemu-appimage
