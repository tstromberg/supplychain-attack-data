schema_version: 1
interpretation:
  - >-
    A contemporaneous Audacity forum reply links the poisoned main installer's VirusTotal report and
    identifies it as a roughly 350 kB replacement. This supplies the exact SHA-256 that was
    previously missing. The clean 2.1.2 installer below matches independent archive-mirror MD5 and
    SHA-1 records.
  - >-
    A contemporaneous Classic Shell forum report records both installers' MD5, SHA-1, and exact
    sizes. The recovered files match every one of those values. The infected file's measured SHA-256
    also matches the VirusTotal report linked directly from The Register's August 2016 coverage.
  - >-
    Triage independently maps the published infected MD5 and SHA-1 to the same SHA-256 and preserves
    the exact bytes as ClassicShell.exe. Its provider record is retained in the sidecar; the
    incident-specific local filename distinguishes the poisoned file from the clean same-version
    installer.
