                <link itemprop="mainEntityOfPage" href="https://forum.audacityteam.org/t/warning-fosshub-apparently-hacked-audacity-dls-affected/43134">


              <span class="crawler-post-infos">
                  <time  datetime='2016-08-03T18:13:32Z' class='post-time'>
                    August 3, 2016,  6:13pm
                  </time>
                  <meta itemprop='dateModified' content='2016-08-03T18:13:32Z'>
              <span itemprop="position">1</span>
              </span>
            </div>
            <div class='post' itemprop="text">
              <p>According to GHacks and other sources, FossHub was hacked. Downloads of ClassicShell and Audacity were both affected.  Both Audacity and ClassicShell use FossHub as official download mirrrors. The included malware will wipe your MBR rendering the PC unbootable.</p>
<p>Story: <a href="http://www.ghacks.net/2016/08/03/attention-fosshub-downloads-compromised/" class="inline-onebox-loading" rel="noopener nofollow ugc">http://www.ghacks.net/2016/08/03/attention-fosshub-downloads-compromised/</a></p>
<p>ClassicShell Forum post: <a href="http://www.classicshell.net/forum/viewtopic.php?f=12&amp;t=6434" class="inline-onebox-loading" rel="noopener nofollow ugc">http://www.classicshell.net/forum/viewtopic.php?f=12&amp;t=6434</a></p>
            </div>

              <div itemprop="interactionStatistic" itemscope="itemscope" itemtype="http://schema.org/InteractionCounter">
                  <meta itemprop="interactionType" content="http://schema.org/LikeAction"/>
                  <meta itemprop="userInteractionCount" content="0" />
                <span class='post-likes'></span>
              </div>


            


          </div>
          <div id='post_2' itemprop="comment" itemscope="itemscope" itemtype="http://schema.org/Comment" class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope="itemscope" itemtype="http://schema.org/Person">
                <a rel='nofollow' href='https://forum.audacityteam.org/u/waxcylinder'><span itemprop="name">waxcylinder</span></a>
                  <meta itemprop='url' content='https://forum.audacityteam.org/u/waxcylinder'>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop="datePublished" datetime='2016-08-04T08:46:57Z' class='post-time'>
                    August 4, 2016,  8:46am
                  </time>
                  <meta itemprop='dateModified' content='2016-08-04T08:46:57Z'>
              <span itemprop="position">2</span>
              </span>
            </div>
            <div class='post' itemprop="text">
              <p>Yes and the Audacity Team put a lot of work in yesterday to mitigate this - see the Audacity Website:<br>
<a href="http://www.audacityteam.org/" class="onebox" target="_blank" rel="noopener">http://www.audacityteam.org/</a></p>
<p>and in particular:<br>
<a href="http://www.audacityteam.org/compromised-download-partner/" class="onebox" target="_blank" rel="noopener">http://www.audacityteam.org/compromised-download-partner/</a></p>
<p>Thanks for the heads-up post though,</p>
<p>WC</p>
            </div>
