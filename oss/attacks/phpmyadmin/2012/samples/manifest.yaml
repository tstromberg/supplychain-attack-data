schema_version: 1
interpretation:
  - >-
    The official phpMyAdmin archive service still publishes the clean 3.5.2.2 all-languages ZIP and
    its SHA-256 checksum file. The recovered archive matches that checksum and the clean MD5
    reported during the incident, and it does not contain server_sync.php. The compromised
    cdnetworks-kr-1 ZIP remains unavailable: neither Wayback nor Arquivo.pt reports a capture of the
    mirror path, and the previously recorded MD5 could not be substantiated.
