---
- id: phpmyadmin-2009
  title: phpMyAdmin SourceForge mirror distributes JavaScript malware (2009)
  synopsis: Downloads of phpMyAdmin obtained from certain compromised SourceForge
    mirrors contained injected malicious JavaScript code within legitimate files (like
    js/cross_framing_protection.js). When an administrator used the compromised phpMyAdmin
    installation, this JavaScript executed in their browser, potentially redirecting
    them or loading external malicious content. This was separate from a later backdoor
    incident in 2012.
  start_date: 2008-12-01
  end_date: 2009-01-21
