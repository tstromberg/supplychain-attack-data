schema_version: 1
interpretation:
  - >-
    npm removed both malicious releases. The original archives were not recovered,
    but Socket's exact install.cjs and the two version-specific crashreporter.dll
    payloads were recovered by content hash from Socket, Hopper, and Triage.
  - >-
    No complete retained manifest was recovered for 5.1.11. jsDelivr does retain a complete
    28-file manifest for 5.1.12, but logs/install_log_1752775077340.txt is unavailable and its
    modified package.json bytes have not been recovered or derived. Because at least those members
    remain unaccounted, no synthetic archive is created.
