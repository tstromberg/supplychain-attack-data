- id: got-fetch
  title: got-fetch npm package shipped Scavenger
  campaigns:
  - npnjs-scam-npm-2025
  synopsis: >-
    As part of the expanding npm maintainer phishing campaign using the npnjs.com domain,
    attackers published rogue got-fetch 5.1.11 and 5.1.12 releases.
  story: |
    `got-fetch` was pulled into the npnjs.com phishing wave that hit several npm maintainers in July 2025. The package was not a lookalike; attackers published malicious releases under the real package after maintainer access was compromised.

    Socket linked `got-fetch` to the same campaign that shipped malicious Prettier tooling packages, `synckit`, `@pkgr/core`, `napi-postinstall`, and `is`. In several packages, the Windows path carried a `node-gyp.dll` loader for the Scavenger infostealer.

    The malicious releases were `5.1.11` and `5.1.12`. They sit in the archive as one package-level event inside the broader npm phishing campaign, because the compromised package scope is small but the attacker infrastructure and method are shared.

    The practical impact was credential theft and remote access risk for systems that installed the poisoned releases. Recovery requires treating exposed developer credentials, browser data, SSH keys, and package-manager tokens as compromised.
  start_date: 2025-07-18
  end_date: 2025-07-22
  target:
    name: got-fetch
    kind: library
    repo: https://github.com/sindresorhus/got-fetch
  actor:
    name: Third Party
    kind: group
  language: JavaScript
  method:
    cause: compromised_account_credentials
    phase: distribution
    motive: data_exfiltration_remote_access
    transitive: false
  impact:
    types:
    - remote_access
    - credential_theft
    users: 0
