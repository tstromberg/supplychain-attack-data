  campaigns:
  - npnjs-scam-npm-2025
  synopsis: 'As part of the expanding npm maintainer phishing campaign using the npnjs.com
    domain, attackers published rogue got-fetch 5.1.11 and 5.1.12 releases. StepSecurity''s
    eslint-config-prettier incident update cited Checkmarx reporting that this package
    used a different Windows-focused payload than the earlier node-gyp.dll packages:
    the Pycoon information stealer delivered via crashreporter.dll. The malicious
    releases were deprecated, and the package was later marked deprecated on npm.'
