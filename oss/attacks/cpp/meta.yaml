---
- id: unix-c-compiler-bell-labs-experiment
  title: Ken Thompson implements compiler backdoor demo
  synopsis: In his 1983 Turing Award lecture (published 1984), Ken Thompson described
    an experiment he likely implemented years earlier at Bell Labs. He modified the
    Unix C compiler (`cc`) binary to insert a backdoor into the `login` program during
    compilation. The compiler was also modified to recognize its own source code and
    inject both the `login` backdoor logic and the self-replicating compiler modification
    into any newly compiled compiler binary, even from clean source. This practical
    demonstration highlighted the fundamental vulnerability of trusting software built
    with potentially compromised toolchains.
