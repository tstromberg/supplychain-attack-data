unresolved:
  - artifact_id: unix-c-compiler-bell-labs-experiment
    phase: during
    filename: backdoored cc binary
    status: unavailable
    notes:
      - >-
        Never published. The binary was the only place the backdoor existed, by design: the compiler
        source was clean after the bootstrap, so no source artifact can carry it either. Its absence
        is the point the paper makes.
    attempts:
      - >-
        No hash was ever published for it, so the digest lanes have nothing to query and no
        recovered file could be verified.
