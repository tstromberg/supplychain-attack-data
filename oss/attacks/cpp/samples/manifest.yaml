schema_version: 1
interpretation:
  - >-
    This incident has no distribution artifact and never will. The backdoored cc lived as a binary
    inside Bell Labs; Thompson's own account is that it was not released, and the surviving Research
    Unix and PWB tapes carry no copy. Nothing here should be read as the compiler.
  - >-
    Two things do survive and are worth keeping together: the code as the attacker himself published
    it, and the contemporaneous evidence that it was actually run against a real group rather than
    only described.
