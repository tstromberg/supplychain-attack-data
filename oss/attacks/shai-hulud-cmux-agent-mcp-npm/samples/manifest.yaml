schema_version: 1
interpretation:
  - >-
    Forager d4c2240e2dc9 with FORAGER_ALLOW_PARTIAL=1 recovered 14 of 17 Socket-listed members from
    all six affected releases. Each initial tree lacked build/cmux-mcp.js, its source map, and
    router_init.js.
  - >-
    The two ordinary build outputs were reproduced from immutable upstream commit
    128315113310c770102196412570e118b8bfc552 with the locked dependency graph. Both generated files
    match the retained Socket content IDs and sizes in every version and the retained jsDelivr
    SHA-256 manifests for 0.1.6 through 0.1.8 exactly.
  - >-
    Socket assigns the same router content ID to 0.1.3 through 0.1.6. The retained jsDelivr 0.1.6
    manifest maps it to SHA-256 2ec78d556d696e208927cc503d48e4b5eb56b31abc2870c2ed2e98d6be27fc96,
    whose exact bytes were obtained independently from Triage. Those four trees are complete.
    Versions 0.1.7 and 0.1.8 contain 16 of 17 exact members and omit only their unavailable router
    variants.
  - >-
    Complete trees remain RECONSTRUCTED because no authoritative original whole-archive digest is
    available; incomplete trees are RECONSTRUCTED-PARTIAL.
