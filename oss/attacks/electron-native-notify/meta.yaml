- id: electron-native-notify
  title: electron-native-notify NPM package adds remote backdoor
  synopsis: The electron-native-notify package was compromised with code that opened
    a reverse shell to the attacker's server. Because the package sat beneath Electron
    applications, including the Agama cryptocurrency wallet, the backdoor moved transitively;
    a small notification dependency became the hidden wire into larger desktop software.
