---
- id: sendmail
  title: Sendmail official FTP source distribution trojanized (8.12.6)
  synopsis: The official Sendmail FTP server, ftp.sendmail.org, was compromised and
    the 8.12.6 .tar.gz and .tar.Z source archives were replaced with trojanized versions;
    HTTP downloads were not believed affected. The malicious code ran during compilation,
    connected to spatula.aclue.com (66.37.138.99) on TCP/6667, and opened a shell
    as the build user, compromising build hosts rather than already-running Sendmail
    daemons.
  story: |
    From about September 28 to October 6, 2002, the official Sendmail FTP server distributed trojaned copies of the 8.12.6 source archives. The compromise hit one of the Internet's default pieces of mail infrastructure: administrators who fetched source from the trusted FTP path could build a backdoored Sendmail without ever touching an exploit against a running daemon.

    The malicious code ran during compilation, forked a process, and connected to `spatula.aclue.com` at 66.37.138.99 on TCP/6667. From there, the attacker could open a shell with the privileges of the build user. CERT emphasized the subtle impact: the exposed system was the build host, and because it initiated the outbound connection, the backdoor could create a tunnel through perimeter controls that would otherwise have blocked inbound access.
  start_date: 2002-09-28
  end_date: 2002-10-06
