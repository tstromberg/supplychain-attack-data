    users: 200
  notes:
  - The impact users figure is The Register's estimate of roughly 200 people who downloaded
    the backdoored copy from the Sendmail FTP server before it was discovered. It counts
    downloads, not confirmed compilations or compromises.
  - No actor was ever identified. Erik Parker of Digital Defense observed that the
    one-letter command syntax matched the 2002 OpenSSH backdoor and thought the same
    hacker was responsible, but conceded the code could have been copied or reused by
    someone else. The record therefore carries no attribution.
