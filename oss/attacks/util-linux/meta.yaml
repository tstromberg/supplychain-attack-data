---
- id: util-linux
  title: util-linux source archive trojanized
  synopsis: The util-linux 2.9g source archive was replaced on an official distribution
    site during the same 1999 advisory window as the tcp-wrappers compromise. The
    malicious change targeted login code, allowing credential theft and unauthorized
    command execution after administrators built and installed the package. This is
    a distinct record from tcp-wrappers, even though both were covered by the same
    CERT-era warning.
