      role: distribution
    - uri: https://seclists.org/bugtraq/1999/Jan/286
      role: mirror
    indicators:
    - kind: observable
      value: ftp://ftp.win.tue.nl/pub/linux/utils/util-linux/util-linux-2.9g.tar.gz
    - kind: file
      value: login-utils/login.c
    - kind: function
      value: checkname
