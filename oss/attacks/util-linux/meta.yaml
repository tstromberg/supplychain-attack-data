    - kind: email
      value: xul@hotmail.com
    - kind: email
      value: wlogain@hotmail.com
    notes:
    - The trojaned login.c mailed to `wlogain@hotmail.com` (RCPT TO) from a forged
      `xul@hotmail.com` (MAIL FROM) after `HELO 127.0.0.1`.
    - Andries Brouwer published MD5 ab409a6ac5a775a4b04b8e27f6c86933 for the clean
      util-linux-2.9g.tar.gz he restored. That digest is a known-good baseline, not an
      attack indicator; neither Brouwer nor CERT published a hash for the trojaned archive.
    - Brouwer's announcement gave the download path as
      ftp://ftp.win.tue.nl/pub/linux/util/util-linux-2.9g.tar.gz, while CERT CA-1999-02
      cited pub/linux/utils/util-linux/ for the 2.9h replacement. The CERT form is used
      here.
