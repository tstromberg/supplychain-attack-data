- id: wp-wrapper-link-element
  title: Wrapper Link Elementor plugin created backdoors
  campaigns:
  - wordpress-plugin-backdoor-2024
  synopsis: >-
    Malicious code was injected directly into the Wrapper Link Elementor plugin repository on
    WordPress.org.
  story: |
    Wrapper Link Elementor was another official WordPress.org plugin affected in the June 2024 campaign. The malicious code entered the trusted plugin channel, so the package looked like a normal update to site owners.

    Wordfence listed versions 1.0.2 and 1.0.3 as infected. It noted that malicious code appeared removed later, but the available tag was 1.0.0, lower than the infected versions, making normal upgrade behavior awkward.

    The shared payload attempted administrator account creation, sent the new credentials to `94.156.79.8`, and injected SEO-spam JavaScript. That meant a site could be both backdoored and polluted with attacker-controlled footer content after a routine plugin update.

    This record keeps the Wrapper Link Elementor version range separate from the other plugin artifacts. The version rollback detail matters because cleanup was not a simple upgrade-to-latest workflow at the time Wordfence published.
  start_date: 2024-06-21
  end_date: 2024-06-24
  target:
    name: Wrapper Link Elementor
    kind: plugin
    repo: https://wordpress.org/plugins/wrapper-link-elementor/
  actor:
    name: Third Party
    kind: group
  language: PHP
  method:
    cause: malicious_injection
    phase: source
    motive: seo_spam_account_takeover
    transitive: false
  impact:
    types:
    - account_takeover
    - defacement
    users: 0
