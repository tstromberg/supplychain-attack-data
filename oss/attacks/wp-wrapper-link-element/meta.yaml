- id: wp-wrapper-link-element
  title: Wrapper Link Element plugin created backdoors
  campaigns:
  - wordpress-plugin-backdoor-2024
  synopsis: >-
    Malicious code was injected directly into the Wrapper Link Element plugin repository on
    WordPress.org.
  story: |
    Wrapper Link Element was another official WordPress.org plugin affected in the June 2024 campaign. The malicious code entered the trusted plugin channel, so the package looked like a normal update to site owners.

    Wordfence listed versions 1.0.2 and 1.0.3 as infected. It noted that malicious code appeared removed later, but the available tag was 1.0.0, lower than the infected versions, making normal upgrade behavior awkward.

    The shared payload attempted administrator account creation, sent the new credentials to `94.156.79.8`, and injected SEO-spam JavaScript. This record keeps the Wrapper Link Element version range separate from the other plugin artifacts.
  start_date: 2024-06-21
  end_date: 2024-06-24
  target:
    name: wp-wrapper-link-element
    kind: plugin
    repo: https://wordpress.org/plugins/wrapper-link-element/
  actor:
    name: Third Party
    kind: group
  language: PHP
  method:
    cause: malicious_injection
    phase: source
    motive: seo_spam_account_takeover
    transitive: false
  impact:
    types:
    - account_takeover
    - defacement
    users: 0
  artifacts:
  - id: wp-wrapper-link-element
    name: wp-wrapper-link-element
    ecosystem: wordpress
    kind: extension
    repo: https://wordpress.org/plugins/wrapper-link-element/
    start_date: 2024-06-21
    end_date: 2024-06-24
    versions:
    - 1.0.2
    - 1.0.3
    locations:
    - uri: https://wordpress.org/plugins/wrapper-link-element/
      role: distribution
    indicators:
    - kind: ip
      value: 94.156.79.8
    - kind: user
      value: Options
    - kind: user
      value: PluginAuth
    notes:
    - Wordfence reported that malicious code appeared removed later, but the latest tag
      was lower than the infected versions, so removal was recommended until a properly
      tagged safe release existed.
  references:
  - url: 
      https://www.wordfence.com/blog/2024/06/supply-chain-attack-on-wordpress-org-plugins-leads-to-5-maliciously-compromised-wordpress-plugins/
    title: Supply Chain Attack on WordPress.org Plugins Leads to 5 Maliciously Compromised WordPress Plugins
