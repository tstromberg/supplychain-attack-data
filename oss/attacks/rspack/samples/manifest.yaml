    notes:
      - >-
        Recorded as tree_equivalent until 2026-09-10 although these bytes came from a registry
        mirror that still had the published tarball. Re-fetched and found unchanged, so the status
        was wrong rather than the bytes: this is the published archive, not a reconstruction of one.
