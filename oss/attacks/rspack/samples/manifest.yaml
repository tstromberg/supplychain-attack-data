        proxy serves the tarball it cached and does not re-pack one, so the container is npm's.
      - >-
        Complete 244-file package tree retained by Huawei Cloud after npm removed 1.1.7. Every
        member name, size, and SHA-256 matches jsDelivr's independent flat inventory.
      - >-
        package/dist/util/support.js is the only code member added relative to 1.1.6. It is 609441
        bytes and contains the reported XMRig, 80.78.28.72, .aliyun, .hcloud, tccli, child_process,
        and spawn indicators; package.json explicitly includes dist/util/support.
