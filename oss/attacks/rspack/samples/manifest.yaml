      - >-
        Forager batch: time=2026-08-12T12:13:01.600-04:00 level=INFO msg="starting PURL download"
        purl=pkg:npm/%40rspack/cli@1.1.7
      - >-
        npm mirror lane, 2026-09-10: @rspack/cli is still published and 1.1.7 is not among its
        versions, so this is a version-level unpublish rather than a package removal -- npm shows no
        0.0.1-security holder. registry.npmmirror.com, r.cnpmjs.org and the Huawei mirror all omit
        1.1.7 from their version lists and 404 its tarball path, so no mirror cached the release
        while it was live.
