- id: rspack
  title: Rspack packages shipped XMRig
  campaigns:
  - rspack-vant-cryptominer-2024
  synopsis: >-
    A compromised npm token published @rspack/core and @rspack/cli 1.1.7 with obfuscated
    postinstall code. The payload fetched XMRig configuration, collected host data,
    and mined Monero.
  story: |
    Rspack was hit through the package publisher path. Datadog tracks the actor as MUT-1692 and says the attacker stole an npm maintainer access token, then published trojanized 1.1.7 releases of `@rspack/core` and `@rspack/cli`.

    The malicious packages carried an obfuscated Node.js script. On install, it retrieved a JSON blob from a GitHub repository under the Vant project, decoded a base64 payload, and wrote it to `/tmp/vant`. The payload installed a custom XMRig fork with a hardcoded configuration, with fallback logic to pull the official XMRig installer if the primary path failed.

    The malware also searched for cloud credentials associated with East Asian providers, including Alibaba Cloud, Huawei Cloud, and Tencent Cloud. It exfiltrated credential material to `80.78.28.72/tokens`. The campaign is grouped with the Vant compromise because the same infrastructure and payload-hosting pattern tied the records together.

    Rspack's role in the campaign was especially sensitive because it is build tooling. The affected packages could execute during dependency installation on developer workstations and CI runners before an application ever started, which put the attack next to source code, build secrets, and cloud credentials.
  start_date: 2024-12-19
  end_date: 2024-12-19
  target:
    name: rspack
    kind: library
    website: https://rspack.dev
    repo: https://github.com/web-infra-dev/rspack
  actor:
    name: MUT-1692
    kind: group
  language: javascript
  method:
    cause: compromised_credentials
    phase: distribution
    motive: cryptojacking
    transitive: false
  impact:
    types:
    - cryptojacking
    - credential_theft
    users: 539000
  artifacts:
  - id: rspack-core
    name: "@rspack/core"
    package: "@rspack/core"
    ecosystem: npm
    kind: source_archive
    start_date: 2024-12-19
    end_date: 2024-12-19
    versions:
    - 1.1.7
    locations:
    - uri: https://www.npmjs.com/package/@rspack/core/v/1.1.7
      role: distribution
    indicators:
    - kind: file
      value: /tmp/vant
    - kind: url
      value: https://api.github.com/repos/youzan/vant/git/blobs/8ed1c9256b4bfeb3e4f5aaff48bf140398361ae3
    - kind: ip
      value: 80.78.28.72
    - kind: path
      value: ~/.aliyun/config.json
    - kind: path
      value: ~/.hcloud/config.json
    - kind: path
      value: ~/.tccli/default.credential
    - kind: observable
      value: Obfuscated postinstall code decoded a base64 payload hosted through a Vant
        GitHub blob and installed XMRig.
    notes:
    - Maintainers released clean 1.1.8 and deprecated 1.1.7.
  - id: rspack-cli
    name: "@rspack/cli"
    package: "@rspack/cli"
    ecosystem: npm
    kind: source_archive
    start_date: 2024-12-19
    end_date: 2024-12-19
    versions:
    - 1.1.7
    locations:
    - uri: https://www.npmjs.com/package/@rspack/cli/v/1.1.7
      role: distribution
    indicators:
    - kind: file
      value: /tmp/vant
    - kind: url
      value: https://api.github.com/repos/youzan/vant/git/blobs/8ed1c9256b4bfeb3e4f5aaff48bf140398361ae3
    - kind: ip
      value: 80.78.28.72
    - kind: path
      value: ~/.aliyun/config.json
    - kind: path
      value: ~/.hcloud/config.json
    - kind: path
      value: ~/.tccli/default.credential
    - kind: observable
      value: Obfuscated postinstall code decoded a base64 payload hosted through a Vant
        GitHub blob and installed XMRig.
    notes:
    - Maintainers released clean 1.1.8 and deprecated 1.1.7.
