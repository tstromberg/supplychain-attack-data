---
- id: cline
  title: Cline CLI unauthorized npm publish installs openclaw
  synopsis: An unauthorized party used an exposed npm publish token to publish cline@2.3.0.
    The release was byte-identical to cline@2.2.3 except for a postinstall script
    that globally installed the unrelated openclaw package. Cline reported no malicious
    code delivery, user-data access, source-code compromise, or VS Code/OpenVSX/JetBrains
    extension compromise. The exposed token traced back to a vulnerable AI-powered
    issue-triage workflow that had been removed but whose npm credential was not revoked.
    Maintainers deprecated 2.3.0, published clean 2.4.0, and revoked the token.
  start_date: 2026-02-17
  end_date: 2026-02-17
