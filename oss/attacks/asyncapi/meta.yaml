  notes:
  - >-
    Initial access was a pull_request_target workflow in the AsyncAPI generator repository,
    which exposes base-repository secrets to contributor-controlled code. The stolen npm
    automation token was then used to publish directly.
  - >-
    Execution occurs on module import rather than through an install hook, so npm install
    --ignore-scripts does not prevent it. The first stage launches a detached node -e process
    that retrieves the encrypted second stage from IPFS.
  - >-
    Socket reported the second stage as an 8.25 MB encrypted payload. Combined weekly downloads
    across the four affected packages were reported at approximately 2.9 million.
  - >-
    Unit 42 described the command-and-control design as decentralized fallback infrastructure
    spanning IPFS, Ethereum and Nostr relays, so blocking any single retrieval channel does not
    sever the second-stage fetch.
