    Forager d4c2240e2dc9 with FORAGER_ALLOW_PARTIAL=1 recovered 29 of 30 Socket-listed members for
    six affected releases. Every partial lacks only router_init.js.
  - >-
    Retained jsDelivr manifests survived for 0.1.16, 0.1.17, and 0.1.18. They identify three
    different router payload variants. New retained Socket API listings show that 0.1.13, 0.1.15,
    and 0.1.16 share the same opaque router content ID and 2,339,346-byte size. That variant,
    SHA-256 2ec78d556d696e208927cc503d48e4b5eb56b31abc2870c2ed2e98d6be27fc96, was independently
    acquired, so those three releases are reconstructed as complete trees. The 0.1.17 and 0.1.18
    variants remain unavailable; 0.1.19 shares the 0.1.18 content ID but therefore also remains
    partial.
  - >-
    Complete trees remain RECONSTRUCTED because no authoritative original whole-archive digest is
    available.
