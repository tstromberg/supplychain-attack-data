      value: meshcore-open-git malicious snapshot 80529dcb0d9ee567fbb963cd8b7b33566de3f31c
    - kind: file_sha256
      value: meshcore-open-git optimizer e73a35b3e75e94746428d1a207703d6335933deadee7d1d9c9d0328df7b9df77
    - kind: file_sha256
      value: meshcore-open-git PKGBUILD 6126c3e44406592f002ce9465014c2fe869bd8f308e2c86286f6a13042e521e1
    - kind: file_sha256
      value: validator (stage 1) 2d25d2ea313767fae5808164224cf6ad610ab09546d1e5a6f033eedbfd98a281
    - kind: file_sha256
      value: stage 2 stealer 06c857c8ca798d50c765b4de39e6c4f272ecb57bc8316a8ed4c0fdf02fb59502
    - kind: domain
      value: p4ayykxcrxfyzrgfbbkazernntjbz43hgclrheguylzd7kijmtce6zqd.onion
    - kind: file
      value: validator
    - kind: technique
      value: malicious commit pushed after adoption rather than at adoption
    - kind: technique
      value: Tor-backed second stage shared with the Atomic Arch waves
  notes:
  - >-
    Arch Linux disabled AUR package adoption on 2026-07-30 following the DevOps team announcement by
    Robin Candau, and paused all AUR pushes on 2026-08-01 while investigating.
  - >-
    Reporting corroborated at least 89 package names, community-assembled and still growing. 298
    package branches were force-pushed in the window and 290 are confirmed malicious; all 290 trees
    are held.
  - >-
    The one payload, SHA-256 e73a35b3e75e94746428d1a207703d6335933deadee7d1d9c9d0328df7b9df77, was
    committed under 28 build-tool names such as validator, indexer and compressor. The name is
    camouflage.
  - >-
    Commit messages were camouflage too: upgpkg, updpkgsums, Fix source. Only the PKGBUILD invoking
    the binary the same commit added separates a poisoned commit from a routine one.
