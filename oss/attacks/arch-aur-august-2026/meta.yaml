        At least 89 package names were corroborated, including i915-sriov-dkms, rtk-git,
        boringssl-git, warp-terminal-git and astro-box. The affected unit is each package's
        PKGBUILD, not a versioned artifact.
      - >-
        The affected releases were recorded as a wildcard rather than enumerated, so this record
        asserts no version list.
