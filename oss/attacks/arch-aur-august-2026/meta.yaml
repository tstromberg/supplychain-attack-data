        - kind: file_md5
          value: optimizer 76b7981f13d86374414e4c887b77539d
      evidence:
        - kind: malicious_payload
          path: samples/meshcore-open-git/during/optimizer
          role: embedded loader recovered byte-for-byte by its published SHA-256
      notes:
      - >-
        The artifact hash identifies the complete malicious AUR snapshot named
        malicious-aur-80529dcb0d9ee567fbb963cd8b7b33566de3f31c.tar.gz in the static-analysis
        report. It is an original-archive checksum, not a reconstruction.
      - >-
        The recovered 43,640-byte optimizer is exact payload-only evidence. Its measured
        SHA-256, SHA-1, MD5, size and ELF format all match the independent report, but the
        complete AUR snapshot bytes remain unavailable.
