  notes:
  - >-
    From version 8.18.0 the attacker dropped the preinstall hook and injected the dropper as a
    self-executing function inside dist/index.js and the CLI binary, defeating install-script
    scanners and npm install --ignore-scripts.
  - >-
    The first malicious version was published 2026-07-11 at 16:12:40 BST, which npm records as
    15:12:40Z. The malicious releases were downloaded 1,479 times before deprecation, against
    roughly 15,800 weekly for the main package.
  - >-
    npm records a seventh release the same afternoon, jscrambler 8.15.0 at 17:07:14Z, between
    two versions reported as malicious. No published source lists it as affected, so treat its
    status as unresolved rather than clean.
  - >-
    The payload targets cloud credentials, CI tokens, browser sessions, cryptocurrency wallets,
    Bitwarden vaults, and configuration files for AI coding tools including Claude Desktop and
    Cursor.
