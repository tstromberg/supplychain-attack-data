  notes:
  - From version 8.18.0 the attacker abandoned the preinstall hook and injected the dropper
    as a self-executing function inside dist/index.js and the CLI binary. This defeats
    install-script scanners and is not mitigated by `npm install --ignore-scripts`.
  - The first malicious version was published 2026-07-11 at 16:12:40 BST, which the npm
    registry records as 15:12:40Z. The malicious releases were downloaded 1,479 times in
    total before deprecation, against roughly 15,800 weekly downloads for the main package.
  - The npm registry records a seventh release the same afternoon, jscrambler 8.15.0 at
    17:07:14Z, sitting between two versions reported as malicious. No published source
    lists 8.15.0 as affected, so it is not recorded as a malicious version here. Treat its
    status as unresolved rather than clean.
  - The payload targets cloud credentials, CI tokens, browser sessions, cryptocurrency
    wallets, Bitwarden vaults, and configuration files for AI coding tools including
    Claude Desktop and Cursor.
