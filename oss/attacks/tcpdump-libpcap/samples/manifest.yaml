  notes:
  - 'The preserved excerpt placed ahead of option parsing so it runs the moment the victim configures
    the build: it tries wget, lynx and fetch in turn against a fixed URL and pipes whatever comes back
    to sh, backgrounded with both streams discarded. The excerpt''s context-diff markers were stripped;
    nothing else was altered.'
  - The preserved evidence alone is not loadable source. This is configure as the victim would have received
    it, so the payload is analysable in the file that gives it effect.
  - 'Only this member is carried: the incident altered no other file, and the rest of the release is already
    represented by the clean baseline in this manifest.'
