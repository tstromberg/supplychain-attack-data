schema_version: 1
interpretation:
- The clean 3.7.1 and 0.7.1 archives match CERT's published update MD5s. Debian's preserved 3.6.2 orig
  archive matches its signed security advisories and predates the November 2002 upstream replacement.
- The poisoned release archives remain unavailable, but the original Houston Linux Users Group disclosure
  preserves both relevant source diffs. Its Wayback archive also preserves the complete downloaded services
  payload and the separately published decoded malicious shell-script portion.
