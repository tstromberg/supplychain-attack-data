- name: tcpdump/libpcap
  title: tcpdump.org source tarballs trojanized
  repo: https://github.com/the-tcpdump-group/tcpdump
  synopsis: The tcpdump.org distribution site was compromised in November 2002, and source archives for tcpdump and libpcap were replaced with trojanized versions. The inserted code ran during compilation, connected to a remote IRC server on port 6667, and accepted commands, turning packet-analysis tooling into a remote-access foothold for systems that built from the poisoned official archives.
  start_date: 2002-11-11
