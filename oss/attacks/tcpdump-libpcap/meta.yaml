    - backdoor
    - remote_code_execution
  notes:
  - No source reports how many people fetched the trojaned archives, so impact users is
    left unset rather than asserted as zero. The files were served from the main
    tcpdump.org HTTP path for roughly two days.
  - The start and end dates bound the window CERT documented for tcpdump.org itself,
    10:14 GMT on 2002-11-11 to 15:05:19 GMT on 2002-11-13. CIAC N-014 adds that early
    reports placed modified versions in circulation around 2002-10-30, so total exposure
    including mirrors may have been longer than the two-day duration recorded here.
