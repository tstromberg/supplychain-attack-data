      role: distribution
    notes:
    - Four versions were reported compromised on 2026-06-03 without published identifiers.
      These four are the only versions the npm registry records as published that day,
      in two pairs across both maintained release lines - 0.11.1 at 23:26:29Z and 1.2.1 at
      23:26:39Z, then 0.11.2 at 23:28:37Z and 1.2.2 at 23:28:48Z. Identifiers are derived
      from registry publish timestamps, not from a vendor advisory.
    - The registry corroborates the identification. The `latest` dist-tag points at 1.2.0,
      published 2026-04-22, which is older than 1.2.1 and 1.2.2. Rolling `latest` back to
      the last pre-incident release is the expected response to a compromised publish, so
      1.2.0 is recorded as the remediated release.
    - All four versions remain published and installable by explicit version or by a range
      that resolves to them. They were not unpublished, only removed from the `latest`
      tag, so a lockfile or caret range pinned into the 0.11.x line can still reach them.
    - The four SHA-256 values are measured complete npm archives and correspond to
      0.11.1, 0.11.2, 1.2.1, and 1.2.2 in that order.
