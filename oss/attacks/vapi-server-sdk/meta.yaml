  notes:
  - StepSecurity counted 57 packages and more than 286 malicious versions published in
    under two hours on 2026-06-03. Snyk reported 57 packages and over 300 malicious
    versions for the same activity, tracking it as a node-gyp supply chain compromise.
  - The binding.gyp payload was reported as `"<!(node index.js > /dev/null 2>&1 && echo
    stub.c)"`. Execution occurs because node-gyp evaluates shell commands in binding.gyp
    during dependency installation, so `npm install --ignore-scripts` does not prevent it.
  - '@vapi-ai/server-sdk was the largest single victim of this wave by download volume.
    Specific affected version identifiers for the Vapi package have not been published;
    four versions were reported as compromised.'
  - Exfiltration used 236 programmatically created repositories under the GitHub account
    liuende501. Repository descriptions referenced earlier security disclosures in
    reversed text.
