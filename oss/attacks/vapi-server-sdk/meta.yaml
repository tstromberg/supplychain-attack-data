  notes:
  - >-
    StepSecurity counted 57 packages and more than 286 malicious versions published in under two
    hours on 2026-06-03. Snyk reported 57 packages and over 300 versions, tracking it as a
    node-gyp supply chain compromise.
  - >-
    The binding.gyp payload was reported as "<!(node index.js > /dev/null 2>&1 && echo stub.c)".
    node-gyp evaluates shell commands in binding.gyp during install, so --ignore-scripts does
    block it by suppressing the implicit build.
  - >-
    @vapi-ai/server-sdk was the largest single victim of this wave by download volume. Specific
    affected version identifiers were never published; four versions were reported as
    compromised.
  - >-
    Exfiltration used 236 programmatically created repositories under the GitHub account
    liuende501. Repository descriptions referenced earlier security disclosures in reversed
    text.
