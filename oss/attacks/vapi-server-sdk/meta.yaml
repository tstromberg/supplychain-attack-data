    notes:
    - >-
      Four versions were reported compromised on 2026-06-03 without published identifiers. These
      four are the only versions npm records as published that day: 0.11.1 at 23:26:29Z, 1.2.1
      at 23:26:39Z, 0.11.2 at 23:28:37Z, 1.2.2 at 23:28:48Z.
    - >-
      The registry corroborates it: the latest dist-tag points at 1.2.0 from 2026-04-22, older
      than 1.2.1 and 1.2.2. Rolling latest back to the last pre-incident release is the expected
      response, so 1.2.0 is the remediated release.
    - >-
      All four versions remain published and installable by explicit version or a range that
      resolves to them. They were not unpublished, only removed from latest, so a pinned caret
      range can still reach them.
    - >-
      The four SHA-256 values are measured complete npm archives for 0.11.1, 0.11.2, 1.2.1 and
      1.2.2 in that order. OSSF MAL-2026-5209 maps the SHA-1 and SHA-512 to
      server-sdk-0.11.1.tgz.
