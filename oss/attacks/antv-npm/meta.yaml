  notes:
  - Compromised maintainer was the shared npm account `atool` per Socket. Wiz tracked
    the same account's GitHub credentials being reused to enter the
    microsoft/durabletask-python repository later the same day.
  - The per-package version lists here were derived from npm's own publication times
    rather than from a published table. Publication stamps for the affected scopes fall
    into two tight bursts, 283 releases at 01:56 UTC and 283 more at 02:05 to 02:06 UTC,
    one per package in each. Those 566 versions across 283 packages are recorded as
    affected, against Socket's count of 639 across 323. The shortfall is packages whose
    npm records are gone entirely, leaving no publication time to read. Spot checks
    against StepSecurity's published examples agree exactly.
  - Three releases on the same day fall outside the bursts, at 01:44, 01:47, and 01:49
    UTC, and are still served by npm. Their archives were downloaded and contain none of
    the campaign's files and no reference to its collection host, so they are recorded as
    clean pre-attack baselines rather than affected versions. A window drawn from the
    01:39 start time some reports give would have swept them in.
  - Socket's count of 639 weaponized versions across 323 unique packages is the most
    inclusive published number. Lower counts elsewhere (SafeDep 637/314, StepSecurity
    500+, Wiz 400+ @antv) reflect earlier or scope-limited tallies. The atool account
    maintained 547 packages total. The broader same-day Mini Shai-Hulud total per
    Socket was 1,055 versions across 502 unique packages spanning npm, PyPI, and
    Composer.
  - 'Publishing windows reported differ slightly: SafeDep places the two automated
    waves at 01:39 to 02:06 UTC; Socket places overall publish activity at 01:56
    to 02:56 UTC. Both agree on the May 19 date and the two-wave structure.'
  - Compromised maintainer was the shared `atool` npm account, email i@hust.cc,
    associated with @antv, @lint-md, @openclaw-cn, @starmind scopes plus a long
    tail of standalone JavaScript and tooling packages.
  - SafeDep notes the payload is identical to the Mini Shai-Hulud toolkit used in the
    earlier SAP compromise the same week.
  - Wiz also reported same-day compromises of the GitHub Actions actions-cool/issues-helper
    and actions-cool/maintain-one-comment using shared infrastructure, plus the
    nrwl.angular-console VS Code extension v18.95.0 (tracked separately as nx-console).
