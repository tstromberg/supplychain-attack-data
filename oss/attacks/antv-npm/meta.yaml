- id: antv-npm
  title: AntV ecosystem npm packages hit by TeamPCP
  campaigns:
  - shai-hulud-here-we-go-again
  synopsis: >-
    On 2026-05-19, TeamPCP took the shared `atool` npm account and published 639 malicious
    versions across 323 packages — most of the @antv ecosystem and a long tail of standalone
    neighbors. The bun-based dropper harvested CI/CD secrets and self-propagated via npm.
  story: |
    The @antv ecosystem is Alibaba's data-visualization stack. It shares publishing authority with a long tail of standalone packages — chart wrappers, time utilities, test helpers — through a single npm account called `atool`. On 2026-05-19 that account belonged to TeamPCP. Two automated waves between 01:39 and 02:56 UTC published 639 malicious versions across 323 packages, out of the 547 the account could reach. The wider Mini Shai-Hulud day-of total was 1,055 versions across 502 packages spanning npm, PyPI, and Composer; this one account drove most of it.

    Two delivery paths. Most packages had `package.json` rewritten with a `preinstall` or `postinstall` of `bun run index.js`, with the script shipped at the root. A second set added an `optionalDependencies` pointer to a poisoned commit in `antvis/G2`, where a `prepare` hook ran the same code. The payload was a half-megabyte obfuscated Bun script. It walked the disk for credentials across every major cloud, kube, Vault, SSH, and database, then read `/proc/*/mem` on the GitHub Actions runner and pulled masked CI/CD secrets out of `Runner.Worker` in plaintext.

    Given an npm token, the payload propagated as a worm: validate the token, enumerate the publishable packages, fetch each latest tarball, inject the same dropper, republish. Exfiltration went to `t.m-kosche.com` over HTTPS disguised as OpenTelemetry traces; bodies were AES-256-GCM ciphertext wrapped with RSA-OAEP. When that channel failed, the payload fell back to GitHub — committing harvested data to public repositories on stolen accounts, named under a Dune theme, with the campaign banner reversed in the description. Socket counted 2,200 to 2,500 such repositories by end of day. On the host, the payload also injected hooks into editor and CI configurations and, on macOS, registered a LaunchAgent for the kitty backdoor.

    Socket flagged most versions within six to twelve minutes of publish, median 6.7. npm reclassified them as known malware. Wiz attributed the operation to TeamPCP at moderate confidence on shared infrastructure, the `firedalazer` dead-drop tag, payload kinship, and reuse of the kitty backdoor and Dune repos elsewhere in the campaign. The same backdoor appeared a few hours later in [[nx-console]], and Wiz traced credentials from here into [[durabletask-pypi]] that night. The cross-ecosystem aggregate lives on [[shai-hulud-here-we-go-again]]; this record holds the @antv-account evidence.
