---
- id: event-stream
  title: event-stream dependency steals Bitcoin wallets.
  synopsis: The 'event-stream' npm package maintainership was transferred via social
    engineering to an attacker who then added 'flatmap-stream@0.1.1' as a dependency
    in 'event-stream@3.3.6'. This new dependency contained obfuscated, malicious code
    specifically designed to steal cryptocurrency (Bitcoin, Bitcoin Cash) from users
    of the Copay Dash wallet application by exfiltrating wallet data and private keys
    if balances exceeded certain thresholds.
