interpretation:
  - >-
    The exact poisoned distribution tarball remains unavailable. The recovered infection.diff
    preserves the two malicious source modifications from a research repository's immutable first
    commit, so it is classified as payload-only evidence rather than as the original archive.
  - >-
    Slackware's preserved 2.3.4 source tarball is the clean original release. Its measured SHA-256,
    SHA-1, MD5, and size all match the Slackware mirror index, and the SHA-256 is independently
    reported in contemporary discussion as the signed, non-backdoored archive.
