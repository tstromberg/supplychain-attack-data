    notes:
      - >-
        Rebuilt so the payload is analyzable as C source. The corpus's only during-phase payload for
        this incident is the diff, which static analyzers type as plain text, leaving every C rule
        inapplicable.
      - >-
        Synthetic archive: member order is sorted and timestamps are normalized, so these bytes are
        reproducible from the same inputs but are not the bytes vsftpd.beasts.org served.
      - >-
        A ':)' sequence in a username reaches vsf_sysutil_extra(), which binds port 6200, accepts,
        dup2()s the socket onto stdio and execs /bin/sh.
