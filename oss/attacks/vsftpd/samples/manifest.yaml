schema_version: 1
interpretation:
  - >-
    The exact poisoned distribution tarball is held: Software Heritage had archived it by content
    hash, and it was recovered on 2026-09-03 and re-measured against the digest this record cites.
    Its gzip mtime is 2011-06-30 14:17:36 and str.c line 572 carries the ':)' trigger. The
    infection.diff and the tree_equivalent reconstruction are kept alongside it: the diff isolates
    the two source changes, and the reconstruction remains a reproducible check that the diff and
    the clean predecessor account for the tarball. Earlier passes recorded this artifact as
    unavailable because the hash lanes they asked -- Hopper, MalwareBazaar, Triage, Malshare --
    index malware repositories, and none of them indexes a source-code archive.
  - >-
    Slackware's preserved 2.3.4 source tarball is the clean original release. Its measured SHA-256,
    SHA-1, MD5, and size all match the Slackware mirror index, and the SHA-256 is independently
    reported in contemporary discussion as the signed, non-backdoored archive.
