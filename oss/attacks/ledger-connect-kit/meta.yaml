- id: ledger-connect-kit
  title: Ledger Connect Kit Supply Chain Attack
  synopsis: A former Ledger employee fell victim to a phishing attack, allowing attackers
    to access their NPM account and publish malicious versions of the @ledgerhq/connect-kit
    package. The payload contained a drainer that rerouted cryptocurrency funds to
