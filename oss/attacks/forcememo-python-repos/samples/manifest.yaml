schema_version: 1
interpretation:
  - >-
    ForceMemo published no package. The affected distribution was each repository's default branch,
    consumed by downstream users who installed straight from a git URL, so the unit of collection is
    the immutable git object rather than a versioned archive.
  - >-
    Every capture below is bound to a commit SHA. The tell is the committer date: the attacker kept
    the original commit's message, author, and author date and rewrote only the tail of an
    entry-point file, so author date and committer date disagree by months.
  - >-
    Three repositories are sampled to show the campaign's spread across the shapes it hit: a
    published Python SDK, machine-learning research code, and a Django application. The payload is
    the same in all three, organised around the marker variable lzcdrtfxyqiplpd.
