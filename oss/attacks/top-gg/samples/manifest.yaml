      sha256:0c1873196dbd88280f4d5cf409b7b53674b3ed85f8a1a28ece9caf2f98a71207,
      sha256:35ac61c83b85f6ddcf8ec8747f44400399ce3a9986d355834b68630270e669fb,
      sha256:c53b93be72e700f7e0c8d5333acd68f9dc5505fb5b71773ca9a8668b98a17ba8
    notes:
      - >-
        The poisoned colorama itself, served from the typosquatted mirrors under paths that copy
        PyPI's real hash-based layout. Checkmarx reported the injected code sat first in
        colorama/tests/__init__.py and was later moved to colorama/init.py.
      - >-
        The three reported digests are published as file hashes, so a recovered copy could be
        verified as exact if one is ever found.
    attempts:
      - files.pythanhosted.org and files.pypihosted.org: hosts no longer resolve to the files.
      - >-
        Internet Archive: no captures for files.pythanhosted.org; a single files.pypihosted.org
        capture of the colorama-0.4.3 path from 2024-03-13, and it is a 404.
      - MalwareBazaar, Triage, Malshare: no sample for any of the three digests.
      - VirusTotal: file download requires a Premium/Intelligence key.
      - >-
        DataDog malicious-software-packages-dataset and lxyeternal/pypi_malregistry: neither indexes
        colorama.
      - >-
        Digest sweep, 2026-09-10: the 3 digest(s) this record names for artifacts with no during
        sample were asked of MalwareBazaar, Triage and ReversingLabs. None is known to any of them.
        An earlier sweep covered only records holding no during sample at all, so these had never
        been probed; they have been now.
    last_attempted_at: '2026-09-11T01:45:18Z'
