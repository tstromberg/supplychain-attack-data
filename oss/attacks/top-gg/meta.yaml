---
- id: top-gg
  title: Top.gg Python SDK Supply Chain Attack
  synopsis: Attackers hijacked the GitHub account of a Top.gg maintainer using stolen
    browser cookies to bypass MFA. They modified the repository's requirements.txt
    to point to a poisoned version of the Colorama package hosted on a typosquatted
    domain (files.pypihosted.org). The malware stole credentials, discord tokens,
    and cryptocurrency data.
