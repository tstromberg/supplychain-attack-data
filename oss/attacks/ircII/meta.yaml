---
- id: ircii
  title: ircII FTP distribution backdoored for remote access
  synopsis: The official FTP server (ftp.irc.org) hosting the ircII source code was
    compromised. The `ircii-2.8.2.tar.gz` distribution was modified; specifically,
    the file `ircd/s_bsd.c` had a backdoor inserted. This backdoor connected to IP
    198.168.253.139 on TCP port 30000 and attempted to start an interactive shell
    (`/bin/sh -i`), allowing remote access with the privileges of the user running
    ircII.
  start_date: 1998-10-22
  end_date: 1999-01-21
