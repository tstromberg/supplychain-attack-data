findings:
  - Two independent historical mirrors provide ircii-2.8.2.tar.gz files whose gzip wrappers differ but whose decompressed tar streams are identical. These are clean comparators only and do not refute a temporary distribution-side replacement.
  - The shared clean tar stream contains 231 entries and does not contain ircd/s_bsd.c. This leaves the claimed modified path and revision attribution unresolved; it does not prove that a poisoned server-side object never existed.
  - Neither mirror object's MD5 matches either MD5 recorded in meta.yaml, as would be expected if the recorded hashes identify different, transiently served bytes.
  - Exact-hash searches found no independent binding for the two recorded MD5 values.
  - The cited CERT advisory is CA-1999-01 for TCP Wrappers, not an ircII 2.8.2 incident.
  - Earlier revisions cited CERT CA-1998-13, which concerns a TCP/IP denial of service and is also unrelated to an ircII distribution compromise.
  - Earlier revisions cited IRCHelp's irc-backdoor.txt. That source explicitly summarizes the documented ircII 2.2.9 Trojan covered by CERT CA-94:14; it does not support the 2.8.2 claim.
  - Earlier revisions disagree with the current claim about the changed files and hashes: they name Makefile.in and source/ircaux.c, an outbound wildbill.okla.net connection, and MD5 f49718f50f89706916095610ff146364, while the later record names ircd/s_bsd.c and two different MD5 values. Exact searches did not independently recover either account.
  - The exact cited Geocrawler Wayback URL does not currently resolve to an archived page, and Wayback lookup did not return a capture for the underlying URL. Its article context therefore has not been recovered.
  - The path ircd/s_bsd.c belongs to daemon-side source rather than the clean ircII client tree, so conflation with a different IRC distribution compromise is plausible, but remains an inference without the missing article or malicious bytes.
