  acquisition generators no longer treat it as a verified incident. The documented
  1994 ircII 2.2.9 Trojan remains active as ircii-1994. Preserve the conflicting
  2.8.2 claims, hashes, and clean comparator metadata for future research, but do
  not label either mirror object malicious.
