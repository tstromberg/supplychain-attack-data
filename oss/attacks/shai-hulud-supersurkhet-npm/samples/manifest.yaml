schema_version: 1
interpretation:
  - >-
    Forager d4c2240e2dc9 with FORAGER_ALLOW_PARTIAL=1 recovered 7 of 8 Socket-listed members from
    every @supersurkhet/cli release and 11 of 12 from every @supersurkhet/sdk release. Every initial
    tree lacked only router_init.js.
  - >-
    Retained Socket listings independently verify every stored member. Versions 0.0.2 through 0.0.5
    use the exact S3ILkdNigxgwgrmHN_5FWHidIaD3Wg5xIhpQnikRr5ZU router obtained from Triage, so those
    eight package trees are complete.
  - >-
    Versions 0.0.6 and 0.0.7 use distinct unavailable router variants and remain exact
    one-member-short partials. Complete trees remain named RECONSTRUCTED because no authoritative
    original whole-archive digest is available.
