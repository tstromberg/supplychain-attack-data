    locations:
    - uri: https://www.npmjs.com/package/@mastra/core
      role: distribution
    - uri: https://registry.npmjs.org/@mastra/core/-/core-1.42.1.tgz
      role: distribution
    notes:
    - '@mastra/core is the highest-download package in the scope at roughly 918,000 weekly
      downloads. 1.42.1 was published at 01:15:13Z on 2026-06-17, inside the reported
      01:12-02:39Z republishing window; 1.43.0 followed at 08:23:01Z, after it. The
      identifiers are derived from npm registry publish timestamps rather than from a
      published advisory list. The registry corroborates it: 1.42.1 now returns 404 while
      1.42.0 and 1.43.0 are both still served, so the registry pulled exactly that version.
      Because it was removed, no sample of the malicious tarball could be acquired.'
  - id: mastra-npm
    name: '@mastra npm packages'
    ecosystem: npm
    kind: source_archive
    start_date: 2026-06-17
    end_date: 2026-06-17
    locations:
