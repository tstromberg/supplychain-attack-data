  notes:
  - >-
    Initial access was social engineering: a compromised LinkedIn account contacted the
    maintainer, who clicked a link while on a call and had his machine compromised. The same
    account approached other TypeScript maintainers.
  - >-
    Two contributing conditions: the publishing account ehindero belonged to a former
    contributor whose access was never revoked, and Mastra required MFA for npm maintainers but
    allowed token bypass, since removed.
  - >-
    Microsoft attributed the attack to Sapphire Sleet with high confidence on 2026-06-19,
    matching the March 2026 axios compromise at [[axios]], and assessed cryptocurrency theft as
    the primary motivation.
  - >-
    Timeline in UTC: easy-day-js 1.11.21 clean on 2026-06-16 at 07:05, malicious 1.11.22 on
    2026-06-17 at 01:01, Mastra republishing from 01:12 to 02:39. Reported package counts range
    from 140 to 145.
