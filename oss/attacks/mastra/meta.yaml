      role: distribution
    - uri: https://registry.npmjs.org/@mastra/core/-/core-1.42.1.tgz
      role: distribution
    notes:
    - >-
      @mastra/core is the highest-download package in scope at roughly 918,000 weekly. 1.42.1
      was published at 01:15:13Z on 2026-06-17, inside the republishing window; the identifiers
      come from npm publish timestamps, not an advisory list.
    - >-
      npm now returns 404 for 1.42.1 while 1.42.0 and 1.43.0 are still served, so the registry
      pulled exactly that version. The original tarball could not be acquired; samples holds a
      complete member-tree reconstruction.
