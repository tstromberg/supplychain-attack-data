  notes:
  - >-
    The per-file SHA-256 values come from the OSSF malicious-packages record MAL-2026-6011, which
    lists them as evidence files for @mastra/core 1.42.1. No digest for the published npm
    archive itself has been recorded by that source.
  - The in-scope compromise is the @mastra npm organization. easy-day-js is an
    attacker-created package impersonating dayjs and is recorded here only as the injected
    dependency.
  - Initial access was social engineering. Mastra's incident report describes a compromised
    LinkedIn account contacting the maintainer, who clicked a link while on a call and had
    his machine compromised. The same account approached maintainers of other prominent
    TypeScript packages.
  - Two contributing conditions are worth recording. The publishing account ehindero
    belonged to a former contributor whose access had never been revoked, and Mastra
    required MFA for npm maintainers but also allowed token bypass, which the project
    called a mistake and has since removed across all packages.
  - Microsoft assessed Sapphire Sleet's primary motivation as cryptocurrency theft,
    targeting technology and intellectual property related to cryptocurrency trading,
    which is why the motive is recorded as cryptocurrency_theft rather than credential
    theft alone.
  - 'Timeline in UTC: easy-day-js 1.11.21 published clean on 2026-06-16 at 07:05, malicious
    1.11.22 on 2026-06-17 at 01:01, and the Mastra republish window from 01:12 to 02:39.'
  - Microsoft Threat Intelligence attributed the attack to Sapphire Sleet with high
    confidence on 2026-06-19, and noted the pattern matched the March 2026 axios compromise
    recorded at [[axios]].
  - Reported package counts range from 140+ to 145. Combined
    weekly downloads across the affected packages exceeded 1.1 million, with @mastra/core
    at roughly 918,000.
