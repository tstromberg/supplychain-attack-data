schema_version: 1
interpretation:
  - >-
    StepSecurity run 27661280135 used npm pack during the incident and uploaded the resulting
    @mastra/schema-compat 1.2.11 and 1.2.12 tarballs without repacking them. The recovered files are
    original npm archive bytes, so their ordinary filenames are intentional rather than
    RECONSTRUCTED names.
  - >-
    The embedded manifests verify 1.2.11 as the adjacent clean release and 1.2.12 as the affected
    release: only 1.2.12 declares easy-day-js ^1.11.21. SHA-1, SHA-256, SHA-512, byte size, and the
    121-member archive layout were measured locally after download from the surviving Actions
    artifact.
  - >-
    npm removed @mastra/core 1.42.1 and its original tarball. Socket retains a complete 2,639-file
    manifest and 2,554 Q-addressed member bodies; Forager d4c2240e2dc9 recovered and verified all of
    those bodies by path, size, and decoded SHA-256.
  - >-
    Socket's independently retained manifests for malicious 1.42.1 and clean 1.42.0 contain the same
    2,639 paths. Their content IDs and sizes are identical for 2,638 members; package.json is the
    only difference. The live npm 1.42.0 archive matches npm's authoritative SHA-1 and SHA-512, and
    every one of the 85 opaque S-addressed 1.42.1 members is therefore recovered byte-for-byte from
    the corresponding member in that verified archive.
  - >-
    The malicious package.json was recovered directly from Socket and declares version 1.42.1 and
    easy-day-js ^1.11.21. Combining it with the 2,638 proven-identical base members reconstructs the
    complete malicious file tree. The gzip/tar stream is synthetic and no authoritative checksum for
    the removed publication is available, so the archive remains explicitly RECONSTRUCTED.
