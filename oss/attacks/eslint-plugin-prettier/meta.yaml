- id: eslint-plugin-prettier
  title: eslint-plugin-prettier npm phishing compromise
  campaigns:
  - npnjs-scam-npm-2025
  synopsis: The same npnjs.com npm maintainer phishing campaign that compromised eslint-config-prettier
    also compromised eslint-plugin-prettier. StepSecurity confirmed eslint-plugin-prettier
    4.2.2 and 4.2.3 as affected versions after maintainer JounQin reported that a
    phishing email led to a malicious npm token being added and used to publish compromised
    releases. The malicious package family executed install.js during installation
    and launched a bundled Windows DLL through rundll32 on Windows systems.
  start_date: 2025-07-18
  end_date: 2025-07-19
