- id: eslint-plugin-prettier
  title: eslint-plugin-prettier phishing shipped malware
  campaigns:
  - npnjs-scam-npm-2025
  synopsis: >-
    The same npnjs.com npm maintainer phishing campaign that compromised eslint-config-prettier
    also compromised eslint-plugin-prettier.
  story: |-
    eslint-plugin-prettier was compromised in the same npm credential theft that hit eslint-config-prettier. The attacker controlled package publishing, not the source repository.

    Versions 4.2.2 and 4.2.3 were published to npm as malicious releases. They rode a trusted package name used by projects that integrate Prettier formatting with ESLint, so dependency automation could pull them into workstations and CI jobs.

    The payload family used install-time execution and a Windows DLL path. Socket reported that the injected code attempted to execute `node-gyp.dll` through `rundll32`, giving the attacker code execution at install time.

    The response followed the eslint-config-prettier cleanup: token revocation, credential rotation, deprecation of malicious versions, and coordination with npm. This record remains package-specific because the affected versions and package coordinates differ.
  start_date: 2025-07-18
  end_date: 2025-07-19
  target:
    name: eslint-plugin-prettier
    kind: library
    repo: https://github.com/prettier/eslint-plugin-prettier
  actor:
    name: Third Party
    kind: group
  language: JavaScript
  method:
    cause: social_engineering
    phase: distribution
    motive: remote_code_execution
    transitive: true
  impact:
    types:
    - code_execution
    users: 0
  artifacts:
  - id: eslint-plugin-prettier
    name: eslint-plugin-prettier
    ecosystem: npm
    kind: source_archive
    repo: https://github.com/prettier/eslint-plugin-prettier
    start_date: 2025-07-18
    end_date: 2025-07-19
    versions:
    - 4.2.2
    - 4.2.3
    locations:
    - uri: https://www.npmjs.com/package/eslint-plugin-prettier/v/4.2.2
      role: distribution
    - uri: https://www.npmjs.com/package/eslint-plugin-prettier/v/4.2.3
      role: distribution
    - uri: https://www.npmjs.com/package/eslint-plugin-prettier
      role: mirror
    indicators:
    - kind: file
      value: node-gyp.dll
    - kind: process
      value: rundll32
