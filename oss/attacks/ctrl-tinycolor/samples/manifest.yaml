    The previous unscoped coordinate was incorrect. The official package is @ctrl/tinycolor;
    retrying that coordinate recovered clean 4.1.0 and 4.2.0 from npm and confirmed that affected
    4.1.1 and 4.1.2 were removed.
  - >-
    The hash-resolved Hopper sample is the shared malicious bundle.js payload. jsDelivr retains
    complete 42-file manifests for both removed releases: each consists of the exact 41-file 4.1.0
    tree plus that bundle. All reconstructed member paths, sizes, and SHA-256 values match those
    manifests. The retained package.json is also byte-identical to 4.1.0 and embeds version 4.1.0;
    that unusual upstream state is preserved rather than corrected.
