---
- id: lottie-player
  title: lottie-player compromised via token, crypto theft.
  synopsis: The lottie-player npm package was compromised when attackers gained access
    to a developer's access token. They published three malicious versions (2.0.5,
    2.0.6, 2.0.7) that prompted users to connect their Web3 wallets, enabling theft
    of cryptocurrency assets. The compromised versions were distributed via CDNs,
    affecting users who hadn't pinned specific versions.
