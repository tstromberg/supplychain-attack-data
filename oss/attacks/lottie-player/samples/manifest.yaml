schema_version: 1
interpretation:
  - >-
    The previous unscoped package coordinate was incorrect. The official npm package is
    @lottiefiles/lottie-player. The original incident thread is GitHub issue 254, not the
    nonexistent issue 593 previously cited.
  - >-
    A collaborator on the original incident thread identifies 2.0.4 as safe, the compromised
    releases as 2.0.5 through 2.0.7, and 2.0.8 as a copy of 2.0.4 published to restore the latest
    tag.
  - >-
    The contemporaneous gist linked from that thread preserves one complete malicious browser
    bundle. Complete jsDelivr manifests show that each affected release differs from the exact
    2.0.4 base only in package.json and dist/lottie-player.js. However, the gist's 3,202,418-byte
    bundle matches none of the retained target sizes or SHA-256 values, so it cannot supply the
    missing member for any version and no archive is reconstructed.
