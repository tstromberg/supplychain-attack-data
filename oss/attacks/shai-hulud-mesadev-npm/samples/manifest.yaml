    Forager d4c2240e2dc9 with FORAGER_ALLOW_PARTIAL=1 recovered every Socket-listed member of each
    affected MesaDev release except router_init.js: 67/68 for REST, 283/284 for Saguaro, and 51/52
    for SDK. Each retained jsDelivr manifest identifies the missing member as 2,339,346 bytes with
    SHA-256 2ec78d556d696e208927cc503d48e4b5eb56b31abc2870c2ed2e98d6be27fc96. Forager's hash
    fallback recovered those exact bytes from Triage.
  - >-
    Overlaying that one exact member produces complete trees whose every path, size, and SHA-256
    matches the corresponding retained manifest. The final archives remain RECONSTRUCTED because npm
    pack creates new container bytes and no authoritative original whole-archive digest is
    available. The Forager partial bases are also preserved and explicitly named
    RECONSTRUCTED-PARTIAL.
