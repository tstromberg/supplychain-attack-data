schema_version: 1
interpretation:
  - >-
    Forager d4c2240e2dc9 with FORAGER_ALLOW_PARTIAL=1 recovered 5 of the 7 jsDelivr-listed members
    from each affected @tolka/cli release. The exact initial outputs are retained under during/base/
    and lacked dist/index.js and router_init.js.
  - >-
    The clean @tolka/cli 1.0.1 npm archive is byte-for-byte verified by the registry SHA-1 and
    SHA-512 integrity and by a retained five-member jsDelivr manifest. Its 362,909-byte
    dist/index.js has SHA-256 821c14337df9236b23844fb3b01af2013ffa2a609650b215f24f6bd044b95a64,
    exactly matching the retained affected-version manifests for all five releases.
  - >-
    Adding that exact predecessor member yields six verified members for every affected release. The
    1.0.2 router is the independently recovered
    2ec78d556d696e208927cc503d48e4b5eb56b31abc2870c2ed2e98d6be27fc96 payload and matches the
    affected manifest by SHA-256 and size, closing a complete seven-member 1.0.2 tree.
  - >-
    Releases 1.0.3 through 1.0.6 remain six-member partials because their
    29c729852fce5a53e30a1541d9fec79c915b2e13f1eda94a5978cf0aae0d88d9 and
    d4a2086ea18f5e39cd867b8b06918a524eabb21d45ea98aad07357b98173458a router variants remain
    unavailable after content-addressed and Forager fallback searches.
  - >-
    The complete 1.0.2 tree remains named RECONSTRUCTED because no authoritative digest for the
    removed original npm archive is available. Incomplete trees remain named RECONSTRUCTED-PARTIAL.
    No lifecycle scripts were executed.
