unresolved:
  - artifact_id: getcookies
    phase: during
    version: 1.12.2
    filename: getcookies-1.12.2.tgz
    status: unavailable
    notes:
      - >-
        npm unpublished all three versions on 2018-05-02 and the name now serves only the
        0.0.1-security stub. BSK preserves 1.12.1 and 1.12.3 but marks 1.12.2 as not in its
        collection.
      - >-
        No authoritative digest survives for 1.12.2: the only archived registry.npmjs.org/getcookies
        capture is from 2022-12-25 and already shows the stub.
    attempts:
      - npm registry: version absent from the packument; all configured mirrors also miss it.
      - registry.npmmirror.com, r.cnpmjs.org, registry.yarnpkg.com, mirrors.cloud.tencent.com, mirrors.huaweicloud.com: 404 or NoSuchKey.
      - Wayback: no capture of the tarball path; the packument capture postdates removal.
      - jsDelivr and unpkg: 404
      - Software Heritage: version not archived; two snapshots examined.
      - socket.dev: no files listed for the version.
      - MalwareBazaar, Triage, Malshare: no reported digest exists to query them with.
      - Backstabber's Knife Collection package index marks getcookies 1.12.2 as not in collection.
