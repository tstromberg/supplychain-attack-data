schema_version: 1
interpretation:
  - >-
    npm unpublished getcookies, express-cookies, http-fetch-cookies, and mailparser 2.2.3 in May
    2018 and replaced the names with security-holding stubs. Complete malicious and carrier archives
    have now been recovered from Backstabber's Knife Collection; clean registry stubs are not
    substituted for the removed versions.
  - >-
    The recovered packages are indexed by exact PURL in Backstabber's Knife Collection and their
    embedded package.json metadata and dependency edges verify the chain. The corpus does not
    contain getcookies 1.12.2 or the removed mailparser releases, which remain explicit gaps.
  - >-
    mailparser 2.2.0 remains available from npm with its original integrity metadata and is retained
    as the clean immediate predecessor to the removed 2.2.1 through 2.2.3 carrier releases.
