schema_version: 1
interpretation:
  - >-
    RubyGems yanked malicious 0.0.7. Discoverer Tute Costa published the exact fragment appended to
    strength_checker.rb and preserved the Pastebin response observed on 2019-06-28. The latter is
    stored exactly as published, including its apparently incomplete final wrapper.
  - >-
    A complete 0.0.7 gem was recovered from Backstabber's Knife Collection. Its embedded gemspec,
    publication date, internal checksums, and malicious strength_checker.rb member all verify, but
    the yanked registry no longer exposes an authoritative whole-archive digest, so it is recorded
    as probable-exact. Official clean 0.0.6 and remediated 0.0.8 gems provide comparators.
