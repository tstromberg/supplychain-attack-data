- id: strong-password
  title: strong_password Ruby gem backdoor stole secrets
  synopsis: >-
    strong_password 0.0.7 was published on RubyGems without maintainer control.
    In Rails production, it fetched Pastebin code and installed a cookie-driven RCE backdoor.
  story: |-
    strong_password was compromised before the rest-client incident but exposed the same failure mode. Attackers published version 0.0.7 under the legitimate RubyGems name while the GitHub repository still showed no corresponding project change.

    Tute Costa found the mismatch while reviewing dependency updates. The malicious code had been appended to `lib/strong_password/strength_checker.rb`; it started a thread, waited a random interval, fetched Ruby from Pastebin, and evaluated it only when `Rails.env[0] == "p"`.

    The fetched payload inserted a Rack middleware hook that evaluated Base64 from a crafted `___id` cookie. It also phoned home with host URL data. A password-strength library has no reason to read cookies or fetch executable code, but once loaded into Rails it runs inside the application process.

    The maintainer confirmed the bogus 0.0.7 release was created on June 25, 2019 and that he no longer had ownership in RubyGems. RubyGems yanked the release, locked the publishing account used for the attack, and restored the maintainer.
  start_date: 2019-06-25
  end_date: 2019-06-29
