- id: iolitelabs-vscode-solidity
  title: IoliteLabs Solidity extensions shipped backdoor
  synopsis: >-
    A dormant IoliteLabs Visual Studio Marketplace publisher account was used to update three
    Solidity extensions to version 0.1.8 after nearly eight years of inactivity, with no matching
    source repository commits.
  story: |
    On March 25, 2026, three Visual Studio Code extensions for Solidity
    development from a publisher called IoliteLabs were updated for the first
    time in nearly eight years. The new releases, all marked 0.1.8, replaced
    legitimate Solidity tooling with a backdoor that targeted the wallets,
    seed phrases, and deployment keys typically held by smart-contract
    developers. Together the extensions had roughly 27,500 installs across
    macOS, Windows, and Linux.

    StepSecurity researcher Ashish Kurmi, who reported the activity two days
    later, said the marketplace updates did not match the source repository:
    the GitHub project showed no commits for version 0.1.8. The new VSIX
    bundles had also shrunk and lost their real Solidity functionality, which
    was reduced to hollow command stubs. The actual payload rode in a
    tampered copy of the `pako` compression library bundled inside each
    extension. Where the legitimate `pako@1.0.11` carried SHA-256
    `e7ec4e35...`, the version shipping with the malicious extensions hashed
    to `fcd398ab...`. The injected code used five obfuscation layers,
    including Unicode escapes, bracket property notation, XOR junk variables,
    string reversal, and dependency hiding.

    Behavior split by platform. Both Windows and macOS extensions invoked
    `child_process.exec()` on every VS Code startup through the
    `onStartupFinished` activation event. The Windows path pulled a batch
    dropper from `rraghh.com` and, in a later stage, an MSI installer from
    `oortt.com` disguised as a Chrome updater. The macOS path fetched a
    shell script from `cdn.rraghh.com` and dropped one of two architecture-
    specific stage-two binaries, `doc` for Intel and `doc1` for Apple Silicon.
    Linux loaded the tampered `pako` but the dropper contained no Linux
    branch, so compromised Linux installs never spawned a malicious process.

    The attack worked because it ran from an established publisher account
    with eight years of legitimate history and existing installs, not from a
    new typosquat. Trust was inherited rather than built, and once the
    attacker had the account, the marketplace listing kept its old name while
    its contents became a loader.
