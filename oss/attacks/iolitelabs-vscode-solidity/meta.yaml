- name: iolitelabs-vscode-solidity
  title: IoliteLabs VS Code Solidity Extensions Backdoor
  repo: https://github.com/iolitelabs/vscode-solidity-iolite
  synopsis: >-
    A dormant IoliteLabs Visual Studio Marketplace publisher account was used
    to update three Solidity extensions to version 0.1.8 after nearly eight
    years of inactivity, with no matching source repository commits. The VSIX
    packages replaced the original language-server behavior with startup
    activation and hid the backdoor in a bundled copy of the pako dependency.
    The payload delivered Windows and macOS backdoors with persistence and
    exfiltration behavior; the Linux extension loaded the tampered dependency
    but did not contain an active Linux execution branch. The incident shows how
    dormant publisher accounts and vendored dependencies can hide malicious
    extension code away from the declared entry point.
  start_date: 2026-03-25
  end_date: 2026-03-27
