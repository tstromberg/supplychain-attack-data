- id: better-mc-modpack-series
  title: Better MC modpacks compromised with Fracturiser malware
  campaigns:
  - fracturiser-2023
  synopsis: The CurseForge account for 'Luna Pixel Studios', creators of the very
    popular 'Better MC' modpack series, was compromised. Attackers uploaded malicious
    versions of the modpacks (e.g., BMC3 for Forge 1.19.2). These modpacks either
    directly contained or pulled in dependencies infected with the 'Fracturiser' malware,
    leading to credential theft (Discord, Microsoft, Minecraft) and further malware
    propagation on users' systems.
