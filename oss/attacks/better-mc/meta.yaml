    notes:
    - >-
      The malware that rode inside the Better MC uploads, recorded as its own artifact because
      the modpack files cannot be acquired. A stage 0 jar loads a class named Utility over plain
      HTTP from 85.217.144.130:8080/dl and calls run() on it.
    - >-
      Luna Pixel Studios was infected by testing one of these seed mods, so this is the upstream
      of the Better MC compromise rather than a separate incident.
    - >-
      Modrinth's exact clean DungeonZ 1.0.1 build for Minecraft 1.19.2 is retained as a complete
      comparator for the infected jar with the same embedded mod version and target.
