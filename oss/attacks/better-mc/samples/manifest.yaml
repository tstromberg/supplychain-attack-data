schema_version: 1
interpretation:
  - >-
    The malicious Better MC uploads were archived on CurseForge the moment they were published,
    which is what hid them from the web UI at the time, and they are not served now: the file page
    404s, the forgecdn paths refuse listing, and the site API returns nothing for the project. None
    of the three modpack files could be acquired.
  - >-
    The malware they carried could be. fractureiser's stage 0 survives in a public sandbox corpus
    and matches the SHA-1 the investigation team published, and the team's own decompilation of
    stage 1 is retained beside it. Together they are the executable content of the incident, held
    under their own artifact rather than presented as a modpack file.
  - >-
    Modrinth independently retained the legitimate DungeonZ 1.0.1 build for Minecraft 1.19.2,
    published two days before the infected jar's build timestamp. It matches the embedded identity
    of the infected jar and provides a complete clean comparator for the stage-0 carrier.
