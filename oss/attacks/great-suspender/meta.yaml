---
- id: thegreatsuspender
  title: The Great Suspender Chrome extension hijacked
  synopsis: After original maintainer Dean Oemcke transferred ownership to an anonymous
    buyer in June 2020, the new owner published v7.1.8 to the Chrome Web Store containing
    tracking and remote-code-loading functionality that was never present in the open-source
    repository. The extension intercepted web requests for tracking and ad fraud,
    and could load arbitrary code from a remote server. Google removed it from the
    Chrome Web Store and force-disabled it for users on 2021-02-04; Microsoft pulled
    it from Edge for malware shortly before. Approximately 2 million users were affected.
  start_date: 2020-10-01
  end_date: 2021-02-04
