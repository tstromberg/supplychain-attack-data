interpretation:
  - >-
    The hostile Chrome Web Store CRX is identified by a surviving archive record and a contemporary
    GitHub comment that links the cached Web Store package. The archive host currently denies
    automated retrieval, and the SHA-256 is not present in Hopper or the configured malware
    repositories.
  - >-
    Version 7.1.8 loaded JavaScript dynamically, so a single archived response cannot describe
    everything the server may have delivered to every client. The preserved response is exact for
    the cited Wayback capture and is retained as recovered runtime-payload evidence, not as a
    substitute for the CRX.
