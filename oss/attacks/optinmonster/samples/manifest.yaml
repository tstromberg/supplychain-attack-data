    size: 926
    source:
      url: https://sansec.io/research/optinmonster-supply-chain-attack
      retrieved_at: '2026-09-02T13:00:00Z'
      kind: original_incident_report_fragment
    verification:
      status: verification_material
      basis:
        - measured_sha256
      evidence:
        - retained_report_page_refs_01_sansec_io_html
        - measured_sha256
    notes:
      - >-
        Sansec's indicator block, extracted verbatim from the retained report page. It names the C2
        (tidio.cc at 84.201.6.54, registered 2026-04-28), the separate exfil and payload-generation
        paths for the OptinMonster/TrustPulse and PushEngage variants, the XOR key jX9kM2nP4qR6sT8v,
        the backdoor shell's UI string, the fixed rogue account developer_api1, and the rotating
        plugin disguises.
      - >-
        This is the identifier set to match against, not the payload. It is what would let a future
        capture of the served script be recognised as the malicious one.
      - >-
        Recorded under the non-version version label "Thu Jun 11 2026 20:00:00 GMT-0400 (Eastern
        Daylight Time)" before release identities were normalized; the label is retained here
        because it is not derivable from the version or commit.
