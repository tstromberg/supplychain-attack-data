unresolved:
  - artifact_id: optinmonster
    phase: during
    version: 2026-06-12T00:00:00.000Z
    filename: served CDN JavaScript
    status: unavailable
    notes:
      - >-
        The malicious objects were served for a 25-minute window and then reverted, and the vendor
        CDN hosts are not archived. No digest was published for them, so even a later copy could not
        be verified as exact.
    attempts:
      - Internet Archive CDX for a.omappapi.com and a.trustpulse.com: no captures.
      - >-
        Internet Archive CDX for clientcdn.pushengage.com: 36 captures between 2026-06-12 and
        2026-06-14 were enumerated and the retrievable SDK and service-worker builds checked for
        tidio.cc, the cdn-cgi/pe- paths, and the XOR key; none matched.
      - Internet Archive CDX for tidio.cc: no captures.
