schema_version: 1
interpretation:
  - >-
    Nothing in the three plugins changed. What changed was JavaScript served from Awesome Motive's
    CDN to sites that embed it, for twenty-five minutes on 2026-06-12 between 22:17 and 22:42 UTC
    for the OptinMonster and TrustPulse objects.
  - >-
    The Internet Archive holds no capture of a.omappapi.com or a.trustpulse.com at all, and none of
    clientcdn.pushengage.com inside the window; the C2 host tidio.cc is not archived either. The
    served bytes are therefore not recoverable, and what survives of the payload is the indicator
    set Sansec published.
