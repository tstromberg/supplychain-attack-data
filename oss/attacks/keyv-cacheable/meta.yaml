    name: jaredwray
    kind: maintainer
    repo: https://github.com/jaredwray
    website: https://www.npmjs.com/~jaredwray
  actor:
    name: Unknown
    kind: group
  language: JavaScript
  method:
    cause: compromised_account_credentials
    phase: source
    motive: credential_theft
    transitive: true
  impact:
    types:
    - credential_theft
    - self_propagation
    - data_exfiltration
    - backdoor
  locations:
  - uri: https://www.npmjs.com/package/keyv
    role: distribution
  - uri: https://www.npmjs.com/package/cacheable
    role: distribution
  indicators:
  - kind: file
    value: setup.mjs
  - kind: file
    value: Math_Symbol.js
  - kind: ethereum_contract
    value: '0xE1f2395ee43e45A1556EC6438a88c31B83493103'
  - kind: technique
    value: C2 endpoint retrieved from an Ethereum smart contract at runtime
  - kind: technique
    value: standalone Bun runtime downloaded during preinstall
  - kind: technique
    value: autostart hooks written to .claude and .vscode
  - kind: technique
    value: republishing via npm OIDC trusted publishing
  - kind: malware_family
    value: ChainDrop
  notes:
  - >-
    The malicious versions carry valid provenance. The attacker pushed to main and cut releases
    through GitHub Actions rather than publishing with a stolen npm token, so attestation does
    not distinguish them from legitimate releases.
  - >-
    Counts vary by source and collection time: StepSecurity reported 444 packages and 2,212
    versions in under four hours; other trackers reported 2,234 to 2,236 versions and 400-plus
    packages as the campaign continued.
  - >-
    npm publish times: keyv 6.0.0 at 09:35:00Z, flat-cache 6.1.24 at 10:10:55Z, file-entry-cache
    11.1.6 at 10:13:02Z on 2026-08-04. keyv 6.0.0-rc.1 predates the window, is unclassified by
    every source, and is still served.
  - >-
    The three carriers now return 404. Socket member manifests and Forager gave verified
    member-tree reconstructions for flat-cache and file-entry-cache and six of nine for keyv;
    the synthetic archives stay named RECONSTRUCTED.
