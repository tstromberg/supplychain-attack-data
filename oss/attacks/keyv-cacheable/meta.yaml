  - kind: technique
    value: standalone Bun runtime downloaded during preinstall
  - kind: technique
    value: autostart hooks written to .claude and .vscode
  - kind: technique
    value: republishing via npm OIDC trusted publishing
  - kind: malware_family
    value: ChainDrop
  notes:
  - The malicious versions carry valid provenance. The attacker pushed to the main branch
    and cut releases through GitHub Actions rather than publishing with a stolen npm token,
    so provenance attestation does not distinguish them from legitimate releases.
  - Counts vary slightly by source and collection time. StepSecurity reported 444 packages
    and 2,212 versions in under four hours; other trackers reported 2,234 to 2,236 versions
    and 400-plus packages as the campaign continued.
  - 'npm registry publish times for the three recorded carriers: keyv 6.0.0 at 09:35:00Z,
    flat-cache 6.1.24 at 10:10:55Z, and file-entry-cache 11.1.6 at 10:13:02Z on 2026-08-04.
    keyv 6.0.0-rc.1 was published at 19:21:08Z on 2026-08-03, before the reported window;
    no source classifies it, so it is not recorded as malicious. It also remains served by
    the registry, while the three recorded carriers return 404, which is consistent with
    leaving it unclassified.'
  - keyv 6.0.0, flat-cache 6.1.24, and file-entry-cache 11.1.6 were removed from npm and
    now return 404, so no sample of the malicious tarballs could be acquired. Their
    immediate predecessors, flat-cache 6.1.23 and keyv 5.5.3, are still served.
  - The Ethereum dead-drop lets the operator rotate exfiltration infrastructure without
    redeploying malware. Researchers observed a full C2 reconfiguration through a single
    transaction late on 2026-08-04.
  - Wiz assessed the payload as a descendant of the Mini Shai-Hulud family, sharing
    characteristics with the TeamPCP and AntV campaigns recorded under
    [[shai-hulud-here-we-go-again]].
