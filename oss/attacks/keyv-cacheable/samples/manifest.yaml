schema_version: 1
interpretation:
  - >-
    Socket retains complete nine-member manifests for the three headline ChainDrop carriers. Direct
    partial-mode recovery retrieved every Q-addressed member. The unavailable bodies are marked by
    opaque S content IDs and are never interpreted as hashes.
  - >-
    flat-cache 6.1.24 and file-entry-cache 11.1.6 each recovered eight of nine members directly.
    Their sole unavailable member is Math_Symbol.js with the same Socket S content ID and size as
    keyv 6.0.0. StepSecurity reports that all eleven initial carriers shipped that identical
    727,680-byte second stage, and the retained keyv member matches the SafeDep/OSSF SHA-256
    9fc2570b7cef51c1b8df116d144d11ff4096357be7d2c4c6367cfc2509cf1bcc.
  - >-
    keyv 6.0.0 was reconstructed from its retained six-member capture, the exact malicious release
    source commit, and the checksum-verified 6.0.0-rc.1 npm archive. The rc.1 and malicious release
    have identical library source and build configuration; rebuilding the latter with its pinned
    pnpm 11.18.0 toolchain produced all four compiled/type members byte-identical to rc.1. All nine
    malicious paths are therefore accounted for, but the synthetic gzip does not match the
    authoritative original SHA-1 or SHA-512 and remains visibly named RECONSTRUCTED.
  - >-
    The resulting keyv, flat-cache, and file-entry-cache archives are exact complete member trees,
    but synthetic npm-pack gzip streams. Authoritative original checksums for all three do not match
    their synthetic streams. All three consequently remain visibly named RECONSTRUCTED.
