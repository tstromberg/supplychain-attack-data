schema_version: 1
interpretation:
  - >-
    Forager d4c2240e2dc9 with FORAGER_ALLOW_PARTIAL=1 recovered 1,271 of 1,280 Socket-listed members
    from every affected release. Each initial tree lacked the same eight ordinary assets plus
    router_init.js.
  - >-
    For 0.8.1, the eight ordinary missing assets have the same Socket content IDs and sizes as
    0.8.2. Exact upstream bytes match the retained 0.8.2 jsDelivr SHA-256 values. The 0.8.1 router
    content ID and size are likewise identical to the independently mapped
    2ec78d556d696e208927cc503d48e4b5eb56b31abc2870c2ed2e98d6be27fc96 variant. These nine exact
    overlays produce a complete 1,280-member reconstructed tree.
  - >-
    For 0.8.2 through 0.8.4, retained jsDelivr manifests provide the SHA-256 and size of every
    member. The eight ordinary missing assets were recovered from upstream commit
    e2ad66ba4b64a3471e0b131e550e1e203dfb8ab9 and match exactly. Those archives contain 1,279
    verified members and omit only unavailable router variants.
  - >-
    The complete 0.8.1 tree remains RECONSTRUCTED because no authoritative original whole-archive
    digest is available; 0.8.2 through 0.8.4 remain RECONSTRUCTED-PARTIAL.
