  title: VestaCP build system compromise inserted remote backdoor
  synopsis: Attackers compromised infrastructure related to the Vesta Control Panel,
    allowing them to inject malicious code into update scripts or packages delivered
    to users. The malicious code executed commands, collected server passwords (including
