schema_version: 1
interpretation:
  - >-
    The repository and project are called xrpl.js, but the official npm package
    coordinate is xrpl. Correcting that coordinate exposed both clean release
    lines and all five removed malicious archives.
  - >-
    npm's retained time map establishes 2.14.1 and 4.2.0 as the latest releases
    on their respective lines before the incident, and 2.14.3 and 4.2.5 as the
    first releases after it. It also corrects the first malicious publication
    time to 2025-04-21T20:46:24.710Z.
  - >-
    Wayback preserved original responses for all five removed npm tarball URLs.
    Their package.json files bind the expected names and versions, and each
    archive contains the reported https://0x9c.xyz/xc exfiltration endpoint.
    Without retained npm integrity values, the archived tarballs are marked
    probable_exact rather than exact.
