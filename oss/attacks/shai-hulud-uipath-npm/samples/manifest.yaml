schema_version: 1
interpretation:
  - >-
    Forager d4c2240e2dc9 with FORAGER_ALLOW_PARTIAL=1 recovered 15847 of 16310 Socket-listed members
    across all 66 affected @uipath releases; all missing members have opaque S-prefixed Socket
    content IDs.
  - >-
    All 15847 retained Q-prefixed members were independently checked by path, size, and decoded
    SHA-256 against the 66 archived Socket listings. S-prefixed values are retained only as opaque
    content IDs and are never represented as checksums.
  - >-
    Every listing names the same S3IL router_init.js content ID and 2,339,346-byte size. Adding its
    established Triage bytes initially yielded 19 complete trees and improved 47 others.
  - >-
    Exact clean predecessor archives for ap-chat 1.5.6, apollo-core 5.9.1, and apollo-react 4.24.4
    match authoritative npm SHA-1 and SHA-512 values. Their retained Socket listings differ from the
    malicious releases only at package.json, setup.mjs, and router_init.js. The latter three
    malicious files were already exact, so copying the remaining 73, 108, and 128 identity-stable
    members yields three additional complete trees.
  - >-
    Fifteen further clean predecessor archives match authoritative npm SHA-1 and SHA-512 values. For
    each, the attack tree had exactly one remaining opaque-ID member, and that member has the same
    path, size, and opaque Socket content ID in the retained clean and malicious listings.
    Overlaying those integrity-verified predecessor bytes raises the corpus to 16237 of 16310 exact
    members, with 37 complete trees and 29 partial trees.
  - >-
    The clean predecessor archives for the remaining 29 releases also match authoritative npm SHA-1
    and SHA-512 values. All 73 remaining build-output members match their clean and malicious Socket
    listings on path, size, and opaque content ID, and their exact predecessor bytes complete every
    tree. The corpus therefore accounts for all 16310 listed members across 66 complete trees.
  - >-
    No other opaque S-prefixed build output is overlaid without equivalent independent evidence: the
    same path, size, and content ID in retained manifests plus exact source bytes from an
    integrity-verified archive.
  - >-
    Complete trees remain named RECONSTRUCTED because no authoritative original whole-archive digest
    is available; incomplete trees are named RECONSTRUCTED-PARTIAL.
