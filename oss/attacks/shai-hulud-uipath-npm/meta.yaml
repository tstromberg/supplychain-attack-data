- id: shai-hulud-uipath-npm
  title: UiPath npm packages carried Shai-Hulud
  campaigns:
  - shai-hulud-here-we-go-again
  synopsis: JFrog listed 66 UiPath npm packages in the May 2026 Shai-Hulud wave. This
    record scopes those artifacts to their own official distribution surface.
  story: |-
    This record keeps the UiPath npm package scope separate from the broader campaign. The affected artifacts were listed by JFrog as part of the May 2026 Shai-Hulud wave and are modeled here as one compromised trust boundary.

    The campaign page carries the shared TeamPCP tooling, infrastructure, and propagation behavior. This attack record preserves the package names, versions, and registry distribution paths security teams need for inventory and exposure checks.
  start_date: '2026-05-11'
  end_date: '2026-05-12'
  target:
    name: UiPath
    kind: library
  actor:
    name: TeamPCP
    kind: group
  language: JavaScript
  method:
    cause: compromised_account_credentials
    phase: distribution
    motive: credential_theft
    transitive: true
  impact:
    types:
    - credential_theft
    - self_propagation
    users: 0
  notes:
  - Minimal campaign-linked record created to keep Shai-Hulud package evidence scoped
    by vendor, organization, maintainer account, or package distribution surface.
