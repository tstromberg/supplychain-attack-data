schema_version: 1
interpretation:
  - >-
    npm removed all four malicious releases, but jsDelivr retains complete file manifests.
    Comparison with the three exact predecessor archives accounts for every target member, and exact
    or derivable package.json bytes match each retained SHA-256. The four complete trees are
    therefore reconstructed below; their synthetic containers are not the original npm tarballs.
  - >-
    Versions 8.10.1, 9.1.1, and 10.1.7 contain the shared install.js and first-stage Scavenger
    node-gyp.dll. The retained 10.1.6 manifest contains neither payload file: it only changes
    package.json to add an install hook pointing at the absent install.js. The reconstruction
    preserves that apparently broken published tree and does not inject campaign files into it.
  - >-
    The three release branches are represented by clean immediately preceding versions and the first
    fixed versions published after the incident.
