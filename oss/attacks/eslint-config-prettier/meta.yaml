      role: distribution
    - uri: https://www.npmjs.com/package/eslint-config-prettier/v/9.1.1
      role: distribution
    - uri: https://www.npmjs.com/package/eslint-config-prettier/v/10.1.6
      role: distribution
    - uri: https://www.npmjs.com/package/eslint-config-prettier/v/10.1.7
