- id: eslint-config-prettier
  title: eslint-config-prettier phishing shipped malware
  campaigns:
  - npnjs-scam-npm-2025
  synopsis: >-
    A phishing campaign targeting npm maintainers through the typosquatted npnjs.com domain
    compromised eslint-config-prettier.
  story: |-
    eslint-config-prettier was one of the first visible packages hit by the July 2025 `npnjs.com` phishing campaign. The attacker did not change the GitHub repository. They used stolen npm publishing credentials.

    Four malicious versions appeared on npm without matching source commits: 8.10.1, 9.1.1, 10.1.6, and 10.1.7. That gap was the signal. The registry showed fresh releases; the project history did not.

    The package executed an install script on Windows and attempted to launch `node-gyp.dll` through `rundll32`. That gave the attack code execution during dependency installation, a path commonly reached by CI and developer workstations before anyone reviews runtime behavior.

    The maintainer revoked the compromised token, rotated credentials, deprecated the malicious releases, and coordinated removal with npm. The campaign record covers the broader phishing wave; this record anchors the high-download Prettier tooling package.
  start_date: 2025-07-18
  end_date: 2025-07-19
  target:
    name: eslint-config-prettier
    kind: library
    repo: https://github.com/prettier/eslint-config-prettier
  actor:
    name: Third Party
    kind: group
  language: JavaScript
  method:
    cause: social_engineering
    phase: distribution
    motive: remote_code_execution
    transitive: true
  impact:
    types:
    - code_execution
    users: 5000000
  artifacts:
  - id: eslint-config-prettier
    name: eslint-config-prettier
    ecosystem: npm
    kind: source_archive
    repo: https://github.com/prettier/eslint-config-prettier
    start_date: 2025-07-18
    end_date: 2025-07-19
    versions:
