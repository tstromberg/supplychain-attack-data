---
- id: eslint-config-prettier
  title: npm Phishing Campaign Targets Prettier Tooling
  campaigns:
  - npnjs-scam-npm-2025
  synopsis: A phishing campaign targeting npm maintainers through the typosquatted
    npnjs.com domain compromised eslint-config-prettier. The attacker added a malicious
    npm token to maintainer JounQin's account and published eslint-config-prettier
    8.10.1, 9.1.1, 10.1.6, and 10.1.7 directly to npm without matching GitHub source
    changes. The malicious package executed install.js during installation and, on
    Windows hosts, launched bundled node-gyp.dll with rundll32. NVD assigned CVE-2025-54313
    to the eslint-config-prettier compromise. Related packages from the same campaign
    are tracked separately in their own records.
  start_date: 2025-07-18
  end_date: 2025-07-19
