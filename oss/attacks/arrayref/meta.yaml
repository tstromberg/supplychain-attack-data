  notes:
  - >-
    crates.io deletes malicious releases rather than yanking them, and its API and CDN then
    answer 403. All four crate files were recovered from regional mirrors, each digest matching
    the cksum in the crates.io-index git history.
  - >-
    The clean decoy proc-macro1 1.0.106 was not held by any mirror that was asked and remains
    unrecovered.
  - >-
    No remediated release exists for any of the three legitimate crates. crates.io restored the
    prior versions by reversing the attacker's yanks, so the remediated state is byte-identical
    to the before samples.