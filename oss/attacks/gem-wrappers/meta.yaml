---
- id: gem-wrappers
  title: gem-wrappers gem backdoored during RubyGems.org platform compromise
  synopsis: During a platform-level compromise of RubyGems.org (exploiting server
    vulnerabilities), attackers gained root filesystem access and replaced the legitimate
    'gem-wrappers' gem file (v1.1.0) with a malicious version. This trojaned version,
    with malicious code inserted into 'gemutils.rb', contained obfuscated code (using
    eval(Zlib::Inflate.inflate(Base64.decode64(...)))) that acted as a backdoor. The
    backdoor listened on UDP port 53, accepted clear text commands, and allowed remote
    command execution via eval() on systems that installed or updated to the compromised
    gem during the incident window.
