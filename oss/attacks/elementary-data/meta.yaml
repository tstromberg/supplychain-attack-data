---
- id: elementary-data
  title: elementary-data PyPI and GHCR Forged Release
  synopsis: An attacker exploited a GitHub Actions script-injection flaw in elementary-data's
    issue-update workflow to forge release state, tag v0.23.3 at an orphan commit,
    and dispatch the legitimate release pipeline. That pipeline published elementary-data==0.23.3
    to PyPI and pushed compromised GHCR images tagged 0.23.3 and latest. The artifacts
    used a Python .pth file to execute at interpreter startup, unpack a multi-stage
    credential stealer, collect local, cloud, container, Kubernetes, package-manager,
    wallet, and system secrets, and exfiltrate them as trin.tar.gz.
  start_date: 2026-04-24
  end_date: 2026-04-25
