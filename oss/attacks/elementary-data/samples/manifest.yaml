schema_version: 1
interpretation:
  - >-
    GitHub still serves malicious commit b1e4b1f3aad0d489ab0e9208031c67402bbb8480 by exact object ID
    even though it is unreachable from advertised refs. The commit adds the 246,691-byte
    elementary.pth payload and changes pyproject.toml from 0.23.2 to 0.23.3 while adding that file
    to Poetry's package set.
  - >-
    The repository's release workflow builds with `python -m build --sdist --wheel --outdir dist .`.
    Running its sdist portion against that exact commit produced a 1,384,600-byte archive with
    BLAKE2b-256 2211e4da100e382242b5e00e60f9da48fe9927b31c8fa4ea331162c137321feb. PyPI Inspector's
    retained URL embeds the same BLAKE2b-256 as the content-addressed storage path for
    elementary-data-0.23.3.tar.gz, proving the rebuilt bytes are the published sdist exactly.
  - >-
    Because byte identity is proven, this sample uses the ordinary published filename rather than a
    RECONSTRUCTED label. The original PyPI CDN object now returns 404; the exact build procedure and
    independent digest comparison are retained here and in the provenance sidecar.
