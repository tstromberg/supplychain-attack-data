---
- id: intercom-client
  title: Intercom Node.js SDK Compromise (Mini Shai-Hulud)
  campaigns:
  - teampcp-2026
  synopsis: The Mini Shai-Hulud/TeamPCP campaign compromised the official intercom-client
    package on npm. The malicious 7.0.4 release was published on April 30, 2026 at
    14:41 UTC via a hijacked GitHub Actions OIDC publishing pipeline and introduced
    a preinstall hook, setup.mjs loader, and 11.7 MB obfuscated router_runtime.js
    payload. The payload used Bun v1.3.13, daemonized itself, harvested GitHub, npm,
    AWS, GCP, Azure, private-key, and generic API credentials, exfiltrated via GitHub
    private repositories under victim accounts, and attempted worm-style propagation
    through stolen npm publishing tokens.
