- id: visanduma-nova-two-factor
  title: Visanduma development branches distributed PolinRider loaders
  synopsis: >-
    A compromised Visanduma developer account introduced malware into nova-two-factor development
    branches distributed through Packagist. Socket identified four affected development versions and
    no malicious stable release.
  story: |
    A package used to add two-factor authentication to Laravel Nova became a distribution route for
    malware through its development branches. Socket researcher Karlo Zanki reported malicious code
    in visanduma/nova-two-factor on September 17, tracing the source changes to a compromised
    Visanduma developer account. The finding concerned development versions, with no malicious
    stable release identified.

    Packagist made those branches available through Composer under names such as dev-main. Consumers
    following development code could therefore receive an upstream change without a new numbered
    release. Socket listed dev-main, dev-nova4support, dev-using-inertia, and dev-nova5 as affected.
    The registry was a route from compromised source to consumers, rather than evidence of a
    separate Packagist account takeover.

    Socket identified altered Tailwind configuration among the payload files and associated the
    intrusion with PolinRider. Such JavaScript configuration can execute when frontend tooling loads
    it, giving a PHP project's development process an additional attack surface. The report placed
    the Visanduma compromise in mid-June, but did not provide a precise initial date.

    By the October 30 review, Packagist had frozen the package and explicitly flagged all four
    development versions as malware. That registry response supplied a concrete containment measure,
    but did not establish that affected checkouts or developers' machines had been cleaned. The
    package's cumulative downloads did not measure use of the poisoned branches, and the attacker's
    reach into private projects remained unknown.
  pull_quote:
    text: >-
      Consumers following development code could therefore receive an upstream change without a new
      numbered release.
    caption: Development branches were a distribution route
    after: 2
  target:
    name: Visanduma
    kind: project_organization
    repo: https://github.com/visanduma/nova-two-factor
  method:
    phase: source
    cause: compromised_account_credentials
  artifacts:
    - id: nova-two-factor
      name: visanduma/nova-two-factor
      package: visanduma/nova-two-factor
      ecosystem: packagist
      kind: source_archive
      versions:
        - dev-main
        - dev-nova4support
        - dev-using-inertia
        - dev-nova5
      indicators:
        - kind: file_sha256
          value: tailwind.config.js 7d47c430e6e404dc2fa8b4837678d1cbdb4d0aeacec9b405655cab79d54a2ad9
  references:
    - url: https://socket.dev/blog/polinrider-github-packagist
      title: PolinRider Spreads Through Compromised GitHub Accounts and Packagist
    - url: https://packagist.org/packages/visanduma/nova-two-factor
      title: Nova Two Factor package status and documentation
    - url: https://packagist.org/packages/visanduma/nova-two-factor/filter-lists/malware/
      title: Packagist malware reports for four development versions
  notes:
