- id: bitwarden-cli
  title: Bitwarden CLI hit by Shai-Hulud
  synopsis: >-
    The official Bitwarden CLI npm package (@bitwarden/cli) version 2026.4.0 was compromised
    during the broader Checkmarx/TeamPCP supply-chain campaign after attackers abused a GitHub
    Actions path in Bitwarden's CI/CD pipeline.
  story: |-
    On April 22, 2026, the official command-line client for the password
    manager Bitwarden briefly shipped a credential stealer on npm, drawn
    into the same TeamPCP supply-chain campaign that researchers at
    Checkmarx had been tracking across the JavaScript ecosystem that
    week.

    Bitwarden distributes its CLI as `@bitwarden/cli`, a tool used by
    developers and CI pipelines to script vault access. Version
    2026.4.0 of that package, published from Bitwarden's own build
    pipeline, carried malicious JavaScript inside `bw1.js`. The
    affected surface is narrow: the npm package, not the Bitwarden
    desktop or web clients, and not customer vault data. Bitwarden
    said it found no evidence that end-user vaults were accessed.

    The payload was a near-direct match for the Checkmarx/TeamPCP
    toolchain documented elsewhere in the campaign. It used the same
    `audit.checkmarx.cx` telemetry endpoint, the same string-scrambling
    style, and the same embedded routines for stealing GitHub Actions
    tokens, injecting workflows, and republishing npm packages from
    stolen credentials. Socket described the bw1.js loader as carrying
    the same npm propagation logic that drove the rest of the wave.

    Because npm packages can run install-time scripts, the malware did
    not need a developer to launch the CLI to act. It could read
    GitHub Actions runner memory, scrape environment variables, lift
    cloud and npm credentials, and use whatever publishing rights it
    found to seed the next round of compromised packages.

    Bitwarden pulled the release, rotated the access used to push it,
    and deprecated 2026.4.0 on npm. The window of exposure was short,
    but anyone whose CI installed `@bitwarden/cli` during it should
    treat the host as having had its environment read by an attacker
    operating against the broader Checkmarx campaign infrastructure.
  start_date: 2026-04-22
  end_date: 2026-04-23
  target:
    name: bitwarden-cli
    kind: application
    repo: https://github.com/bitwarden/clients
  actor:
    name: TeamPCP
    kind: group
  language: JavaScript
  method:
    cause: ci_cd_exploit
    phase: ci_cd
    motive: credential_theft
    transitive: true
  impact:
    types:
    - credential_theft
    - self_propagation
  artifacts:
  - id: bitwarden-cli
    name: bitwarden-cli
    ecosystem: npm
    kind: source_archive
    repo: https://github.com/bitwarden/clients
    start_date: 2026-04-22
    end_date: 2026-04-23
    versions:
    - 2026.4.0
    locations:
    - uri: https://www.npmjs.com/package/@bitwarden/cli/v/2026.4.0
      role: distribution
    indicators:
    - kind: file
      value: bw1.js
    - kind: url
      value: https://audit.checkmarx.cx/v1/telemetry
    - kind: observable
      value: ip:94.154.172.43
    - kind: observable
      value: path:/tmp/tmp.987654321.lock
    - kind: observable
      value: path:/tmp/_tmp_<Unix Epoch Timestamp>/
    - kind: file
      value: package-updated.tgz
  references:
  - url: https://socket.dev/blog/bitwarden-cli-compromised
    title: Bitwarden CLI compromised in ongoing Checkmarx supply chain campaign
  - url: https://unit42.paloaltonetworks.com/monitoring-npm-supply-chain-attacks/
    title: The npm threat landscape
