---
- id: bitwarden-cli
  title: Bitwarden CLI Compromise (Shai-Hulud V3)
  campaigns:
  - teampcp-2026
  synopsis: The official Bitwarden CLI npm package (@bitwarden/cli) version 2026.4.0
    was compromised during the broader Checkmarx/TeamPCP supply-chain campaign after
    attackers abused a GitHub Actions path in Bitwarden's CI/CD pipeline. The malicious
    package included a bw1.js payload that shared infrastructure with the Checkmarx
    campaign, harvested GitHub, npm, cloud, SSH, environment, Claude, and MCP credentials,
    exfiltrated to audit.checkmarx.cx and GitHub commit-based dead drops, and attempted
    npm/GitHub supply-chain propagation with injected install hooks and workflow files.
  start_date: 2026-04-22
  end_date: 2026-04-23
  target:
    name: bitwarden-cli
    kind: application
    repo: https://github.com/bitwarden/clients
  actor:
    name: Advanced Persistent Threat
    kind: group
  language: JavaScript
  method:
    cause: ci_cd_exploit
    phase: ci_cd
    motive: credential_theft
    transitive: true
  impact:
    types:
    - credential_theft
    - self_propagation
    users: 100000
  artifacts:
