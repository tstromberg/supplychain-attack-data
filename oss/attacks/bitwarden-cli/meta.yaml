- id: bitwarden-cli
  title: Bitwarden CLI hit by Shai-Hulud
  campaigns:
  - teampcp-2026
  synopsis: >-
    The official Bitwarden CLI npm package (@bitwarden/cli) version 2026.4.0 was compromised
    during the broader Checkmarx/TeamPCP supply-chain campaign after attackers abused a GitHub
    Actions path in Bitwarden's CI/CD pipeline.
  story: |-
    Bitwarden CLI was hit through its npm delivery path. On April 22, 2026, version 2026.4.0 of `@bitwarden/cli` briefly carried malicious JavaScript in the package contents. The record is narrow: the CLI package on npm was affected, not Bitwarden vault data.

    The payload appeared in `bw1.js` and matched the Checkmarx/TeamPCP toolchain. It used the same `audit.checkmarx.cx` telemetry endpoint, the same style of scrambled strings, and the same embedded machinery for token theft, workflow injection, and npm republishing.

    The installer path mattered. The package could run through npm lifecycle behavior, scrape GitHub Actions runner memory and environment data, collect cloud and npm credentials, and use stolen publishing rights to push the campaign into more packages.

    Bitwarden contained the release, revoked compromised access, and deprecated the affected npm version. The useful boundary is precise: people outside the short npm distribution window were not affected, and Bitwarden reported no evidence that end-user vault data was accessed.
  start_date: 2026-04-22
  end_date: 2026-04-23
  target:
    name: bitwarden-cli
    kind: application
    repo: https://github.com/bitwarden/clients
  actor:
    name: TeamPCP
    kind: group
  language: JavaScript
  method:
    cause: ci_cd_exploit
    phase: ci_cd
    motive: credential_theft
    transitive: true
  impact:
    types:
    - credential_theft
    - self_propagation
  artifacts:
  - id: bitwarden-cli
    name: bitwarden-cli
    ecosystem: npm
    kind: source_archive
    repo: https://github.com/bitwarden/clients
    start_date: 2026-04-22
    end_date: 2026-04-23
    versions:
    - 2026.4.0
    locations:
    - uri: https://www.npmjs.com/package/@bitwarden/cli/v/2026.4.0
      role: distribution
    indicators:
    - kind: file
      value: bw1.js
    - kind: url
      value: https://audit.checkmarx.cx/v1/telemetry
    - kind: observable
      value: ip:94.154.172.43
    - kind: observable
      value: path:/tmp/tmp.987654321.lock
    - kind: observable
      value: path:/tmp/_tmp_<Unix Epoch Timestamp>/
    - kind: file
      value: package-updated.tgz
  references:
  - url: https://socket.dev/blog/bitwarden-cli-compromised
    title: Bitwarden CLI compromised in ongoing Checkmarx supply chain campaign
  - url: https://unit42.paloaltonetworks.com/monitoring-npm-supply-chain-attacks/
    title: The npm threat landscape
