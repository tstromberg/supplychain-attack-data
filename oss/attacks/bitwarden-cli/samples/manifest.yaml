schema_version: 1
interpretation:
  - >-
    The previous unscoped PURL was incorrect. The compromised official package
    was @bitwarden/cli@2026.4.0. Bitwarden confirms that its npm delivery path
    served the malicious release for 93 minutes on April 22, 2026; the company
    found no impact to the legitimate source repository or other products.
  - >-
    The original tarball has been removed. jsDelivr retains a complete nine-file
    manifest for 2026.4.0. Four members differ from the exact 2026.3.0 base: two
    added malicious files, modified package.json, and a one-byte change to build/bw.js.
    Every other member, including the no-longer-retrievable WebAssembly file, has the
    same retained SHA-256 as the clean base. Those facts permit a complete
    member-for-member tree reconstruction, but not recovery of the original npm
    tarball bytes. Ossprey later published the original tarball's SHA-256; it does not
    match the synthetic archive, confirming that the reconstructed filename must remain.
  - >-
    The recovered package.json adds a preinstall hook and redirects the bw CLI
    binary to bw_setup.js. That setup file installs Bun and launches bw1.js.
    The 10,154,904-byte bw1.js is the payload Socket analyzed; all three files
    match jsDelivr's retained content hashes and Socket's manifest sizes.
