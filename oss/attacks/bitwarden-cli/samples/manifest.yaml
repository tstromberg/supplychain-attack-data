unresolved:
  - artifact_id: bitwarden-cli
    phase: during
    coordinate: pkg:npm/%40bitwarden/cli@2026.4.0
    status: original_distribution_unavailable_tree_reconstructed
    attempts:
      - npm removed the malicious version record and original tarball.
      - Wayback Machine has no capture of the original tarball URL.
      - unpkg returns 404 for the removed version.
      - Software Heritage does not retain version 2026.4.0.
      - >-
        jsDelivr lists 11 files and serves the three decisive malicious files,
        but its advertised build/0267f925739a02ab7f0e.module.wasm returns 404.
      - >-
        Socket lists the same 11 files and content mappings, but its copy of
        that WebAssembly member returns HTTP 400. Strict Forager reconstruction
        rejected and removed the incomplete archive.
      - >-
        On 2026-08-11 the retained jsDelivr manifest hash for that WebAssembly
        member was found to match the exact 2026.3.0 base, allowing a complete
        tree reconstruction without retrieving the member again.
      - >-
        Ossprey published SHA-256
        99ac962005550130398d55af2527d839e73489bc7911e7c2c37474d979aaf43f for the
        original package tarball. The synthetic archive hashes to
        ac71803ababd0dd6f33d5f441ff99d2427939dc0c3435d91afd0d7a61ab0a105, so it is
        complete at the member-tree level but is not byte-for-byte identical.
    last_attempted_at: '2026-08-11T15:42:38Z'
