schema_version: 1
interpretation:
  - >-
    npm removed all ten affected versions on 2026-08-29. registry.npmmirror.com retained every
    tarball, and npm's own retained dist.shasum and signed dist.integrity values for those versions
    still verify the mirrored bytes, so each affected release is exact rather than reconstructed.
  - >-
    The eight stable affected releases each carry an identical 828-byte binding.gyp (SHA-256
    d3246926b20a8d021ed7de0ac8e9eee1dda986088f84ba18f31cb2042a121f5d) and a per-version
    3FWCvzduYZg.js loader between 4.4 MB and 6.4 MB. The four wave-2 releases additionally declare
    "preinstall": "node 3FWCvzduYZg.js"; the four wave-1 releases declare no install script and rely
    on node-gyp reading binding.gyp.
  - >-
    The two 0.0.0-* prereleases are carriers, not payload archives. Each ships only an
    attacker-modified package.json whose preinstall hook invokes is_it_this_simple.js or nu.js, and
    neither script is present in the published files, so an install of either prerelease would fail
    before executing anything.
