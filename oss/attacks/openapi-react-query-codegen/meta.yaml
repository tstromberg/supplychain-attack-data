  notes:
  - >-
    The eight stable versions were acquired from registry.npmmirror.com after npm removed them.
    Each archive's SHA-1 and SHA-512 match npm's retained dist.shasum and signed dist.integrity.
  - >-
    Every loader and binding.gyp digest recorded here was measured from those archives rather than
    copied from a report; published reports gave no loader hash for 2.2.1 or 3.0.3.
  - >-
    The two 0.0.0-* prereleases ship only an attacker-modified package.json. The scripts their
    preinstall hooks name are absent from the published files, so neither could execute on install.
  - >-
    npm's timestamps place four stable releases seconds ahead of the workflow's own prerelease in
    each wave, consistent with the payload publishing from inside the job during pnpm install.
