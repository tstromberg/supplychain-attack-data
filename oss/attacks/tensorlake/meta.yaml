- id: tensorlake
  title: Tensorlake npm release ran a credential-stealing worm
  synopsis: >-
    The official tensorlake 0.5.144 npm release added a preinstall loader. Installing the SDK with
    lifecycle scripts enabled launched a worm that stole credentials and attempted further
    propagation.
  start_date: '2026-10-07'
  target:
    name: Tensorlake
    kind: library
    repo: https://github.com/tensorlakeai/tensorlake
  method:
    phase: source
    cause: compromised_account_credentials
  artifacts:
    - id: tensorlake
      name: tensorlake
      package: tensorlake
      ecosystem: npm
      kind: source_archive
      versions:
        - 0.5.144
      start_date: '2026-10-08'
      fixed_versions:
        - 0.5.145
      hashes:
        - sha1:843a898ab72793568d77c53ff9282e6ce7c66aea
    - id: tensorlake-source
      name: tensorlakeai/tensorlake
      kind: revision_control_system
      ecosystem: github
      repo: https://github.com/tensorlakeai/tensorlake
      commits:
        - e65ed94ac9d3443a5cb899fb6631a82bcd31b733
      locations:
        - uri: >-
            https://github.com/tensorlakeai/tensorlake/commit/e65ed94ac9d3443a5cb899fb6631a82bcd31b733
          role: distribution
  references:
    - url: https://socket.dev/blog/tensorlake-compromise
      title: TensorLake npm SDK Compromised in ChainDrop Shai-Hulud Credential-Stealing Attack
    - url: https://safedep.io/tensorlake-npm-compromise-mini-shai-hulud/
      title: tensorlake 0.5.144 npm Compromise Ships Mini Shai-Hulud
  language: JavaScript
  impact:
    types:
      - credential_theft
      - remote_code_execution
  notes:
    - >-
      The attacker committed the payload through a repository administrator account on October 7,
      then invoked the legitimate release workflow. npm trusted publishing released the poisoned
      source on October 8.
