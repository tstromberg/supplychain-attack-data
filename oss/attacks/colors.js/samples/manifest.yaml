interpretation:
  - >-
    The sabotaged lib/index.js was recovered from Hopper on 2026-09-03 and is held as a payload_only
    member. A corroboration note under this record's unresolved entries reports ReversingLabs
    recognising its digest as pkg:pypi/super-ec2, which is wrong: the file fetched under that digest
    is 642 bytes of colors.js source containing the require of ../lib/custom/american and the for
    (let i = 666; i < Infinity; i++) loop. Treat that Spectra attribution as a mis-identification
    rather than as evidence about this artifact.
