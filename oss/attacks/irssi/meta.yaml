- name: irssi
  title: Irssi configure script backdoored
  repo: https://github.com/irssi/irssi
  synopsis: The irssi.org server was cracked, and the official Irssi 0.8.4 source distribution served a modified configure script for about two months. The backdoor compiled into builds made from the poisoned archive and allowed remote access through IRC-triggered behavior. The project disclosed the compromise, restored the site, and released Irssi 0.8.4a with a clean configure script.
  start_date: 2002-03-14
  end_date: 2002-05-25
