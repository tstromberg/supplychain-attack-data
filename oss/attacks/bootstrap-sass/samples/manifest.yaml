schema_version: 1
interpretation:
  - >-
    The exact malicious 3.2.0.3 gem was recovered by its published SHA-256
    from Hopper. The original reporter independently preserved the complete
    backdoor fragment from lib/active-controller/middleware.rb.
  - >-
    The attacker yanked clean predecessor 3.2.0.2 before publishing 3.2.0.3.
    RubyGems no longer serves that gem, so the before sample is the immutable
    official v3.2.0+2 release commit as a source-tree substitute. Clean 3.2.0.4
    is preserved as the official remediated RubyGems archive.
