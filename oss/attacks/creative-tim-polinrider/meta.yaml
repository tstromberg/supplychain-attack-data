- id: creative-tim-polinrider
  title: Creative Tim dashboard repositories carried PolinRider loaders
  synopsis: >-
    Four Creative Tim dashboard repositories contained malicious JavaScript at their default branch
    tips. The loaders used Ethereum transactions to resolve infrastructure for credential-stealing
    payloads.
  target:
    name: Creative Tim
    kind: project_organization
    repo: https://github.com/creativetimofficial
  method:
    phase: source
  artifacts:
    - id: black-dashboard-django
      name: black-dashboard-django
      kind: revision_control_system
      ecosystem: github
      repo: https://github.com/creativetimofficial/black-dashboard-django
      commits:
        - f55a30c353e1d7b06ff169cd7dd2595a2962b736
      locations:
        - uri: >-
            https://github.com/creativetimofficial/black-dashboard-django/blob/f55a30c353e1d7b06ff169cd7dd2595a2962b736/postcss.config.js
          role: distribution
    - id: argon-dashboard-django
      name: argon-dashboard-django
      kind: revision_control_system
      ecosystem: github
      repo: https://github.com/creativetimofficial/argon-dashboard-django
      commits:
        - f3c0a8f8b7f3b2051c9366d044d4054cca643560
      locations:
        - uri: >-
            https://github.com/creativetimofficial/argon-dashboard-django/blob/f3c0a8f8b7f3b2051c9366d044d4054cca643560/apps/static/assets/vendor/bootstrap-datetimepicker.js
          role: distribution
    - id: material-dashboard-django
      name: material-dashboard-django
      kind: revision_control_system
      ecosystem: github
      repo: https://github.com/creativetimofficial/material-dashboard-django
      commits:
        - fab45b237af2a97f40d980a4a36febd96a382505
      locations:
        - uri: >-
            https://github.com/creativetimofficial/material-dashboard-django/blob/fab45b237af2a97f40d980a4a36febd96a382505/postcss.config.js
          role: distribution
    - id: argon-dashboard-flask
      name: argon-dashboard-flask
      kind: revision_control_system
      ecosystem: github
      repo: https://github.com/creativetimofficial/argon-dashboard-flask
      commits:
        - 0ca599415baae8a2653e548eceb7c96255100485
      locations:
        - uri: >-
            https://github.com/creativetimofficial/argon-dashboard-flask/blob/0ca599415baae8a2653e548eceb7c96255100485/apps/static/assets/vendor/bootstrap-datetimepicker.js
          role: distribution
  references:
    - url: https://safedep.io/polinrider-ethereum-c2-github-repositories/
      title: PolinRider Switches to Ethereum C2 in 30+ Repositories
  notes:
    - >-
      SafeDep confirmed the infected branch tips on September 30. Last-push dates and forged commit
      timestamps do not establish the first malicious distribution date.
  impact:
    types:
      - credential_theft
