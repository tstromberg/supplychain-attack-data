schema_version: 1
interpretation:
  - >-
    reworm was never republished to npm during the compromise, so the affected distribution is the
    GitHub repository state. The unit of collection is the immutable git object: the package.json
    blob carrying the Glassworm payload and the commit that force-pushed it.
  - >-
    The commit preserves the author identity, message, and author date of a genuine 2020 Dependabot
    commit; only the committer date, 2026-03-07, records the rewrite. That is the campaign's
    signature and the reason a git log review missed it.
