    notes:
    - Aikido cited 1,460 GitHub stars for reworm as exposure context, not a confirmed
      victim count.
    - The hash is the exact Git commit object ID, not a generated source-archive
      checksum. GitHub's commit API retains the object and shows the invisible-Unicode
      decoder and payload added to package.json.
    - The commit reuses a 2020 Dependabot message and author date as camouflage. Its
      presence in the March 2026 attack was established by the contemporaneous Aikido
      report and discussion; the embedded author timestamp is not the attack date.
