- name: pear
  title: PEAR PHP installer go-pear.phar compromised on server
  synopsis: The official go-pear.phar installer on pear.php.net was replaced with a malicious version and left in place for roughly six months. Anyone bootstrapping PEAR from the trusted server risked executing a backdoored installer, a thin bootstrap script turned into a long-lived foothold.
  start_date: 2018-06-20 # Estimated start based on file timestamp (may vary)
  end_date: 2019-01-19
