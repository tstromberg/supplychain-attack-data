schema_version: 1
interpretation:
  - >-
    PEAR told users to compare the tainted official-site installer with the same release in
    pear/pearweb_phars, which was unaffected. The immutable 1.10.7 file is therefore the intended
    clean comparator even though its Git commit falls inside the broad, approximate
    infrastructure-compromise window.
  - >-
    A requested January 19 Wayback replay redirected to a February 20 capture whose bytes are
    identical to this clean 1.10.7 GitHub file. It is corroborating clean evidence, not a recovered
    poisoned installer.
