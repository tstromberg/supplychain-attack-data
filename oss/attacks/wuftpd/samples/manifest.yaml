    notes:
      - >-
        The password predicate restored to its trojanized form: the real check is conjoined with
        strcmp(passwd, "NULL"), so the literal password NULL makes the failure branch unreachable
        for every account.
      - >-
        The preserved evidence alone is not loadable source. This is src/ftpd.c as the victim would
        have received it, so the payload is analysable in the file that gives it effect.
      - >-
        Only this member is carried: the incident altered no other file, and the rest of the release
        is already represented by the clean baseline in this manifest.
