schema_version: 1
interpretation:
  - >-
    The WU-FTPD project's preserved attic contains clean 2.2 and 2.3 source distributions, but its
    entries named for the 2.2 Trojan are only 1,951-byte wish-list notices stating that the project
    did not possess the bad archive. CERT's exact authentication diff is therefore preserved as
    malicious payload evidence. The 2.3 .tar.Z is byte-identical to the remediation archive named
    and checksummed in CERT's original April 6 advisory.
