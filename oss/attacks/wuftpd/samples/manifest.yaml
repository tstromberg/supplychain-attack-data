schema_version: 1
interpretation:
  - >-
    The WU-FTPD project's preserved attic contains clean 2.2 and 2.3 source distributions, but its
    entries named for the 2.2 Trojan are only 1,951-byte wish-list notices stating that the project
    did not possess the bad archive. CERT's exact authentication diff is therefore preserved as
    malicious payload evidence. The 2.3 .tar.Z is byte-identical to the remediation archive named
    and checksummed in CERT's original April 6 advisory.
samples:
  - artifact_id: wuftpd
    phase: before
    classification: clean
    version: '2.2'
    filename: wu-ftpd-2.2.tar.gz
    path: wuftpd/before/wu-ftpd-2.2.tar.gz
    sha256: 7404ce43572f614d7ceb2f019149e8085143a60c2a3b3a364a8e3bcc80bde65e
    size: 112045
    source:
      url: https://ftp.gwdg.de/pub/misc/wu-ftpd/ftp.wu-ftpd.org/wu-ftpd-attic/wu-ftpd-2.2.tar.gz
      retrieved_at: '2026-08-09T21:41:39.575583Z'
      kind: project_archive_mirror
    verification:
      status: exact
      basis:
        - preserved_project_attic
        - authentication_block_matches_certs_clean_side
        - no_quoted_NULL_backdoor_password
        - measured_sha256
    relates_to:
      - phase: during
        version: '2.2'
    notes:
      - This is a clean same-version comparator, not the unavailable trojaned 2.2 distribution.
  - artifact_id: wuftpd
