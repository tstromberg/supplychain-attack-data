        - cert_published_exact_ftpd_c_diff
        - contemporary_bugtraq_corroboration
        - measured_sha256
    relates_to:
      - phase: before
        version: '2.2'
    notes:
      - In CERT's normal diff, the less-than side is malicious and the greater-than side is clean.
