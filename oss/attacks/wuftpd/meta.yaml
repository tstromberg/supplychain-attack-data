      role: mirror
    - uri: https://seclists.org/nanog/1994/Apr/3
      role: mirror
    - uri: https://ftp.gwdg.de/pub/misc/wu-ftpd/ftp.wu-ftpd.org/wu-ftpd-attic/
      role: mirror
    indicators:
    - kind: observable
      value: ftp://wuarchive.wustl.edu/packages/wuarchive-ftpd/wu-ftpd-2.2.tar.Z
    evidence:
    - kind: advisory
      path: cert0079.txt
      role: advisory_text
    notes:
    - >-
      No hash of the trojaned distribution is recorded because none was published. The project's
      attic lists the 2.2 Trojan Horse on its WISHLIST, and the file served as
      wu-ftpd-2.2-trojan.tar.Z is a 1,951-byte copy of that wish list.
    - >-
      A previously recorded md5:3e12b0efb95bcb97e5b58fb916323618 matched no known file and was
      removed rather than replaced with a clean release's digest.
    - >-
      Clean-baseline digests measured from the attic, kept out of hashes so they are never read
      as indicators: 2.1f is md5:59232fc100eb9cf5d82d54e469790e50, 2.2 is
      md5:8d34c7a4dfb163180a6b82fd164373b7, 2.3 is md5:e58adc5ce0b6eae34f3f2389e9dc9197.
    - >-
      The 2.3 value matches the MD5 CERT published on April 6, which establishes the mirror as
      authentic. CERT wrote only that trojaned versions "were found in a number of locations",
      so the wuarchive.wustl.edu path is the canonical coordinate.
