schema_version: 1
interpretation:
  - >-
    The MalwareBazaar records preserved beside these samples map the SHA-1 indicators published by
    Kaspersky to the measured SHA-256 identities of the downloaded bytes. The provider filenames are
    retained even where Kaspersky describes the file under its delivery-chain name.
  - >-
    These are two components from different observed chains, not complete Notepad++ distributions.
    The infrastructure compromise selectively replaced updater responses, so there is no single
    poisoned Notepad++ release archive for either file.
