    0.10.0 distributions plus retained Socket diffs. The sdist matches all 185 Socket member
    hashes; the wheel matches all 186 in its RECORD.
  - >-
    Both stay named RECONSTRUCTED because their deterministic container hashes do not match the
    two authoritative original PyPI hashes recorded on the artifact.
