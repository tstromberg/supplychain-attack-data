schema_version: 1
interpretation:
  - >-
    PyPI quarantined and removed both guardrails-ai 0.10.1 distributions. Their authoritative
    original SHA-256 values remain recorded in meta.yaml, but the original archive bytes were not
    recovered from PyPI, MalwareBazaar, Triage, Malshare, or local downloads.
  - >-
    The clean 0.10.0 sdist and wheel were downloaded from their immutable files.pythonhosted.org
    URLs. Their SHA-256 values and sizes match retained PyPI metadata, and every member matches the
    corresponding retained Socket listing.
  - >-
    Socket's retained sdist diff reports zero added, removed, or replaced files and exactly three
    modified files. Replaying its complete before side reproduces the clean bytes of all three;
    replaying its complete after side and retaining the other 182 files produces a 185-member tree
    whose every path, size, and decoded SHA-256 matches the affected Socket API listing.
  - >-
    Socket's retained wheel diff reports five dist-info files removed, five replacement dist-info
    files added, and only guardrails/__init__.py modified. Every removed or modified before image
    matches the clean wheel. The reconstructed 0.10.1 RECORD contains 186 paths and validates the
    SHA-256 and size of every resulting wheel member (with the standard blank self-entry).
  - >-
    Both attack artifacts remain named RECONSTRUCTED because their complete file trees are known,
    but their deterministic containers do not match the authoritative original distribution digests.
    No package code or lifecycle hook was executed.
