---
- id: xinference
  title: Xinference PyPI Two-Stage Credential Stealer
  campaigns:
  - teampcp-2026
  synopsis: 'TeamPCP compromised three consecutive xinference PyPI releases, 2.6.0
    through 2.6.2, by adding an import-time two-stage Python credential stealer to
    xinference/__init__.py. The attacker iterated the trigger across releases but
    kept the same core behavior: collect SSH keys, environment variables, cloud and
    Kubernetes credentials, package-manager tokens, CI/CD files, shell history, and
    wallet material, then archive and exfiltrate the results to attacker infrastructure.
    The incident is notable for its rapid multi-version refinement and for sharing
    TeamPCP markers and injection patterns with the LiteLLM and Telnyx compromises.'
