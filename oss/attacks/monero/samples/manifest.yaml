        downloads.getmonero.org was serving, plus the per-file comparison that isolated
        monero-wallet-cli as the only member that differed.
      - >-
        Behavioural and identifying evidence, not the binary. The clean archive it names is held in
        the before phase; the compromised one is unavailable.
