schema_version: 1
interpretation:
  - >-
    The original reporter compared the official GitHub archive with the compromised download-server
    archive and found that only monero-wallet-cli differed. The clean official archive below matches
    the reporter's archive and inner wallet SHA-256 values exactly.
  - >-
    The reporter's malicious binary survives on Google Drive but Google now blocks public downloads
    because it detects the file as infected. The older AnonFiles copy is gone, and the configured
    hash providers have no copy.
