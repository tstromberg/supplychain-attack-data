schema_version: 1
interpretation:
  - >-
    No plugin file was modified in this incident. The artifact that changed is the static JSON the
    seven Biggopti plugins fetch on every wp-admin page load, so the corpus holds the feed as its
    own artifact alongside the plugin release that made it dangerous.
  - >-
    The poisoned response itself was never archived. Internet Archive holds the Biggopti feed on
    2026-06-27 and 2026-07-31, both clean, and again on 2026-08-18, after cleanup; the poisoning
    window Wordfence dated by Last-Modified is 2026-08-06 22:40 UTC to 2026-08-07 09:11 UTC, which
    no capture falls in. What survives of the malicious response is the excerpt Wordfence printed,
    retained here as a reconstruction input rather than as bytes.
  - >-
    Both attacker payload paths now answer 403 AccessDenied naming DigitalOcean Spaces bucket
    static-bdthemes, so x.js and w2.js cannot be recovered from the origin.
