    - kind: database_option
      value: fz_emer_done_v1
    - kind: account
      value: usernames matching bd_ plus 6 alphanumeric characters
    - kind: account
      value: accounts using @wordpress.org or @developer.wordpress.org email domains
    - kind: parameter
      value: _wplogin
  notes:
    - >-
      No source file in the WordPress.org repository was modified. The compromise was of the
      vendor's remote JSON data stream, which the plugins fetch and render at runtime, so
      file-integrity scanners would not detect an affected site.
    - >-
      The underlying flaw is an unescaped display_id written into an HTML id attribute by the
      Biggopti banner script, introduced 2026-03-01 in Prime Slider 4.1.9 at SVN r3471891 and later
      copied to the other plugins. Wordfence rated it CVSS 5.4 and it was unpatched at the time of
      writing.
    - >-
      Wordfence attributed the C2 domain to the same operators behind the Advanced Responsive Video
      Embedder and OptinMonster compromises. The presence of the x.js payload inside BdThemes' own
      bucket indicates compromise of the vendor's cloud storage credentials.
    - >-
      The x.js payload derives credentials deterministically from the site hostname as `bd_` plus a
      6-character base36 hash, with password `Bd@26!` plus the same hash plus `x`. Responders can
      compute the expected account for a given domain.
    - >-
      No plugin version is malicious. The compromise was of the remote JSON feed the plugins fetch
      at runtime, so affected sites run unmodified plugin releases and no version identifiers or
      package digests exist to record for this incident.
    - >-
      No install-count total was published for the campaign. The seven affected plugins were closed
      on the WordPress directory on 2026-08-07 pending review.
