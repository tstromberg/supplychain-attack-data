schema_version: 1
interpretation:
  - >-
    The official npm tarballs for affected versions 2.18.6 through 2.18.12 have been removed. Git
    retains annotated release tags for every version, but a tag alone does not prove the member set
    of the published npm archive.
  - >-
    jsDelivr retains complete 519-file manifests for 2.18.11 and 2.18.12. Packing the exact peeled
    Git commit for each tag with npm 11.16.0 and lifecycle scripts disabled produces a tree whose
    path, size, and SHA-256 match all 519 retained entries. This proves complete tree equivalence,
    but not byte identity with the removed npm gzip streams, so both sample names remain explicitly
    RECONSTRUCTED.
  - >-
    Socket retains complete member listings for 2.18.6, 2.18.7, 2.18.9, and 2.18.10. Forager
    recovered every Q-addressed member. Fourteen opaque-ID members were safely overlaid from the
    fully verified 2.18.11 tree because every listing repeats the same path, size, and opaque
    content ID. Each version's unique opaque-ID CHANGELOG.md remains absent, so these four samples
    are explicitly RECONSTRUCTED-PARTIAL with payload_only verification.
