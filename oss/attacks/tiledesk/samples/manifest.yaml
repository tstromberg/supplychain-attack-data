schema_version: 1
interpretation:
  - >-
    The official npm tarballs for affected versions 2.18.6 through 2.18.12
    have been removed. Git retains annotated release tags for every version,
    but a tag alone does not prove the member set of the published npm
    archive.
  - >-
    jsDelivr retains complete 519-file manifests for 2.18.11 and 2.18.12.
    Packing the exact peeled Git commit for each tag with npm 11.16.0 and
    lifecycle scripts disabled produces a tree whose path, size, and SHA-256
    match all 519 retained entries. This proves complete tree equivalence,
    but not byte identity with the removed npm gzip streams, so both sample
    names remain explicitly RECONSTRUCTED.
