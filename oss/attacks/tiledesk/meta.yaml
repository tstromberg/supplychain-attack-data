- id: tiledesk
  title: Tiledesk GitHub org poisoned by Megalodon, npm followed
  campaigns:
  - megalodon-2026
  synopsis: >-
    On 2026-05-18 nine Tiledesk repositories received Megalodon's Optimize-Build workflow
    commit. The maintainer published @tiledesk/tiledesk-server 2.18.6 through 2.18.12 from
    the poisoned tree between 2026-05-19 and 2026-05-21, bundling the workflow file into
    every tarball.
  story: |
    Tiledesk is an open-source LLM agent platform. The server publishes to npm as
    `@tiledesk/tiledesk-server` and builds Docker images through repository
    workflows. On 2026-05-18 at 12:50 UTC the first Megalodon commit landed on
    `Tiledesk/tiledesk-server`, forged as a build-bot author with a routine chore
    message. The diff replaced one workflow file with one named `Optimize-Build`,
    gated on `workflow_dispatch`, that decoded and ran the Megalodon credential
    collector. See [[megalodon-2026]] for the payload.

    Eight more Tiledesk repositories took the same commit within the hour. Every
    push went direct to the default branch with no pull request, consistent with
    a stolen PAT or deploy key. SafeDep attributes the access to the Tiledesk
    side.

    The maintainer kept publishing. Between 2026-05-19 and 2026-05-21, seven
    releases — 2.18.6 through 2.18.12 — shipped from the poisoned tree, each
    tarball carrying the workflow file. `npm install` does not execute workflow
    files, so npm consumers were not poisoned at runtime. Anyone cloning,
    forking, or rebuilding from the tarball was. And the `workflow_dispatch`
    trigger meant the attacker controlled timing — the file could sit dormant
    between detection sweeps.

    SafeDep's Malysis engine flagged the npm package on a routine scan, traced
    the workflow file back to GitHub, and pivoted from there to the broader
    Megalodon scope.
