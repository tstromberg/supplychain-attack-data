  notes:
  - The commit pushed directly to the default branch with no pull request, consistent
    with a stolen PAT or deploy key holding write access. Tiledesk's branch protection
    state at the time of the push is not publicly documented.
  - Workflow files in an npm tarball do not execute on `npm install`. The downstream
    consumer is exposed only if it clones, forks, or extracts the tarball and runs the
    workflow in its own GitHub Actions environment.
  - Versions 2.18.6 through 2.18.12 were published from the poisoned tree between
    2026-05-19 and 2026-05-21. 2.18.5 is the last clean release.
  - The same `Optimize-Build` workflow shape, payload, and C2 (216.126.225.129:8443)
    appear in 5,560 other repositories in the same six-hour window. See
    [[megalodon-2026]].
