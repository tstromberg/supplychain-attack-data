  notes:
  - >-
    Version 0.7.4 has no matching tag, release or commit in XanaduAI/MrMustard, whose tags stop
    at v0.7.3. It was uploaded straight to PyPI after takeover of a maintainer's GitHub account
    and use of the project's CI to get the token.
  - >-
    The payload is a 258-line _check_tf_compatibility() in mrmustard/__init__.py; the rest of
    0.7.4 is byte-identical to 0.7.3. It runs at import, installs three persistence mechanisms,
    and skips CI and container environments.
  - >-
    The C2 URL is XOR obfuscated with the key tf_compat_v2 and decodes to
    https://metrics.femboy.energy/v1/collect. Collected JSON is encrypted with the same key,
    base64 encoded, and posted with a spoofed browser User-Agent.
  - >-
    PyPI hard-deleted 0.7.4 and the removal reached the simple index and its mirrors. Software
    Heritage visited the PyPI origin on 2026-07-24, between publish and removal, so the sdist
    tree survives there; the wheel does not.
