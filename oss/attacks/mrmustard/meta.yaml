  - kind: path
    value: ~/.cache/.tf_cache/
  - kind: file
    value: mmcompat.pth
  - kind: command
    value: '*/15 * * * * /usr/bin/env python3 ~/.cache/.tf_cache/hw_probe.pyc'
  - kind: marker
    value: '# tensorflow hardware compatibility check'
  - kind: code
    value: tf_compat_v2
  - kind: account
    value: ziofil
  - kind: commit
    value: 2ebfe28
  - kind: commit
    value: 80aba72
  - kind: technique
    value: execution on import rather than install
  - kind: technique
