      mrmustard-0.7.4.tar.gz. OSSF's record preserves both filenames and their integrity SHA-256
      values after PyPI removed the release.
    - >-
      The original archive bytes remain unavailable. samples/mrmustard/during holds a
      tree-equivalent sdist reconstruction from Software Heritage plus report-derived
      import-hook, evasion and persistence excerpts.
