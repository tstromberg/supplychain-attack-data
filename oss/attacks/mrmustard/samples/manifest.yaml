        keeps the artifact's upstream name.
      - >-
        Carries the payload: mrmustard/__init__.py is 343 lines with the 258-line
        _check_tf_compatibility() block, the tf_compat_v2 XOR key, hw_probe.pyc, and mmcompat. Its
        SHA-256 is 188ed439bdcfb214cb0cb773c3c4fb172a8e9946659a9c2fd75effab21f08058, which matches a
        copy pulled independently from the Software Heritage content API.
