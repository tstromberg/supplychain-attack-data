- id: uaparser-js
  title: ua-parser-js NPM package hijacked distributing malware
  synopsis: The maintainer's npm account was compromised, allowing attackers to publish
    malicious versions of ua-parser-js, a library embedded across millions of weekly
    installs. The payload stole OS passwords, browser cookies, and Discord tokens,
    then installed a cryptominer on Linux and Windows. Its danger came from reach;
    user-agent parsing had become quiet infrastructure.
