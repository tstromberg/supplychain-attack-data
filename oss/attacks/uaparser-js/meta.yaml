  notes:
  - >-
    create.dll and sdd.dll are the same file: the payload fetched
    https://citationsherbe.at/sdd.dll and saved it locally as create.dll. They are not two
    separate binaries.
  - >-
    Platform behaviour differed. preinstall.js no-ops on macOS and preinstall.sh aborts where
    freegeoip.app places the host in RU, UA, BY or KZ; the Windows batch file had no such check.
  - >-
    Credential theft was Windows-only, and Linux hosts received only the miner. The removed
    0.7.29, 0.8.0 and 1.0.0 archives remain unavailable; a clean 0.7.28 archive and the exact
    0.7.28-to-0.7.29 Diffend comparison are retained.
