schema_version: 1
interpretation:
  - >-
    Forager d4c2240e2dc9 with FORAGER_ALLOW_PARTIAL=1 recovered 102 of 103 Socket-listed members
    from both @draftlab/auth releases, 18 of 19 from both @draftlab/auth-router releases, and 53 of
    54 from both @draftlab/db releases. Every initial tree lacked only router_init.js.
  - >-
    All six retained Socket listings identify the missing router as the same
    S3ILkdNigxgwgrmHN_5FWHidIaD3Wg5xIhpQnikRr5ZU object with size 2339346. This stable Socket object
    identity is independently mapped to SHA-256
    2ec78d556d696e208927cc503d48e4b5eb56b31abc2870c2ed2e98d6be27fc96 by retained campaign jsDelivr
    manifests, and exact matching bytes were obtained from Triage.
  - >-
    Every reconstructed path, size, and hash was checked against its retained Socket listing. All
    six trees are therefore complete, but remain named RECONSTRUCTED because no authoritative
    original whole-archive digest is available.
