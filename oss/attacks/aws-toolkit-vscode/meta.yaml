---
- id: aws-toolkit-vscode
  title: Amazon Q extension prompt injection
  synopsis: A threat actor used an overbroad GitHub token in AWS CodeBuild to commit
    malicious prompt-injection code into Amazon Q Developer for VS Code 1.84.0.
    The code shipped through the official extension release, but a syntax error prevented
    execution.
  story: |
    AWS investigated the Amazon Q Developer for VS Code extension in July 2025 and found that its CodeBuild configuration exposed a GitHub token with too much repository access. The token let the attacker commit code into the open-source repository.

    The malicious change was automatically included in Amazon Q Developer for VS Code 1.84.0. It targeted the assistant's code-context path rather than a normal binary payload: the injected content acted as a prompt intended to make the agent perform destructive local and AWS actions.

    AWS said the malicious code was distributed with the extension but did not execute because of a syntax error. ReversingLabs and later case-study writeups framed the incident as a near miss because Amazon Q can operate with local files and cloud resources available to the developer.

    AWS revoked and replaced credentials, removed the malicious code, removed 1.84.0 from distribution channels, and released 1.85.0. Existing 1.84.0 installations still contained the inert malicious code and were directed to upgrade.
