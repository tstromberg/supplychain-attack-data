- id: typecho-fans-plugins
  title: Typecho Fans plugins repository distributed a credential-stealing workflow
  synopsis: >-
    A compromised contributor account added a malicious GitHub Actions workflow to Typecho Fans
    plugins. The workflow attempted to send repository credentials to an attacker-controlled server.
  start_date: '2026-09-05'
  target:
    name: Typecho Fans plugins
    kind: project
    repo: https://github.com/typecho-fans/plugins
  method:
    phase: source
    cause: compromised_account_credentials
  language: Shell
  impact:
    types:
      - credential_theft
  artifacts:
    - id: typecho-fans-plugins
      name: Typecho Fans plugins
      kind: revision_control_system
      ecosystem: github
      repo: https://github.com/typecho-fans/plugins
      commits:
        - c604ac42c496b0dd9699c7004dbd921e50f88ed1
      locations:
        - uri: >-
            https://github.com/typecho-fans/plugins/blob/c604ac42c496b0dd9699c7004dbd921e50f88ed1/.github/workflows/github_actions_security.yml
          role: distribution
  references:
    - url: https://www.stepsecurity.io/blog/ghostaction-returns
      title: >-
        GhostAction Returns: Malicious Security Audit Workflows Now Mine Credentials from Entire Git
        Histories
  notes:
    - >-
      October 7 attempts to rerun the workflow were blocked by the repository approval requirement.
      The malicious source had already been committed in September.
