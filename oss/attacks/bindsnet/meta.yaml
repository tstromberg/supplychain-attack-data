  notes:
  - >-
    The advisory credits PyPI's escape to release 0.3.4 predating the injection. 0.3.4 is a GitHub
    release tag; PyPI's newest bindsnet is 0.2.7, from 2020-02-25.
  - >-
    Forged commit 9cb1eab5 and its clean twin bbafb9ae share both parents, the message, the author,
    and both timestamps. Only the merged tree differs.
  - >-
    Blockscout shows wallet 0xa322E5f3d311D3080e6f0121063e9aDC2490Ef1a publishing a C2 address
    every 15 minutes or so. 166.88.73.46 was current for the whole exposure window.
  - The second stage was fetched at run time and is not recoverable from the repository.
