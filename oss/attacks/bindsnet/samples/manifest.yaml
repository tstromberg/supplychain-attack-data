    notes:
      - >-
        Not a font. 32,645 bytes of obfuscated JavaScript stored among 15 genuine FontAwesome files.
        Node.js dispatches on content rather than extension, so `node ./fa-solid-400.woff2` executes
        it.
      - >-
        Resolves its command server from the recipient address of transactions sent by
        0xa322E5f3d311D3080e6f0121063e9aDC2490Ef1a, read through public Ethereum JSON-RPC endpoints
        and the Blockscout API, then requests the second stage over cleartext HTTP on port 443 and
        runs it with eval and a detached `node -e` child. The second stage was fetched at run time
        and is not recoverable from the repository.
    subject: bindsnet
    commit: 9cb1eab50557991212b84ea52977257f8392274e
