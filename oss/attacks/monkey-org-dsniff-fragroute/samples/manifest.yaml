      kind: reconstructed_distribution
      reconstruction:
        method: upstream_tarball_plus_published_diff
        direction: >-
          The block published as the fragroute-1.2 backdoor, applied forward to the clean
          fragrouter-1.6 tarball.
        base:
          path: fragrouter-1-6/before/fragrouter-1.6.tar.gz
          sha256: db066e3e55a97f5623e5bfbd742d5eb934037b4f3b467e1e1535c40778bdcbe8
          member_count: 392
        retained_manifest:
          url: https://seclists.org/bugtraq/2002/May/290
          path: fragrouter-1-6/during/fragrouter-1.6-configure-backdoor.diff
          sha256: 4d44d0048897ff756299abf5510be07928ef61bb21d516cd56d42f6d3ddebd07
          member_count: 1
          member_hash: diff_hunk_target_paths
        overlays:
          - path: configure
            operation: block_inserted
            sha256: 6e1bfe39da73115b23e1dbafbf9421eab9935a7afdd22b94da9a46ef9cd9321c
        insertion_point:
          established: false
          line: 1336
          anchor: immediately after the -lsocket check closes, before the net/ethernet.h header test
          reasoning: >-
            Two constraints agree on this point and no source states it. The block's own compile
            line is `gcc $LIBS conftest.c`, so it has to run after the socket library check has put
            -lsocket into $LIBS or the payload would not link where socket() lives outside libc; and
            the fragroute-1.2 copy, the one position that was published, sits at exactly this
            relative point, immediately after its socket/nsl checks and before the next test.
        unchanged_members:
          count: 391
          verification: inherited_byte_for_byte_from_the_verified_upstream_tarball
        packaging:
          format: tar.gz
          path_order: sorted
          normalized: member mtime, uid/gid and owner names zeroed; gzip mtime 0
          framing: >-
            ustar, REGTYPE; reproduces the fragroute-1.2 reconstruction byte for byte from its own
            inputs
          original_archive_bytes_recovered: false
        complete_attack_record: true
    verification:
      status: tree_equivalent
      basis:
        - reported_digest_matched
        - measured_sha256
      evidence:
        - clean_upstream_tarball_verified_exact_against_dug_song_published_md5
        - upstream_advisory_states_the_same_backdoor_went_into_all_three_tarballs
        - inserted_block_byte_identical_to_published_fragroute_diff
        - insertion_point_inferred_not_established
        - c2_address_present_in_rebuilt_configure
        - measured_sha256_and_size
    notes:
      - >-
        Dug Song's advisory states the dsniff-2.3, fragroute-1.2 and fragrouter-1.6 tarballs were
        all modified at 03:00 on 2002-05-17 to carry the same configure backdoor, and the published
        block carries a stale `configure:2379` line reference that matches none of the three files,
        which is what a verbatim paste into each looks like.
      - >-
        What is not established is where in this configure the block sat. No digest or listing of
        the trojaned fragrouter-1.6 was ever published, so the position is inferred and the
        archive's own bytes cannot be checked against anything. See the insertion_point record.
      - >-
        Synthetic archive: member order is sorted and timestamps are normalized, so these bytes are
        reproducible from the same inputs but are not the bytes monkey.org served.
    subject: fragrouter-1-6
unresolved:
  - artifact_id: dsniff-2-3
    phase: during
    version: '2.3'
    status: original_distribution_unavailable_no_reported_digest_no_established_insertion_point
    attempts:
      - >-
        Reconstruction considered and declined on 2026-09-10. The clean base is exact: the held
        dsniff-2.3.tar.gz reproduces 183e336a45e38013f3af840bddec44b4, the MD5 Dug Song published
        for the clean archive. The injected block is known verbatim from the fragroute-1.2 diff, and
        the advisory states the same backdoor went into all three tarballs. What is missing is where
        it sat: fragroute's copy is anchored immediately after the AC_LBL socket/nsl checks that put
        -lsocket -lnsl into $LIBS, which the payload's own `gcc $LIBS conftest.c` line needs, and
        dsniff-2.3's configure has no such macro at all -- its socket and nsl checks belong to
        AC_PATH_XTRA and populate X_EXTRA_LIBS, never $LIBS. With no anchor and no digest, any
        placement would be invented, so fragrouter-1.6 was rebuilt and this was not.
      - >-
        MD5-to-SHA-256 conversion, 2026-09-10: of 1 md5 digest(s) this record names, VirusTotal
        knows 0 and has never seen 1. Triage and MalShare index SHA-1 and SHA-256 only, so an md5
        VirusTotal cannot resolve is unreachable by every digest lane; such a digest is either wrong
        or names a file no public collection holds.
    last_attempted_at: '2026-09-10T21:29:07Z'
