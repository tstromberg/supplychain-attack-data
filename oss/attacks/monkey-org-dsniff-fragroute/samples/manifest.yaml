interpretation:
  - >-
    The original project URLs now serve the clean archives restored by Dug Song, and all three match
    the clean MD5s published after the compromise.
  - >-
    Anders Nordby's contemporary Bugtraq post supplies the poisoned fragroute MD5 and the complete
    diff against the restored clean archive. The linked archival FTP copy is no longer reachable,
    but the exact malicious configure change is preserved here.
