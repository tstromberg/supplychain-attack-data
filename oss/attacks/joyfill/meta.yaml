  - kind: technique
    value: persistence by injection into VS Code and npm
  notes:
  - Both malicious releases are prerelease versions. Consumers pinning to a stable range
    would not have received them, but anyone tracking beta or release-candidate channels
    would.
  - Execution occurs at module import, so `npm install --ignore-scripts` does not prevent
    it. The implant is appended after the legitimate package code rather than replacing it.
  - Socket reported the RAT stage at 77 KB and the Python credential stealer at 82,457
    bytes. No install or download count for the malicious versions has been published.
  - The npm registry records four further prereleases on the same day that no source
    classifies. On layouts, 0.1.2-2773.beta.1 at 13:57:01Z and 0.1.2-2773.beta.2 at
    15:16:43Z. On components, 4.0.0-rc24-2773-beta.5 at 14:01:19Z and
    4.0.0-rc24-2773-beta.6 at 15:21:29Z. Socket named only beta.0 and beta.4 as malicious,
    so the later prereleases are left unrecorded rather than assumed either way.
  - Both malicious prereleases were removed from npm and now return 404, so no sample of
    the published tarballs could be acquired.
  - SafeDep tracks the blockchain dead-drop loader carried in the production bundles as
    PolinRider.
