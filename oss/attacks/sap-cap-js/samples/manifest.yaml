schema_version: 1
interpretation:
  - >-
    jsDelivr retains complete file manifests for all four removed npm releases.
    Exact clean predecessors show that each attack release added setup.mjs and
    execution.js, replaced package.json, and left every other member unchanged.
  - >-
    mbt 1.2.48 and @cap-js/sqlite 2.2.2 are completely reconstructable: both exact
    added files are preserved, and deriving package.json by changing the version and
    replacing scripts with the preinstall hook produces the exact retained hash.
  - >-
    @cap-js/postgres 2.2.2 and @cap-js/db-service 2.10.1 are not reconstructed. Their
    shared execution.js member (SHA-256
    eb6eb4154b03ec73218727dc643d26f4e14dfda2438112926bb5daf37ae8bcdb) is absent,
    and configured hash providers and retained CDNs did not return it.
