schema_version: 1
interpretation:
  - >-
    jsDelivr retains complete file manifests for all four removed npm releases. Exact clean
    predecessors show that each attack release added setup.mjs and execution.js, replaced
    package.json, and left every other member unchanged.
  - >-
    mbt 1.2.48 and @cap-js/sqlite 2.2.2 are completely reconstructable: both exact added files are
    preserved, and deriving package.json by changing the version and replacing scripts with the
    preinstall hook produces the exact retained hash.
  - >-
    @cap-js/postgres 2.2.2 and @cap-js/db-service 2.10.1 are not reconstructed. Their shared
    execution.js member (SHA-256 eb6eb4154b03ec73218727dc643d26f4e14dfda2438112926bb5daf37ae8bcdb)
    is absent, and configured hash providers and retained CDNs did not return it.
  - >-
    The execution.js member for @cap-js/postgres 2.2.2 and @cap-js/db-service 2.10.1 was recovered
    on 2026-09-03 from Hopper, which had held it all along. The unresolved records for both packages
    already carried its SHA-256, noted as the single member the reconstruction audit could not find;
    the attempts beneath them record a Hopper 404, but against http://10.9.8.5:8081, the address the
    store used before it moved. Re-asking the current host returned the file immediately.
  - >-
    @cap-js/postgres 2.2.2 and @cap-js/db-service 2.10.1 were reconstructed on 2026-09-03 once their
    missing execution.js member was recovered. Both follow the same route the sqlite reconstruction
    took: jsDelivr still records the full member list with a SHA-256 for each file, the version
    before the malicious one is still on the registry, and only three members differ --
    package.json, setup.mjs and execution.js -- all of which Hopper holds. Every member in both
    archives matches jsDelivr's recorded digest, so they are complete trees rather than partial
    ones, and rebuilding either reproduces the same bytes.
