  notes:
  - The hardcoded SHA-256 value is the backdoor token compared by hash_equals, not a hash
    of a distributed artifact. It is recorded under indicators for that reason.
  - The backdoor filtered administrator usernames beginning with wpsvc_, developer_, dev_,
    and wp_update_ out of the impersonation pool, which Wordfence read as the operators
    avoiding their own seeded accounts.
  - 'Disclosure timeline in US Eastern time: backdoor introduced 08:42, PRISM report
    10:33, Wordfence validation and WordPress.org notification 10:43, plugin closed 11:09,
    all on 2026-07-28.'
  - WordPress.org confirmed the malicious release had not yet been distributed, so sites
    should not have auto-updated to it. The plugin remained unpatched and closed.
