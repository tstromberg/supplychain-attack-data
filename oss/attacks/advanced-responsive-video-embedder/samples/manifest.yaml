interpretation:
  - >-
    The before and after baselines come from the WordPress.org plugin directory, which is the
    channel this compromise travelled through: an attacker with commit access planted the bypass in
    10.8.7 and it shipped as a normal update. Both 10.8.7 and 10.8.8 are absent from the directory's
    version list today, so 10.8.6 and 10.8.9 bracket the incident exactly.
