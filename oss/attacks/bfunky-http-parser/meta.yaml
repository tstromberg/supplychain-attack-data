    - Packagist reports 36469 lifetime downloads and roughly 675 monthly; affected-user count
      is not separately confirmed.
    - The SHA-256 values identify the recovered malicious GitHub distribution ZIPs for
      1.0.4, 2.1.0, 2.2.4, and 2.2.5, respectively. Other listed versions either remain
      unavailable in their rewritten state or resolve today to clean pre-attack commits;
