- id: bfunky-http-parser
  title: bfunky/http-parser Packagist package backdoored with host stealer
  synopsis: >-
    An attacker pushed an Analytics.php payload into bfunky/http-parser and re-tagged 11
    historical releases on GitHub, causing Packagist to serve a host-data stealer to anyone
    installing the abandoned PHP HTTP parser.
  story: |-
    bfunky/http-parser is a small PHP HTTP message parser whose original maintainer had not
    published a release since 2018. On 2026-05-08 a commit landed on the repository that added
    `src/Analytics.php` and a `require_once` in `src/AbstractHttpParser.php`, so the new file
    executes automatically whenever any class in the library is autoloaded.

    The same day, the attacker tagged versions 2.1.0 and 2.2.0 through 2.2.4 against the new
    commits, and on 2026-05-14 force-tagged the 1.0.0 through 1.0.4 historical releases and
    cut a 2.2.5 tag on top of the same backdoor. Packagist picked up every retagged release
    and began serving the trojanised zipballs from GitHub. The attacker also altered the file
    header to change the author from "Jairo Rodríguez" to "jairo.rodriguez", and the commit
    message on the 2.1.0 retag is "[2.2.3]", suggesting an account compromise rather than a
    deliberate maintainer republish.

    Analytics.php disables TLS verification, then POSTs a JSON blob to the URL stored in
    base64 as `URL_DIGEST` — `https://44.210.94.38/packagist.php`. The payload exfiltrates
    `gethostname()`, `$_SERVER['SERVER_NAME']`, `$_SERVER['SERVER_ADDR']`, the current working
    directory, `php_uname()`, and the entire process environment via `getenv()`. A marker
    file under the system temp directory, named `md5(URL_DIGEST . gethostname())`, is written
    after a successful send so the beacon fires once per host. The file's comment header
    copies the boilerplate from Composer's generated files to look benign.

    The exfiltration of `getenv()` makes this a credential stealer in practice: PHP processes
    routinely hold database passwords, API keys, and cloud credentials in the environment.
    Packagist reports 36,469 lifetime downloads and roughly 675 monthly, so the exposed
    population is small but the payload runs on every autoload of any class in the library.
  start_date: 2026-05-08
  end_date: 2026-05-17
