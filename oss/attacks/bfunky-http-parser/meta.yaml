- id: bfunky-http-parser
  title: bfunky/http-parser Packagist package backdoored with host stealer
  synopsis: >-
    An attacker pushed an Analytics.php payload into bfunky/http-parser and re-tagged 11
    historical releases on GitHub, causing Packagist to serve a host-data stealer to anyone
    installing the abandoned PHP HTTP parser.
  story: |-
    Someone quietly slipped a credential beacon into `bfunky/http-parser`, a small PHP library that had not seen a release since 2018, and re-tagged nearly a dozen historical versions on GitHub to make Packagist serve the backdoored code to anyone who installed it.

    The library, used by a small number of PHP applications to parse HTTP messages, was first re-published on May 8, 2026, and a blueteamsec post on Reddit later that week flagged the change. According to the commit history, the attacker added a new file at `src/Analytics.php` and dropped a single `require_once` line into `AbstractHttpParser.php`. Because Composer autoloads the library, the new code runs whenever any class in the package is referenced, with no exploit chain required. The same day, the attacker tagged versions 2.1.0 and 2.2.0 through 2.2.4 against the new commits. Six days later the historical 1.0.0 through 1.0.4 tags were also moved to a fresh commit, and version 2.2.5 was added to the 2.x line. That second wave shipped the same stealer but pointed it at a different collection server, which means the two rounds of tampering can be told apart by the address baked into the payload. Packagist followed the tags and served the rewritten zipballs. The author header in `AbstractHttpParser.php` had been changed from "Jairo Rodríguez" to the lowercase "jairo.rodriguez," and the commit message on the 2.1.0 retag was simply "[2.2.3]," patterns more consistent with account takeover than a long-absent maintainer's return.

    `Analytics.php` itself is short. It disables TLS verification and POSTs JSON to a URL the attacker hid as a base64 string. Archives still served by Packagist show the May 8 tags reporting to `https://44.210.94.38/packagist.php`, while the May 14 retag of the 1.x line reports to `https://193.221.201.107/analytics.php`. Both versions also declare an unused constant naming `analytics.packagist.org`, a domain the attacker never used but which is the first thing a developer skimming the file would see. The body carries the hostname, `SERVER_NAME`, `SERVER_ADDR`, the working directory, `php_uname()` output, and the full process environment from `getenv()`. After a successful send, the code writes a marker file in the system temporary directory so the beacon fires only once per host, and the file's header copies Composer's autogenerated boilerplate, making it read like routine plumbing on casual inspection.

    The environment dump is the prize. PHP processes routinely hold database passwords, API keys, and cloud credentials in their environment. Packagist lists 36,469 lifetime downloads and roughly 675 per month for the package, so the exposed population is small. But every autoload of every class in the library reaches the payload, and the collection server was still accepting connections at the time this record was published.
