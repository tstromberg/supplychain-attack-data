schema_version: 1
interpretation:
  - >-
    phpBB described this as an official-link redirection attack: the two normal
    phpBB download URLs were redirected by a malicious Cloudflare page rule to
    archives on an attacker-controlled server. The project did not publish the
    malicious archive hashes, the redirect destination, or the injected file.
  - >-
    The clean 3.2.2 archives currently preserved in phpBB's historical release
    directory are post-incident comparators. They match the SHA-256 values
    published alongside the official files and must not be mistaken for the
    poisoned archives served during the three-hour window.
samples:
  - artifact_id: phpbb-full-package
    phase: before
    classification: clean
    version: 3.2.1
    filename: phpBB-3.2.1.zip
    path: phpbb-full-package/before/phpBB-3.2.1.zip
    sha256: 30977547dcc59b26a727fecf397f7a6f102816cca0d82028d1d72c1cd881e117
    size: 7767156
    source:
      url: https://download.phpbb.com/pub/release/3.2/3.2.1/phpBB-3.2.1.zip
      retrieved_at: '2026-08-10T01:03:22Z'
      kind: official_historical_archive
    verification:
      status: exact
      basis: [official_published_sha256, measured_sha256]
    notes:
      - Immediate clean full-package release preceding the affected 3.2.2 release.
  - artifact_id: phpbb-full-package
    phase: after
    classification: remediated
    version: 3.2.2
