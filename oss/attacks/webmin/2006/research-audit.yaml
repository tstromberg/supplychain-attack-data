findings:
  - The currently served SourceForge object for webmin-1.290.tar.gz is a clean comparator only. A clean same-version copy does not refute a temporary distribution-side replacement.
  - Its digests do not match the digests attributed to the malicious archive in meta.yaml, which is expected if different bytes temporarily replaced the release on a distribution server.
  - The currently reachable webmin.com exploit and security pages describe the arbitrary remote file-access vulnerability fixed in 1.290; they do not provide context for a 2006 distribution compromise.
  - The cited Register URL is unavailable. The Register's independently recoverable 2019 report describes a SourceForge-only malicious Webmin 1.890 build, not version 1.290 in 2006.
  - The cited SANS diary identifier currently exposes an empty article body, so its historical context has not been recovered.
  - An earlier revision of this dataset cited Full Disclosure message 2006/08/167, but that message is about ProtectFly/RegisterFly WHOIS data and is unrelated to Webmin.
  - Contemporary CERT/CC, Gentoo, Webmin, Bugtraq, and Full Disclosure material recovered for this period describes CVE-2006-3392, an arbitrary file-disclosure vulnerability in versions before 1.290. It does not describe a poisoned 1.290 distribution.
  - The clean 1.290 source tree does not contain the previously claimed openiscsi/edit_args.cgi path.
  - Exact-hash searches and configured hash providers found no independent record for the two hashes in meta.yaml.
  - The similarities between the dataset claim and the documented 2019 incident (SourceForge-hosted altered release, August dates, and versions 1.290 versus 1.890) make conflation plausible, but this is an inference rather than proof that the 2006 event did not occur.
