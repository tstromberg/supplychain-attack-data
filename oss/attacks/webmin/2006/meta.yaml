---
- id: webmin-2006
  title: Webmin SourceForge mirror distributes backdoor (2006)
  synopsis: A compromised SourceForge mirror distributed a modified Webmin 1.290 archive.
    The tampered release carried a backdoor in /usr/libexec/webmin/openiscsi/edit_args.cgi,
    allowing crafted HTTP requests to reach remote command execution as root through
    software that administrators had downloaded from a trusted public mirror.
  start_date: 2006-08-10
  end_date: 2006-08-13
