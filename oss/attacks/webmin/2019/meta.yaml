---
- id: webmin-2019
  title: Webmin build infrastructure compromise inserts backdoor (2019)
  synopsis: Webmin's build infrastructure was compromised, and attackers modified
    useradmin/password_change.cgi before official releases were produced. The inserted
    backdoor enabled unauthenticated remote command execution through the password
    change form, quietly riding multiple signed-looking releases over several months
    before public discovery by users.
