- id: wp-simply-show-hooks
  title: Simply Show Hooks plugin created backdoors
  campaigns:
  - wordpress-plugin-backdoor-2024
  synopsis: >-
    Malicious code was found in Simply Show Hooks 1.2.1 and 1.2.2 during the June 2024
    WordPress.org plugin-repository compromise.
  story: |
    Simply Show Hooks was not the plugin that first raised the alarm. The public WordPress.org Plugin Review Team notice was about Social Warfare; Wordfence used that Social Warfare sample to search for the same pattern and found four more affected plugins, including Simply Show Hooks.

    Wordfence listed Simply Show Hooks 1.2.1 as infected and reported no patched version at publication time. The official CVE record includes 1.2.1 through 1.2.2, which agrees with the immutable repository history: the injected file first appeared while declaring 1.2.1 and remained in later revisions that declared 1.2.2. That keeps the incident in scope even though the plugin appears to have had no active installations reported publicly; the compromised artifact still sat in the WordPress.org plugin supply chain.

    The injected PHP attempted to create administrator accounts named `Options` or `PluginAuth`, exfiltrated those details to `94.156.79.8`, and added SEO-spam JavaScript in the site footer.

    The risk model is the same as the larger campaign but the exposure is narrower. A site owner did not have to fetch a lookalike ZIP from a random domain; if they installed or updated the affected plugin through the repository while the malicious copy was available, the trusted update path could deliver the backdoor. This page keeps Simply Show Hooks separate because it had an unusual exposure profile. The campaign record carries the shared WordPress.org source-compromise pattern; this record is the inventory handle for the Simply Show Hooks artifact.
  start_date: 2024-06-21
  end_date: 2024-06-24
