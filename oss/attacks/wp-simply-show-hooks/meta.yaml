- id: wp-simply-show-hooks
  title: Simply Show Hooks plugin created backdoors
  campaigns:
  - wordpress-plugin-backdoor-2024
  synopsis: >-
    Malicious code was injected directly into the Simply Show Hooks plugin repository on WordPress.org.
  story: |
    Simply Show Hooks was one of the five WordPress.org plugins Wordfence found with similar malicious code in June 2024. The affected package came from the official plugin repository.

    Wordfence listed version 1.2.1 as infected and reported no patched version at the time. A site owner who updated the plugin through the normal WordPress channel could install the backdoor.

    The injected PHP attempted to create administrator accounts named `Options` or `PluginAuth`, exfiltrated those details to `94.156.79.8`, and added SEO-spam JavaScript in the site footer.
  start_date: 2024-06-21
  end_date: 2024-06-24
  target:
    name: wp-simply-show-hooks
    kind: plugin
    repo: https://wordpress.org/plugins/simply-show-hooks/
  actor:
    name: Third Party
    kind: group
  language: PHP
  method:
    cause: malicious_injection
    phase: source
    motive: seo_spam_account_takeover
    transitive: false
  impact:
    types:
    - account_takeover
    - defacement
    users: 0
  artifacts:
  - id: wp-simply-show-hooks
    name: wp-simply-show-hooks
    ecosystem: wordpress
    kind: extension
    repo: https://wordpress.org/plugins/simply-show-hooks/
    start_date: 2024-06-21
    end_date: 2024-06-24
    versions:
    - 1.2.1
    locations:
    - uri: https://wordpress.org/plugins/simply-show-hooks/
      role: distribution
    indicators:
    - kind: ip
      value: 94.156.79.8
    - kind: user
      value: Options
    - kind: user
      value: PluginAuth
  references:
  - url: 
      https://www.wordfence.com/blog/2024/06/supply-chain-attack-on-wordpress-org-plugins-leads-to-5-maliciously-compromised-wordpress-plugins/
    title: Supply Chain Attack on WordPress.org Plugins Leads to 5 Maliciously Compromised WordPress Plugins
