    notes:
    - The CVE record identifies versions 1.2.1 through 1.2.2 as affected; the previous
      dataset revision omitted 1.2.2.
    - Immutable SVN snapshot 3105888 has the longstanding clean 1.2.1 index.php;
      revision 3105889 is the first snapshot whose index.php contains the 94.156.79.8
      backdoor. Revisions 3105890 and 3105891 retain the payload while changing the
      embedded plugin header to 1.2.2.
    - Revision 3106767, committed by the Plugin Review Team on 2024-06-24, restores the
      clean index.php. It is remediation evidence, not the injection changeset.
    - The WordPress.org support thread was the Plugin Review Team's Social Warfare notice,
      not a separate attack; Wordfence used it as the starting point for the broader
      five-plugin investigation.
    - Heise reported Simply Show Hooks 1.2.1 with no active installations, so this record
      models the compromised repository artifact rather than a known population of affected
      sites.
