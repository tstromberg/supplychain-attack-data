---
- id: php
  title: PHP Git server compromise attempts source code backdoor
  synopsis: Attackers compromised the self-hosted `git.php.net` server. They pushed
    two malicious commits directly to the php-src repository ('main' branch). These
    commits attempted to insert a backdoor enabling remote code execution, disguised
    as typo fixes. The commits were detected quickly and did not impact any released
    version. PHP migrated to GitHub afterwards.
  start_date: 2021-03-28
  end_date: 2021-03-28
