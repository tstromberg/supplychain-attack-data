schema_version: 1
interpretation:
  - >-
    The affected distribution was the php-src revision-control tree itself; no release tarball ever
    carried the backdoor. The unit of collection is therefore the immutable git object: the
    backdoored ext/zlib/zlib.c blob and the two commits that introduced it.
  - >-
    Both malicious commits produce the same ext/zlib/zlib.c blob (git 6964407837cb), so a single
    file covers the state after either one. The second commit is a revert of a revert that restored
    the identical content.
