---
- id: zapier-npm
  title: Zapier NPM Account Compromise (Shai Hulud V2)
  campaigns:
  - sha1-hulud-npm-packages
  synopsis: The Sha1-Hulud "Second Coming" npm worm compromised Zapier packages across
    the @zapier scope and unscoped zapier-platform packages. Affected releases used
    a preinstall hook to invoke Bun and run an obfuscated credential stealer that
    harvested GitHub, npm, cloud, and local environment secrets, exfiltrated them
    through public GitHub repositories, attempted npm self-propagation, and registered
    a self-hosted GitHub Actions runner for persistence. The incident affected core
    Zapier platform and SDK packages.
  start_date: 2025-11-23
  end_date: 2025-11-24
  target:
    name: zapier-npm
    kind: library
    repo: https://github.com/zapier/zapier-platform
  actor:
    name: Third Party
    kind: group
  language: JavaScript
  method:
    cause: compromised_account_credentials
    phase: distribution
    motive: credential_theft
    transitive: false
  impact:
    types:
    - credential_theft
    - self_propagation
    users: 0
