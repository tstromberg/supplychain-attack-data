schema_version: 1
interpretation:
  - >-
    npm removed @zapier/ai-actions 0.1.18 through 0.1.20 and their original tarballs. jsDelivr
    retains an 18-member manifest with SHA-256 and size for every member of each release; Socket
    independently retains the same path and size inventories.
  - >-
    The exact npm-integrity-verified 0.1.17 archive supplies 15 members whose paths, sizes, and
    SHA-256 values are unchanged in all three releases. Each malicious package.json is reproduced
    byte-for-byte by changing the version and appending preinstall as the final scripts member.
  - >-
    Forager recovered the added bun_environment.js and setup_bun.js bytes by their published
    MalwareBazaar hashes. Every reconstructed tree matches all 18 retained jsDelivr SHA-256 values
    and sizes with no missing, extra, or mismatched files.
  - >-
    The complete file tree is therefore preserved, but the gzip/tar stream is synthetic and no
    authoritative digest for the removed publication was found. The affected archive remains
    explicitly named RECONSTRUCTED and is verified only as tree-equivalent.
  - >-
    The same method independently verifies @zapier/ai-actions-react 0.1.12 through 0.1.14. Its
    npm-integrity-verified 0.1.11 predecessor supplies 691 unchanged members; exact generated
    package.json files and the two recovered payloads complete each 694-member target tree.
  - >-
    @zapier/babel-preset-zapier 6.4.1 through 6.4.3 are also complete-tree reconstructions. The
    npm-integrity-verified 6.4.0 archive supplies six unchanged members; Socket's hash-addressed
    endpoint supplies each exact 1,450-byte package.json, and Forager's MalwareBazaar fallback
    supplies the two added payloads. Fresh extraction matches all nine jsDelivr member hashes and
    sizes for every target, while RECONSTRUCTED remains required because the original tar streams
    and their authoritative whole-archive digests are unavailable.
  - >-
    @zapier/browserslist-config-zapier 1.0.3 through 1.0.5 use the same evidence chain. Exact
    npm-verified 1.0.2 bytes supply two unchanged members, archived Socket hash-addressed responses
    supply each exact package.json, and Forager-recovered payloads complete each five-member tree.
  - >-
    @zapier/eslint-plugin-zapier 11.0.3 through 11.0.5 are complete by the same method: 18 files
    match npm-verified 11.0.2, exact package.json bytes are archived from Socket, and the two added
    payloads produce target trees matching all 21 retained jsDelivr hashes and sizes.
  - >-
    @zapier/mcp-integration 3.0.1 through 3.0.3 are complete-tree reconstructions: 107 members match
    npm-integrity-verified 3.0.0, with exact archived Socket package.json bytes and the two
    Forager-recovered payloads completing all 110 retained target members.
  - >-
    zapier-platform-cli 18.0.2 through 18.0.4 are complete-tree reconstructions. The verified 18.0.1
    archive supplies 156 unchanged members; exact archived Socket metadata and the two recovered
    payloads complete and verify all 159 members of each affected release.
  - >-
    zapier-platform-core 18.0.2 through 18.0.4 are complete-tree reconstructions. Verified 18.0.1
    supplies 115 unchanged members; exact archived Socket metadata and the two recovered payloads
    complete all 118 retained members per release.
