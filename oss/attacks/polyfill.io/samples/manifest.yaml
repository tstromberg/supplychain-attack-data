schema_version: 1
interpretation:
  - >-
    polyfill.io served generated JavaScript from a URL rather than publishing versioned files, and
    the hostile response was conditional on request context. No single capture is the artifact; each
    one is what a particular client received at a particular moment.
  - >-
    Every Internet Archive capture of cdn.polyfill.io/v3/polyfill.min.js retrieved for this record
    returned the benign polyfill bundle, which is consistent with targeted delivery to mobile
    clients rather than to a desktop crawler. The malicious stage is therefore held as a
    contemporaneous research copy and as an archived capture of the second-stage host.
