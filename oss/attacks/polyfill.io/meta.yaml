  - kind: technique
    value: payload served only to mobile visitors, and only in certain hours
  - kind: technique
    value: execution suppressed when an admin user or a web analytics script is detected
  notes:
  - No file hash is recorded for the injected script, and none is expected. Sansec
    describes the payload as served conditionally, varying by device, hour, cookie, and
    whether an admin or an analytics script was present, so the bytes differed between
    requests and no single digest identifies what was distributed. Absence here reflects
    the delivery mechanism rather than incomplete research.
  - Sansec attributed bootcdn.net, bootcss.com, staticfile.net, staticfile.org,
    unionadjs.com, xhsbpza.com, union.macoms.la, and newcrbpc.com to the same operator,
    active since at least June 2023. They are recorded as actor infrastructure, not as
    distribution surfaces for this incident.
