- id: universal-file-viewer
  title: Flutter example build files distributed XCSSET malware
  synopsis: >-
    The universal_file_viewer 0.1.5 archive on pub.dev contained infected example build files from a
    compromised maintainer workstation. Building the example could execute XCSSET; ordinary
    dependency use did not compile those files.
