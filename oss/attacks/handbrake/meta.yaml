- id: handbrake
  title: HandBrake Mac download mirror distributed Proton RAT
  synopsis: An official HandBrake download mirror, download.handbrake.fr, was compromised
    while hosting the macOS release. The HandBrake-1.0.7.dmg image was replaced with
    a malicious build carrying the Proton RAT, so Mac users following the expected
    mirror path received remote-access malware instead of video tooling.
