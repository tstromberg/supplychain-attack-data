    name: ShapedPlugin
    kind: organization
    website: https://shapedplugin.com/
  actor:
    name: Unknown
    kind: group
  language: PHP
  method:
    cause: compromised_infrastructure
    phase: ci_cd
    motive: unauthorized_access_control
    transitive: false
  impact:
    types:
      - backdoor
      - credential_theft
      - remote_code_execution
      - data_exfiltration
  locations:
    - uri: https://account.shapedplugin.com/
      role: distribution
  indicators:
    - kind: advisory
      value: CVE-2026-10735
    - kind: advisory
      value: CVE-2026-49777
    - kind: file
      value: src/Includes/LicenseLoader.php
    - kind: file
      value: wp-content/plugins/woocommerce-subscription/
    - kind: file
      value: wp-content/plugins/woocommerce-notification/
    - kind: file
      value: install-persistent.php
    - kind: file
      value: class-wc-subscription-trace-dispatch.php
    - kind: file
      value: class-wc-subscription-diagnostics.php
    - kind: file
      value: class-wc-subscription-scheduler.php
    - kind: domain
      value: generate.2faplugin.org
    - kind: ipv4
      value: 194.76.217.28
    - kind: port
      value: '2871'
    - kind: endpoint
      value: /wp-json/wc/v3/settings/apply
    - kind: md5
      value: e268c35a06d85f672e70c9beecb4e5d1
  notes:
    - >-
      Only Pro builds distributed through the vendor's Easy Digital Downloads endpoint were
      affected. Wordfence confirmed the free plugins on WordPress.org were not compromised, despite
      the attacker having deploy access to both channels.
    - >-
      Wordfence read file timestamps inside the compromised ZIP as evidence of an automated
      build-step injection. 4 files were modified on 2026-05-21 within a two-hour window, against
      366 files from 2025-04-22 and 100 from 2026-02-25. A composer `installed.php` git reference of
      d0f349c04c2a3578a65b7e17bcabc84152a61b12 indicates the package was built from a private
      repository.
    - >-
      CVE-2026-49777 was assigned to a related Product Slider Pro backdoor and reported as patched
      in 3.5.4. Wordfence describes CVE-2026-49777 as a duplicate of CVE-2026-10735.
    - >-
      Wordfence examined all other ShapedPlugin Pro plugins available as of 2026-06-15 and found no
      LicenseLoader.php or associated C2 indicators, but could not rule out earlier compromised
      versions since replaced. Bundle packages may also be affected.
    - >-
      Both C2 hosts are registered to AEZA GROUP LLC. The domain 2faplugin.org was updated on
      2026-05-10, shortly before the backdoor injection timestamps.
