unresolved:
  - artifact_id: real-testimonials-pro
    phase: during
    coordinate: pkg:wordpress/testimonial-pro@3.2.4
    status: unavailable
    attempts:
      - >-
        First-party ShapedPlugin incident advisory identifies a malicious 3.2.4 package served
        around 2026-05-16. The paid plugin has no WordPress.org archive, and no authoritative
        archive checksum or complete member set has been published, so reconstruction would not be
        complete or accurate.
      - >-
        Wordfence publishes SHA-256 0e17c869d3e4586d4c160041042bd15123c2a37117a98a995fae885f0f4417fc
        for the injected LicenseLoader.php member. Forager queried MalwareBazaar, Triage, and
        Malshare by that exact digest on 2026-08-13; none returned the bytes.
      - >-
        Wayback host sweep, 2026-09-10: asked the CDX index for every archived file with an
        installer extension under account.shapedplugin.com between 2026-05-18 and 2026-06-16 (three
        days either side). No capture exists. The vendor download was not archived while it was
        compromised.
      - >-
        wordpress.org release lane, 2026-09-10: downloads.wordpress.org serves neither the theme nor
        the plugin path for testimonial-pro, woo-product-slider-pro or smart-show-post-pro. These
        are commercial Pro builds distributed through the vendor's own Easy Digital Downloads
        endpoint, so wordpress.org never carried any version of them, fixed or affected.
    last_attempted_at: '2026-09-10T23:40:38Z'
