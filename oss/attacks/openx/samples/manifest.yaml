schema_version: 1
interpretation:
  - >-
    A long-running GPL release archive preserves OpenX 2.8.9, 2.8.10, and 2.8.11. The 2.8.10 ZIP is
    definitively the compromised build: its embedded openXVideoAds.zip and all three participating
    files match the malicious MD5 values published during the incident. Both adjacent releases
    contain the same clean video-plugin bytes and lack the injected PHP execution chain.
