---
- id: openx
  title: OpenX Source archive backdoored
  synopsis: The official OpenX Source 2.8.10 distribution archives were compromised
    for months, shipping a remote PHP code execution backdoor in the open-source ad
    server. The payload hid obfuscated PHP inside flowplayer-3.1.1.min.js, while modified
    delivery code invoked it through MAX_commonReadFile and require_once. Compromised
    ad servers could be taken over and then used for malvertising, phishing, or drive-by
    download campaigns against site visitors.
