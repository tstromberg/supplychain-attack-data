- name: openx
  title: OpenX Source archive backdoored
  synopsis: The official OpenX Source 2.8.10 distribution archives were compromised for months, shipping a remote PHP code execution backdoor in the open-source ad server. The payload hid obfuscated PHP inside flowplayer-3.1.1.min.js, while modified delivery code invoked it through MAX_commonReadFile and require_once. Compromised ad servers could be taken over and then used for malvertising, phishing, or drive-by download campaigns against site visitors.
  start_date: 2012-11-01
  end_date: 2013-08-08
  attribution_type: Cybercriminal Gang # Likely financially motivated group
  component_type: Application # Ad Server
  lang: PHP # Malicious code inserted into PHP application
  cause: Compromised Infrastructure # Download/update infrastructure breached
  motive: Financial Gain # Server takeover and potential exploit kit distribution
  transitive: false
  insertion_phase: distribution # Compromise of official download/update mechanism
  impact_type: Backdoor, Remote code execution
  references:
    - https://www.clearmind.cc/2013/08/backdoor-found-in-openx-open-source-version-2-8-10-some-thoughts/ # Three-file technical analysis
    - https://seclists.org/oss-sec/2013/q3/295 # CVE-2013-4211 assignment and July 15 sample confirmation
    - https://www.cisa.gov/news-events/alerts/2013/08/08/openx-releases-security-update # US-CERT alert
    - https://arstechnica.com/information-technology/2013/08/backdoor-in-popular-ad-serving-software-opens-websites-to-remote-hijacking/ # News and technical context
    - https://www.tenable.com/plugins/nessus/69371 # Detection details for CVE-2013-4211
    - https://blog.sucuri.net/2013/12/openx-compromise-serving-malware.html # Original disclosure
  versions:
