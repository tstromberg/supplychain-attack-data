schema_version: 1
interpretation:
  - >-
    Gentoo force-pushed the affected branches back to their last legitimate commits. The
    parent-revision files stored under before therefore also represent the restored post-incident
    state and are stored only once.
  - >-
    afcdc03b added the same destructive line to every ebuild. One exact ebuild pair is retained as
    representative payload evidence; the official incident report and exact commit IDs preserve the
    full scope. The same malicious tree was then force-pushed as e6db0eb4 to gentoo/gentoo and
    gentoo/musl.
