<html lang="en-us"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Page not found 404 | Ars Technica</title>

  <style>
    /* Exo 2 fallback */
    @font-face {
      font-family: 'Exo 2-fallback';
      size-adjust: 102.13%;
      ascent-override: 91%;
      src: local('Arial');
    }

    /* latin */
    @font-face {
      font-family: 'Exo 2';
      font-style: normal;
      font-weight: 500;
      font-display: fallback;
      src: url('https://cdn.arstechnica.net/wp-content/themes/ars-v9/public/fonts/7cHmv4okm5zmbtYoK-4.a71c5e.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
        U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
        U+FEFF, U+FFFD;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(180deg, #0a0a0a 0%, #12121a 100%);
      min-height: 100vh;
      font-family: 'Exo 2', 'Exo 2-fallback', sans-serif;
      font-weight: 600;
      padding: 0;
      position: relative;
    }

    #stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      text-align: center;
      padding: 2rem;
      padding-top: max(2rem, calc(50vh - 300px));
    }

    .shark {
      display: block;
      width: 100%;
      max-width: 400px;
      height: auto;
      margin: 0 auto 1.5rem auto;
      filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.5));
    }

    .home-link {
      display: inline-block;
      border: 1px solid #c9cbc8;
      padding: 0.875rem 3rem;
      color: #c9cbc8;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.5rem;
      letter-spacing: 0.1em;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    .home-link:hover {
      background: rgba(201, 203, 200, 0.1);
      transform: translateY(-2px);
    }

    .logo-link {
      display: flex;
      justify-content: center;
      margin-top: 2.5rem;
    }

    .logo {
      width: 120px;
      height: auto;
      opacity: 0.5;
      transition: opacity 0.2s ease;
    }

    .logo:hover {
      opacity: 0.8;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .error-message {
      font-size: 1.5rem;
      color: #c9cbc8;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      text-wrap: pretty;
    }

    @media (max-width: 480px) {
      .home-link {
        font-size: 1.1rem;
        padding: 0.875rem 1.2rem;
      }

      .error-message {
        font-size: 1.2rem;
        margin-bottom: 1.3rem;
      }
    }
  </style>
</head>

<body>
  <canvas id="stars" width="756" height="413"></canvas>
  <div class="container">
    <p class="error-code sr-only">404</p>
    <h1 class="sr-only">Page not found</h1>
    <img src="https://cdn.arstechnica.net/wp-content/uploads/2023/10/404-moonshark.png" width="402" height="407" alt="Moon shark" class="shark" loading="lazy">
    <p class="error-message">Alas, the Moonshark has eaten your link.</p>
    <a href="/" class="home-link">Back to homepage?</a>
    <a href="/" class="logo-link">
      <img src="https://cdn.arstechnica.net/wp-content/uploads/2024/10/ars-logo.png" width="248" height="80" alt="Ars Technica" class="logo">
    </a>
  </div>
  <script>
    (function () {
      const canvas = document.getElementById('stars');
      const ctx = canvas.getContext('2d');
      let stars = [];

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        initStars();
      }

      function initStars() {
        stars = [];
        const count = Math.floor((canvas.width * canvas.height) / 8000);
        for (let i = 0; i < count; i++) {
          stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 1.5 + 0.5,
            alpha: Math.random() * 0.5 + 0.2,
            twinkleSpeed: Math.random() * 0.02 + 0.005,
            drift: (Math.random() - 0.5) * 0.15,
            rise: Math.random() * 0.1 + 0.02
          });
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const time = Date.now() * 0.001;

        for (const star of stars) {
          star.x += star.drift;
          star.y -= star.rise;

          if (star.y < -5) {
            star.y = canvas.height + 5;
            star.x = Math.random() * canvas.width;
          }
          if (star.x < -5) star.x = canvas.width + 5;
          if (star.x > canvas.width + 5) star.x = -5;

          const twinkle = Math.sin(time * star.twinkleSpeed * 50 + star.x) * 0.3 + 0.7;
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha * twinkle})`;
          ctx.fill();
        }

        requestAnimationFrame(draw);
      }

      window.addEventListener('resize', resize);
      resize();
      draw();
    })();
  </script>


</body></html>
