  notes:
  - Microsoft and OpenVSX reported 28 and 41 downloads for 18.95.0, but Nrwl's internal
    analytics counted roughly 6,000 extension activations in the two days following the
    incident. The impact users field uses the activation figure.
  - Nrwl attributes the contributor compromise to the TanStack Mini Shai-Hulud incident a
    week earlier (see [[tanstack-router]]), which leaked GitHub CLI credentials and let the
    attacker reach the Nx Console publishing path.
  - The earlier August 2025 s1ngularity attack on nx and @nrwl/nx packages is recorded
    separately as [[nx-build]]; that record's nx-console artifact covers extension
    exposure during the npm compromise, not this direct marketplace publish.
