- id: nx-console
  title: Nx Console VS Code extension shipped credential stealer
  campaigns:
  - shai-hulud-here-we-go-again
  synopsis: >-
    A compromised contributor published Nx Console 18.95.0 to the VS Code Marketplace and OpenVSX
    on 2026-05-18. The malicious build fetched an obfuscated payload that harvested Vault, npm,
    AWS, GitHub, 1Password, and SSH credentials and installed a Python LaunchAgent on macOS.
  story: |
    Nine months after a high-profile worm called s1ngularity tore through the
    Nx ecosystem, a new attacker briefly published a malicious version of the
    popular Nx Console VS Code extension on the Visual Studio Marketplace and
    OpenVSX on May 18, 2026 — and according to StepSecurity, this one came a
    step closer to abusing Sigstore for legitimate-looking provenance
    attestations than any earlier supply-chain compromise.

    Nx Console is a Visual Studio Code companion extension to the Nx build
    system. After the 2025 s1ngularity incident, Nrwl, the company behind Nx,
    added a manual-approval gate to the `nx` npm publish pipeline. Nx Console
    kept its older setup, in which a single organization member could publish
    a new extension version unattended. On May 18, an attacker used a stolen
    contributor credential to publish a malicious version 18.95.0 to both
    marketplaces.

    According to Nrwl, the credential traced back to the TanStack Mini
    Shai-Hulud compromise a week earlier. That payload had stolen GitHub CLI
    tokens from a Nrwl developer's machine — enough access to run workflows on
    the Nx Console repository as a contributor and reach the extension publish
    step. The malicious build was live on the Visual Studio Marketplace for
    18 minutes, from 12:30 to 12:48 UTC, and on OpenVSX for 36 minutes, from
    12:33 to 13:09 UTC.

    The extension fetched and ran an obfuscated, multi-channel credential
    stealer. StepSecurity, which published the most detailed dissection of the
    payload, said it harvested Vault tokens, `.npmrc` credentials, AWS metadata
    endpoints and Secrets Manager entries, GitHub `ghp_`, `gho_`, and `ghs_`
    tokens, GitHub Actions secrets, 1Password CLI sessions, on-disk private
    keys, database connection strings, GCP service accounts, and Docker
    credentials. Exfiltration ran over HTTPS, through the GitHub API using the
    victim's own tokens, and over DNS. On Linux, the payload attempted
    sudoers injection. On macOS, it wrote `~/.local/share/kitty/cat.py` and
    registered `~/Library/LaunchAgents/com.user.kitty-monitor.plist` as a
    LaunchAgent.

    StepSecurity also identified Sigstore-related code paths in the payload:
    requests for short-lived signing certificates from `fulcio.sigstore.dev`,
    log entries to `rekor.sigstore.dev`, and `slsa.dev/provenance/v1`
    attestations through npm's OIDC trusted-publisher flow. With the right
    OIDC material and enough time on a runner, the attacker could in principle
    have published follow-on npm versions carrying valid provenance
    attestations — a meaningful escalation over earlier worms, where forged
    provenance was not in reach. The exposure window closed before any such
    publish landed.

    Microsoft and OpenVSX reported 28 and 41 downloads respectively for
    version 18.95.0. Nrwl's internal telemetry, however, counted roughly 6,000
    extension activations from VS Code over the next two days. Nrwl shipped
    18.100.0, added a two-admin approval step to Nx Console publishes to mirror
    the `nx` npm pipeline, and instructed affected users to update, kill any
    `cat.py` or `__DAEMONIZED` processes, unload the LaunchAgent, delete the
    persistence files, and rotate every credential reachable from the machine.
  start_date: 2026-05-18
  end_date: 2026-05-18
