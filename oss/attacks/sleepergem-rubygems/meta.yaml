    role: distribution
  indicators:
  - kind: domain
    value: git.disroot.org
  - kind: directory
    value: ~/.local/share/gcm/
  - kind: file
    value: /usr/local/sbin/ping6
  - kind: technique
    value: exits when CI environment variables are detected
  - kind: technique
    value: 'redundant persistence via systemd --user and cron'
  - kind: account
    value: 'RubyGems: LR-DEV'
  - kind: account
    value: 'RubyGems: pinkroom'
  notes:
  - >-
    Only the hijacked pre-existing gems are recorded as artifacts. The campaign's third gem,
    git_credential_manager 2.8.0 to 2.8.3, was created by the attacker to impersonate
    Microsoft's tool and is out of scope here.
  - >-
    The loader checks roughly thirty CI-related environment variables and exits under GitHub
    Actions, GitLab CI, CircleCI, Jenkins, Travis or Vercel, targeting workstations rather than
    build runners.
  - >-
    Two maintainer accounts were involved, LR-DEV and pinkroom. Reported exposure of over
    574,000 counts historical downloads of the gem names, not installs of the malicious
    versions.
  - >-
    RubyGems yanked the malicious versions, but exact complete archives for both Dendreo
    releases and the fastlane plugin were recovered from public incident-analysis captures and
    reproduce RubyGems' retained SHA-256 values.
