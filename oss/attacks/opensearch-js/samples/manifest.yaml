schema_version: 1
interpretation:
  - >-
    Forager d4c2240e2dc9 with FORAGER_ALLOW_PARTIAL=1 recovered 1,033 of the 1,035 members Socket
    retained for @opensearch-project/opensearch 3.8.0. Every recovered member has a Q-prefixed
    Socket address and independently matches its decoded SHA-256 and listed size.
  - >-
    The two absent TypeScript declaration files have opaque S-prefixed Socket content IDs. They are
    not attack code, but their exact bytes cannot be inferred from those IDs, so the archive remains
    RECONSTRUCTED-PARTIAL.
  - >-
    The recovered package.json is the attack-bearing member: it adds an optional @opensearch/setup
    dependency pinned to deleted OpenSearch repository commit
    d446803f4c3bc116263faa3499a1d3f95b2825de. GitHub no longer advertises that object, so the
    dependency it would have fetched during installation is not overlaid here.
