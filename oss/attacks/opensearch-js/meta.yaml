  title: OpenSearch npm prereleases compromised
  campaigns:
  - teampcp-2026
  - shai-hulud-here-we-go-again
  synopsis: The Mini Shai-Hulud campaign reached OpenSearch when four prerelease versions
    of the official @opensearch-project/opensearch npm package were published with
    malicious payloads. The advisory maps the release window to May 11, 2026 EDT,
    or May 12 UTC, and recommends immediate removal of affected prereleases. The impact
    followed the broader worm pattern, with install-time credential theft risk and
    potential propagation through stolen developer and publishing tokens.
