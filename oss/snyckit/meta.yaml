- name: snyckit
  title: snyckit npm phishing compromise
  repo: https://www.npmjs.com/package/snyckit
  synopsis: >-
    StepSecurity confirmed snyckit 0.11.9 as one of the npm packages affected
    by the July 2025 npnjs.com maintainer phishing campaign. The attacker used a
    phished maintainer credential path to publish malicious releases directly to
    npm without corresponding source repository changes. In the
    eslint-config-prettier cluster, the malicious package family executed
    install.js during installation and launched a bundled Windows DLL through
    rundll32 on Windows systems.
