- name: nx-build
  title: Nx Build "s1ngularity" Supply Chain Attack
  repo: https://github.com/nrwl/nx
  synopsis: "Attackers exploited a vulnerable GitHub Action workflow in the Nx build platform repository to modify publish.yml and extract a maintainer's npm token. Using this token, they published 19 malicious versions of Nx packages containing a post-installation script (telemetry.js) that targeted macOS and Linux. The malware searched for crypto wallets, GitHub/npm tokens, and SSH keys, exfiltrating the data to public GitHub repositories (e.g., s1ngularity-repository) created under the victim's account, and then forced system shutdowns."
  start_date: 2025-08-26
  end_date: 2025-08-27
