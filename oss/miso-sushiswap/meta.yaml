- name: miso-sushiswap
  title: SushiSwap MISO launchpad commit redirected auction proceeds
  repo: https://github.com/sushiswap/miso
  synopsis: On 2021-09-17 a contractor with merge access to the SushiSwap MISO (Minimal Initial Sushi Offering) launchpad GitHub repository pushed a single-line code change that swapped the auction's payout address with their own. Approximately 864.8 ETH (~$3 million at the time) raised through the Jay Pegs Auto Mart NFT auction was diverted to the attacker before SushiSwap engineers detected and reverted the commit. Because the attacker's wallet address was a known contractor wallet, SushiSwap was able to identify them and the funds were returned within hours.
  start_date: 2021-09-17
  end_date: 2021-09-17
