- name: intercom-client
  title: Intercom Node.js SDK Compromise (Mini Shai-Hulud)
  repo: https://github.com/intercom/intercom-node
  synopsis: "The Mini Shai-Hulud campaign compromised the official intercom-client package on npm. Attackers compromised a maintainer account and utilized a preinstall hook to run setup.mjs, ensuring execution before the package was even imported. The payload executed credential-stealing logic targeting GitHub tokens, SSH keys, cloud credentials, and .env files, sending them to zero.masscan.cloud."
