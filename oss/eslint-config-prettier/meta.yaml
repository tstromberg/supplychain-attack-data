- name: eslint-config-prettier
  title: npm Phishing Campaign Targets Prettier Tooling
  repo: https://github.com/prettier/eslint-config-prettier
  synopsis: >-
    A phishing campaign targeting npm maintainers through the typosquatted
    npnjs.com domain compromised eslint-config-prettier. The attacker added a
    malicious npm token to maintainer JounQin's account and published
    eslint-config-prettier 8.10.1, 9.1.1, 10.1.6, and 10.1.7 directly to npm
    without matching GitHub source changes. The malicious package executed
    install.js during installation and, on Windows hosts, launched bundled
    node-gyp.dll with rundll32. NVD assigned CVE-2025-54313 to the
    eslint-config-prettier compromise. Related packages from the same campaign
    are tracked separately in their own records.
  start_date: 2025-07-18
  end_date: 2025-07-19
  attribution_type: Third Party
  component_type: Library
  lang: JavaScript
  cause: Social Engineering
  motive: Remote Code Execution
  transitive: true
  historical_artifacts: []
  current_artifacts:
    - https://www.npmjs.com/package/eslint-config-prettier
  domain: npmjs.com
  domain_type: package host
  artifact_type: source archive
  insertion_phase: distribution
  impact_type: Code Execution
  impact_user_count: 5000000
  references:
