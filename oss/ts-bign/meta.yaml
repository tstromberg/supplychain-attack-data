- name: ts-bign
  title: ts-bign npm Polymarket wallet stealer
  repo: https://www.npmjs.com/package/ts-bign
  synopsis: >-
    ts-bign 1.2.8 was one of the malicious npm packages embedded in a fake
    Polymarket trading bot hosted under the hijacked dev-protocol GitHub
    organization. The package posed as numeric-library plumbing but pulled in
    levex-refa, a transitive file stealer that searched for environment files,
    Solana keypairs, and trading-bot configuration, then exfiltrated them with
    local user and IP metadata. The case is historically useful because the scam
    bot still called real Polymarket APIs, making the theft path look like a
    functional trading tool.
