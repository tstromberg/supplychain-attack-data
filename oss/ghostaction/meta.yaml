- name: ghostaction
  title: GhostAction GitHub Actions campaign exfiltrates 3,325 secrets
  synopsis: GitGuardian disclosed on 2025-09-05 that an attacker had injected malicious workflow files named "Github Actions Security" into 817 repositories across 327 GitHub user accounts. The injected workflows enumerated specific secret variable names referenced by each repo's legitimate CI/CD pipelines and exfiltrated them via HTTP POST to `bold-dhawan.45-139-104-115.plesk.page` (45.139.104.115). 3,325 secrets were stolen, including PyPI and npm publishing tokens, DockerHub credentials, GitHub PATs, AWS access keys, database credentials, and Cloudflare API tokens. 24 downstream packages (9 npm, 15 PyPI) were left at immediate risk of follow-on supply-chain compromise via the stolen publishing credentials.
  start_date: 2025-08-28
  end_date: 2025-09-05
  attribution_type: Unknown attacker
  component_type: CI/CD plugin
  lang: yaml
  cause: Compromised credentials
  motive: Credential theft
  transitive: true
  insertion_phase: CI/CD
  impact_type: Credential theft, Token theft
  impact_user_count: 327
  references:
    - https://blog.gitguardian.com/ghostaction-campaign-3-325-secrets-stolen/
    - https://thehackernews.com/2025/09/ghostaction-campaign-steals-3325.html
