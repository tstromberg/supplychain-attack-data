- name: shai-hulud-here-we-go-again
  title: Shai-Hulud hits NPM and PyPI
  synopsis: >-
    Shai-Hulud: Here We Go Again was a May 2026 TeamPCP campaign affecting more
    than 170 npm packages and 2 PyPI packages with a combined package download
    volume above 200 million per week. This record tracks the broader npm
    campaign and the guardrails-ai PyPI package, beyond the separately tracked
    TanStack Router, OpenSearch, and mistralai package-scope incidents. The npm payload used
    preinstall loaders, Bun, GitHub Actions OIDC
    and runner-memory secret extraction, cloud, Kubernetes, Vault, local, and
    password-manager credential harvesting, GitHub and Session/Oxen exfiltration,
    npm self-propagation, and a destructive GitHub-token revocation monitor.
  start_date: 2026-05-11
  end_date: 2026-05-12
