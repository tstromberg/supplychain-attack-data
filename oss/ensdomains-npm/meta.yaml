- name: ensdomains-npm
  title: ENS NPM Account Compromise (Shai Hulud V2)
  repo: https://github.com/ensdomains/ens-contracts
  synopsis: >-
    The Sha1-Hulud "Second Coming" npm worm compromised many Ethereum Name
    Service packages, including @ensdomains/ensjs, @ensdomains/ens-contracts,
    @ensdomains/ens-validation, ethereum-ens, and supporting ENS libraries.
    Affected releases invoked Bun from a preinstall hook and ran an obfuscated
    payload that harvested GitHub, npm, cloud, and local secrets, exfiltrated
    them through public GitHub repositories, attempted npm propagation,
    registered a self-hosted GitHub Actions runner, and included destructive
    behavior on non-CI Linux hosts.
  start_date: 2025-11-23
  end_date: 2025-11-24
  attribution_type: Third Party
  component_type: Library
  lang: JavaScript
  cause: Compromised Account/Credentials
  motive: Credential Theft
