- name: num2words
  title: num2words Maintainer Phishing and Account Takeover
  repo: https://github.com/savoirfairelinux/num2words
  synopsis: >-
    Attackers used the lookalike pypj.org domain to phish PyPI maintainers,
    steal credentials and 2FA codes, create a new API token, and upload
    malicious num2words releases. The first suspicious release, 0.5.15, appeared
    on PyPI without a matching GitHub tag, commit, or release. The later GitHub
    advisory confirmed that both 0.5.15 and 0.5.16 contained malware and were
    removed from PyPI. The incident is part of the broader Scavenger-era
    maintainer phishing wave.
  start_date: 2025-07-28
  end_date: 2025-07-31
  attribution_type: Cybercriminal gang
  component_type: Library
  lang: Python
  cause: Social Engineering
  motive: Credential Theft
  transitive: false
  historical_artifacts:
    - https://pypi.org/project/num2words/0.5.15/
    - https://pypi.org/project/num2words/0.5.16/
    - https://github.com/savoirfairelinux/num2words/tags
  current_artifacts:
    - https://github.com/savoirfairelinux/num2words
  domain: pypi.org
  domain_type: package host
  artifact_type: source archive
  insertion_phase: distribution
  impact_type: Credential Theft
  impact_user_count: 50000
  references:
    - https://www.stepsecurity.io/blog/supply-chain-security-alert-num2words-pypi-package-shows-signs-of-compromise
    - https://github.com/advisories/GHSA-jxr6-qrxx-2ph2
  versions:
