- name: sap-cap-js
  title: SAP CAP Packages Mini Shai-Hulud
  repo: https://github.com/cap-js/cds-dbs
  synopsis: >-
    Mini Shai-Hulud compromised SAP ecosystem npm packages mbt,
    @cap-js/sqlite, @cap-js/postgres, and @cap-js/db-service through two release
    paths: a stolen static npm token for mbt and an abused GitHub Actions OIDC
    publishing flow for cap-js/cds-dbs. The malicious releases ran a Bun-based
    credential stealer, exfiltrated encrypted secrets through attacker-created
    GitHub repositories, added IDE persistence through Claude Code and VS Code
    hooks, injected repository-secret stealing workflows, and attempted
    propagation through stolen npm tokens.
  start_date: 2026-04-29
  end_date: 2026-04-30
