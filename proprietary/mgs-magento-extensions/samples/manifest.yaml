    source:
      url: https://sansec.io/research/license-backdoor
      retrieved_at: '2026-09-02T20:10:27Z'
      kind: original_incident_report_fragment
    verification:
      status: payload_only
      basis:
        - measured_sha256
      evidence:
        - retained_report_page_02_sansec_io_html
        - measured_sha256
    notes:
      - >-
        The mechanism as Sansec published it: registration.php includes a License.php that ships
        with the module, and adminLoadLicense passes the licence file straight to include_once, so
        the licence file is executed as PHP.
      - >-
        The hard-coded SECURE_KEY and SIGN_KEY constants are the vendor's, and are what let the
        attacker sign a licence the module would run.
      - >-
        A report excerpt, not the shipped extension. The vendor download URLs this record cites
        answer 403 or 404 and the Internet Archive holds no capture of any of them.
    subject: mgs-magento-extensions
