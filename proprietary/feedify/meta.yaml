---
- id: feedify
  title: Feedify push notification script compromised.
  synopsis: Feedify, a push notification service provider, had its JavaScript library
    compromised. Attackers injected malicious code into the script served to Feedify's
    customers. This skimmer code was then loaded on the websites of numerous businesses
    using Feedify, attempting to steal payment card details from their end-users.
  start_date: 2018-09-01
  end_date: 2018-11-01
