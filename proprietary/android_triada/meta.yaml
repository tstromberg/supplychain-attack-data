- id: android-triada
  title: Android firmware shipped Triada backdoor
  synopsis: >-
    Triada moved from an advanced Android trojan into the firmware supply chain for low-cost
    Android devices.
  story: |
    Triada did not start as a firmware incident. Kaspersky first described it as a modular Android trojan that used root privileges, hid much of its work in memory, and pushed code into Zygote, the parent process Android uses to launch applications. That made Triada less like a nuisance adware bundle and more like a platform for whatever modules its operators wanted next.

    The supply-chain turn came when Dr.Web found `Android.Triada.231` built into firmware images on low-cost Android phones, including Leagoo and Nomu models. The malicious code was embedded in `libandroid_runtime.so`, a system library used by Android applications, and Dr.Web traced the hook to the Android log path: when an application wrote to the system log, the modified library could run Triada code from system context. From there the backdoor could enter app processes, decrypt module files, load native code as `libcnfgp.so`, or run Java payloads through `mms-core.jar`. Securelist's 2016 browser-spoofing write-up shows why that mattered. Once Triada lived inside another app's process, a module could intercept URLs and swap destinations without the user ever seeing a separate malicious app.

    The suspected insertion point was not the Android Open Source Project itself. It was the commercial layer where device makers and partners customize firmware images before shipping, and Dr.Web explicitly pointed to insiders or unscrupulous firmware partners as plausible sources. A factory reset does not remove malware from the system partition, so the real fix was a clean firmware image from the manufacturer.

    This record keeps the early OEM and firmware supply-chain Triada cases separate from the 2025 counterfeit-smartphone wave. They share malware lineage and tactics, but the public facts are different: the older reports centered on legitimate low-cost device firmware and partner customization, while the later Kaspersky report described fake devices sold through online marketplaces.
  start_date: 2016-01-20
  end_date: 2019-06-06
