  notes:
  - >-
    Rapid7 recovered the authentication backdoor as a hardcoded password disguised to read
    as a debug format string, and located it in the SSG5 and SSG20 ARM firmware at
    sub_13DBEC. Any username paired with that password authenticated over SSH or Telnet
    regardless of whether the account existed.
  - >-
    No file hash is recorded for the affected firmware images. Juniper's advisory identifies
    the affected builds by version rather than by digest, and the published analyses worked
    from decompressed binaries without stating a digest for the distributed image.
  - >-
    No cited source attributes the unauthorized code to a specific actor. Juniper did not name
    one, and Checkoway et al. explicitly decline to attribute, so the actor is recorded as
    unknown despite widespread press speculation about a state operator.
  - >-
    The start date is imprecise. The Q parameter change is located only by a version diff
    between ScreenOS 6.2.0r14 and 6.2.0r15; no source establishes a day, so 2012-09-01 stands
    in for "the 6.2.0r15 timeframe" rather than a known date.
  - >-
    The end date marks the December 2015 out-of-cycle patch, which restored Juniper's original
    Q value. It does not mark the end of the underlying PRNG weakness: Dual_EC and the skipped
    ANSI X9.31 filter remained in ScreenOS from the 2008 6.2 release until Juniper announced
    their removal in January 2016 and shipped the replacement in ScreenOS 6.3.0r22 in April
    2016.
  - >-
    Juniper's advisory was originally published as kb.juniper.net/InfoCenter/index?page=content&id=JSA10713,
    the identifier cited by Checkoway et al. That URL now redirects to the Juniper support
    portal article listed in the references, which serves a JavaScript shell with no readable
    text; the archived PDF alongside this record is the usable copy.
