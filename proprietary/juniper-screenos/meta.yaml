---
- id: juniper-screenos
  title: Juniper ScreenOS firmware contained unauthorized backdoors
  synopsis: Juniper disclosed on December 17, 2015 that unauthorized code had entered
    official ScreenOS firmware for NetScreen firewalls. One flaw, CVE-2015-7755,
    let remote SSH or Telnet users obtain administrator access with a hidden password.
    The other, CVE-2015-7756, weakened VPN encryption so a knowledgeable passive
    observer could decrypt traffic. The case remains notorious because the same
    firewall image carried both command access and traffic-surveillance risk.
  story: |
    The Juniper ScreenOS incident was not a normal bug disclosure. Juniper said an internal review found unauthorized code in ScreenOS, the operating system for NetScreen firewalls. The affected firmware was official vendor firmware, distributed through the normal ScreenOS channel, and the product sat directly on network boundaries.

    CVE-2015-7755 was the administrative-access backdoor. Rapid7 and Fox-IT analysis found an authentication path in SSH and Telnet that compared the supplied password against the string `<<< %s(un='%s') = %u`. The string looked like a format string, but on vulnerable builds it was a master password: any username could reach an administrative shell with the highest privileges.

    CVE-2015-7756 was a separate VPN decryption vulnerability. Juniper described it as independent of the authentication bypass. Researchers tied the weakness to ScreenOS random-number generation and the Dual_EC_DRBG controversy: a changed parameter could let someone who knew the corresponding secret passively decrypt VPN traffic they could capture.

    The two issues had different version scopes. Juniper's bulletin gave broad affected ScreenOS ranges, while Rapid7 reported that the authentication backdoor appeared later in the 6.3.0 line and Juniper later confirmed it for 6.3.0r17 through 6.3.0r20. The VPN weakness covered the broader 6.2.0r15 through 6.2.0r18 and 6.3.0r12 through 6.3.0r20 ranges.
