---
- id: juniper-screenos
  title: Juniper ScreenOS firmware contained unauthorized backdoors
  synopsis: Juniper disclosed on 2015-12-17 that unauthorized code was found in official
    ScreenOS firmware shipped on NetScreen firewalls. CVE-2015-7755 added a hardcoded
    master password (`<<< %s(un='%s') = %u`) granting administrative SSH/Telnet access
    to any device. CVE-2015-7756 weakened the Dual_EC_DRBG random number generator
    by replacing the Q parameter, enabling passive decryption of VPN traffic by anyone
    holding the corresponding private key. The malicious code is believed to have
    been present since 2012 (in 6.2.0r15 and later, and 6.3.0r12 and later) and is
    widely attributed to a nation-state actor — possibly building on a pre-existing
    NSA-influenced backdoor.
