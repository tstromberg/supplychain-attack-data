- id: cursor-claude-code
  title: Cursor marketplace distributed a modified Claude Code extension
  synopsis: >-
    Cursor distributed a malicious Anthropic.claude-code 2.1.313 extension through its marketplace.
    The modified package collected host details and attempted to establish a persistent SSH
    backdoor.
  start_date: '2026-10-29T09:27:00Z'
  target:
    name: Cursor Extension Marketplace
    kind: distribution_site
    website: https://cursor.com
  method:
    phase: distribution
  artifacts:
    - id: claude-code-darwin-arm64
      name: Anthropic.claude-code darwin-arm64
      kind: ide_extension
      versions:
        - 2.1.313
      notes:
        - >-
          The advisory’s reported macOS digest is disputed by the recovered archive identity; see
          samples/manifest.yaml.
    - id: claude-code-win32-x64
      name: Anthropic.claude-code win32-x64
      kind: ide_extension
      versions:
        - 2.1.313
      hashes:
        - sha256:3de1722901165769893bef57c72594e9a54459faa23f3091b136b79966edd081
  references:
    - url: https://cursor.com/en-US/blog/claude-code-extension-security-notice
      title: 'Security notice: malicious Anthropic.claude-code 2.1.313 in Cursor Extension Marketplace'
    - url: https://socket.dev/blog/claude-code-extension-compromise
      title: Cursor Removes Malicious Claude Code 2.1.313 Extension From Its Marketplace
  end_date: '2026-10-29T20:35:00Z'
  language: JavaScript
  impact:
    types:
      - backdoor
      - data_theft
  notes:
    - >-
      Cursor confirmed its marketplace as the distribution channel. Socket found no corresponding
      Open VSX publication record. This record does not claim a compromise of Anthropic or Open VSX.
    - >-
      Cursor reported that enabling SSH generally failed without administrator privileges.
      Persistence and host-information collection still required remediation.
    - >-
      The recovered macOS advisory digest identifies anysphere.remote-ssh 1.1.17 internally. It is
      disputed evidence, not a verified Claude Code package; see samples/manifest.yaml.
