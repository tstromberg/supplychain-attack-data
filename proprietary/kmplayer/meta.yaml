- id: kmplayer
  title: KMPlayer updater pushed fake malware release
  synopsis: >-
    KMPlayer's update flow offered a fake 3.7.0.87 release that installed malware. KMP Media
    confirmed external attack activity and warned July-August 2013 users.
  story: >
    KMPlayer users saw an update prompt for version 3.7.0.87 even though the vendor's current clean
    release was 3.6.0.87. Taiwanese reporting says the prompt led to a different site, which served
    `KMP_3.7.0.87.exe` rather than a normal upgrade.


    Taiwanese security reporting said the fake updater installed malware into a hidden folder. It
    also described relay or command domains under `abacocafe.com`, including `pen.abacocafe.com`,
    `pens.abacocafe.com`, `cdn.abacocafe.com`, and `vpen.abacocafe.com`.


    KMP Media acknowledged an external attack through a KMPlayer emergency notice. The company
    warned users who downloaded or installed KMPlayer between 2013-07-26 and 2013-08-08 to scan
    their systems, said it had strengthened software security, and referred the matter to
    investigators.


