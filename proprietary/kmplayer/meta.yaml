- name: KMPlayer
  title: KMPlayer installer/updates distributed malware.
  synopsis: KMPlayer, a freeware media player, reportedly distributed unwanted software, adware, or potentially more malicious payloads through some installer and update channels. Users who expected a media player instead encountered bundled programs and advertisements, a gray-zone supply chain where monetization blurred into unwanted execution.
