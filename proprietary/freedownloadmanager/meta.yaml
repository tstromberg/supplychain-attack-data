---
- id: freedownloadmanager
  title: FreeDownloadManager site served backdoored Linux version.
  synopsis: The official FreeDownloadManager website was compromised and intermittently
    redirected Linux users to a domain serving a trojanized Debian package. The malicious
    package installed a backdoor and infostealer aimed at passwords, crypto wallets,
    and cloud credentials, turning selective redirects into quiet compromise.
  start_date: 2020-01-24
  end_date: 2022-01-01
