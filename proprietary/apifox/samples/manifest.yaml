      - phase: after
        version: '20260527124515'
    notes:
      - >-
        The tracking script as Apifox's CDN served it on 2026-03-05, the day after the window opens.
        The Electron client loaded this file at startup, which is why a CDN script reached SSH keys
        and git credentials.
      - >-
        Does not match the reported SHA-256
        91d48ee33a92acef02d8c8153d1de7e7fe8ffa0f3b6e5cebfcb80b3eeebc94f1; the archived gzip
        container hashes to 6d462af1a9ba8f1fac633593c79396dd968b6e39a7e8dcbc3e5953d28c577c61 and
        does not match it either. See the unresolved record.
      - >-
        The archived response was stored gzip-encoded; these are the decoded bytes, as recorded in
        the sidecar.
    subject: apifox-app-event-tracking
    commit: '20260305051418'
