schema_version: 1
interpretation:
  - >-
    The artifact is a CDN URL, not a release, so the sample is whatever cdn.apifox.com returned at a
    moment inside the window. The Internet Archive holds nine captures of that URL in total and
    exactly one from the incident window, 2026-03-05.
  - >-
    That capture is the clean file with 40332 bytes appended: its first 37859 bytes are
    byte-identical to the 2025-12-02 capture. The 2026-05-27 capture is back to 37965 bytes, which
    brackets the compromise on both sides from the archive alone.
  - >-
    The measured digest does not equal the SHA-256 the incident record publishes for this artifact.
    Neither the decoded bytes nor the archived gzip container matches it. The window ran eighteen
    days and this is a single moment inside it, so the reported digest most likely describes a
    different revision of the payload; it is left in meta.yaml, annotated rather than replaced, and
    the unresolved record keeps the question open.
