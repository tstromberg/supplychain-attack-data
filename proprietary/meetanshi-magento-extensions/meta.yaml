---
- id: meetanshi-magento-extensions
  title: Meetanshi Magento extensions shipped license backdoors
  campaigns:
  - magento-license-backdoor-2025
  synopsis: Meetanshi extension downloads were part of the Magento license-backdoor
    campaign reported by Sansec. The affected vendor packages carried PHP backdoor
    code in license-check paths.
  story: |-
    Meetanshi is modeled separately from the other Magento extension vendors because its download site and package portfolio were a distinct distribution boundary.

    Sansec reported PHP backdoor code posing as license logic in vendor-distributed extension ZIPs. The campaign record carries the shared license-backdoor pattern, long dwell time, and cross-vendor context.
  start_date: 2019-01-01
  end_date: 2025-05-01
  target:
    name: Meetanshi
    kind: extension
    website: https://meetanshi.com
  actor:
    name: Unknown
    kind: unknown
  language: PHP
  method:
    cause: vendor_server_compromise
    phase: distribution
    motive: remote_access
    transitive: false
  impact:
    types:
    - backdoor
    - remote_access
    - data_theft_potential
    users: 1000
  artifacts:
