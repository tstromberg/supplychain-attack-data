schema_version: 1
interpretation:
  - >-
    Nothing identifies the artifact. No source located for this incident names a file, a version, a
    size, or a hash for the tampered Blade Chronicle update files; the record rests on Aiming's
    emergency-maintenance notice and a contemporary Japanese summary of the CDNetworks intrusion.
  - >-
    Without a filename or a digest there is nothing to ask a registry, a hash provider, or the
    Internet Archive for. The gap is recorded rather than filled with the incident's own metadata,
    which would assert a sample that does not exist.
samples: []
unresolved:
  - artifact_id: blade-chronicle-update
    phase: during
    status: unidentified
    notes:
      - >-
        The affected unit is "the update files" served on 2014-05-26 and 2014-05-27 through
        CDNetworks, which the same intrusion used to tamper with Buffalo's Windows drivers. The
        Buffalo side of that intrusion is tracked separately and is identified no better.
      - >-
        What would unblock this: any contemporary Aiming release note, launcher manifest, or
        antivirus write-up naming a file or digest. A game client update from 2014 has no surviving
        public distribution point to enumerate.
    attempts:
      - >-
        No digest is published in any cited source, so the hash lanes (MalwareBazaar, Triage,
        Malshare) have nothing to query.
      - >-
        No distribution URL is published either; the only location on the record is a blog post
        about the incident, not a download.
    last_attempted_at: '2026-09-10T14:56:43.349Z'
