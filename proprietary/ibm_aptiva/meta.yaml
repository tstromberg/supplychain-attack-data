---
- id: ibm-aptiva
  title: IBM Aptiva PCs shipped pre-infected with CIH virus.
  synopsis: In early 1999, IBM accidentally shipped several thousand Aptiva consumer
    PCs pre-installed with the destructive CIH (Chernobyl) file virus. The contamination
    occurred during manufacturing due to an infected test diskette and outdated antivirus
    software on a duplication server, shortly before the virus's damaging payload
    activation date (April 26th).
