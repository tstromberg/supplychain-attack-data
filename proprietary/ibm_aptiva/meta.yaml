    notes:
    - Affected IBM Aptiva scope covered models 240, 301, 520, and 580 manufactured
      between 1999-03-05 and 1999-03-17.
    - IBM service bulletin DETR-46NRJW scoped the affected units to the Aptiva E
      Series, machine types 2158 and 2163, and is the source for the Norton
      AntiVirus detection procedure described in the pull quote.
    - No source gives a precise count of affected units, so none is recorded. IDG
      reported that "several thousand" Aptivas were exposed, while IBM's own
      service bulletin described "a very limited number" of machines.
