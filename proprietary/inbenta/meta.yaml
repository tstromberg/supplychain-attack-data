---
- id: inbenta
  title: Inbenta chatbot script compromised, hit Ticketmaster.
  synopsis: A third-party chatbot script provided by Inbenta Technologies to Ticketmaster
    UK (and potentially others) was compromised by attackers (Magecart group). Malicious
    JavaScript skimming code was injected into the legitimate script, allowing theft
    of payment card details and PII from users on Ticketmaster's payment pages where
    the widget was active.
  start_date: 2018-02-10
  end_date: 2018-06-23
