---
- id: solarwinds-orion
  title: SolarWinds Orion updates delivered widespread backdoors.
  synopsis: Attackers compromised SolarWinds' build system and inserted the Sunburst
    backdoor into signed Orion platform updates, reaching roughly 18,000 customers
    through trusted software. The operation opened access into U.S. federal agencies,
    security firms, and major enterprises, becoming one of the defining modern supply-chain
    intrusions. Supernova appeared as a related secondary backdoor in the same operational
    orbit.
