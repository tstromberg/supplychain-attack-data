      of: archive
      role: malicious
      note: >-
        An infected AIMP2 Core library, measured 2026-09-11 from the VX Heaven 2010 collection,
        where it is classified Virus.Win32.Induc.a.
    notes:
    - >-
      The media player this record's own notes name among the products found shipping infected
      builds. Its version resource reads AIMP2: Core 2.6.0.462, AIMP DevTeam, Artem Izmaylov.
    - >-
      A Delphi-built application, which is what made it a carrier: the virus infected only what a
      compromised Delphi installation compiled.
  notes:
  - >-
    Named products found shipping infected builds include the chat client QIP, the media player
    AIMP, Tidy Favorites and Any TV Free. Their source code was never modified.
  - >-
    The virus has no payload beyond propagation, which is likely why it circulated for months
    before anyone connected the reports.
  - >-
    Induc is the wild instance of the attack described in unix-c-compiler-bell-labs-experiment, and
    the same shape as xcodeghost: compromise the toolchain and every artifact inherits it.
