      role: distribution
    hashes:
    - sha256: ef66ca202f1f0998c13d8d350bf26bd8206c0979bfb5e84ef511ff2adb58403b
      of: archive
      role: malicious
      note: >-
        An infected Light Alloy build, measured 2026-09-10 from the VX Heaven 2010 collection,
        where it is classified Virus.Win32.Induc.c.
    notes:
    - >-
      A shipped product carrying the virus rather than the toolchain that produced it. Its version
      resource names Light Alloy 4.4.0.7948 by Softella, a Delphi-built multimedia player.
    - >-
      Induc infected only programs compiled on a machine whose Delphi SysConst it had rewritten, so
      an infected build of a released application had to come from the vendor's own build machine.
