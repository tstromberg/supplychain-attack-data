    attempts:
      - >-
        MalwareBazaar and Triage hold nothing under Induc, consistent with both feeds postdating
        2009.
      - >-
        The infected artifact is SysConst.dcu inside a developer's own Delphi installation. No
        vendor distributed it and no digest was published, so there is no coordinate or digest to
        fetch.
      - >-
        The reachable evidence would be one of the 3,000-plus infected applications Sophos
        collected, which are the downstream carriers rather than the infected compiler unit.
