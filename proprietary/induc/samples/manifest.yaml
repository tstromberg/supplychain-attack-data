        VXHeaven collection (archive.org viruses-2010-05-18, 47.88 GB, sha256 c6a64e80...978f),
        2026-09-10: streamed and hashed all 271094 members against every digest in this corpus. No
        match, but the result is not testable for this record, which names no hash for its artifact.
        The 2010 snapshot postdates Induc (August 2009) and holds 2 files the AV classification
        calls Induc; the 2007 snapshot predates the virus entirely.
