      - >-
        A hijacked Chrome extension update is removed by Google within days, and the CRX archives
        that mirror the Web Store keep the listing's ordinary releases rather than the build that
        was pulled.
      - The id above is what any future attempt needs; it is the part that was missing.
    attempts:
