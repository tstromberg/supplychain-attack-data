interpretation:
  - >-
    The extension id eenjdnjldapjajjofmldgmkjaienebbj was recovered on 2026-09-02 from the
    references retained under refs/ and added to meta.yaml. Until then this record named no id at
    all, which meant no CRX archive could be asked about it even in principle.
  - >-
    The hijacked CRX is not held; what is held is the malicious background script as the extension's
    own author published it after regaining control. Both files are transcriptions of code blocks,
    so they are verification_material and their digests name the transcriptions rather than anything
    the Chrome Web Store served.
  - >-
    The loader is worth reading closely because the delivery is the interesting part. It does
    nothing for the first ten minutes after install or update, which keeps it quiet during review
    and casual testing. It then takes the extension's own version, replaces the dots with dashes,
    and builds the name copyfish-npm-2-8-5; it fetches https://unpkg.com/<that name>/<current UTC
    hour>.js, so the payload rotates across 24 files and can be changed per hour without touching
    the extension. The URL is assembled from split string fragments ('sc'+'ript',
    'ht'+'tps://un'+'p'+'kg.com/') so that neither the host nor the tag appears as a literal in the
    source.
  - >-
    That makes the payload host an npm package served through unpkg, which is why the npm registry
    still carries the trail. registry.npmjs.org holds copyfish-npm-2-8-5 as a security holding
    package at 0.0.1-security, but its time field still names the three versions that were removed:
    1.0.1501325940, 1.0.1501413946 and 1.0.1501416918. Read as Unix timestamps those are 29 and 30
    July 2017, inside the incident.
  - >-
    The payload itself is gone. The tarballs 404 on both registry.npmjs.org and
    registry.npmmirror.com, and the Internet Archive's only capture of the unpkg path is itself a
    404 taken in 2019. Equivalent package names for the other extensions in this campaign --
    web-paint, infinity-new-tab, social-fixer -- do not resolve on npm at all, so the mechanism is
    documented here for Copyfish specifically rather than assumed for the rest.
