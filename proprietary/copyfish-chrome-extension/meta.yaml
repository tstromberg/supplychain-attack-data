    indicators:
    - kind: observable
      value: Chrome Web Store extension id eenjdnjldapjajjofmldgmkjaienebbj. Recovered 2026-09-02 
        from the vendor's own incident post retained under refs/, which links its extension by that 
        id; the listing is delisted so crx4chrome cannot corroborate it. Without it no archive can 
        be asked about this extension at all.
    - kind: package
      value: copyfish-npm-2-8-5 (npm, payload host)
    - kind: url
      value: https://unpkg.com/copyfish-npm-2-8-5/<UTC hour>.js
    - kind: observable
      value: removed npm versions 1.0.1501325940, 1.0.1501413946, 1.0.1501416918
    - kind: technique
      value: payload withheld for ten minutes after install to evade review
    - kind: technique
      value: host and script tag assembled from split string fragments
    locations:
    - uri: 
        https://chrome.google.com/webstore/detail/copyfish-free-ocr-soft/eenjdnjldapjajjofmldgmkjaienebbj
      role: distribution
    notes:
    - >-
      Recovered 2026-09-02: the malicious background script is held as a transcription of the
      code the extension's own author published after regaining the account. The payload it
      fetched is not held and appears unrecoverable.
    - >-
      The loader built an npm package name from the extension version, copyfish-npm-2-8-5, and
      pulled https://unpkg.com/copyfish-npm-2-8-5/<UTC hour>.js, so the payload rotated hourly
      across 24 files.
    - >-
      npm still holds that name as a security holding package and its time field lists the three
      removed versions 1.0.1501325940, 1.0.1501413946 and 1.0.1501416918, which as Unix
      timestamps are 29 and 30 July 2017.
    - >-
      The tarballs 404 on both npmjs.org and npmmirror.com, and the Internet Archive's only
      capture of the unpkg path is a 404 from 2019.
