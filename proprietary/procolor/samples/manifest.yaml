interpretation:
- A metadata-backed evidence placeholder was removed from this manifest once the artifact's actual bytes
  were recovered; it described the incident record, not the file.
- The three printer models share a single distributed archive. It is stored once and related to each model
  rather than copied per artifact, which is the layout rule for a file several affected units have in
  common.
- 'The after samples were pulled on 2026-09-03 from the six public MEGA folders this record cites as mirrors,
  which are Procolored''s own live distribution. They are not the compromised builds: every PrintExp package
  there is 5.7.6.5.94 dated 2025-05-19 against the infected 5.7.6.5.77 of 2024-06-25, none carries the
  dot-prefixed or ._cache_ members that mark XRed, and VirusTotal reports no detections on any of them.
  Three distinct files serve all six models: one PrintExp package shared by V11 Pro, F13 Pro and VF13
  Pro, one driver shared by F8 and V6, and the F13 printer driver.'
