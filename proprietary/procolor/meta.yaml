- name: Procolored
  title: Procolored printer software downloads contained malware
  synopsis: Procolored shipped printer companion software through USB media and official website download links that led to infected Mega-hosted packages. Cameron Coward first found Floxif on vendor-supplied media while reviewing a V11 Pro DTO printer; G DATA then confirmed malware in official downloads for six product lines. The website packages contained XRedRAT and SnipVex, enabling remote control, keylogging, screenshots, file manipulation, and clipboard cryptocurrency theft before Procolored removed the downloads around May 8, 2025.
  start_date: 2024-10-01
  end_date: 2025-05-08
  attribution_type: Unknown
  component_type: Driver
  lang: multiple
  cause: compromised distribution
  motive: financial gain
  transitive: true
  insertion_phase: distribution
  impact_type: Backdoor, Credential theft, File infection
  impact_user_count: 1000
