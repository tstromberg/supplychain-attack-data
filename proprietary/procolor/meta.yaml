  notes:
  - >-
    G Data identified two families in the downloads, the Delphi backdoor
    Win32.Backdoor.XRedRAT.A and a .NET file infector it nicknamed SnipVex, detected as
    MSIL.Trojan-Stealer.CoinStealer.H. It counted 39 infected files across the packages, of
    which 20 carried distinct hashes.
  - >-
    The archive hash recorded on f13-pro, v11-pro, and vf13-pro is the same file. G Data lists
    PrintExp_X64_V5.7.6.5.77.2024.06.25.Single.zip as shared across those three models, so one
    set of bytes was served for all of them.
  - >-
    The command-and-control server had been offline since February 2024, before the downloads
    were pulled, so infected hosts could not reach it during much of the exposure window.
    Procolored initially dismissed the detections as false positives.
