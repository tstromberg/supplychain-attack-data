    - kind: path
      value: '%LOCALAPPDATA%\updater.exe'
    - kind: observable
      value: Windows builds of DogWifTools versions 1.6.3 through 1.6.6 were replaced
        with RAT-laced artifacts after legitimate releases.
    notes:
    - The public sources describe the compromised artifact as the Windows version;
      macOS users were reported as unaffected.
    - The estimated theft exceeded $10 million in community reporting, but the exact
      amount remains disputed.
