- id: veraport-wizvera
  title: VeraPort plugin pushed malware South Korea.
  synopsis: VeraPort, an integrated installation program by WIZVERA, commonly used
    in South Korea for secure access to government and financial websites, was abused.
    Its browser plugin mechanism was compromised or leveraged to prompt users to install
    malware, sometimes signed with stolen digital certificates, effectively turning
    a trusted security tool into a malware distribution vector. One of the key English-language
    references detailing this attack is no longer accessible.
