- id: rank-math-pro
  title: Rank Math PRO downloads carried persistent WordPress backdoors
  synopsis: >-
    Some Rank Math PRO 3.0.123 downloads and updates contained malware during an eleven-hour window.
    Activation could install backdoors that recreated themselves on later page visits.
  start_date: '2026-10-15T20:02:00Z'
  target:
    name: Rank Math PRO
    kind: application
  method:
    phase: distribution
  artifacts:
    - id: rank-math-pro
      name: Rank Math PRO
      kind: plugin
      versions:
        - 3.0.123
      fixed_versions:
        - 3.0.124
      locations:
        - uri: https://rankmath.com/my-account/
          role: distribution
  references:
    - url: https://rankmath.com/kb/pro-3-0-123-security-incident/
      title: 'Rank Math PRO 3.0.123 Security Incident: How to Secure Your Website'
    - url: >-
        https://www.bleepingcomputer.com/news/security/wordpress-seo-plugin-rank-math-compromised-to-backdoor-websites/
      title: WordPress SEO plugin Rank Math compromised to backdoor websites
  end_date: '2026-10-16T07:12:00Z'
  language: PHP
  impact:
    types:
      - backdoor
      - credential_theft
  notes:
    - >-
      The free WordPress.org plugin was unaffected. The version number alone does not distinguish
      clean copies from the modified downloads.
