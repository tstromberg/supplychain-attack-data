- id: mb-connect-line
  title: MB Connect Line installer distributed Havex
  synopsis: As part of the DragonFly/Energetic Bear campaign, MB Connect Line, a German
    vendor of industrial routers and remote-access solutions, had official software
    installers trojanized with the Havex RAT. The campaign, later attributed in a
    U.S. indictment to Russia's FSB Center 16, used trusted ICS software distribution
    to reach industrial environments. This record tracks the MB Connect Line product
    scope specifically; related Havex vendor compromises are tracked separately.
  story: |
    Dragonfly treated industrial software distribution as infrastructure worth owning. In the Havex phase, the group compromised ICS and SCADA vendors, then made altered installers available through the channels customers already trusted. The result was an espionage tool delivered with the shape and timing of ordinary maintenance.

    MB Connect Line fit that pattern. Its routers and remote-access utilities sit close to industrial operations, where software such as mbCHECK or mbCONF can be used by engineers and support staff. A poisoned vendor download did not have to cross the plant boundary by force; the customer carried it in as part of normal administration.

    Once installed, Havex opened remote access, collected host data and credentials, and could run an OPC-focused discovery module to identify industrial control systems. The DOJ indictment says the broader Dragonfly/Havex operation infected more than 17,000 unique devices worldwide, including equipment connected to power and energy organizations.

    The MB Connect Line record is intentionally vendor-scoped. It belongs to the same Dragonfly/Havex campaign as the eWON and MESA Imaging records, but the artifact group, product names, and distribution location are distinct enough to preserve separately. Campaign-wide counts are recorded as campaign context, not as a per-vendor victim count.
