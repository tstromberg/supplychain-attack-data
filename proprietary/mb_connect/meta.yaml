---
- id: mb-connect-line
  title: MB Connect Line installer distributed Havex.
  synopsis: As part of the DragonFly/Energetic Bear campaign, MB Connect Line, a German
    vendor of industrial routers and remote access solutions, had a software installer
    on their website trojanized with the Havex Remote Access Trojan (RAT). This allowed
    attackers to gain a foothold in networks of organizations that downloaded and
    installed the compromised software. This record tracks the MB Connect Line product
    scope specifically; related Havex vendor compromises are tracked separately.
