- id: ccleaner
  title: CCleaner distributed with multi-stage backdoor.
  synopsis: Attackers compromised Piriform's build environment and inserted a backdoor
    into official CCleaner releases before Avast completed the acquisition. More than
    two million users received the first-stage telemetry collector, while a much narrower
    second stage pursued high-value technology companies. The incident showed how
    consumer utility software could become a precision espionage filter.
