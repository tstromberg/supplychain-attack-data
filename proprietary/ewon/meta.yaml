---
- id: ewon-hms-networks
  title: eWON VPN software installer distributed Havex.
  synopsis: Belgian ICS vendor eWON (later acquired by HMS Networks), which provides
    remote connectivity solutions like VPN software for industrial equipment, was
    targeted by the DragonFly campaign. Legitimate software installers for their products
    (e.g., eCatcher VPN client) available on their website were compromised to include
    the Havex RAT. This record tracks the eWON product scope specifically; related
    Havex vendor compromises are tracked separately.
