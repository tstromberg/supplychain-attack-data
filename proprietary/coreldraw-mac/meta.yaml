    notes:
    - Virus Bulletin reported that Corel said it had retrieved 95% of the infected 
      CDs during the first week of October 1998.
    - The date window is bounded to the first week of October 1998 and the October 
      5, 1998 public report; the exact pressing or shipment start date was not found.
    - Virus Bulletin described AutoStart 9805-D as removing earlier versions of
      itself and not intentionally damaging files, unlike more destructive AutoStart
      9805 variants.
    - Virus Bulletin (July 1998, p.8) documented the -C and -D variants as using
      `DELDB` on media and `DELDesktop Print Spooler` on hosts; -B used `BD` and
      `Desktop Printr Spooler`, and only the original -A used `DB` and `Desktop
      Print Spooler`.
    - Corel claimed the strain was "not detected by many popular virus-checking
      utilities". Virus Bulletin considered that unlikely, having documented the
      variant the month before the recall.
