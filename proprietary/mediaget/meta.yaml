- name: mediaget
  title: MediaGet P2P client update channel delivered Dofoil cryptominer
  synopsis: Microsoft Defender disclosed on 2018-03-13 that the official MediaGet update mechanism — a signed `mediaget.exe` that fetches `update.exe` and replaces itself — was compromised, replacing the legitimate signed binary with an unsigned but functionally-similar trojanized version (`Trojan:Win32/Modimer.A`, SHA-1 `3e0ccd9fa0a5c40c2abb40ed6730556e3d36af3c`). The `update.exe` dropper was signed with a stolen "DEVELTEC SERVICES SA DE CV" certificate (thumbprint `5022EFCA9E0A9022AB0CA6031A78F66528848568`). Groundwork began mid-February 2018; payload distribution started 2018-03-01; on 2018-03-06 Windows Defender behavior monitoring blocked the resulting Dofoil/Smoke Loader cryptominer outbreak — over 80,000 infections within hours and 400,000+ within 12 hours, concentrated in Russia (73%), Turkey (18%), and Ukraine (4%). The miner used process hollowing on `explorer.exe` and a masqueraded `wuauclt.exe` to mine Electroneum via NiceHash, with C2 over the Namecoin decentralized DNS.
  start_date: 2018-02-15
  end_date: 2018-03-07
  attribution_type: Cybercriminal
  component_type: application
  lang: c++
  cause: Update infrastructure compromise
  motive: Cryptojacking
  transitive: false
