- name: mediaget
  title: MediaGet P2P client update channel delivered Dofoil cryptominer
  synopsis: MediaGet's official update flow was compromised in March 2018, replacing the signed updater with a functionally similar trojanized binary. The dropper used a stolen DEVELTEC certificate and delivered Dofoil/Smoke Loader cryptomining at scale, with more than 400,000 infections in 12 hours, process hollowing into explorer.exe, and Namecoin-based C2.
