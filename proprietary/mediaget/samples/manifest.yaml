interpretation:
  - >-
    The one file recovered for this record came through a bridge rather than a direct lookup:
    Microsoft published SHA-1s only, VirusTotal resolved this one to a SHA-256, and Malshare then
    served it by that SHA-256. Nothing would have reached it from the SHA-1 alone, because the
    stores that hold it are SHA-256 addressed.
