        evaluated it.
    notes:
    - NSFOCUS described the affected scope as the PHP 5.4 distribution in the phpStudy 2016 package 
      and said the developer removed the backdoor in January 2019.
    - NVD and the GitHub Advisory Database describe broader PHPStudy 2016 through 2018 exposure; 
      this artifact records the narrower DLL and version detail with public hashes.
