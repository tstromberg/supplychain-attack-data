interpretation:
  - >-
    The 5.2.17 backdoor was recovered on 2026-09-03 only because the record's MD5 was bridged to a
    SHA-256 first. MalwareBazaar and Triage were both asked for the MD5 earlier and neither could
    answer: Triage does not index MD5 at all, and its silence was indistinguishable from not holding
    the sample. With the SHA-256 in hand it returned the file immediately. It is php_xmlrpc.dll, a
    73728-byte PE32 DLL, which is the component the phpStudy backdoor lived in.
