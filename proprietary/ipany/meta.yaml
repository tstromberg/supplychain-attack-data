- id: ipany-vpn
  title: South Korean IPany VPN installer backdoored.
  synopsis: The legitimate installer for IPany VPN, a South Korean VPN provider, available
    on their official website was replaced with a malicious version. This trojanized
    installer deployed both the legitimate VPN software and the SlowStepper backdoor,
    used by the PlushDaemon APT group (suspected China-aligned) for espionage.
