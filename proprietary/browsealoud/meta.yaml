- id: browsealoud
  title: Browsealoud script delivered Coinhive miner
  synopsis: >-
    On 2018-02-11 between 03:00 and 11:45 UTC, the official `ba.js` JavaScript file served
    from Texthelp's Browsealoud CDN was modified to embed an obfuscated Coinhive Monero miner
    that ran in visitors' browsers.
  story: |-
    Browsealoud was a third-party accessibility script. Thousands of sites loaded `ba.js` from Texthelp, including public-sector and government pages. On February 11, 2018, that shared script became the delivery point.

    The altered file wrote Coinhive mining JavaScript into pages that included it. Visitors did not lose money or credentials, but their browsers performed cryptocurrency mining for the attacker, burning CPU, battery, and trust.

    Texthelp took Browsealoud offline after the compromise was reported. The NCSC used the incident to point administrators toward a simple lesson: third-party JavaScript executes with the authority of the page that includes it.

    The defenses were old and still neglected. Subresource Integrity can pin a static script to a known hash. Content Security Policy can constrain where code may load from. Without those checks, one supplier file became code running across thousands of unrelated sites.
  start_date: 2018-02-11
  end_date: 2018-02-11
  target:
    name: browsealoud
    kind: library
    website: https://browsealoud.com
  actor:
    name: Cybercriminal
    kind: group
  language: javascript
  method:
    cause: website_compromise
    phase: distribution
    motive: cryptojacking
    transitive: true
  impact:
    types:
    - cryptojacking
    users: 4275
  artifacts:
  - id: browsealoud
    name: browsealoud
    kind: source_archive
    website: https://browsealoud.com
    start_date: 2018-02-11
    end_date: 2018-02-11
    locations:
    - uri: https://www.browsealoud.com/plus/scripts/ba.js
      role: distribution
    notes:
    - Affected Browsealoud artifact was ba.js as modified on 2018-02-11.
    - >-
      The during artifact was recovered on 2026-09-02 with tools/wayback-window-diff.js rather
      than from any hash lane, because a CDN URL has no version to ask for and no digest was
      ever published for it.
    - >-
      The window is one day wide and the Archive holds exactly one capture inside it; the
      captures on 2018-02-10 and 2018-03-14 agree with each other and not with it, so the
      tampered copy is identified from the archive rather than a report.
    hashes:
    - sha256: 01b862b1afe74bd58c9defd85fe76a88520d97e262135e4c096bc0489bd5b489
      of: archive
      role: malicious
      note: "Measured on 2026-09-02 from the file this record now holds, not taken from a report: no digest
        for the tampered ba.js appears in the public reporting, which described the injection but never
        published a hash. It is the Internet Archive's 2018-02-11 11:26:33 capture of the live URL, 32238
        bytes."
    - sha256: 52268c888d09886919adad0c442b1a618c1d55bced5c0cc7c334242c292d33bb
      of: payload
      role: malicious
      note: The 1703 injected bytes alone, isolated by diffing the tampered capture against the 
        2018-02-10 one. Not a file the CDN served on its own.
