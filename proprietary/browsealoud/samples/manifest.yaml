schema_version: 1
interpretation:
  - >-
    The artifact is a CDN URL rather than a release, so the sample is whatever browsealoud.com
    returned at a moment inside the window. The window is a single day and the Internet Archive
    holds exactly one capture inside it.
  - >-
    That capture is the clean file with 1703 bytes spliced in after a 77-byte header comment: the
    surrounding 77-byte prefix and 30458-byte suffix are byte-identical to the 2018-02-10 capture.
    The captures on 2018-02-10 and 2018-03-14 agree with each other and not with it, which brackets
    the compromise from the archive alone without relying on any report.
  - >-
    The injected bytes are hex-escaped to hide their strings from a casual reader. Decoded, they
    document.write a script tag loading https://coinhive.com/lib/coinhive.min.js and then start
    CoinHive.Anonymous with a thread count derived from navigator.hardwareConcurrency and a throttle
    of 0.6 -- an in-browser Monero miner, which is what the February 2018 Texthelp incident is.
  - >-
    The capture immediately after, on 2018-02-12, is 558 bytes and reads only 'BA.js */'. That is
    the file being pulled during remediation rather than a third version of it, so it is not held as
    a sample.
