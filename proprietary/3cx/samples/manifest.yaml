    verification:
      status: exact
      basis:
        - reported_digest_matched
        - measured_sha256
      evidence:
        - malwarebazaar_reported_sha256
        - measured_sha256_and_size
    notes:
      - >-
        The trojanized ffmpeg.dll shipped inside the Windows 3CXDesktopApp installer. It is the
        first stage: it reads the appended shellcode out of d3dcompiler_47.dll and runs it.
      - >-
        A component of the installer, not the installer. The signed MSI itself remains unrecovered,
        and the unresolved record for it stands.
      - >-
        Renamed from MalwareBazaar's defanged _ffmpeg.dll to the name it carries inside the
        application; the rename is recorded in the sidecar.
      - >-
        Recorded under the non-version version label "ffmpeg.dll-component" before release
        identities were normalized; the label is retained here because it is not derivable from the
        version or commit.
    subject: 3cxdesktopapp-windows
