        - measured_sha256_and_size
    notes:
      - >-
        The carrier for the second stage: a legitimate-looking d3dcompiler_47.dll with encrypted
        shellcode appended past the end of its PE structure, which is what ffmpeg.dll decrypts.
      - >-
        Renamed from MalwareBazaar's defanged _d3dcompiler_47.dll; the rename is recorded in the
        sidecar.
      - >-
        Recorded under the non-version version label "d3dcompiler_47.dll-component" before release
        identities were normalized; the label is retained here because it is not derivable from the
        version or commit.
    subject: 3cxdesktopapp-windows
