interpretation:
  - >-
    The signed 3CX installers are still unrecovered on both platforms. What is held is the malicious
    code from inside them: the macOS libffmpeg.dylib member, and on Windows the two DLLs the
    installer shipped plus the third stage they fetched.
  - >-
    The Windows components were found by searching MalwareBazaar's 3CX tag rather than by asking for
    the installer digests the incident record publishes. That is the general lesson: a repository
    often holds the payload under its own name while holding nothing under the coordinate the report
    names.
  - >-
    Five placeholder evidence records were removed from this manifest. Three are superseded by the
    recovered components; two carried artifact ids, windows and macos, that meta.yaml no longer
    declares.
  - >-
    The Windows installer was recorded as unavailable behind two SHA-256 values that no provider has
    ever seen. VirusTotal returns NotFound for both, as does MalwareBazaar. The installer was in
    Hopper the whole time under a different digest, and it is now held; the two unverifiable values
    are annotated in meta.yaml rather than presented as the artifact's identity.
