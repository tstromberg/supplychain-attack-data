---
- id: 3cx
  title: 3CX app updates delivered multi-stage malware.
  synopsis: Attackers compromised 3CX's build process and shipped malware through
    signed Desktop App updates for Windows and macOS to a customer base spanning hundreds
    of thousands of organizations. The breach cascaded from another supply-chain attack,
    X_TRADER, and turned 3CX into a downstream delivery system for data theft, reconnaissance,
    and follow-on payloads inside enterprise networks.
