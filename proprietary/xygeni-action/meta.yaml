---
- id: xygeni-action
  title: Xygeni GitHub Action v5 tag poisoning compromise
  synopsis: Compromised Xygeni maintainer and GitHub App credentials were used to
    open malicious pull requests against xygeni/xygeni-action, but branch protections
    blocked the changes from merging. The attacker instead moved the mutable v5 tag
    to a malicious PR commit, so workflows pinned to xygeni/xygeni-action@v5 could
    execute a reverse-shell backdoor without any workflow-file change. Xygeni removed
    the poisoned tag, rotated credentials, removed the compromised app, and enabled
    tag protections and release immutability. The vendor reported no main-branch,
    SaaS, customer-data, or confirmed customer CI compromise.
  start_date: 2026-03-03
  end_date: 2026-03-10
  target:
    name: xygeni-action
    kind: ci_cd_plugin
    website: https://github.com
    repo: https://github.com/xygeni/xygeni-action
