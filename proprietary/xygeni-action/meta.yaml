    locations:
    - uri: 
        https://github.com/xygeni/xygeni-action/tree/4bf1d4e19ad81a3e8d4063755ae0f482dd3baf12
      role: distribution
    - uri: https://github.com/xygeni/xygeni-action
      role: mirror
    commits:
    - 4bf1d4e19ad81a3e8d4063755ae0f482dd3baf12
    indicators:
    - kind: file
      value: action.yml
    - kind: ip
      value: 91.214.78.178
    - kind: domain
      value: security-verify.91.214.78.178.nip.io
    - kind: header
      value: 'X-B: sL5x#9kR!vQ2$mN7'
    - kind: command
      value: eval
    - kind: observable
      value: The v5 mutable tag pointed at the backdoored commit from March 3 to
        March 10, 2026.
