    notes:
    - Piyolog maps this MD5 to the complete malicious outer updater `GoMPLAYER_JPSETUP.EXE`; it is 
      not the hash of the legitimate bundled updater or any inner Miancha component.
    - GRETECH initially identified December 27, 2013 through January 16, 2014 as the affected update
      window; later reporting said investigation extended the start date to November 27, 2013.
    - The Reddit thread supplied for review appears to discuss later user concerns about bundled 
      unwanted software, not evidence for this update-server compromise.
