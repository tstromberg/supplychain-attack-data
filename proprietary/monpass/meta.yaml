---
- id: monpass
  title: MonPass Mongolian CA distributed Cobalt Strike-laced installer
  synopsis: Avast disclosed in July 2021 that the official client installer for MonPass — a major Mongolian certificate authority — was backdoored on the company's download site between 2021-02-08 and 2021-03-03. The trojanized installer wrapped the legitimate MonPass client (used by Mongolian users to interact with their digital certificates), executing it normally while side-loading a Cobalt Strike beacon for remote access. Avast notified MonPass, which acknowledged the compromise and notified affected customers.
  start_date: 2021-02-08
  end_date: 2021-03-03
