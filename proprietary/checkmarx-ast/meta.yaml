- name: checkmarx-ast
  title: Checkmarx AST GitHub Actions Compromise
  repo: https://github.com/Checkmarx/ast-github-action
  synopsis: "Attackers (TeamPCP) used a compromised service account to push malicious code into Checkmarx's GitHub repositories, including kics-github-action and ast-github-action. They hijacked 35 release tags (e.g., v1, v2) via spoofed commits. The payload stole environment variables, SSH keys, AWS Metadata, and Kubernetes tokens, exfiltrating data to checkmarx.zone. They also published malicious OpenVSX extensions (cx-dev-assist, ast-results)."
  start_date: 2026-03-21
  end_date: 2026-04-25
  attribution_type: Advanced Persistent Threat
