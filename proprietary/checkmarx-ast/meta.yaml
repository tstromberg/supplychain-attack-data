- id: checkmarx-march-2026
  title: Checkmarx March 2026 GitHub Actions and OpenVSX compromise
  synopsis: TeamPCP turned Checkmarx's own developer tooling into a credential-harvesting
    path on March 23, 2026. Malicious GitHub Action tags and OpenVSX extensions reached
    CI runners and developer workstations, collecting environment variables, cloud
    keys, SSH material, Kubernetes tokens, and Checkmarx credentials before exfiltration
    to attacker infrastructure. The incident mattered because security scanners and
    IDE plugins sit directly inside privileged build and development workflows.
