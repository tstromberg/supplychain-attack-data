- name: checkmarx-kics-github-action
  title: Checkmarx KICS GitHub Action compromised
  repo: https://github.com/Checkmarx/kics-github-action
  synopsis: >-
    Attackers gained access to Checkmarx repositories and injected
    credential-harvesting code into the public KICS GitHub Action. Checkmarx's
    official March 2026 exposure window controls this record. Third-party
    analysis described tag poisoning with malicious setup.sh changes,
    runner-memory and cloud-secret theft, encrypted exfiltration to
