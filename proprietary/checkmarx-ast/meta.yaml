- name: checkmarx-march-2026
  title: Checkmarx March 2026 GitHub Actions and OpenVSX compromise
  repo: https://github.com/Checkmarx
  synopsis: TeamPCP turned Checkmarx's own developer tooling into a credential-harvesting path on March 23, 2026. Malicious GitHub Action tags and OpenVSX extensions reached CI runners and developer workstations, collecting environment variables, cloud keys, SSH material, Kubernetes tokens, and Checkmarx credentials before exfiltration to attacker infrastructure. The incident mattered because security scanners and IDE plugins sit directly inside privileged build and development workflows.
  start_date: 2026-03-23
  end_date: 2026-03-23
  attribution_type: Advanced Persistent Threat
  component_type: CI/CD plugin
  lang: Shell
