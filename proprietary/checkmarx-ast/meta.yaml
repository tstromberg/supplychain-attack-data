    channels after the March TeamPCP incident. Checkmarx reported malicious AST GitHub
    Action, KICS DockerHub, and IDE extension artifacts on April 22, shifting the
    exposure from a single March day into a later release-channel cleanup problem.
    The record keeps those artifacts together while preserving their package, version,
    and distribution-specific details.
