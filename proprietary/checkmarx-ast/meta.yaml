- id: checkmarx-may-2026
  title: Checkmarx May 2026 Jenkins AST plugin compromise
  synopsis: The May 2026 Checkmarx record tracks the Jenkins AST plugin rather than
    folding it into the March or April waves. A malicious 2026.5.09 release reached
    the Jenkins Marketplace, putting build pipelines at risk through a trusted scanner
    plugin. Checkmarx advised users to avoid the poisoned release and remain on version
    2.0.13-829.vc72453fa_1c16 or earlier while clean distribution was restored.
  start_date: 2026-05-09
  end_date: 2026-05-10
  target:
