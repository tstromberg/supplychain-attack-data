- name: checkmarx-may-2026
  title: Checkmarx May 2026 Jenkins AST plugin compromise
  repo: https://plugins.jenkins.io/checkmarx-ast-scanner
  synopsis: The May 2026 Checkmarx record tracks the Jenkins AST plugin rather than folding it into the March or April waves. A malicious 2026.5.09 release reached the Jenkins Marketplace, putting build pipelines at risk through a trusted scanner plugin. Checkmarx advised users to avoid the poisoned release and remain on version 2.0.13-829.vc72453fa_1c16 or earlier while clean distribution was restored.
