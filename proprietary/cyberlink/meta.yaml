- id: cyberlink
  title: CyberLink installer compromised to distribute malware.
  synopsis: A North Korean group tracked as Diamond Sleet or ZINC modified a legitimate
    CyberLink multimedia installer and signed it with a valid certificate. Hosted
    on CyberLink's update infrastructure, the LambLoad trojanized installer downloaded
    secondary payloads onto victim systems across multiple countries.
