- name: vgca
  title: Vietnam Government Certificate Authority website served backdoored installers
  synopsis: ESET disclosed Operation SignSight on 2020-12-17 — between 2020-07-23 and 2020-08-16, attackers compromised the Vietnam Government Certification Authority's website (ca.gov.vn) and replaced the official `gca01-client-v2-x32-8.3.msi` and `gca01-client-v2-x64-8.3.msi` digital-signature toolkit installers with trojanized versions. The malicious MSIs ran the legitimate signing client while side-loading PhantomNet (a.k.a. Smanager), a modular backdoor compiled 2020-04-26, that beaconed to `vgca.homeunix.org` and `office365.blogdns.com`. The trojanized installers carried the same SafeNet certificate as the legitimate ones. ESET noted tooling similarities to TA428.
  start_date: 2020-07-23
  end_date: 2020-08-16
  attribution_type: Nation-state
  component_type: application
  lang: c++
  cause: Website compromise
  motive: Espionage
  transitive: false
