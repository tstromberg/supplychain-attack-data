- id: aomei-updates
  title: AOMEI update configuration redirected clients to malicious archives
  synopsis: >-
    Attackers briefly modified AOMEI update and notification settings, then restored them. Clients
    polling during the observed windows downloaded and executed payloads leading to the CROSSROAD
    downloader and SHINYROAD backdoor.
  start_date: '2026-05-28'
  target:
    name: AOMEI Technology
    kind: update_service
  method:
    phase: distribution
  artifacts:
    - id: aomei-update
      name: upgrade-now.zip
      kind: binary_archive
      locations:
        - uri: https://www2.aomeisoftware.com/download/abpopup/upgrade-now.zip
          role: distribution
      indicators:
        - kind: file_sha256
          value: upgrade-now.exe 9a58e8f49edf5644e5728f74cf36f560d3d486fa51db4db69d927963c7aca450
        - kind: file_sha256
          value: Notifycfg.ini d2f9ef2429312667f0512504b6a19ba4a9cc5514f1b2933923dd42f75a1c5934
  references:
    - url: >-
        https://cloud.google.com/blog/topics/threat-intelligence/investigating-ephemeral-supply-chain-tampering/
      title: Investigating Ephemeral Supply Chain Tampering
  end_date: '2026-07-20'
  actor:
    name: UNC7017
    kind: group
  impact:
    types:
      - backdoor
  notes:
    - >-
      Disclosed October 15. April is the earliest reported related malware activity; directly
      observed configuration tampering occurred May 28, July 16, and July 20. Component hashes do
      not identify the complete update ZIP.
