- id: pdfescape
  title: PDFescape installer dropped redirector malware
  synopsis: >-
    Minerva Labs and Malwarebytes disclosed in July 2018 that the official PDFescape Desktop
    installer distributed from the vendor's website was modified to side-load a malicious
    DLL that ran when the legitimate installer executed.
  story: |
    The PDFescape incident was a small but clean desktop supply-chain case. In July 2018, researchers reported that the official PDFescape Desktop installer available from the vendor's site had been modified.

    The installer still performed the expected PDFescape installation, which made the attack quiet. During that normal path, it side-loaded a malicious DLL and ran redirector malware under the cover of trusted software setup.

    The delivery point matters more than the malware family. Users did not fetch a fake clone from a typosquat; they fetched the vendor's installer from the vendor's distribution path.

    The public reporting does not give a durable victim count or a precise first-compromised date. The July 2018 window is therefore retained, and the impact is kept to the observed redirector/backdoor behavior.
