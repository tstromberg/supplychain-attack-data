- id: pdfescape
  title: PDFescape Desktop installer trojanized to drop redirector
  synopsis: Minerva Labs and Malwarebytes disclosed in July 2018 that the official PDFescape Desktop installer distributed from the vendor's website was modified to side-load a malicious DLL that ran when the legitimate installer executed. The malicious component acted as a redirector / loader, using the trusted installer process to evade detection. The trojanized installer was signed and offered through PDFescape's normal download channel until the vendor was notified and pulled it.
