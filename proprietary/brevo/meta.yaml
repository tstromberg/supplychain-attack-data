- id: brevo
  title: Brevo embedded scripts delivered ClickFix and WordPress malware
  synopsis: >-
    Brevo served modified tracker and chat scripts through its own infrastructure. The injected code
    showed ClickFix lures to visitors and attempted to install a malicious WordPress plugin when
    administrators browsed affected sites.
  start_date: '2026-09-14T16:05:18Z'
  target:
    name: Brevo
    kind: service
    website: https://www.brevo.com
  method:
    phase: distribution
  artifacts:
    - id: sdk-loader
      name: sdk-loader.js
      kind: javascript
      locations:
        - uri: https://cdn.brevo.com/js/sdk-loader.js
          role: distribution
      hashes:
        - sha256:58a5c601c9df7ca2120435588fc39f97712d9b878795f6ee500590099a432308
        - sha256:f67d572d2d30407b3f470904326411450763108980cdad89550fbb221fb06782
    - id: brevo-conversations
      name: brevo-conversations.js
      kind: javascript
      locations:
        - uri: https://cdn.brevo.com/js/brevo-conversations.js
          role: distribution
        - uri: https://conversations-widget.brevo.com/brevo-conversations.js
          role: distribution
      hashes:
        - sha256:9b62c12bc5c7feb9802f58e6cf75a368690df3c754e37cc64483a92acacf87a5
  references:
    - url: https://sansec.io/research/brevo-supply-chain-attack
      title: Brevo supply chain attack hits 100k+ sites with Wordpress backdoors and Clickfix malware
  end_date: '2026-09-14T20:12:53Z'
  language: JavaScript
  impact:
    types:
      - backdoor
      - malware_distribution
  notes:
    - >-
      Sansec observed subsequent delivery from cached copies. The September 10 account incident is
      not treated as proof of the cause of the September 14 script compromise.
