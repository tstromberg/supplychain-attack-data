schema_version: 1
interpretation:
  - >-
    The record's distribution URL was wrong until 2026-09-02: it read
    https://www.britishairways.com/scripts/modernizr.js, a path the Internet Archive has never held
    anything under except unrelated scripts from 2001. RiskIQ's own screenshots name the real one,
    https://www.britishairways.com/cms/global/scripts/lib/modernizr-2.6.2.min.js, and the archive
    holds 32 captures of it.
  - >-
    None of those captures fall inside the window. The archive's coverage of this URL jumps from
    2013-01-14 to 2019-07-10, straddling the August-September 2018 compromise entirely, so the
    tampered file itself cannot be recovered from the archive at any resolution.
  - >-
    What can be established is both ends of the change. The 2013 capture is the clean file, and two
    independent details tie it to the incident: its Last-Modified matches the header RiskIQ
    screenshotted for the untampered script, and it ends at the exact byte where RiskIQ's screenshot
    of the tampered script shows the appended block starting.
  - >-
    The injected block is held only as a transcription of RiskIQ's screenshot, because RiskIQ
    published it as an image. It is 22 lines that bind to mouseup and touchend on #submitButton,
    serialize #paymentForm, add the innerHTML of #personPaying as the payer name, and POST the JSON
    to https://baways.com/gateway/app/dataprocessing/api/ after a 500ms delay. The baways.com
    certificate RiskIQ screenshotted was issued 2018-08-15 by COMODO, six days before the tampered
    file's Last-Modified of 21 Aug 2018 20:49:38 GMT.
