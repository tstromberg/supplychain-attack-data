---
- id: british-airways-via-modernizr-script
  title: British Airways breached via modified script.
  synopsis: British Airways' website was compromised by attackers who modified a JavaScript
    library, Modernizr, that was loaded on their payment pages. This malicious script
    captured and exfiltrated customer names, addresses, payment card details, and
    login credentials. While Modernizr is an open-source library, its modification
    on BA's site as part of their supplied code to users represents a compromise of
    a component in their web delivery supply chain.
  start_date: 2018-08-21
  end_date: 2018-09-05
