    notes:
    - Sansec reported malware in FishPig Magento Security Suite and several other 
      FishPig Magento 2 extensions, and said all paid FishPig extensions were likely 
      compromised.
    - Free FishPig extensions hosted on GitHub appeared not to be affected.
    - Sansec reported more than 200,000 downloads for FishPig software on Packagist; the
      number of paid-extension customers affected was unknown.
