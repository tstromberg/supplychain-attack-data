  notes:
  - 'The backdoor as Sansec printed it: a lock check on /tmp/.varnish7684, then a shell-out that curls
    lic.png from license.fishpig.co.uk, chmods it 777, runs it as lic.bin with the admin domain, and deletes
    it.'
  - The name lic.png is cover; the file is an ELF. It is the Rekoobe stage this record's unresolved entry
    describes.
  - A report excerpt, not the shipped module. Sansec's ellipses, where present, are preserved rather than
    filled in.
