---
- id: web-developer-chrome
  title: Chrome extension developer accounts hijacked via phishing
  synopsis: A coordinated phishing campaign impersonating the Chrome Web Store team tricked extension developers into surrendering credentials via fake Google login pages on Freshdesk and bit.ly URLs. The hijacked accounts were used to publish malicious updates that injected adware and overlaid ads on visited pages. Confirmed compromised extensions include Copyfish (2017-07-28), Web Developer (2017-08-01, ~1M users), Chrometana, Infinity New Tab, Web Paint, Social Fixer, TouchVPN, and Betternet. All malicious updates were delivered through the official Chrome Web Store.
  start_date: 2017-07-28
  end_date: 2017-08-15
