- name: web-developer-chrome
  title: Chrome extension developer accounts hijacked via phishing
  synopsis: A coordinated phishing campaign impersonating the Chrome Web Store team tricked extension developers into surrendering credentials via fake Google login pages on Freshdesk and bit.ly URLs. The hijacked accounts were used to publish malicious updates that injected adware and overlaid ads on visited pages. Confirmed compromised extensions include Copyfish (2017-07-28), Web Developer (2017-08-01, ~1M users), Chrometana, Infinity New Tab, Web Paint, Social Fixer, TouchVPN, and Betternet. All malicious updates were delivered through the official Chrome Web Store.
  start_date: 2017-07-28
  end_date: 2017-08-15
  attribution_type: Cybercriminal
  component_type: Extension
  lang: javascript
  cause: Phishing
  motive: Financial gain
  transitive: false
  insertion_phase: distribution
  impact_type: Adware, Ad fraud
  impact_user_count: 1500000
  references:
    - https://www.bleepingcomputer.com/news/security/chrome-extension-developers-under-a-barrage-of-phishing-attacks/
    - https://a9t9.com/blog/chrome-extension-adware/
    - https://www.proofpoint.com/us/threat-insight/post/threat-actor-goes-chrome-extension-hijacking-spree
  versions:
    - "Copyfish 2.8.5"
    - "Web Developer 0.4.9"
    - "Chrometana 1.1.3"
    - "Infinity New Tab 3.12.3"
    - "Web Paint 1.2.1"
    - "Social Fixer 20.1.1"
  domain: chromewebstore.google.com
  domain_type: package host
  artifact_type: extension package
