- id: web-developer-chrome
  title: Chrome extension accounts shipped malware
  synopsis: >-
    Phishing stole Chrome Web Store developer credentials and pushed malicious extension
    updates. The campaign injected ads, redirected traffic, and collected credentials.
  story: |
    In 2017, a threat actor phished Chrome extension developers by impersonating the Chrome Web Store team. The lure sent maintainers to fake Google login pages, giving attackers the credentials needed to publish new versions of legitimate extensions.

    Copyfish and Web Developer were prominent cases, but Proofpoint tied the spree to a broader set that included Chrometana, Infinity New Tab, Web Paint, and Social Fixer. The extensions reached large installed bases, so the Chrome Web Store became the distribution path.

    The malicious updates loaded JavaScript from attacker infrastructure such as `wd7bdb20e4d622f6569f3e8503138c859d.win`, `searchtab.win`, and `redirect2.top`. The code substituted ads, redirected traffic to affiliate programs, and in some paths exfiltrated credentials.

    The campaign shows why extension stores are software supply chains. A maintainer account is a release key; once stolen, the attacker can ship code through the same automatic update channel users already trust.
  start_date: 2017-07-28
  end_date: 2017-08-15
