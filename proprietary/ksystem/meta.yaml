    worth stating because sixteen are unknown to MalwareBazaar, Triage and VirusTotal alike.
  - >-
    That silence is about where the samples live: twenty appear verbatim in the archived AhnLab
    ASEC pages, and the remaining three SHA-256s are known to VirusTotal with 44 or 45 engines
    detecting them, one named icsvcext.dll.
  - >-
    A Korean vendor's IOCs being absent from Western sample repositories is the expected case,
    not a sign of bad metadata.
