---
- id: medoc
  title: MeDoc updates distributed NotPetya ransomware.
  synopsis: The update mechanism for MeDoc, a widely used Ukrainian accounting package,
    was compromised and used to distribute NotPetya. What looked like ransomware operated
    as a destructive wiper, escaping its initial target set and crippling shipping,
    pharmaceuticals, logistics, and public services worldwide. A local tax-software
    update became one of the costliest cyber disruptions on record.
  start_date: 2017-04-01
  end_date: 2017-06-27
