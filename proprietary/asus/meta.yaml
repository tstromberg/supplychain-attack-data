- id: asus-live-update
  title: ASUS Live Update delivered targeted backdoors.
  synopsis: Attackers compromised ASUS Live Update servers and signed trojanized utility
    builds with stolen digital certificates. The first stage reached a broad population,
    but its second-stage logic was selective, checking MAC addresses against a target
    list before installing deeper backdoors on chosen machines.
