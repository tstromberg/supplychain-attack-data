---
- id: noxplayer
  title: NoxPlayer updates distributed targeted malware.
  synopsis: BigNox, the company behind NoxPlayer (an Android emulator for PC/Mac),
    had its update mechanism compromised. Attackers delivered tailored malware payloads
    to specific users, primarily in Asian countries, without compromising the NoxPlayer
    software itself initially. The attackers gained access to BigNox's update infrastructure
    to deliver these malicious updates.
  start_date: 2020-09-01
  end_date: 2021-01-25
