    last_attempted_at: '2026-09-11T12:17:52Z'
interpretation:
  - >-
    The trojanized MiMi application bundles themselves are not held; what is held for macOS are the
    two rshell payloads they carried, recovered from Triage on 2026-09-02 and re-measured against
    the digests Trend Micro published. Both are Mach-O 64-bit x86_64 executables.
  - >-
    Selecting the right Triage result matters here. A search for a SHA-256 also returns reports that
    merely reference the digest -- for both of these, the first hit was a container named rShell.zip
    whose own digest is 721efbc86745b49f70775b80b06bcf83e0523ae42828f3c7bea107ab8d4d0536, not the
    payload. The sample whose own sha256 equals the requested digest was taken instead, and the
    downloaded bytes were re-measured to confirm.
  - >-
    The Linux rshell payload was recovered from Software Heritage on 2026-09-03 after every malware
    feed had reported the digest unavailable. Software Heritage was asked for all six of the Linux
    rshell digests Trend Micro published and holds exactly this one; the other five return 404 there
    as well, so they have now been put to Hopper, MalwareBazaar, Triage, Malshare and Software
    Heritage without a hit. The two macOS digests were already held from Triage.
