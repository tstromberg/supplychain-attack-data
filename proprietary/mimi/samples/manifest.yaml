      - >-
        Digest corroboration, 2026-09-11: unknown to every sample feed and to VirusTotal, but these
        are IoCs from the Iron Tiger MiMi chat reporting, which describes HyperBro for Windows and
        rshell for macOS delivered through the compromised installers. The digests stand; no public
