interpretation:
  - >-
    The extension id this record carried was MyEtherWallet CX's, not MEGA's, which meant every
    archive lookup asked about the wrong listing. It is corrected in meta.yaml; the search below
    used the right one and still came up empty.
  - >-
    The malicious CRX itself is not held. Google pulled MEGA 3.39.4 about five hours after it went
    up on 2018-09-04 and no archive of the Chrome Web Store binary survives, so what is recoverable
    is the code as the researcher who analysed it published it.
  - >-
    The content script appends a script tag to the page and polls every two seconds. On
    MyEtherWallet it walks Angular scopes for a .wallet and reads getAddressString() and
    getPrivateKeyString(); on MyMonero it reads scope.address with view_key and spend_key; for Idex
    it reads localStorage state together with configuration.keySalt. Each finding is handed to the
    extension over a CustomEvent -- nmew, nmm, imm -- which a listener forwards with
    chrome.runtime.sendMessage as nmewm, nmmm and immm.
  - >-
    The manifest fragment shows why those three sites: the build declared matches for file:///*,
    myetherwallet.com, mymonero.com and idex.market.
  - >-
    Both files are transcriptions of code blocks in a blog post, not bytes the Chrome Web Store
    served, so they are recorded verification_material and the digests name the transcriptions.
