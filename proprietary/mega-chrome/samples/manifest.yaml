        crx4chrome extension page for bigefpfhnfcobdlfbedofhhaibnlghod: present, but its version
        history lists only 3.3.2, 3.8.3 and 3.36.0 and stops well before 3.39.4.
      - 'chrome-stats.com: answers 403 without a paid key.'
