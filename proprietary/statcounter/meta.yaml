- name: statcounter
  title: StatCounter analytics tag hijacked to steal gate.io withdrawals
  synopsis: ESET disclosed on 2018-11-06 that attackers had injected malicious JavaScript into the official StatCounter tracking script `www.statcounter.com/counter/counter.js` on 2018-11-03, served to roughly 2 million sites embedding StatCounter analytics. Conditional code triggered only on URI paths matching `myaccount/withdraw/BTC` — i.e. the gate.io cryptocurrency exchange's BTC withdrawal page — and pulled a second stage from the lookalike `statconuter.com/c.php`. The payload silently rewrote the destination wallet on Bitcoin withdrawals to attacker-controlled `1JrFLmGVk1ho1UcMPq1WYirHptcCYr2jad`, capping at the user's daily withdrawal limit. Gate.io stopped using StatCounter on 2018-11-06 and StatCounter removed the script the same day.
  start_date: 2018-11-03
  end_date: 2018-11-06
  attribution_type: Unknown attacker
  component_type: library
  lang: javascript
  cause: Website compromise
  motive: Cryptocurrency theft
  transitive: true
  insertion_phase: distribution
  impact_type: Cryptocurrency theft
  impact_user_count: 2000000
