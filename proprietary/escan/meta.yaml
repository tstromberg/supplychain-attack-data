- id: escan
  title: eScan Antivirus Update Supply Chain Attack
  synopsis: Attackers compromised the legitimate eScan antivirus update infrastructure to distribute a trojanized version of Reload.exe (32-bit). This component dropped a persistent downloader (CONSCTLX.exe) that used scheduled tasks, registry modifications, and hosts file tampering to block remote updates and evade remediation while maintaining backdoor access.
