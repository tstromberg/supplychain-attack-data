---
- id: microsoft-software-media
  title: Microsoft distribution media shipped with Form virus.
  synopsis: In 1995, Microsoft acknowledged accidentally distributing software installation
    floppy disks (reportedly including some for Windows 95 upgrades) infected with
    the common 'Form' boot sector virus. The infection likely occurred during mass
    disk duplication. While not destructive, the virus caused audible clicking sounds
    on infected PCs on the 18th of the month.
