- id: mesa-imaging-acquired-by-heptagon-then-ams-osram
  title: MESA Imaging camera software distributed Havex
  synopsis: MESA Imaging, a Swiss developer of 3D Time-of-Flight (ToF) cameras and
    related software used in industrial applications, was another vendor whose website
    was compromised during the Dragonfly/Havex campaign. Software installers for
    its camera products were trojanized with Havex, enabling espionage on systems
    using specialized imaging equipment. The campaign was later attributed in a U.S.
    indictment to Russia's FSB Center 16. This record tracks the MESA Imaging product
    scope specifically.
  story: |
    Havex was not dropped only by phishing mail or drive-by compromise. Dragonfly also turned official industrial software distribution into a delivery system. By compromising ICS and SCADA vendors, the operators made trusted downloads carry the first stage of an intrusion.

    MESA Imaging was one of the vendor scopes publicly associated with that supply-chain phase. Its 3D Time-of-Flight camera software belonged to a narrow industrial niche, which made the compromise useful for finding specialized environments rather than broad consumer machines. The poisoned download looked like product support; the payload made it reconnaissance.

    The malware installed a backdoor, reached command-and-control infrastructure, gathered credentials and system details, and could use an OPC scanning module to enumerate industrial control devices. According to the DOJ indictment, the wider Dragonfly/Havex operation infected more than 17,000 unique devices in the United States and abroad, including systems used around power and energy operations.

    The MESA Imaging entry stays separate from eWON and MB Connect Line because the affected artifacts and vendor distribution paths differ. The campaign attribution is shared, but the package scope is not. The 2013-2014 dates reflect the public trojanized-download window for this artifact group, while the indictment describes earlier supplier-level access in the same broader operation.
