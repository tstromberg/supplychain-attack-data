- id: mesa-imaging-acquired-by-heptagon-then-ams-osram
  title: MESA Imaging camera software distributed Havex.
  synopsis: MESA Imaging, a Swiss developer of 3D Time-of-Flight (ToF) cameras and
    related software used in industrial applications, was another vendor whose website
    was compromised by the DragonFly group. Software installers for their camera products
    were trojanized with the Havex RAT, enabling espionage on systems using their
    specialized imaging equipment. This record tracks the MESA Imaging product scope
    specifically; related Havex vendor compromises are tracked separately.
