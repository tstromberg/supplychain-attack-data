- title: Checkmarx vs TeamPCP
  synopsis: TeamPCP repeatedly compromised Checkmarx-controlled developer tooling
    in 2026, including GitHub Actions, OpenVSX extensions, Docker images, VS Code
    extensions, and the Jenkins AST Scanner plugin.
  story: |-
    The Checkmarx incidents were not one artifact failure. TeamPCP returned across several months and several trusted developer channels, repeatedly targeting security tooling that naturally runs near source code, CI secrets, cloud credentials, and deployment material.

    The linked attack records stay separated by date and distribution boundary: March GitHub Actions and OpenVSX extensions, April scanner images and IDE channels, and the May Jenkins plugin compromise. This campaign ties the repeated actor, infrastructure, payload grammar, and Checkmarx trust surface together without flattening the individual incidents.
