---
- id: codecov
  title: Codecov Bash Uploader compromised via CI/CD
  synopsis: Attackers modified Codecov's Bash Uploader after gaining access to a private
    GCP key through a flawed Docker image creation process. The one-line change exfiltrated
    environment variables from customer CI/CD jobs, pulling credentials, tokens, and
    keys from build systems. Its impact came from position; one trusted coverage script
    quietly crossed many private software pipelines.
  start_date: 2021-01-31
  end_date: 2021-04-01
