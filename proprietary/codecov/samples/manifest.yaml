interpretation:
  - >-
    The compromised uploader itself is not held and the archive cannot supply it: captures of
    https://codecov.io/bash jump from 2020-11-11 to 2021-04-15, straddling the 2021-01-31 to
    2021-04-01 window entirely, the S3 path has no captures at all, and the raw.githubusercontent
    copy stops at 2020-12-31. The GitHub blob at the commit this record cites now 404s. What is held
    instead brackets the change with the clean versions either side, both exact and both declaring
    their own version string, plus the researcher's redacted copy showing the injected line in
    place.
