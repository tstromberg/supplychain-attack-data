interpretation:
  - >-
    The Internet Archive holds eleven captures of www.ammyy.com/AA_v3.exe and none of them is the
    trojanized installer. Nine are the ordinary installer from 2012 to 2015-07-01, and the two that
    fall inside the 2016 window are not binaries at all: one is an HTML notice telling Chrome users
    to use another browser, and the other is the download endpoint's PHP source, returned
    unexecuted.
  - >-
    That PHP is worth keeping even though it is not the artifact, because it is the distribution
    path's own logic captured mid-window. It refuses Chrome outright, which keeps many crawlers and
    scanners away from the binary, and it carries a commented-out line, $filename = ($is_chrome ||
    empty($agent)) ? '/unsigned' : '', that would have served the file from a separate unsigned
    directory depending on the user agent. Selective delivery by client is the mechanism these Ammyy
    compromises depended on; here it sits disabled in the source, which documents the capability
    without showing it in use.
  - >-
    The 2015-07-01 installer is held as a before baseline. It predates the earliest of the three
    windows and is the closest clean copy of the distributed file that survives.
