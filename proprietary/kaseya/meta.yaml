---
- id: kaseya-vsa
  title: Kaseya VSA distributed REvil ransomware
  synopsis: Attackers (REvil RaaS affiliate) exploited a chain of zero-day vulnerabilities
    (authentication bypass, arbitrary file upload, and code injection) in Kaseya VSA
    to distribute REvil ransomware. The attack delivered a malicious agent.crt which
    was decoded into agent.exe. This executable dropped a legitimate Windows Defender
    binary to sideload the malicious mpsvc.dll REvil encryptor, affecting approximately
    30 MSPs and over 1,500 downstream businesses.
  start_date: 2021-07-02
  end_date: 2021-07-11
