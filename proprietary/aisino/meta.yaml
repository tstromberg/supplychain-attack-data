    notes:
    - Trustwave observed GoldenSpy active in April 2020 and reported an uninstaller
      pushed by Intelligent Tax on June 28, 2020.
    - FBI/IC3 reported in July 2020 that Aisino and Baiwang were the only
      government-authorized VAT software providers and that use of one provider was
      required for US companies operating in China's market.
    - FBI/IC3 said GoldenSpy was believed to have been around since 2016, but the
      public Trustwave Aisino incident timeline begins with observed April 2020
      activity.
    - CERT-FR later used GoldenSpy as a case study in mandatory untrusted software
      and recommended isolating such software from the rest of an enterprise network.
    - Attribution remains unattributed in the primary Trustwave reporting; the
      record avoids assigning this to a named government or state actor.
