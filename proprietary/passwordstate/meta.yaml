- id: passwordstate
  title: Passwordstate update pushed Moserpass credential stealer.
  synopsis: Passwordstate's enterprise password manager update mechanism was compromised
    by an unknown actor. For about 28 hours, it distributed a malicious update containing
    Moserpass, malware built to exfiltrate system details and stored Passwordstate
    credential data from the very vault trusted to protect secrets.
