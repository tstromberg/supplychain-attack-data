---
- id: comm100
  title: Comm100 chat installer delivered backdoor malware.
  synopsis: Attackers compromised the official website of Comm100 (customer engagement
    software vendor) to distribute a trojanized version of their Windows Desktop Agent
    installer. The installer, signed with a valid Comm100 certificate, contained a
    JavaScript backdoor leading to potential remote shell access and further malware
    deployment.
  start_date: 2022-09-27
  end_date: 2022-09-29
