- id: vipnet-client-infotecs
  title: ViPNet updates mimicked to deploy backdoor
  synopsis: >-
    Targeted LZH archives imitated ViPNet security-network updates for Russian organizations
    in government, finance, and industry.
  story: |
    Kaspersky published the Russian disclosure on April 17, 2025 after finding the backdoor during an incident response. The victims were large Russian organizations connected to ViPNet networks. InfoTeCS confirmed targeted attacks against some users in an April 18 update and issued security updates and customer recommendations.

    The malicious archives used the shape of ViPNet update packages. Each archive contained `action.inf`, a legitimate `lumpdiag.exe`, a small malicious `msinfo32.exe`, and an encrypted payload file whose name varied by archive.

    The update service component `itcsrvup64.exe` processed `action.inf` and executed `lumpdiag.exe --msconfig`. The legitimate executable was vulnerable to path substitution, so the attacker-controlled `msinfo32.exe` ran in its context.

    The loader decrypted the payload and mapped the backdoor into memory. The backdoor connected to command-and-control over TCP, could steal files, and could launch additional malicious components.
  start_date: 2025-04-01
  end_date: 2025-04-22
  target:
    name: ViPNet Client (InfoTeCS)
    kind: application
    website: https://infotecs.ru
  actor:
    name: APT group
    kind: group
  language: C++
  method:
