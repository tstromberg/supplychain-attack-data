- id: vipnet-client-infotecs
  title: ViPNet updates mimicked to deploy backdoor.
  synopsis: A sophisticated backdoor was distributed disguised as updates for ViPNet,
    a secure networking software suite by InfoTeCS used in Russia. Attackers crafted
    update archives that, when processed by the ViPNet update service component, would
    execute a malicious loader and deploy a versatile backdoor.
