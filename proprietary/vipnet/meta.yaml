    notes:
    - Kaspersky's Russian disclosure was published on 2025-04-17 and updated on 
      2025-04-18 after InfoTeCS confirmed targeted attacks against some users; the 
      English Securelist article followed on 2025-04-22.
    - InfoTeCS stated that certified fourth-generation products operated according
      to documentation, fifth-generation products, and intermediate 4U products were
      not susceptible to this attack.
    - The modeled supply-chain boundary is the forged ViPNet update package accepted
      inside victim networks, not a confirmed compromise of the public InfoTeCS update
      service.
