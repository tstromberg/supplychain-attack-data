---
- id: stylish
  title: Stylish browser extension exfiltrated browsing history
  synopsis: After SimilarWeb acquired Stylish (Chrome version in January 2017, Firefox version in March 2018), official store updates began silently exfiltrating users' complete browsing history — full URLs, Google search results, and unique tracking identifiers tied to user accounts — to api.userstyles.org. Robert Heaton publicly disclosed the behaviour on 2018-07-02 after observing the requests; Mozilla and Google removed the extension from their stores within two days. The exfiltrated data included sensitive URLs such as password reset tokens and medical record links.
