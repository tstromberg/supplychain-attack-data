---
- id: conceptworld
  title: Conceptworld installers trojanized, data theft.
  synopsis: Installers for Conceptworld's Notezilla, RecentX, and Copywhiz were compromised
    on conceptworld.com. The trojanized builds stole browser credentials, crypto wallets,
    clipboard and keystroke data, then downloaded more payloads. Rapid7 disclosed
    the issue, and Conceptworld remediated the download path within 12 hours.
