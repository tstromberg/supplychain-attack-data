- id: intel-lanspool
  title: Intel LANSpool disks carried Michelangelo
  synopsis: >-
    Intel halted LANSpool 3.01 shipments after finding Michelangelo on some official 5.25-inch
    floppy disks. The affected NetWare packages were replaced by virus-free LANSpool 3.02.
  story: |
    In March 1992, Intel said it had stopped shipping LANSpool 3.01, a print-server utility for Novell NetWare networks. Some official 5.25-inch distribution diskettes carried the Michelangelo boot-sector virus. The infection reached customers through Intel product media, not through a user-downloaded crack or an unrelated bulletin board copy. For a network print utility, that meant one contaminated disk could enter the shared office computing environment through an administrator doing ordinary setup work. The risky action was not experimentation; it was installing a trusted vendor product.

    The affected scope was specific. Contemporary reports named the LANSpool 3.01 builds for NetWare 2.1x and 2.2x networks and for NetWare 3.1x networks, and limited the known infected media to 5.25-inch floppy disks. UPI reported that Intel's worst-case estimate was 850 infected units and that Michelangelo was inadvertently shipped on 839 diskettes. Virus Bulletin reported that 180 of those diskettes were traced within Europe, leaving some 650 still to be recovered from North America.

    Michelangelo was a DOS boot-sector virus from the Stoned family. It stayed quiet until March 6, then overwrote early hard-disk sectors on infected PCs. That made Intel's timing urgent: LANSpool had begun shipping in January, and the public warning came days before the trigger date.

    Intel advised customers who bought LANSpool 3.01 to take precautions, provided dedicated disinfection software free of charge, and released LANSpool 3.02 as a tested replacement. It also gave afflicted customers a free copy of LANProtect, Intel's own server-based anti-virus system for NetWare, which retailed for US$999. The vendor was selling the category of defense it had failed to apply to its own master diskette. Intel never established how that master became infected and did not rule out malicious tampering. The trusted artifact was the disk in the box.
  pull_quote:
    text: >-
      Intel traced the virus to the master diskette of LANSpool itself.
      Another vendor's anti-virus scanning software was already in use, and it
      failed to detect the Michelangelo strain.
    caption: the scanner that missed the master
