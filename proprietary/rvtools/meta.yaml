    - >-
      The official-distribution status is contested. Aidan Leon reported a direct official-site
      download and hash mismatch; Dell said it found no evidence of official-site or
      official-download compromise.
    - >-
      Arctic Wolf reported trojanized RVTools installers from typosquatted domains, a confirmed
      malicious delivery path that overlaps the same RVTools-branded payload.
    - >-
      Public reports gave no stable malicious RVTools version in text; some secondary reporting
      mentioned 4.7.1, but this record leaves the version unset until confirmed from primary
      evidence.
    - >-
