      role: distribution
    - uri: https://www.rvtools.com/
      role: distribution
    notes:
    - The official-distribution status is contested. Aidan Leon reported direct official-site
      download and hash mismatch; Dell said it found no evidence of official-site or
      official-download compromise.
    - Arctic Wolf reported trojanized RVTools installers from typosquatted domains, a
      confirmed malicious delivery path that overlaps the same RVTools-branded payload.
    - Public reports did not provide a stable malicious RVTools version in text; some
      secondary reporting mentioned 4.7.1, but this record leaves the version unset until
      confirmed from primary evidence.
