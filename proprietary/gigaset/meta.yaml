    notes:
    - Gigaset said only some devices from older product lines were infected and that 
      affected devices were those where past software updates had not been carried out 
      by the user.
    - Potentially affected Gigaset lines were GS100, GS160, GS170, GS180, GS270, GS270 
      plus, GS370, and GS370 plus.
    - Malwarebytes also observed Android/PUP.Riskware.Autoins.Redstone on Siemens GS270,
      Siemens GS160, Alps P40pro, and Alps S20pro+ devices.
    - Gigaset said GS110, GS185, GS190, GS195, GS195LS, GS280, GS290, GX290, GX290plus, 
      GX290 PRO, GS3, and GS4 were not affected according to its information at the 
      time.
