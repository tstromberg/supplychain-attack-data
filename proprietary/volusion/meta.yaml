- id: volusion-via-google-cloud-storage-script
  title: Volusion e-commerce sites skimmed via script.
  synopsis: Over 29,500 e-commerce websites hosted on the Volusion platform were compromised
    when a malicious JavaScript file (volusion.js), hosted on a Google Cloud Storage
    bucket (storage.googleapis.com/volusionapi/resources/) used by Volusion, was modified.
    This script skimmed credit card information, exfiltrating it to gogogolo.com.
