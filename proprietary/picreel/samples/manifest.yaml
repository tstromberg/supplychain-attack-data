interpretation:
  - >-
    The picreel-script sample is the skimmer's own code, taken from the pastebin mirror the record
    cites, not a capture of the file picreel.com served: the Internet Archive holds no capture of
    the compromised script inside the window. It is recorded payload_only for that reason. It reads
    the cc_name, cc_number, cc_month, cc_year and cc_cvc fields along with the billing name, address
    and phone, concatenates them, and sends them over a WebSocket to wss://fontsawesome.gq:8080/g
    before re-firing the original click handler so the checkout continues normally. It installs
    itself by polling every 500ms for #button-confirm and rewriting its onclick.
