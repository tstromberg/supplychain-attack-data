schema_version: 1
interpretation:
  - >-
    Adform replaced trackpoint-async.js in place, so no versioned coordinate names the malicious
    state. The Internet Archive crawls s2.adform.net several times a day, and four captures fall
    inside the 2026-07-26 to 2026-07-27 window: one clean and three tampered.
  - >-
    meta.yaml recorded that no archived copy had been located. That is corrected here: the archive
    holds three, and they are different from each other. The attacker rotated the payload during the
    window, growing it from 2174 to 3610 to 6945 appended bytes in the two hours between 22:29 UTC
    on the 26th and 00:41 UTC on the 27th.
  - >-
    Every tampered capture begins with the 82727 bytes of the 2026-07-25 clean file, byte for byte,
    and the 2026-07-30 capture is identical to that clean file again. The compromise is therefore
    bracketed on both sides by the archive alone, without relying on any report.
