  notes:
  - No file hash is recorded. The one digest quoted in reporting is 49 hex characters,
    which is not a SHA-256, SHA-1, or MD5, so it is not usable as an indicator and is left
    out rather than reproduced. Beaumont also reported zero VirusTotal detections for the
    file and its infrastructure while the campaign was live.
  - The attacker-controlled wallet addresses were not published, so the substitution
    targets are described by behavior rather than enumerated.
  - This record previously carried a different field layout from the rest of the dataset
    and cited three site homepages rather than articles. It was rewritten onto the common
    schema and the citations replaced with the reporting they were standing in for.
