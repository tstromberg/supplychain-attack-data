    notes:
    - The upstream compromised artifacts are modeled in the OSS event-stream record; this
      record captures the downstream Copay wallet releases and user impact.
    - BitPay said Copay versions 5.0.2 through 5.1.0 were vulnerable and fixed Copay in
      5.2.0.
    - BitPay's exposed customer count is not known; users is left as 0 for unknown rather
      than treating app downloads as confirmed victims.
    - The malicious npm packages were delivered through npm, but Copay users received risk
      through official Copay builds.
    - Previous local data listed a SHA-256 for this artifact without a named Copay file;
      it was removed rather than retained as an ambiguous hash.
