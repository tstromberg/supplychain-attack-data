---
- id: twilio-taskrouter-js-sdk
  title: Twilio SDK hosted on S3 delivered malicious code.
  synopsis: An improperly configured AWS S3 bucket allowed attackers to modify version
    1.20 of Twilio's TaskRouter JavaScript SDK hosted for public use. For several
    hours, websites loading the SDK directly from Twilio's CDN received code modified
    with malicious script, likely part of a Magecart-related malvertising or skimming
    campaign.
  start_date: '2020-07-19T20:12:00Z'
  end_date: '2020-07-20T05:30:00Z'
  target:
    name: Twilio TaskRouter JS SDK
    kind: library
    website: https://twiliocdn.com
  actor:
