- name: jdownloader
  title: JDownloader Website CMS Compromise (2026)
  repo: ""
  synopsis: Attackers compromised the jdownloader.org CMS and replaced selected installer links with redirects to malicious third-party binaries. The Windows alternative installer and Linux shell installer were affected; signed in-app updates and third-party mirrors were not. Probing began around May 5, 2026, full manipulation started May 6, and the site returned with verified clean links on May 8-9.
  start_date: 2026-05-06
  end_date: 2026-05-07
  attribution_type: Unknown
  component_type: Application # Download manager utility
  lang: Java
  cause: Website compromise # CMS-managed installer links redirected to malicious files; underlying server stack and host filesystem not breached
  motive: Unknown # Distributed unsigned malicious installers flagged by AV/SmartScreen; specific payload behavior not publicly characterized
  transitive: false
  insertion_phase: distribution # Compromised official download website redirected installer links to malicious binaries
  impact_type: Malware delivery
  impact_user_count: 0 # Unknown; ~41 hour exposure window on selected installer links
  references:
    - https://jdownloader.org/incident_8.5.2026.html
