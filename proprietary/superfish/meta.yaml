    notes:
    - >-
      Preinstalled rather than downloaded, so there is no distribution URL or version list; affected
      machines are identified by model and manufacture date rather than by a release.
  notes:
  - >-
    Lenovo stopped preloading Superfish in January 2015 over complaints about the ads, before the
    TLS interception was public, and published a removal tool on 2015-02-20.
  - >-
    The root certificate's private key was the same on every affected machine and was protected with
    the password komodia, which Errata Security extracted in about three hours.
  - >-
    Komodia's SDK was found in other products too, so the same interception weakness reached users
    who had never heard of Superfish or Lenovo.
  - >-
    Lenovo settled with the FTC and 32 state attorneys general in 2017 over the preinstallation.
