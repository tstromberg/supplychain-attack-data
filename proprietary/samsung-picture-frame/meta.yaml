    notes:
    - >-
      The replacement Frame Manager 1.082 download was described by Computerworld as "an updated
      - and theoretically malware-free - version"; no source we hold states that it was verified
      clean.
    - >-
      Samsung's advisory says "a batch of Photo Frame Driver CDs contain [sic] a worm virus in
      the Frame Manager software". Only Windows XP was affected. The disc was required to use
      the frame as a USB monitor, so skipping it was not an option.
    - >-
      Samsung did not state how the malware reached the disc, or how it passed quality control.
      The Register's duplication-machine explanation is explicit speculation.
    - >-
      SANS ISC preserved Amazon guidance telling customers to uninstall the CD version, install
      the clean update, and run antivirus cleanup.
