- id: daemon-tools
  title: DAEMON Tools installer delivered QUIC RAT
  synopsis: >-
    Official signed DAEMON Tools Lite installers were trojanized from April 2026. The backdoor
    profiled machines, then selectively delivered a minimal backdoor and QUIC RAT.
  story: >
    DAEMON Tools was compromised at the point users trust most: the vendor's own signed installers.
    Kaspersky found that installers distributed from the legitimate DAEMON Tools website had been
    trojanized starting April 8, 2026, covering versions 12.5.0.2421 through 12.5.0.2434.


    The altered builds changed signed DAEMON Tools binaries such as `DTHelper.exe`,
    `DiscSoftBusServiceLite.exe`, and `DTShellHlp.exe`. At startup, the implanted code contacted
    `env-check.daemontools.cc`, a lookalike domain registered shortly before the campaign, and could
    receive shell commands to download and run follow-on payloads.


    Most observed infections received an information collector. It gathered MAC address, host and
    DNS names, running processes, installed software, and locale, then posted the profile to
    attacker infrastructure. That stage let the operators sort a broad installer compromise into a
    smaller list of useful targets.


    A few machines received a minimal backdoor, and one observed organization received QUIC RAT.
    Kaspersky described the latter as a C++ implant supporting HTTP, UDP, TCP, WSS, QUIC, DNS, and
    HTTP/3, with injection into `notepad.exe` and `conhost.exe`. The vendor later acknowledged the
    issue and released 12.6.0.2445 without the malicious behavior.
