---
- id: netsarang
  title: NetSarang server tools shipped with ShadowPad backdoor.
  synopsis: Legitimate updates for NetSarang's popular server management software
    (Xmanager, Xshell, etc.) were compromised to include the ShadowPad backdoor. This
    allowed attackers to potentially control and exfiltrate data from infected systems
    in highly sensitive organizations worldwide. The backdoor was discovered after
    being active for a short period.
