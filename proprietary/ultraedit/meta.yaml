- name: ultraedit
  title: UltraEdit update mechanism abused in Operation WilySupply
  synopsis: Microsoft disclosed WilySupply on 2017-05-04, describing a targeted supply-chain attack that abused an unnamed editor's auto-update channel to deliver a tiny ue.exe dropper to roughly 25 finance and payments organizations. The vendor was not named, but community evidence points most strongly to UltraEdit; that attribution remains circumstantial.
  start_date: 2017-04-13
  end_date: 2017-04-14
