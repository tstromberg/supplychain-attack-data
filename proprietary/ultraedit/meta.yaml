- name: ultraedit
  title: UltraEdit update mechanism abused in Operation WilySupply
  synopsis: Microsoft Defender ATP disclosed on 2017-05-04 the operation it codenamed "WilySupply" — a targeted supply-chain attack in which the auto-update channel of an unnamed editor application was abused to deliver a 132-byte dropper named `ue.exe` to roughly 25 organisations, primarily in the finance and payments sector. Microsoft never publicly named the vendor, but the security community has long inferred IDM Computer Solutions' UltraEdit based on the dropper filename — `ue` is UltraEdit's longstanding executable prefix (`ue_english.exe`, `uedit32.exe`, `uedit64.exe`) — combined with the target demographics, the use of an in-product auto-updater, and the small-vendor profile that fit Microsoft's remediation footprint. The attribution remains circumstantial; `ue.exe` could plausibly stand for "update executable", but the convergence of evidence makes UltraEdit the most credible candidate.
  start_date: 2017-04-13
  end_date: 2017-04-14
  attribution_type: Unknown attacker
  component_type: application
  lang: c++
  cause: Update infrastructure compromise
  motive: Espionage
  transitive: false
  insertion_phase: distribution
  impact_type: Backdoor, Remote access
  impact_user_count: 25
