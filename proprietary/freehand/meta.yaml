---
- id: aldus-freehand
  title: Aldus FreeHand disk shipped with MacMag virus.
  synopsis: Master copies of a promotional/training disk for Aldus FreeHand, a commercial
    graphics program, were infected with the MacMag virus by a contractor before duplication.
    Aldus unknowingly distributed thousands of infected disks, notably via Macworld
    magazine, marking an early commercial software supply chain compromise.
