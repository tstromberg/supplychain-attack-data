- id: sha1-hulud-npm-packages
  text: >-
    The repositories it created had discussions enabled, so any GitHub user could
    inject and execute arbitrary shell commands on a victim's `SHA1HULUD` runner
    simply by posting a discussion.
  caption: public discussions as a command channel
  after: 2
  source: https://www.stepsecurity.io/blog/sha1-hulud-the-second-coming-zapier-ens-domains-and-other-prominent-npm-packages-compromised

- id: shai-hulud-npm-2025
  text: >-
    The workflow exfiltrated repository secrets to a webhook[.]site URL on a free
    plan capped at 100 callbacks. The platform deactivated it, but the secrets
    stayed visible in GitHub workflow logs.
  caption: the exfil webhook hit its free-tier cap
  after: 2
  source: https://www.wiz.io/blog/shai-hulud-npm-supply-chain-attack

- id: wordpress-admin-persistence-2026
  text: >-
    The BdThemes payload derived its rogue admin username and password from a hash
    of the victim's own hostname, so operators never needed a list of compromised
    sites and responders could compute the credentials themselves.
  caption: credentials derived from the victim's hostname
  after: 2
  source: https://www.wordfence.com/blog/2026/08/psa-supply-chain-compromise-in-bdthemes-ecosystem-via-poisoned-api-response/

- id: checkmarx-vs-teampcp-2026
  text: >-
    All 35 release tags in `kics-github-action` were repointed to attacker commits
    while the master branch stayed clean, so any workflow pinned to a version tag
    ran the infostealer.
  caption: tag pinning was not protection
  after: 2
  source: https://www.wiz.io/blog/teampcp-attack-kics-github-action

- id: glassworm-march-2026
  text: >-
    The injections arrived inside realistic commits: doc tweaks, version bumps and
    small refactors matched to each project's style. Aikido notes hand-crafting 151
    bespoke changes across different codebases is not feasible, suggesting AI help.
  caption: commits tailored to each project's style
  after: 2
  source: https://www.aikido.dev/blog/glassworm-returns-unicode-attack-github-npm-vscode
