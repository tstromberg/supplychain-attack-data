# Tranche 3 (2013-2018). Staged as audits land.
#
#   node tools/apply-pull-quotes.js tools/pull-quotes-tranche3.yaml --dry-run
#
# Declined so far: web-developer, chrometana, infinity-new-tab, social-fixer and
# web-paint chrome extensions — all five are the campaign's mechanism (developer
# phished, account taken over, malicious update auto-pushed), which the campaign
# record already carries.

- id: copyfish-chrome-extension
  text: >-
    The attackers did not just push Copyfish 2.8.5; they moved the extension into
    their own Chrome Web Store account, so a9t9 could not roll it back or even
    disable it until Google intervened.
  caption: locked out of their own listing
  after: 2
  source: https://ui.vision/blog/chrome-extension-adware/

- id: ccleaner
  text: >-
    Selection ran on the C2, not in the binary: every machine reported hostname,
    domain, installed software and running processes, and the server's PHP matched
    that against a target list the operators could edit at any time.
  caption: the target list lived on the server
  after: 3
  source: https://blog.talosintelligence.com/ccleaner-c2-concern/

- id: asus-live-update
  text: >-
    Targets were hardcoded as MD5 hashes of network-adapter MAC addresses, so
    possessing the malware did not reveal whom it was for. Kaspersky cracked the
    600-plus hashes and shipped a tool letting people test their own MAC.
  caption: the victim list nobody could read
  after: 2
  source: https://securelist.com/operation-shadowhammer-a-high-profile-supply-chain-attack/90380/

- id: medoc
  text: >-
    The backdoor used no external command server: it hid the collected EDRPOU
    legal-entity numbers in cookies on M.E.Doc's routine update checks to
    upd.me-doc.com.ua, and took its commands back the same way.
  caption: the update check was the command channel
  after: 2
  source: https://www.welivesecurity.com/2017/07/04/analysis-of-telebots-cunning-backdoor/

- id: ammyy-admin-2016
  text: >-
    Ammyy's answer each time was to remove the alien code from the site.
    Kaspersky notified the company of three further instances in February alone,
    and each time the problem was solved only temporarily.
  caption: removed each time, back each time
  after: 2
  source: https://securelist.com/lurk-a-danger-where-you-least-expect-it/75384/

- id: british-airways-via-modernizr-script
  text: >-
    The skimmer bound `touchend` as well as `mouseup` on the submit button, so it
    also caught customers paying inside British Airways' mobile app, which loaded
    its booking pages from the same website.
  caption: the touch event that reached the app
  after: 2
  source: https://web.archive.org/web/20180918015231/https://www.riskiq.com/blog/labs/magecart-british-airways-breach/

- id: inbenta
  text: >-
    A Monzo customer mistyped their card's expiry date; the same wrong date
    appeared on a fraudulent charge the next day, pinning the leak to
    Ticketmaster's checkout. The ICO said Ticketmaster then took nine weeks to
    test that page.
  caption: the typo that pinned the leak
  after: 3
  source: https://www.theregister.com/2020/11/13/ticketmaster_fined_1_25m_magecart_breach/

- id: ewon-hms-networks
  text: >-
    The poisoned download was eCatcher itself, the VPN client for eWON's Talk2M
    service: infection could compromise the user's Talk2M login, handing the
    attacker the credential for remote access into customer machines.
  caption: the trojan stole the remote-access login
  after: 2
  source: https://www.netresec.com/?page=Blog&month=2014-10&post=Full-Disclosure-of-Havex-Trojans

- id: dragonfly-havex-ics-2014
  text: >-
    Havex's second stage did not stop at the workstation: it spoke OPC over DCOM
    to enumerate control servers and their tags, inventorying the plant floor
    from a trusted vendor download.
  caption: reconnaissance reached the control layer
  after: 3
  source: https://www.cisa.gov/news-events/ics-advisories/icsa-14-178-01

- id: able-desktop
  text: >-
    Able's updates were unsigned even when legitimate, so nobody had to steal or
    forge a certificate: the client saved whatever the update server returned to
    `Documents\Able\Able Desktop.exe` and ran it.
  caption: no signature to steal or forge
  after: 2
  source: https://www.welivesecurity.com/2020/12/10/luckymouse-ta428-compromise-able-desktop/

- id: gentoo
  text: >-
    Gentoo filed the attacker's force-push under lucky items: rewriting history
    stopped `git pull` from silently updating existing checkouts, so only fresh
    clones taken during the window carried the `rm -rf`.
  caption: why existing checkouts didn't pull it
  after: 2
  source: https://wiki.gentoo.org/wiki/Project:Infrastructure/Incident_reports/2018-06-28_Github

- id: arch-aur-acroread
  text: >-
    The fetched script exited unless `$pkgdir` was set; inside a build it wrote
    `xeactor.timer` and its `multi-user.target.wants` symlink into the staging
    tree, so pacman installed the timer already enabled, as a file of acroread.
  caption: persistence shipped as package content
  after: 2
  source: https://gist.github.com/campuscodi/74d0d2e35d8fd9499c76333ce027345a

- id: eslint
  text: >-
    The stolen `.npmrc` token was appended to a `Referer` header on hit-counter
    requests to `sstatic1.histats.com` and `c.statcounter.com`. The exfiltration
    ran through two ordinary web-analytics services rather than attacker
    infrastructure.
  caption: exfiltration through a hit counter
  after: 2
  source: https://gist.github.com/hzoo/51cb84afdc50b14bffa6c6dc49826b3e

- id: mailparser
  text: >-
    The three `mailparser` releases declared `http-fetch-cookies` and never
    called it. npm's Adam Baldwin believed the dependency existed to inflate
    download counts, borrowing a deprecated package's traffic until a stranger's
    cookie parser looked popular enough to adopt.
  caption: a dependency added to be counted
  after: 3
  source: https://www.theregister.com/security/2018/05/05/cookie-code-compromise-caper-caught-and-crumbled/357957

- id: coolpad
  text: >-
    CoolReaper was signed with Coolpad's own certificates, and Unit 42 found
    Coolpad had also modified the Android OS in its ROMs, with the changes
    tailored to hide the backdoor's components from the user and from antivirus
    programs.
  caption: the OS was modified to hide it
  after: 2
  source: https://unit42.paloaltonetworks.com/coolreaper-revealed-backdoor-coolpad-android-devices/

- id: android-triada
  text: >-
    To add features outside AOSP, such as face unlock, OEMs sent the whole system
    image out to a third-party developer; Google believes a vendor using the name
    Yehuo or Blazefire returned the image with Triada already in it.
  caption: sent out for a feature, returned infected
  after: 3
  source: https://security.googleblog.com/2019/06/pha-family-highlights-triada.html

- id: octopus-scanner
  text: >-
    The `-post-jar` hook wrote two empty marker files, `.netbeans_automatic_build`
    and `.netbeans_update_resources`, so NetBeans read the build as up to date and
    would not replace the infected JAR.
  caption: why a rebuild did not clean it
  after: 2
  source: https://github.blog/security/vulnerability-research/the-octopus-scanner-malware-attacking-the-open-source-supply-chain/

- id: webmin-2019
  text: >-
    Webmin built releases from a local directory kept in sync with GitHub rather
    than from checked-in code; the attacker set the modified `password_change.cgi`
    timestamp back, and Webmin says it never showed up in a Git diff.
  caption: the timestamp that hid the diff
  after: 2
  source: https://webmin.com/security/

- id: handbrake
  text: >-
    HandBrake's built-in updater verified a DSA signature and would not install the
    trojan, but only from 1.0 onward; 0.10.5 and earlier had no such check, so the
    users furthest behind had the update path that verified nothing.
  caption: the updater verified only from 1.0
  after: 3
  source: https://www.macrumors.com/2017/05/07/handbrake-app-security-warning-servers-hacked/

- id: eltima-elmedia-player-folx
  text: >-
    ESET observed what looked like real-time repackaging and re-signing: three disk
    images, three different hashes, all under the same Developer ID, between 08:00
    and 14:00 on a single day.
  caption: three signed builds in six hours
  after: 2
  source: https://www.welivesecurity.com/2017/10/20/osx-proton-supply-chain-attack-elmedia/

- id: ask-partner-network
  text: >-
    APN's response to November was to revoke the compromised certificate and
    reissue. The December remote-access trojan arrived signed with the
    replacement certificate, issued November 9, 2016.
  caption: revocation was not eviction
  after: 2
  source: https://blogs.vmware.com/security/2017/03/second-ask-partner-network-apn-compromise-highlights-attackers-commandeering-widely-used-general-tools-sophisticated-targeted-attacks.html

- id: bitcoin-gold
  text: >-
    The planted wallet uploaded nothing and tripped no antivirus. Its one
    modified function, `CKey::MakeNewKey`, seeded keys from a timestamp plus one
    random byte, so the attacker could recompute them by watching the blockchain.
  caption: no payload, only weakened entropy
  after: 2
  source: https://www.bitcoingold.org/vulnerable-core-wallet-update/

- id: ivanti-csa-csrf-magic
  text: >-
    csrf-magic's real home was repo.or.cz; the attacker's clone sat at
    github.com/csrf-magic/csrf-magic, which looked more official. Sonatype's
    reading is that Ivanti shipped the counterfeit rather than the project.
  caption: the fake repo looked more official
  after: 2
  source: https://www.sonatype.com/blog/the-curious-case-of-csrf-magic-a-case-study-in-supply-chain-poisoning

- id: gom-player
  text: >-
    GRETECH and JPCERT concluded the poisoned update reached only specific
    organizations, except for six minutes on December 21, when anyone updating
    was a target and nobody knows what was downloaded.
  caption: six minutes when everyone was a target
  after: 2
  source: https://forest.watch.impress.co.jp/docs/news/638849.html

- id: buffalo-japan-bankeiya
  text: >-
    The break-in was not at Buffalo: CDNetworks concluded its own content-upload
    servers were entered from a compromised staff PC, and the same intrusion
    altered four customers' files, from blog pages to an online game's patches.
  caption: one CDN breach, four customers
  after: 2
  source: https://piyolog.hatenadiary.jp/entry/20140603/1401801327

- id: statcounter
  text: >-
    gate.io's page already had a `doSubmit` function; the injected script
    redefined it, so the destination was replaced only after the click. The
    server generated a new attacker address per load, so even ESET could not
    total the theft.
  caption: the swap came after the click
  after: 3
  source: https://www.welivesecurity.com/2018/11/06/supply-chain-attack-cryptocurrency-exchange-gate-io/

- id: mega-chrome
  text: >-
    Google disallowed publisher signatures on Chrome extensions, signing them
    itself after upload, so the store account was the only barrier. MEGA signed
    its Firefox extension and mobile apps itself, and said those could not have
    fallen this way.
  caption: signed by the store, not the publisher
  after: 2
  source: https://serhack.me/articles/mega-chrome-extension-hacked/

- id: mediaget
  text: >-
    MediaGet's updater did verify update.exe: that it carried a valid signature,
    and that its hash matched the value from the vendor's own hash server.
    Neither check asked who had signed it.
  caption: neither check asked who signed
  after: 2
  source: https://www.microsoft.com/en-us/security/blog/2018/03/13/poisoned-peer-to-peer-app-kicked-off-dofoil-coin-miner-outbreak/

- id: pdfescape
  text: >-
    Every font MSI the installer pulled was signed by the same company except the
    tampered one, which lost its signature and installed anyway. After the next
    restart it was swapped back for the original.
  caption: unsigned among the signed, then swapped back
  after: 2
  source: https://www.microsoft.com/en-us/security/blog/2018/07/26/attack-inception-compromised-supply-chain-within-a-supply-chain-poses-new-risks/
