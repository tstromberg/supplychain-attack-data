- id: emeditor
  text: >-
    Winget, the portable build, the store app, and EmEditor's own auto-updater were all
    unaffected. Only the homepage `Download Now` redirect served the WALSHAM-signed MSI.
  caption: only the download button
  after: 1
  source: https://www.emeditor.com/general/important-security-incident-notice-regarding-the-emeditor-installer-download-link/

- id: duckdb
  text: >-
    "In hindsight, the fact that his browser did not auto-complete the login should have
    been a red flag," DuckDB's maintainers wrote. The phishing site proxied every action
    to the real npm, so the 2FA reset went through.
  caption: the browser didn't autofill
  after: 1
  source: https://github.com/duckdb/duckdb-node/security/advisories/GHSA-w62p-hx95-gf2c

- id: nx-build
  text: >-
    Some victims had no Nx workspace at all. The Nx Console VS Code extension installed
    `nx@latest` just to read its version, so opening the editor was enough to run the
    malicious postinstall.
  caption: compromised by opening an editor
  after: 3
  source: https://github.com/nrwl/nx/security/advisories/GHSA-cxm3-wv7p-598c

- id: notepad-plus-plus
  text: >-
    Kaspersky noted the attackers avoided DLL sideloading in the first chain, likely
    because the technique now draws too much attention, and instead abused a ProShow
    vulnerability dating to the early 2010s.
  caption: sideloading draws too much attention
  after: 3
  source: https://securelist.com/notepad-supply-chain-attack/118708/

- id: rvtools
  text: >-
    "When it came back online, the download had changed: the file size was smaller, and
    the hash now matched the clean version listed on the site," Aidan Leon said.
  caption: the file quietly changed
  after: 1
  source: https://www.bleepingcomputer.com/news/security/trojanized-rvtools-push-bumblebee-malware-in-seo-poisoning-campaign/

- id: rand-user-agent
  text: >-
    On Windows the implant prepended `%LOCALAPPDATA%\Programs\Python\Python3127` to
    `PATH`, quietly hijacking anything that resolved `python` or `pip` by name.
  caption: a fake python on path
  after: 1
  source: https://www.aikido.dev/blog/catching-a-rat-remote-access-trojan

- id: xrpl-js
  text: >-
    The backdoor was a function named `checkValidityOfSeed`. It POSTed the wallet seed to
    `0x9c.xyz` inside an HTTP header called `ad-referral`.
  caption: named like a validation helper
  after: 2
  source: https://www.aikido.dev/blog/xrp-supplychain-attack-official-npm-package-infected-with-crypto-stealing-backdoor

- id: tj-actions-changed-files
  text: >-
    Unit 42 noted that git tag pushes are not recorded in GitHub's audit log on the free
    tier. Paired with commits staged in forks that were later deleted, the rewrite left
    almost nothing to find.
  caption: tag moves leave no audit trail
  after: 2
  source: https://unit42.paloaltonetworks.com/github-actions-supply-chain-attack/

- id: dogwiftools
  text: >-
    The tampering left no trace in GitHub's logs. DogWifTools only noticed when a build
    released a week earlier turned out to have been replaced in the previous few days.
  caption: no trace in the logs
  after: 2
  source: https://www.bleepingcomputer.com/news/security/dogwifools-solana-tool-hacked-to-drain-wallets-of-crypto-users/

- id: essential-plugin
  text: >-
    The update that carried the backdoor shipped on August 8, 2025 under the changelog
    note "Check compatibility with WordPress version 6.8.2." It added 191 lines of PHP.
  caption: the changelog said compatibility check
  after: 1
  source: https://anchor.host/someone-bought-30-wordpress-plugins-and-planted-a-backdoor-in-all-of-them/

- id: qix-npm-account
  text: >-
    The drainer did not just swap the destination address. It chose the attacker address
    that most resembled the original, so the transaction still looked right on screen
    before the user signed.
  caption: an address that looks right
  after: 1
  source: https://www.wiz.io/blog/widespread-npm-supply-chain-attack-breaking-down-impact-scope-across-debug-chalk

- id: eslint-config-prettier
  text: >-
    CrowdStrike found the Scavenger DLL read and exfiltrated the victim's `.npmrc`, the
    file holding npm authentication tokens, before writing a second-stage browser-data
    stealer to disk.
  caption: the payload wanted npm tokens
  after: 3
  source: https://www.crowdstrike.com/en-us/blog/crowdstrike-detects-prevents-scavenger-malware-npm-packages/

- id: is
  text: >-
    "The old owner was somehow removed from the npm package, and emailed me to be
    re-added," Jordan Harband wrote. "Everything seemed normal, so I obliged and the next
    morning this [malware] was published."
  caption: npm's recovery flow was the way in
  after: 3
  source: https://socket.dev/blog/npm-is-package-hijacked-in-expanding-supply-chain-attack

- id: num2words
  text: >-
    "A new version (0.5.16) was just deployed and it still contains a malicious payload.
    I feel like their sessions are still active despite the password rotation," the
    maintainers wrote.
  caption: rotating the password wasn't enough
  after: 3
  source: https://x.com/SFLinux/status/1949906299308953827
