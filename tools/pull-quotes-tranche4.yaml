# Tranche 4 (2019-2021).
#   node tools/apply-pull-quotes.js tools/pull-quotes-tranche4.yaml --dry-run

- id: twilio-taskrouter-js-sdk
  text: >-
    The path's S3 policy granted `s3:PutObject` to every principal on the
    internet: a build-system fix switched write access on and nobody reset it for
    years. Overwriting the SDK took no credentials, only Tor.
  caption: anyone on the internet could write
  after: 3
  source: https://www.twilio.com/en-us/blog/incident-report-taskrouter-js-sdk-july-2020

- id: thegreatsuspender
  text: >-
    The store listing moved to a clean v7.1.9, but browsers already running the
    hostile v7.1.8 never received that update and kept executing the remote code
    until Google force-disabled the extension.
  caption: the fix that never reached users
  after: 3
  source: https://github.com/greatsuspender/thegreatsuspender/issues/1263

- id: magento-license-backdoor-2025
  text: >-
    The backdoor was the license check: `registration.php` loaded a fake
    `License.php` whose `adminLoadLicense` executed an attacker-supplied file as
    PHP, with no authentication in the 2019 versions. It sat unused for six years.
  caption: the license check was the backdoor
  after: 3
  source: https://sansec.io/research/license-backdoor

- id: electron-native-notify
  text: >-
    The payload came after the adoption: GitHub user `sawlysawly` committed
    `electron-native-notify@^1.1.5` into Komodo's EasyDEX-GUI on March 8, and
    1.1.6, the first version carrying seed-stealing code, was published fifteen
    days later.
  caption: reviewed clean, poisoned later
  after: 2
  source: https://blog.npmjs.org/post/185397814280/plot-to-steal-cryptocurrency-foiled-by-the-npm

- id: purescript-npm-installer
  text: >-
    rate-map 1.0.3 refused to fire whenever a `.git` directory sat beside the
    calling module, stripped a callback from the neighbouring `dl-tar` package,
    then rewrote its own file to erase the malicious block. Source checkouts
    installed cleanly.
  caption: it would not run from git
  after: 2
  source: https://harry.garrood.me/blog/malicious-code-in-purescript-npm-installer/

- id: codecov
  text: >-
    Codecov's own advice drew the line at the checksum: pipelines that compared
    the uploader's shasum against GitHub's were likely unaffected. Nothing in the
    fetch required that comparison, and the customer who ran it ended a two-month
    compromise.
  caption: the check nothing required
  after: 3
  source: https://about.codecov.io/security-update/

- id: kaseya-vsa
  text: >-
    The procedure computed the seconds left until 16:30:12 UTC and spent them on
    `ping 127.0.0.1`, so the encryptor fired at one moment across every network
    the compromised VSA servers reached.
  caption: the ping that synchronized the detonation
  after: 2
  source: https://www.huntress.com/blog/rapid-response-kaseya-vsa-mass-msp-ransomware-incident

- id: passwordstate
  text: >-
    The malicious DLL hooked into the Passwordstate service and used the
    instance's own encryption key and database connection string. Click Studios
    found no evidence either was ever sent, only the password records they
    unlocked.
  caption: the key never left, the passwords did
  after: 3
  source: https://kryptera.se/wp-content/uploads/Incident_Management_Advisory-01-20210424.pdf

- id: aisino
  text: >-
    The tax software could push and run any binary silently, and it did: hours
    after Trustwave published a YARA rule for the GoldenSpy uninstaller,
    Intelligent Tax deployed a re-encoded version the rule missed.
  caption: the vendor's channel outran the detection
  after: 3
  source: https://www.levelblue.com/blogs/spiderlabs-blog/goldenspy-chapter-3-new-and-improved-uninstaller

- id: vgca
  text: >-
    The trojanized MSIs were improperly signed, but ESET found the genuine GCA
    installers failed verification too, both using a certificate assigned to
    Safenet. Checking the signature would have condemned the real installer as
    well.
  caption: the genuine installer failed too
  after: 2
  source: https://www.welivesecurity.com/2020/12/17/operation-signsight-supply-chain-attack-southeast-asia/

- id: veraport-wizvera
  text: >-
    VeraPort checked that a downloaded binary's signature was valid, not whose it
    was. Any code-signing certificate would pass, so Lazarus signed its impostor
    installers with certificates illegally obtained from two other companies.
  caption: valid signature, no publisher check
  after: 2
  source: https://www.welivesecurity.com/2020/11/16/lazarus-supply-chain-attack-south-korea/

- id: php
  text: >-
    git.php.net also accepted pushes over HTTPS, through git-http-backend and
    Apache Digest auth against the master.php.net user database, a path gitolite
    never saw. The missing git-receive-pack log entries were first read as
    evidence of a compromised server.
  caption: the push path gitolite never logged
  after: 2
  source: https://news-web.php.net/php.internals/113981

- id: uaparser-js
  text: >-
    Faisal Salman's first sign was his inbox: spam from hundreds of websites,
    which he read as cover so he would not notice something was wrong. The flood
    is what made him look.
  caption: the spam flood that gave it away
  after: 1
  source: https://github.com/faisalman/ua-parser-js/issues/536#issuecomment-949742904

- id: miso-sushiswap
  text: >-
    The front end intercepted nothing. MISO's auction templates take the payout
    address as a deployment parameter, so the commit set `wallet` when the Jay
    Pegs auction was created, and `finalize()` paid the balance to that address.
  caption: the website filled in the payout address
  after: 2
  source: https://github.com/sushiswap/miso/blob/canary/contracts/Auctions/BatchAuction.sol

- id: accesspress-themes
  text: >-
    The same theme at the same version was clean from WordPress.org and
    backdoored from the vendor's own download page. The version number said
    nothing about which copy you had.
  caption: same version, two different files
  after: 3
  source: https://jetpack.com/resources/backdoor-found-in-themes-and-plugins-from-accesspress-themes/

- id: monero
  text: >-
    The attacker replaced the binary but not the hash listed beside it, so
    getmonero.org's own published checksum convicted getmonero.org's own
    download — a user comparing the two caught it the same day.
  caption: the hash the attacker left alone
  after: 2
  source: https://github.com/monero-project/monero/issues/6151

- id: x-trader
  text: >-
    The backdoor took the employee's 3CX work credentials off a personal
    computer, and 3CX's VPN accepted them two days later. X_TRADER had been
    retired in 2020, but was still available on the vendor's website.
  caption: work credentials off a personal computer
  after: 3
  source: https://www.securityweek.com/cascading-supply-chain-attack-3cx-hacked-after-employee-downloaded-trojanized-app/

- id: freedownloadmanager
  text: >-
    The compromised page carried an exception list, not a target list: visitors
    from Bing and Google IP ranges were always given the correct download link,
    so the malicious branch stayed invisible to the crawlers indexing the site.
  caption: an exception list, not a target list
  after: 2
  source: https://www.freedownloadmanager.org/blog/?p=664

- id: asus-webstorage
  text: >-
    The update check was an XML reply over plain HTTP; attackers on the path
    rewrote its version and link fields to point at a malicious file on a
    compromised gov.tw site, and the signed client ran it unverified.
  caption: ASUS itself was never breached
  after: 2
  source: https://www.welivesecurity.com/2019/05/14/plead-malware-mitm-asus-webstorage/
