- id: ultralytics
  text: >-
    The payload was the branch name. Ultralytics' custom action dropped an
    unsanitized branch name into a shell `run` block, so a fork branch named as a
    command substitution ran `curl | bash` on a privileged runner.
  caption: the branch name was the exploit
  after: 3
  source: https://www.legitsecurity.com/blog/the-ultralytics-supply-chain-attack-how-it-happened-how-to-prevent

- id: kong-ingress-controller
  text: >-
    Kong reverted the risky trigger in November after a researcher's report, applying
    the fix to master and every actively developed branch. It missed some old unused
    branches, and that is where the pull request landed.
  caption: patched everywhere but the dead branches
  after: 3
  source: https://konghq.com/blog/product-releases/december-2024-unauthorized-kong-ingress-controller-3-4-0-build

- id: lottie-player
  text: >-
    Wiz cited a Scam Sniffer report of a transaction indicating at least one user fell
    for the prompt, losing 10 Bitcoin, roughly $723,436.
  caption: one prompt, ten bitcoin
  after: 2
  source: https://www.wiz.io/blog/lottie-player-supply-chain-attack

- id: procolored
  text: >-
    XRed's command-and-control server had been offline since February 2024, so the
    backdoor could not phone home for most of the exposure window. SnipVex's eight-line
    clipboard swap still took in about 9.3 BTC.
  caption: the dumb half made the money
  after: 2
  source: https://blog.gdatasoftware.com/2025/05/38200-printer-infected-software-downloads

- id: justice-av-solutions-javs-viewer
  text: >-
    Rapid7 dated the Vanguard Tech Limited code-signing certificate to February 10,
    2024; the first malicious JAVS installer was signed with it eleven days later. The
    dropped file was `fffmpeg.exe`, one `f` more than real.
  caption: a certificate bought for the job
  after: 3
  source: https://www.rapid7.com/blog/post/2024/05/23/cve-2024-4978-backdoored-justice-av-solutions-viewer-software-used-in-apparent-supply-chain-attack/

- id: shibai-phones
  text: >-
    Doctor Web counted about 40 modified apps and nearly two dozen attacker wallets,
    which together had received more than $1.6 million over the previous two years.
  caption: what the counterfeit phones earned
  after: 2
  source: https://thehackernews.com/2025/04/chinese-android-phones-shipped-with.html

- id: android-triada-counterfeit-smartphones-2025
  text: >-
    Android hardened its system partitions so that even root cannot edit them.
    Kaspersky notes the irony: pre-installed malware inside those partitions has become
    impossible to remove.
  caption: hardening that helps the attacker
  after: 2
  source: https://securelist.com/triada-trojan-modules-analysis/116380/

- id: rspack
  text: >-
    The miner payload was not on attacker infrastructure. The postinstall script pulled
    a base64 blob straight from the GitHub repository of the campaign's other victim,
    `youzan/vant`.
  caption: one victim hosting the other's payload
  after: 3
  source: https://securitylabs.datadoghq.com/articles/2025-q1-threat-roundup/

- id: sqgame
  text: >-
    After fetching its shellcode, the trojanized `mono.dll` terminated the game client
    and downloaded the original clean library over itself. Both the payload and the
    clean replacement came from compromised South Korean websites.
  caption: the trojan that cleaned up after itself
  after: 3
  source: https://www.welivesecurity.com/en/eset-research/rigged-game-scarcruft-compromises-gaming-platform-supply-chain-attack/

- id: wp-wrapper-link-element
  text: >-
    Someone stripped the malicious code out, then tagged the result 1.0.0, lower than
    the infected 1.0.2 and 1.0.3. There was no version to update to, so Wordfence told
    owners to remove the plugin.
  caption: a fix that upgrades backwards
  after: 3
  source: https://www.wordfence.com/blog/2024/06/supply-chain-attack-on-wordpress-org-plugins-leads-to-5-maliciously-compromised-wordpress-plugins/
