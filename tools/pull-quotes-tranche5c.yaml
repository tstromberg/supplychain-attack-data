- id: ctx
  text: >-
    The domain was registered at 18:40 UTC; the maintainer account's PyPI password
    was reset 12 minutes later. No multi-factor authentication was enabled on the
    account.
  caption: twelve minutes from domain to takeover
  after: 1
  source: https://python-security.readthedocs.io/pypi-vuln/index-2022-05-24-ctx-domain-takeover.html

- id: ledger-connect-kit
  text: >-
    Ledger revoked the former employee's GitHub, SSO, and internal tool access when
    they left. Their npm publishing access was never revoked.
  caption: offboarding that missed one registry
  after: 1
  source: https://www.ledger.com/blog/security-incident-report

- id: cyberlink
  text: >-
    LambLoad checked the host date against a preconfigured window and looked for
    `csfalconservice.exe`, `xagt.exe`, and `taniumclient.exe`. If the checks failed,
    it just ran the real CyberLink software.
  caption: edr present, malware stands down
  after: 1
  source: https://www.microsoft.com/en-us/security/blog/2023/11/22/diamond-sleet-supply-chain-compromise-distributes-a-modified-cyberlink-installer/

- id: keenadu
  text: >-
    The malicious static library sat in the firmware source tree under
    `vendor/mediatek/proprietary/`, posing as a MediaTek `vndx` component. Kaspersky
    notes no such component exists in MediaTek products.
  caption: a vendor component that never existed
  after: 2
  source: https://securelist.com/keenadu-android-backdoor/118913/

- id: colors-js
  text: >-
    The maintainer opened issue #285 against his own sabotage: "It's come to our
    attention that there is a zalgo bug in the v1.4.44-liberty-2 release of colors."
  caption: the saboteur files a bug report
  after: 2
  source: https://github.com/Marak/colors.js/issues/285

- id: fantasy-agrius
  text: >-
    ESET attributed the victim ordering, South Africa then Israel then Hong Kong, to
    time zone differences and a hardcoded check-in time inside the legitimate
    software.
  caption: victims fell in time zone order
  after: 2
  source: https://www.welivesecurity.com/2022/12/07/fantasy-new-agrius-wiper-supply-chain-attack/
