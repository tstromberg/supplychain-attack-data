- id: juiceledger-pypi-phishing-2022
  text: >-
    The poisoned packages phoned home to `linkedopports[.]com`, the same domain
    that collected credentials from the fake PyPI login page. The callback URL
    even encoded which compromised package it came from.
  caption: phishing and packages shared one domain
  after: 2
  source: https://checkmarx.com/blog/first-known-phishing-attack-against-pypi-users/

- id: faker-colors-sabotage-2022
  text: >-
    In November 2020 Marak had warned he would no longer support big corporations
    with his free work, telling commercial entities to fork the projects or pay
    him a six figure salary. The sabotage came more than a year later.
  caption: the warning came first
  after: 1
  source: https://www.bleepingcomputer.com/news/security/dev-corrupts-npm-libs-colors-and-faker-breaking-thousands-of-apps/

- id: fracturiser-2023
  text: >-
    Stage 3 searched the entire filesystem for jar files and infected any that
    looked like a mod, including Gradle and Maven caches. Luna Pixel Studios was
    compromised because a developer tested one of the malicious mods.
  caption: the malware infected build caches
  after: 2
  source: https://github.com/trigram-mrp/fractureiser/blob/main/docs/tech.md

- id: rspack-vant-cryptominer-2024
  text: >-
    The miner did not run everywhere. The payload limited infection to machines in
    a set of countries including China, Russia, Hong Kong, Belarus, and Iran, and
    read location from `ipinfo.io/json`.
  caption: a miner with a country list
  after: 2
  source: https://thehackernews.com/2024/12/rspack-npm-packages-compromised-with.html

- id: fake-dependabot-github-2023
  text: >-
    GitHub personal access tokens do not require 2FA and can be used from any
    computer. PAT activity logs are visible only to enterprise accounts, so a
    non-enterprise victim cannot tell whether a stolen token was used.
  caption: tokens that leave no trace
  after: 2
  source: https://checkmarx.com/blog/surprise-when-dependabot-contributes-malicious-code/
